---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
# Renders the Garage CLI config (with the RPC secret) INTO THE APP'S NAMESPACE so the
# setup Job is self-contained and works from any namespace.
#
# Why this exists: the Job used to mount the `config.toml` ConfigMap from the
# `database` namespace, but a pod cannot mount a cross-namespace ConfigMap -- so the
# Job hung in ContainerCreating forever the first time the component was used outside
# `database`. It also referenced a `garage-admin` secret that was never created (all
# existing Garage buckets/keys were made by hand inside the pod). The garage CLI
# authenticates to the cluster with the RPC secret in this config file -- no admin
# S3 key needed for bucket/key creation.
#
# Required variables : APP, NAMESPACE, SECRET_DOMAIN (from cluster-secrets)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-garage-cli
  namespace: ${NAMESPACE}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${APP}-garage-cli
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.toml: |
          metadata_dir = "/tmp/meta"
          data_dir = "/tmp/data"
          replication_factor = 1
          consistency_mode = "consistent"
          rpc_bind_addr = "0.0.0.0:3901"
          rpc_public_addr = "garage.database.svc.cluster.local:3901"
          rpc_secret = "{{ .GARAGE_RPC_SECRET }}"
          [s3_api]
          s3_region = "homelab"
          api_bind_addr = "0.0.0.0:3900"
          root_domain = ".s3.${SECRET_DOMAIN}"
          [admin]
          api_bind_addr = "0.0.0.0:3903"
  dataFrom:
    - extract:
        key: garage
