---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
# Renders the Garage config + admin S3 credentials INTO THE APP'S NAMESPACE so the
# setup Job is self-contained. Previously the Job tried to mount the `config.toml`
# ConfigMap from the `database` namespace and referenced a manually-created
# `garage-admin` secret -- neither works from another namespace (a pod cannot mount
# a cross-namespace ConfigMap, and the manual secret only ever existed in `database`).
#
# Both the RPC secret (used by the garage CLI to create the bucket/key) and the
# admin S3 key (used by aws-cli for the CORS step) come from the same 1Password
# `garage` item, so this needs no cluster-side prerequisite.
#
# Required variables : APP, NAMESPACE, SECRET_DOMAIN (from cluster-secrets)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-garage-admin
  namespace: ${NAMESPACE}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${APP}-garage-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # aws-cli (CORS step) reads these as the admin S3 key pair.
        ACCESS_KEY: "{{ .GARAGE_ADMIN_ACCESS_KEY }}"
        SECRET_KEY: "{{ .GARAGE_ADMIN_SECRET_KEY }}"
        # garage CLI reads this config; rpc_secret authenticates it to the cluster.
        config.toml: |
          metadata_dir = "/tmp/meta"
          data_dir = "/tmp/data"
          replication_factor = 1
          consistency_mode = "consistent"
          rpc_bind_addr = "0.0.0.0:3901"
          rpc_public_addr = "garage.database.svc.cluster.local:3901"
          rpc_secret = "{{ .GARAGE_RPC_SECRET }}"
          [s3_api]
          s3_region = "homelab"
          api_bind_addr = "0.0.0.0:3900"
          root_domain = ".s3.${SECRET_DOMAIN}"
          [admin]
          api_bind_addr = "0.0.0.0:3903"
  dataFrom:
    - extract:
        key: garage
