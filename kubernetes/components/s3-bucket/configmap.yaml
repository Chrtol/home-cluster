---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${APP}-s3-setup-script
  namespace: ${NAMESPACE}
data:
  setup.sh: |
    #!/bin/bash
    set -euo pipefail

    echo "Setting up S3 bucket for ${APP}..."

    # Wait for Garage to be ready
    until /garage -c /etc/garage.toml status 2>/dev/null | grep -q "HEALTHY"; do
      echo "Waiting for Garage to be healthy..."
      sleep 5
    done

    # Create bucket if it doesn't exist
    if ! /garage -c /etc/garage.toml bucket list | grep -q "${S3_BUCKET}"; then
      echo "Creating bucket ${S3_BUCKET}..."
      /garage -c /etc/garage.toml bucket create ${S3_BUCKET}
    else
      echo "Bucket ${S3_BUCKET} already exists"
    fi

    # Key handling is gated on the k8s SECRET, not the Garage key. A Garage secret
    # key can't be retrieved after creation, so if the k8s secret is missing we must
    # mint a fresh key (and drop the stale one) to repopulate it. This makes the Job
    # safely re-runnable even if the secret was deleted.
    KEY_NAME="${APP}-key"
    if kubectl get secret ${APP}-s3-credentials -n ${NAMESPACE} >/dev/null 2>&1; then
      echo "Secret ${APP}-s3-credentials already exists -- nothing to do"
    else
      # Remove any orphaned key of the same name (secret is gone, so its secret key
      # is unrecoverable and useless).
      if /garage -c /etc/garage.toml key list | grep -q "$KEY_NAME"; then
        echo "Deleting orphaned key $KEY_NAME (no matching secret)..."
        OLD_ID=$(/garage -c /etc/garage.toml key list | awk -v n="$KEY_NAME" '$2==n {print $1}')
        [ -n "$OLD_ID" ] && /garage -c /etc/garage.toml key delete --yes "$OLD_ID"
      fi

      echo "Creating access key for ${APP}..."
      KEY_OUTPUT=$(/garage -c /etc/garage.toml key create "$KEY_NAME")
      ACCESS_KEY=$(echo "$KEY_OUTPUT" | grep "Key ID" | awk '{print $3}')
      SECRET_KEY=$(echo "$KEY_OUTPUT" | grep "Secret key" | awk '{print $3}')

      # Grant the key full access to the bucket
      /garage -c /etc/garage.toml bucket allow --read --write --owner ${S3_BUCKET} --key "$ACCESS_KEY"

      kubectl create secret generic ${APP}-s3-credentials \
        --namespace=${NAMESPACE} \
        --from-literal=ACCESS_KEY="$ACCESS_KEY" \
        --from-literal=SECRET_KEY="$SECRET_KEY" \
        --from-literal=BUCKET="${S3_BUCKET}" \
        --from-literal=ENDPOINT="https://s3.${SECRET_DOMAIN}" \
        --from-literal=REGION="homelab" \
        --dry-run=client -o yaml | kubectl apply -f -

      echo "Created secret ${APP}-s3-credentials"
    fi

    echo "S3 setup for ${APP} complete!"
