---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${APP}-s3-setup
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: ${APP}-s3-setup
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: ghcr.io/chrtol/garage-kubectl:v1.3.0 # garage CLI + kubectl
          command: ["/bin/bash"]
          args: ["/scripts/setup.sh"]
          env:
            - name: APP
              value: "${APP}"
            - name: NAMESPACE
              value: "${NAMESPACE}"
            - name: S3_BUCKET
              value: "${S3_BUCKET}"
            - name: SECRET_DOMAIN
              value: "${SECRET_DOMAIN}"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            # Garage CLI config (with rpc_secret) rendered into this namespace by
            # the component's ExternalSecret -- no cross-namespace mount.
            - name: garage-config
              mountPath: /etc/garage.toml
              subPath: config.toml
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: ${APP}-s3-setup-script
            defaultMode: 0755
        - name: garage-config
          secret:
            secretName: ${APP}-garage-cli
