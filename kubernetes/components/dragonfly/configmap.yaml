---
# app-template values fragment. The consuming HelmRelease must reference it:
#   spec:
#     valuesFrom:
#       - kind: ConfigMap
#         name: ${APP}-dragonfly-values
#
# Required variables : APP
#
# The db.home.arpa/dragonfly pod label is what the dragonfly-allow-clients
# NetworkPolicy selects on: pulling in this component grants 6379 access by
# construction. REDIS_URLs stay hand-written in each app's ExternalSecret —
# apps consume redis config in incompatible shapes (URL vs host/port vs
# celery broker), so the component does not template them.
#
# Apps not on app-template (homarr, authentik) cannot consume this fragment;
# set the pod label through their own chart values instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${APP}-dragonfly-values
data:
  values.yaml: |
    defaultPodOptions:
      labels:
        db.home.arpa/dragonfly: "true"
