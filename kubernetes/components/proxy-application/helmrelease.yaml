---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
# Required variables : APP, GROUP, SUBDOMAIN, DESCRIPTION
# Optional variables : DISPLAY_NAME (defaults to APP if not provided)
#                      PROXY_ADMIN_GROUP - existing group to bind for admin access (for proxy auth apps)
# Creates blueprint-managed resources with naming convention:
#   - Provider: bp-${APP}-proxy
#   - Application: ${DISPLAY_NAME} (display name) / ${APP} (slug)
#   - Group: bp-${APP}-users
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}-proxy
  labels:
    homelab/auth-component: "true"
spec:
  releaseName: ${APP}-proxy
  targetNamespace: security
  chartRef:
    kind: OCIRepository
    name: authentik-application
    namespace: flux-system
  interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    blueprint:
      authentik:
        domain: "https://sso.${SECRET_DOMAIN}"
      provider:
        enabled: true
        name: "bp-${APP}-proxy"  # bp- prefix for blueprint-managed providers
        type: "proxy"
        proxy:
          mode: "forward_single"
          externalHost: "https://${SUBDOMAIN}.${SECRET_DOMAIN}"
          authorizationFlow: "default-provider-authorization-implicit-consent"
      application:
        name: "${DISPLAY_NAME:=${APP}}"  # Uses DISPLAY_NAME if provided, otherwise APP
        slug: "${APP}"  # Keep slug simple for compatibility
        group: "${GROUP}"
        launchURL: "https://${SUBDOMAIN}.${SECRET_DOMAIN}"
        openInNewTab: false
        icon: "${ICON_URL:-}"
        description: "${DESCRIPTION}"
        policyEngineMode: "any"
      # Empty ON PURPOSE -- see blueprint-patch.yaml. The chart renders each binding
      # with `identifiers: {pk: <$group.bindID>}` and there is no way to supply a
      # stable bindID from here, so the identifier came out empty: it matched nothing,
      # every reconcile appended another binding (shelfmark reached 14) and later
      # entries displaced earlier ones, so owncast/konflate never got bp-${APP}-users
      # bound at all. An empty list (not null) is what suppresses them -- with a
      # non-slice value the template falls back to a default "app: <slug>" group.
      groups: []