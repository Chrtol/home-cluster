---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/externalsecret_v1.json
# Renders ${APP}-initdb-secret, consumed by the init-db initContainer that the
# companion ConfigMap (${APP}-cnpg-values) injects via the HelmRelease valuesFrom.
#
# Required variables : APP
#                      DB_OP_ITEM    (1Password item holding this app's DB password)
#                      DB_PASS_FIELD (field name inside DB_OP_ITEM, e.g. MYAPP_POSTGRES_PASS)
# Optional variables : DB_NAME       (defaults to ${APP}; space-separated for multi-DB apps)
#                      DB_USER       (defaults to ${APP})
#
# DB_OP_ITEM / DB_PASS_FIELD are REQUIRED on purpose. They used to default to the
# cloudnative-pg item's shared POSTGRES_PASS (the old "app" role's password). Every
# app now owns a dedicated role with its own password, so a silent fallback to the
# shared credential would be a regression that nothing surfaces. ${VAR:?...} makes
# Flux fail the substitution with the message below instead.
#
# Deliberately NOT parameterised: INIT_POSTGRES_USER_FLAGS / INIT_POSTGRES_EXTENSIONS.
# An empty envsubst default renders as YAML null after kustomize strips quotes and
# the apply fails. The one app that needs them (immich, "-s") carries them in its own
# secret and overrides the initContainer envFrom list in its HelmRelease values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-initdb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${APP}-initdb-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: "${DB_NAME:=${APP}}"
        INIT_POSTGRES_HOST: "{{ .POSTGRES_RW_SVC }}"
        INIT_POSTGRES_PORT: "5432"
        INIT_POSTGRES_USER: "${DB_USER:=${APP}}"
        INIT_POSTGRES_PASS: "{{ .${DB_PASS_FIELD:?set DB_PASS_FIELD to this app's own 1Password field, e.g. MYAPP_POSTGRES_PASS} }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: "${DB_OP_ITEM:?set DB_OP_ITEM to this app's own 1Password item}"
