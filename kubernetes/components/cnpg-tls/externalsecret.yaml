---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-ca
spec:
  # Short interval on purpose. When CNPG renews postgres17-ca it swaps the
  # server cert at the same time, so this mirror is the lag between the server
  # presenting a new cert and the app being restarted with the CA that signs it.
  # One small secret -- cheap to poll.
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: cnpg-ca
  target:
    name: cnpg-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: postgres17-ca
        property: ca.crt
