---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/externalsecret_v1.json
#
# Read-only GHCR credential for the kubelet (`imagePullSecrets`) and Flux image
# scanning (`ImageRepository.spec.secretRef`). GHCR accepts only a classic PAT, and
# only as username + password: a bare bearer token is rejected.
#
# GHCR does not fall back to anonymous when a credential is rejected, so a revoked
# token also breaks pulls of the public chrtol images that reference this secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"chrtol","password":"{{ .token }}","auth":"{{ printf "chrtol:%s" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: ghcr
        property: GHCR_PULL_TOKEN
