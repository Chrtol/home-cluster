---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# A child Kustomization rather than the ExternalSecret itself: namespace
# kustomizations are applied by cluster-apps, and an ExternalSecret there would fail
# cluster-apps' whole apply on a cold cluster that does not have the CRD yet.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ghcr-pull
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: ghcr-pull
  dependsOn:
    - name: onepassword-store
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/components/ghcr-pull/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: true
