---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${APP}
spec:
  sourcePVC: "${VOLSYNC_PVC:=${APP}}"
  trigger:
    # All 33 sources share one schedule, so they stampede: on 2026-09-12 every one fired
    # at 03:00Z, finished 03:02-03:09Z, and stacked restic I/O onto peak torrent seeding
    # -- lenovo1 hit load 38.7 with 60% IO pressure. 03:00Z is the worst hour available;
    # by 06:00Z seeding has tapered (ens18 ~17 MB/s vs 58).
    #
    # Only the HOUR is substitutable, deliberately: a ${VAR:=default} holding spaces is
    # not worth trusting, and one integer is enough to spread the herd per app.
    schedule: "0 ${VOLSYNC_SCHEDULE_HOUR:=6} * * *"
  restic:
    copyMethod: Snapshot
    storageClassName: "${VOLSYNC_STORAGECLASS:=csi-rbd-sc}"
    volumeSnapshotClassName: "${VOLSYNC_STORAGECLASS:=csi-rbd-sc}"
    repository: ${APP}-volsync-secret
    cacheCapacity: "${VOLSYNC_CACHE_CAPACITY:=1Gi}"
    # Bump VOLSYNC_UNLOCK to make the mover run `restic unlock` before backing up,
    # clearing a stale repo lock left by a mover that died mid-run.
    # Value MUST be a non-numeric string — the CRD requires string and envsubst
    # of a bare number yields an int, which fails the typed-patch dry-run.
    unlock: "${VOLSYNC_UNLOCK:=unlocked}"
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000