---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${APP}-volsync-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        #Restic backup
        # Repo path defaults to ${APP}, but is overridable so restic history can be
        # decoupled from the app name. Restic repos cannot be renamed in place, so an
        # app rename would otherwise orphan the old repo (which the stale-unlock sweep
        # would then keep touching forever) and silently start a fresh one.
        RESTIC_REPOSITORY: "/repository/${VOLSYNC_REPO_NAME:=${APP}}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
  dataFrom:
    - extract:
        key: restic
