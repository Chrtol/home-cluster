---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
# Required variables : APP, GROUP, SUBDOMAIN, DESCRIPTION, REDIRECT_PATH
# Optional variables : DISPLAY_NAME (defaults to APP if not provided)
#                      OIDC_SECRET_NAMESPACE (defaults to security - set to app namespace for direct secret access)
# REDIRECT_PATH: The callback path for OIDC (e.g., /accounts/oidc/authentik/login/callback/)
# Creates blueprint-managed resources with naming convention:
#   - Provider: bp-${APP}-oidc
#   - Application: ${DISPLAY_NAME} (display name) / ${APP} (slug)
#   - Group: bp-${APP}-users
#   - Secret: ${APP}-oidc-authentik-application (in OIDC_SECRET_NAMESPACE)
#
# The provider emits only the openid/email/profile claims (no `groups`). Apps whose
# native config gates admin/access by group therefore can't match on this provider
# as-is; add a `groups` scope mapping via a per-app blueprint patch (see the
# grant_types patch pattern in blueprint-patch.yaml) if you need it. The wrenix
# chart's static scopes list can't take colon/apostrophe-laden envsubst defaults,
# so that extra belongs in a patch, not a component variable.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}-oidc
  labels:
    homelab/auth-component: "true"
spec:
  releaseName: ${APP}-oidc
  targetNamespace: ${OIDC_SECRET_NAMESPACE:=security}
  chartRef:
    kind: OCIRepository
    name: authentik-application
    namespace: flux-system
  interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # From https://codeberg.org/wrenix/helm-charts/src/branch/main/authentik-application/values.yaml
    blueprint:
      authentik:
        domain: "https://sso.${SECRET_DOMAIN}"
      provider:
        enabled: true
        name: "bp-${APP}-oidc"  # bp- prefix for blueprint-managed providers
        type: "oidc"
        oidc:
          clientType: "confidential"
          # clientID and clientSecret are auto-generated and stored in ${APP}-oidc-authentik-application secret
          redirectURL:
          - "https://${SUBDOMAIN}.${SECRET_DOMAIN}${REDIRECT_PATH}"
          tokenDuration: "minutes=5"
          signingKey: "namespace_security.secret_authentik-cert-tls.tls"
          scopes:
            - name: "authentik default OAuth Mapping: OpenID 'openid'"
            - name: "authentik default OAuth Mapping: OpenID 'email'"
            - name: "authentik default OAuth Mapping: OpenID 'profile'"
      application:
        name: "${DISPLAY_NAME:=${APP}}"  # Uses DISPLAY_NAME if provided, otherwise APP
        slug: "${APP}"  # Keep slug simple for compatibility
        group: "${GROUP}"
        launchURL: "https://${SUBDOMAIN}.${SECRET_DOMAIN}"
        openInNewTab: false
        icon: "${ICON_URL:-}"
        description: "${DESCRIPTION}"
        policyEngineMode: "any"
      groups:
        # Create app-specific group for access control (blueprint-managed)
        - slug: "bp-${APP}-users"
          parent: ""
        # Bind authentik Admins for admin access to all apps
        - slug: "authentik Admins"
          parent: ""