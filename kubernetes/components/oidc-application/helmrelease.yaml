---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
# Required variables : APP, GROUP, SUBDOMAIN, DESCRIPTION, REDIRECT_PATH
# Optional variables : DISPLAY_NAME (defaults to APP if not provided)
#                      OIDC_SECRET_NAMESPACE (defaults to security - set to app namespace for direct secret access)
#                      OIDC_INTERNAL_SUBDOMAIN (defaults to SUBDOMAIN) - registers a
#                        SECOND redirect URI at
#                        https://${OIDC_INTERNAL_SUBDOMAIN}.${SECRET_DOMAIN}${REDIRECT_PATH}.
#                        Set it when the app is reachable on a host different from
#                        SUBDOMAIN (e.g. files.* external vs filebrowser.* internal).
#                        Default duplicates the primary URI -> Authentik dedupes it,
#                        so single-host apps are unaffected.
# REDIRECT_PATH: The callback path for OIDC (e.g., /accounts/oidc/authentik/login/callback/)
# Creates blueprint-managed resources with naming convention:
#   - Provider: bp-${APP}-oidc
#   - Application: ${DISPLAY_NAME} (display name) / ${APP} (slug)
#   - Group: bp-${APP}-users
#   - Secret: ${APP}-oidc-authentik-application (in OIDC_SECRET_NAMESPACE)
#
# The provider emits only the openid/email/profile claims (no `groups`). Apps whose
# native config gates admin/access by group therefore can't match on this provider
# as-is; add a `groups` scope mapping via a per-app blueprint patch (see the
# grant_types patch pattern in blueprint-patch.yaml) if you need it. The wrenix
# chart's static scopes list can't take colon/apostrophe-laden envsubst defaults,
# so that extra belongs in a patch, not a component variable.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}-oidc
  labels:
    homelab/auth-component: "true"
spec:
  releaseName: ${APP}-oidc
  targetNamespace: ${OIDC_SECRET_NAMESPACE:=security}
  chartRef:
    kind: OCIRepository
    name: authentik-application
    namespace: flux-system
  interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # From https://codeberg.org/wrenix/helm-charts/src/branch/main/authentik-application/values.yaml
    blueprint:
      authentik:
        domain: "https://sso.${SECRET_DOMAIN}"
      provider:
        enabled: true
        name: "bp-${APP}-oidc"  # bp- prefix for blueprint-managed providers
        type: "oidc"
        oidc:
          clientType: "confidential"
          # clientID and clientSecret are auto-generated and stored in ${APP}-oidc-authentik-application secret
          redirectURL:
          # Primary hostname (SUBDOMAIN). Also the launch URL.
          - "https://${SUBDOMAIN}.${SECRET_DOMAIN}${REDIRECT_PATH}"
          # Second redirect URI for apps reachable on a DIFFERENT host than
          # SUBDOMAIN -- e.g. exposed on both gateways where the internal route
          # uses a different hostname (files.* external vs filebrowser.* internal).
          # Filebrowser derives its OIDC callback from the request origin, so
          # without the internal host registered, internal logins fail with
          # redirect_uri mismatch. Set OIDC_INTERNAL_SUBDOMAIN to that other host's
          # subdomain to register it. Defaults to SUBDOMAIN, making this an exact
          # duplicate of the line above -> Authentik dedupes it (redirect_uris is a
          # set), so apps that don't set it are completely unaffected.
          - "https://${OIDC_INTERNAL_SUBDOMAIN:=${SUBDOMAIN}}.${SECRET_DOMAIN}${REDIRECT_PATH}"
          tokenDuration: "minutes=5"
          # NAME of a CertificateKeyPair inside Authentik, not a k8s secret reference.
          # The old value ("namespace_security.secret_authentik-cert-tls.tls") matched
          # nothing, the chart's !Find resolved to None, and Authentik silently fell back
          # to HS256 -- unnoticed until hass-oidc-auth, which checks the algorithm.
          #
          # This name comes from the /certs/authentik-cert-tls mount added to the
          # authentik HelmRelease; discovery names the key pair after that directory.
          signingKey: "authentik-cert-tls"
          scopes:
            - name: "authentik default OAuth Mapping: OpenID 'openid'"
            - name: "authentik default OAuth Mapping: OpenID 'email'"
            - name: "authentik default OAuth Mapping: OpenID 'profile'"
      application:
        name: "${DISPLAY_NAME:=${APP}}"  # Uses DISPLAY_NAME if provided, otherwise APP
        slug: "${APP}"  # Keep slug simple for compatibility
        group: "${GROUP}"
        launchURL: "https://${SUBDOMAIN}.${SECRET_DOMAIN}"
        openInNewTab: false
        icon: "${ICON_URL:-}"
        description: "${DESCRIPTION}"
        policyEngineMode: "any"
      # Empty ON PURPOSE -- groups and their application bindings are created by
      # blueprint-patch.yaml instead. The chart renders each binding with
      # `identifiers: {pk: <$group.bindID>}` and there is no way to feed it a stable
      # bindID from here, so the identifier came out empty: it matched nothing, every
      # reconcile appended another binding (119 redundant estate-wide), and the second
      # entry displaced the first so bp-${APP}-users was never actually bound.
      # An empty list (not null) is what suppresses them -- the template falls back to
      # a default "app: <slug>" group when groups is not a slice.
      groups: []