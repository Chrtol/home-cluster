---
# Patches fields on the OAuth2Provider that the upstream wrenix/authentik-application
# chart cannot express (its values.yaml exposes only clientType, clientID,
# clientSecret, redirectURL, signingKey and scopes).
#
# Authentik 2026.x requires grant_types to be set explicitly; providers created by
# the chart's blueprint get an empty list, which makes the authorization code
# exchange fail at login. This blueprint runs alongside the chart's own and sets
# the field on the same provider (matched by name), so it is additive rather than
# a replacement.
#
# Delete this file if the upstream chart ever grows a grantTypes value.
apiVersion: v1
kind: Secret
metadata:
  name: ${APP}-oidc-grant-types-blueprint
  namespace: ${OIDC_SECRET_NAMESPACE:=security}
  labels:
    # Must match the LABEL the authentik blueprint sidecar selects on, which is
    # the legacy underscore form -- NOT the goauthentik.io/blueprint form in the
    # upstream docs. The chart-generated blueprint secrets use this same label.
    goauthentik_blueprint: "1"
stringData:
  blueprint.yaml: |
    version: 1
    metadata:
      name: ${APP}-oidc-grant-types
    entries:
      - model: authentik_providers_oauth2.OAuth2Provider
        # Match the provider the chart's blueprint created, and patch it in place.
        identifiers:
          name: bp-${APP}-oidc
        state: present
        attrs:
          # Standard OIDC web application: the login flow, plus token renewal so
          # sessions don't require a full re-login. Deliberately excludes the
          # legacy implicit / password / client_credentials grants that older
          # Authentik versions granted by default.
          grant_types:
            - authorization_code
            - refresh_token

      # Access groups + their application bindings, moved off the chart (see the
      # groups: [] note in helmrelease.yaml). The importer ANDs non-pk identifiers
      # together -- __query_from_identifier does `sub_query &= Q(**{k: v})` -- so
      # {target, group} is a genuine composite key and these entries are idempotent.
      - model: authentik_core.group
        id: app-users
        identifiers:
          name: "bp-${APP}-users"
        state: present
        attrs:
          name: "bp-${APP}-users"
          parent: null
      - model: authentik_policies.PolicyBinding
        identifiers:
          target: !Find [authentik_core.Application, [slug, "${APP}"]]
          group: !KeyOf app-users
        state: present
        attrs:
          order: 10
      - model: authentik_policies.PolicyBinding
        identifiers:
          target: !Find [authentik_core.Application, [slug, "${APP}"]]
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
        state: present
        attrs:
          order: 10

      # Optional shared access group (e.g. media-users), on top of bp-${APP}-users.
      # The application is created with policyEngineMode: any, so bindings OR together
      # -- membership in EITHER group grants access, which is what a hand-written
      # "user in {APP}-users or media-users" policy used to express.
      # Same !Condition guard as proxy-application's PROXY_ADMIN_GROUP: the arg is
      # coerced to bool, so an unset OIDC_ACCESS_GROUP skips the entry entirely
      # rather than letting !Find resolve to None and fail the whole blueprint.
      - model: authentik_policies.PolicyBinding
        conditions:
          - !Condition [AND, "${OIDC_ACCESS_GROUP:-}"]
        identifiers:
          target: !Find [authentik_core.Application, [slug, "${APP}"]]
          group: !Find [authentik_core.group, [name, "${OIDC_ACCESS_GROUP:-}"]]
        state: present
        attrs:
          order: 10
