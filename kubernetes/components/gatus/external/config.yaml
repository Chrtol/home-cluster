endpoints:
  - name: "${APP}"
    group: external
    url: "https://${GATUS_SUBDOMAIN:=${APP}}.${SECRET_DOMAIN}${GATUS_PATH:=/}"
    interval: 5m
    client:
      dns-resolver: tcp://1.1.1.1:53
      timeout: 30s
    conditions:
      - "[STATUS] == ${GATUS_STATUS:=200}"
    alerts:
      - type: custom
