---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${APP}-s3-setup
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${APP}-s3-setup
  namespace: ${NAMESPACE}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "update", "patch", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${APP}-s3-setup
  namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${APP}-s3-setup
subjects:
- kind: ServiceAccount
  name: ${APP}-s3-setup
  namespace: ${NAMESPACE}