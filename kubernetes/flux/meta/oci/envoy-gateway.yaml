---
# yaml-language-server: $schema=https://schemas.tholinka.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Pinned to 1.6.3 due to ext_authz redirect regression in 1.7.0
    # See: allowed_client_headers not configured, breaking Location header forwarding
    # TODO: Test 1.7.x+ when issue is resolved upstream
    tag: v1.8.3
  url: oci://mirror.gcr.io/envoyproxy/gateway-helm
