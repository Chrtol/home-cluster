---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/helmrepository_v1.json
# Temporal publishes only to a classic Helm index (gh-pages), not to an OCI
# registry, and home-operations/charts-mirror does not carry it -- so this is a
# HelmRepository despite the repo's OCI-first preference.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: temporal
  namespace: flux-system
spec:
  interval: 2h
  url: https://go.temporal.io/helm-charts
