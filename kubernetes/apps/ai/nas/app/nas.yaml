# restic backup repository for the ai namespace. The volsync-mover-nfs
# MutatingAdmissionPolicy injects a "repository" volume into every mover Job and
# hardcodes the claim name "nas-backup" -- resolved in the MOVER's own namespace,
# so each namespace running volsync needs its own pair. Without it the mover Pod
# sits Pending with no useful event. volumeHandle must be unique per PV; capacity
# is ignored for NFS but must be non-empty.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-backup-ai
spec:
  capacity:
    storage: 1Ti
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: ["nfsvers=4.2", "nconnect=16", "hard", "noatime"]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nas-backup-ai
    volumeAttributes:
      server: nas.${SECRET_DOMAIN}
      share: /mnt/truenas/cf-nas/backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-backup
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: nas-backup-ai
  resources:
    requests:
      storage: 1Ti
---
# kopia repository for the `nas` ClusterRepository -- kopiur mounts this claim's root
# at the repository path in every mover Job it runs in this namespace. Rooted at
# backup/kopia, not backup/, because kopiur has no subPath.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-kopia-ai
spec:
  capacity:
    storage: 1Ti
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: ["nfsvers=4.2", "nconnect=16", "hard", "noatime"]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nas-kopia-ai
    volumeAttributes:
      server: nas.${SECRET_DOMAIN}
      share: /mnt/truenas/cf-nas/backup/kopia
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-kopia
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: nas-kopia-ai
  resources:
    requests:
      storage: 1Ti
