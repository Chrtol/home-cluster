---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/externalsecret_v1.json
#
# Two secrets, because the Temporal chart and postgres-init want the same
# password under different shapes:
#
#   temporal-initdb-secret -> INIT_POSTGRES_* env for the postgres-init
#       initContainer wired into the schema Job (see helmrelease.yaml).
#       Creates the ai_temporal role and both databases, owned by that role.
#   temporal-store-secret  -> a single `password` key, referenced by BOTH
#       datastores via server.config.persistence.datastores.*.sql.existingSecret.
#       The chart would otherwise render the password into a Secret of its own
#       from a plaintext values field.
#
# The 1Password item is `temporal` (item name == app name, per repo
# convention), but the Postgres role and databases are ai_temporal /
# ai_temporal_visibility -- deliberately NOT the matching names. postiz-temporal
# already owns `temporal` and `temporal_visibility` on this same postgres17
# cluster, and two Temporal servers sharing one history store would corrupt both
# silently. Do not "tidy" the ai_ prefix away.
#
# Note also that the postiz 1Password item carries its own field spelled
# TEMPORAL_POSTGRES_PASS, for postiz-temporal's role. Same field name, different
# item, different role -- this file wants the one in the `temporal` item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-initdb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: temporal-initdb-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Space-separated: postgres-init creates each database in turn, all owned
        # by INIT_POSTGRES_USER.
        INIT_POSTGRES_DBNAME: "ai_temporal ai_temporal_visibility"
        INIT_POSTGRES_HOST: "{{ .POSTGRES_RW_SVC }}"
        INIT_POSTGRES_PORT: "5432"
        INIT_POSTGRES_USER: "ai_temporal"
        INIT_POSTGRES_PASS: "{{ .TEMPORAL_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: temporal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-store
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: temporal-store-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .TEMPORAL_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: temporal
