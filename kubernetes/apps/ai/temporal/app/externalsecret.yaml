---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/externalsecret_v1.json
# Two secrets for one password: postgres-init takes INIT_POSTGRES_* env,
# the chart's datastore existingSecret takes a bare `password` key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-initdb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: temporal-initdb-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Space-separated: postgres-init creates each in turn.
        INIT_POSTGRES_DBNAME: "${TEMPORAL_DB_NAME} ${TEMPORAL_DB_VISIBILITY_NAME}"
        INIT_POSTGRES_HOST: "{{ .POSTGRES_RW_SVC }}"
        INIT_POSTGRES_PORT: "5432"
        INIT_POSTGRES_USER: "${TEMPORAL_DB_USER}"
        INIT_POSTGRES_PASS: "{{ .TEMPORAL_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: temporal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-store
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: temporal-store-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .TEMPORAL_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: temporal
