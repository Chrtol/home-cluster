---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/externalsecret_v1.json
# Two secrets for one set of credentials: postgres-init takes INIT_POSTGRES_* env,
# the chart takes a bare `password` key plus values injected by valuesFrom.
#
# TEMPORAL_DB_NAME must NOT be `temporal` and TEMPORAL_DB_VISIBILITY_NAME must
# NOT be `temporal_visibility` -- postiz-temporal owns those on postgres17, and
# pointing a second server at them corrupts both histories silently.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-initdb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: temporal-initdb-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Space-separated: postgres-init creates each in turn.
        INIT_POSTGRES_DBNAME: "{{ .TEMPORAL_DB_NAME }} {{ .TEMPORAL_DB_VISIBILITY_NAME }}"
        INIT_POSTGRES_HOST: "{{ .POSTGRES_RW_SVC }}"
        INIT_POSTGRES_PORT: "5432"
        INIT_POSTGRES_USER: "{{ .TEMPORAL_DB_USER }}"
        INIT_POSTGRES_PASS: "{{ .TEMPORAL_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: temporal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-store
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: temporal-store-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # password is read by the chart's datastore existingSecret; the rest are
        # pulled into values by the HelmRelease valuesFrom/targetPath entries.
        password: "{{ .TEMPORAL_POSTGRES_PASS }}"
        databaseName: "{{ .TEMPORAL_DB_NAME }}"
        visibilityDatabaseName: "{{ .TEMPORAL_DB_VISIBILITY_NAME }}"
        user: "{{ .TEMPORAL_DB_USER }}"
  dataFrom:
    - extract:
        key: temporal
