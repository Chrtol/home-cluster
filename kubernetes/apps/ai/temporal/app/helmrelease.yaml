---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
spec:
  interval: 1h
  chart:
    spec:
      chart: temporal
      version: 1.6.0
      sourceRef:
        kind: HelmRepository
        name: temporal
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          # admintools' liveness probe is hardcoded in the chart template (no
          # values knob): `ls /` every 5s, in a container whose only process is
          # `sleep infinity`. Each exec costs ~52ms of CPU charged to the
          # container cgroup, so the probe alone accounted for 10m sustained --
          # twice the container's own request, and more than the Web UI draws.
          # It cannot detect any real failure either: if the sleep dies, PID 1
          # exits and the container restarts regardless. Stretched to 60s.
          - target:
              kind: Deployment
              name: temporal-admintools
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: temporal-admintools
              spec:
                template:
                  spec:
                    containers:
                      - name: admin-tools
                        livenessProbe:
                          periodSeconds: 60
  valuesFrom:
    # databaseName and user come from 1Password via temporal-store-secret.
    # Anything set under spec.values would override these, so they are absent there.
    - kind: Secret
      name: temporal-store-secret
      valuesKey: databaseName
      targetPath: server.config.persistence.datastores.default.sql.databaseName
    - kind: Secret
      name: temporal-store-secret
      valuesKey: user
      targetPath: server.config.persistence.datastores.default.sql.user
    - kind: Secret
      name: temporal-store-secret
      valuesKey: visibilityDatabaseName
      targetPath: server.config.persistence.datastores.visibility.sql.databaseName
    - kind: Secret
      name: temporal-store-secret
      valuesKey: user
      targetPath: server.config.persistence.datastores.visibility.sql.user
  values:
    schema:
      # Must be false under Flux, per the chart: hooks re-run the migration
      # Job on every reconcile.
      useHelmHooks: false
      ttlSecondsAfterFinished: 86400
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
      containerSecurityContext: &hardening
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        seccompProfile: { type: RuntimeDefault }
      securityContext: &podSecurity
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

    # Default true, for 1.29 images only.
    shims:
      dockerize: false
      elasticsearchTool: false

    server:
      replicaCount: 1
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      securityContext: *podSecurity
      config:
        logLevel: "info"
        persistence:
          defaultStore: default
          visibilityStore: visibility
          # IRREVERSIBLE once deployed. Chart default is 512.
          numHistoryShards: 128
          datastores:
            default:
              sql:
                # Plugin generation (PG 12+), not a server version. Server is 17.
                pluginName: postgres12
                connectAddr: "postgres17-rw.database.svc.cluster.local:5432"
                connectProtocol: "tcp"
                existingSecret: temporal-store-secret
                secretKey: password
                createDatabase: false
                manageSchema: true
                maxConns: 8
                maxIdleConns: 4
                maxConnLifetime: "1h"
                tls:
                  enabled: true
                  enableHostVerification: false
            visibility:
              sql:
                pluginName: postgres12
                connectAddr: "postgres17-rw.database.svc.cluster.local:5432"
                connectProtocol: "tcp"
                existingSecret: temporal-store-secret
                secretKey: password
                createDatabase: false
                manageSchema: true
                maxConns: 8
                maxIdleConns: 4
                maxConnLifetime: "1h"
                tls:
                  enabled: true
                  enableHostVerification: false
        namespaces:
          create: true
          namespace:
            - name: ai-coding
              retention: 7d

      frontend:
        # Sized from 5h of idle metrics, 2026-09-09. Peak working set across the
        # three services on this anchor was 69Mi (matching); CPU p95 17m.
        resources: &small
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            memory: 384Mi
        containerSecurityContext: *hardening
        metrics:
          serviceMonitor:
            enabled: true
      history:
        # The only service whose draw scales with workflow volume, so it keeps
        # the widest margin: idle is 22m / 104Mi against 128 shards.
        resources:
          requests:
            cpu: 35m
            memory: 160Mi
          limits:
            memory: 512Mi
        containerSecurityContext: *hardening
        metrics:
          serviceMonitor:
            enabled: true
      matching:
        resources: *small
        containerSecurityContext: *hardening
        metrics:
          serviceMonitor:
            enabled: true
      worker:
        resources: *small
        containerSecurityContext: *hardening
        metrics:
          serviceMonitor:
            enabled: true

    admintools:
      enabled: true
      # The chart also injects these as the schema Job's first initContainers,
      # its only pre-migration hook. Runs on the admintools pod too; idempotent.
      additionalInitContainers:
        - name: init-db
          image: >-
            ghcr.io/home-operations/postgres-init:18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: temporal-initdb-secret
          securityContext: *hardening
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 128Mi
      containerSecurityContext: *hardening
      securityContext: *podSecurity

    web:
      enabled: true
      replicaCount: 1
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      additionalEnv:
        - name: TEMPORAL_DEFAULT_NAMESPACE
          value: ai-coding
        - name: TEMPORAL_NOTIFY_ON_NEW_VERSION
          value: "false"
      # Idle draw is 0m / 10Mi -- the UI does nothing until someone opens it.
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 128Mi
      containerSecurityContext: *hardening
      securityContext: *podSecurity
