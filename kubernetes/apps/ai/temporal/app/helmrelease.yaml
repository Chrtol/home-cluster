---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
spec:
  interval: 1h
  chart:
    spec:
      chart: temporal
      version: 1.6.0
      sourceRef:
        kind: HelmRepository
        name: temporal
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    schema:
      # Must be false under Flux, per the chart: hooks re-run the migration
      # Job on every reconcile.
      useHelmHooks: false
      ttlSecondsAfterFinished: 86400
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
      containerSecurityContext: &hardening
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        seccompProfile: { type: RuntimeDefault }
      securityContext: &podSecurity
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

    # Default true, for 1.29 images only.
    shims:
      dockerize: false
      elasticsearchTool: false

    server:
      replicaCount: 1
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      securityContext: *podSecurity
      config:
        logLevel: "info"
        persistence:
          defaultStore: default
          visibilityStore: visibility
          # IRREVERSIBLE once deployed. Chart default is 512.
          numHistoryShards: 128
          datastores:
            default:
              sql:
                # Plugin generation (PG 12+), not a server version. Server is 17.
                pluginName: postgres12
                databaseName: ${TEMPORAL_DB_NAME}
                connectAddr: "postgres17-rw.database.svc.cluster.local:5432"
                connectProtocol: "tcp"
                user: ${TEMPORAL_DB_USER}
                existingSecret: temporal-store-secret
                secretKey: password
                createDatabase: false
                manageSchema: true
                maxConns: 8
                maxIdleConns: 4
                maxConnLifetime: "1h"
                tls:
                  enabled: true
                  enableHostVerification: false
            visibility:
              sql:
                pluginName: postgres12
                databaseName: ${TEMPORAL_DB_VISIBILITY_NAME}
                connectAddr: "postgres17-rw.database.svc.cluster.local:5432"
                connectProtocol: "tcp"
                user: ${TEMPORAL_DB_USER}
                existingSecret: temporal-store-secret
                secretKey: password
                createDatabase: false
                manageSchema: true
                maxConns: 8
                maxIdleConns: 4
                maxConnLifetime: "1h"
                tls:
                  enabled: true
                  enableHostVerification: false
        namespaces:
          create: true
          namespace:
            - name: ai-coding
              retention: 7d

      frontend:
        resources: &small
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
        containerSecurityContext: *hardening
        metrics:
          serviceMonitor:
            enabled: true
      history:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
        containerSecurityContext: *hardening
        metrics:
          serviceMonitor:
            enabled: true
      matching:
        resources: *small
        containerSecurityContext: *hardening
        metrics:
          serviceMonitor:
            enabled: true
      worker:
        resources: *small
        containerSecurityContext: *hardening
        metrics:
          serviceMonitor:
            enabled: true

    admintools:
      enabled: true
      # The chart also injects these as the schema Job's first initContainers,
      # its only pre-migration hook. Runs on the admintools pod too; idempotent.
      additionalInitContainers:
        - name: init-db
          image: >-
            ghcr.io/home-operations/postgres-init:18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: temporal-initdb-secret
          securityContext: *hardening
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 128Mi
      containerSecurityContext: *hardening
      securityContext: *podSecurity

    web:
      enabled: true
      replicaCount: 1
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      additionalEnv:
        - name: TEMPORAL_DEFAULT_NAMESPACE
          value: ai-coding
        - name: TEMPORAL_NOTIFY_ON_NEW_VERSION
          value: "false"
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      containerSecurityContext: *hardening
      securityContext: *podSecurity
