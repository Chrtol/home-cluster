---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/externalsecret_v1.json
# Substitution source for the temporal Kustomization, not consumed by any pod.
# Kept in its own Kustomization so the secret exists before the manifests that
# substitute from it are built.
#
# TEMPORAL_DB_NAME must NOT be `temporal`, and TEMPORAL_DB_VISIBILITY_NAME must
# NOT be `temporal_visibility` -- postiz-temporal owns those on postgres17, and
# pointing a second server at them corrupts both histories silently.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-vars
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: temporal-vars
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TEMPORAL_DB_NAME: "{{ .TEMPORAL_DB_NAME }}"
        TEMPORAL_DB_VISIBILITY_NAME: "{{ .TEMPORAL_DB_VISIBILITY_NAME }}"
        TEMPORAL_DB_USER: "{{ .TEMPORAL_DB_USER }}"
  dataFrom:
    - extract:
        key: temporal
