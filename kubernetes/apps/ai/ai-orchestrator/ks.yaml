---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ai-orchestrator
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  dependsOn:
    # the worker polls the frontend on startup; without this it crash-loops
    # through the whole Temporal install on a cold cluster
    - name: temporal
      namespace: ai
  path: "./kubernetes/apps/ai/ai-orchestrator/app"
  components:
    # The Windows shift launcher reaches /shifts/* and /dispatcher through this
    # Authentik-guarded hostname. The webhook route in the HelmRelease stays
    # separate: kan cannot present a session, so that one is HMAC-only.
    - ../../../../components/ext-auth
    - ../../../../components/proxy-application
    - ../../../../components/route-timeout
  postBuild:
    substitute:
      APP: *app
      EXT_AUTH_PORT: "8080"
      EXT_AUTH_HOST: ai-shifts
      # app-template already named the webhook route `ai-orchestrator`
      EXT_AUTH_HTTPROUTE_NAME: ai-orchestrator-shifts
      ROUTE_TIMEOUT_TARGET: ai-orchestrator-shifts
      SUBDOMAIN: ai-shifts
      GROUP: Infrastructure
      DISPLAY_NAME: AI shifts
      DESCRIPTION: "Open, heartbeat and stop a desktop GPU shift for the AI orchestrator"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m
