---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/externalsecret_v1.json
#
# KAN_WEBHOOK_SECRET must match the `secret` on the kan webhook exactly. kan
# signs the raw request body with HMAC-SHA256 keyed on it and sends the hex
# digest as X-Webhook-Signature; a mismatch makes every delivery 400 and the
# only recovery is the reconciliation sweep.
#
# KAN_API_KEY is a kan API key, created in the kan UI under Settings -> API.
# It is NOT a 1Password, GitHub or Authentik token. It carries the full
# read/write rights of the kan user that created it, so prefer a dedicated
# service user over a personal key: kan attributes webhook events to the acting
# user, and a shared key makes the orchestrator's own writes indistinguishable
# from that human's approvals.
#
# 1Password field labels carry an AI_ORCHESTRATOR_ prefix while the env vars the
# app reads do not. `dataFrom.extract` flattens every extracted item into one
# map, so an unprefixed label like KAN_API_KEY would collide the moment a second
# item is merged in here -- as the temporal secret already does with
# cloudnative-pg. The prefix also makes the field findable by search in
# 1Password, which matches on text rather than by item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-orchestrator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ai-orchestrator-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KAN_BASE_URL: "https://kanban.${SECRET_DOMAIN}/api/v1"
        KAN_API_KEY: "{{ .AI_ORCHESTRATOR_KAN_API_KEY }}"
        KAN_WEBHOOK_SECRET: "{{ .AI_ORCHESTRATOR_KAN_WEBHOOK_SECRET }}"
        # The kan user id the API key belongs to, from GET /users/me. Optional:
        # the state machine is already loop-free because the orchestrator never
        # writes the one column that triggers dispatch. Set it once the
        # orchestrator has its own kan user and self-caused events stop mattering.
        KAN_SELF_ACTOR_ID: "{{ .AI_ORCHESTRATOR_KAN_SELF_ACTOR_ID }}"
  dataFrom:
    - extract:
        key: ai-orchestrator
