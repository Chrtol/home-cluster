---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-orchestrator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      ai-orchestrator:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Built from apps/ai-orchestrator by .github/workflows/ai-orchestrator.yaml.
            # Pinned by hand: no ImageUpdateAutomation, which would need a
            # git-write credential reachable from this namespace.
            image:
              repository: ghcr.io/chrtol/ai-orchestrator
              tag: main-20260909144948@sha256:d8f285bb1ebe1333dc29692a5ccca4367ffee57b3a5c1210a88b7151d9556bd4
            env:
              # readOnlyRootFilesystem below means every import would otherwise
              # attempt a __pycache__ write and silently fail.
              PYTHONDONTWRITEBYTECODE: "1"
              TEMPORAL_ADDRESS: temporal-frontend.ai.svc.cluster.local:7233
              TEMPORAL_NAMESPACE: ai-coding
              TEMPORAL_TASK_QUEUE: ai-coding
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
