# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-orchestrator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      # Two processes from one image (plan §7): the Temporal worker runs the
      # workflows, the API terminates kan's webhook. They are separate
      # controllers so the webhook stays answerable while the worker restarts.
      ai-orchestrator:
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: default
        pod:
          # app-template defaults this to false. The worker is the only process
          # that talks to the API server — it creates and observes the coding
          # Jobs — so it is the only one that gets a token. Without this it
          # fails at startup on `load_incluster_config`.
          automountServiceAccountToken: true
        containers:
          app:
            # Built from apps/ai-orchestrator by .github/workflows/ai-orchestrator.yaml.
            # Tag only, no digest: app-template's image map has no digest field.
            image: &image
              repository: ghcr.io/chrtol/ai-orchestrator
              tag: main-20260911170254 # {"$imagepolicy": "flux-system:ai-orchestrator:tag"}
            env: &env
              # readOnlyRootFilesystem below means every import would otherwise
              # attempt a __pycache__ write and silently fail.
              PYTHONDONTWRITEBYTECODE: "1"
              TEMPORAL_ADDRESS: temporal-frontend.ai.svc.cluster.local:7233
              TEMPORAL_NAMESPACE: ai-coding
              TEMPORAL_TASK_QUEUE: ai-coding
              PROJECTS_PATH: /config/projects.yaml
              JOBS_NAMESPACE: ai-jobs
              WORKSPACE_STORAGE_CLASS: csi-rbd-sc
              WORKSPACE_SIZE: 5Gi
              DESKTOP_ID: primary
              # Phase 2's coding Job is the dummy worker, which ships in this
              # same image. Spelled out rather than aliased to `&image`: that
              # anchor is a repository/tag map, and this needs one string.
              JOB_IMAGE: ghcr.io/chrtol/ai-orchestrator:main-20260911170254@sha256:9f399d7ba6d5c141536f24b960122938c340d93ea4c233a46e0900c8551677ff # {"$imagepolicy": "flux-system:ai-orchestrator"}
              RECONCILE_INTERVAL_SECONDS: "300"
              # Context assembly reads reviewed lessons from here. Internal
              # service name: this is the orchestrator talking to Memini
              # in-cluster, not the external route Claude Desktop uses. The key
              # itself arrives via the secret, never as a value here.
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              # Plan §13 Phase 2's "deliberately fails when requested". 0 is
              # off. Set a step (1..STEPS, the dummy worker runs 6) to make the
              # attempt exit 17 there, which drives the card to Blocked.
              #
              # Set the card id too, or every attempt on every board fails. The
              # worker logs a warning at startup whenever this is armed, so a
              # value left behind here is visible rather than mysterious.
              JOB_FAIL_AT_STEP: "0"
              JOB_FAIL_TASK_ID: ""
            envFrom: &envFrom
              - secretRef:
                  name: ai-orchestrator-secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              # Measured 2026-09-09: both controllers idle at ~103Mi, flat over
              # every pod generation, so the 64Mi request was below steady state
              # -- a Burstable pod over its memory request is evicted first under
              # node pressure. CPU p95 is 9m on both.
              requests:
                cpu: 15m
                memory: 160Mi
              limits:
                memory: 512Mi
      api:
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: default
        # No `automountServiceAccountToken` override: this is the pod reachable
        # from off-cluster, and it deliberately holds no Kubernetes credential.
        # It runs no Activities — it verifies a signature and signals Temporal.
        containers:
          app:
            image: *image
            command: ["python", "-m", "uvicorn", "orchestrator.api:app"]
            args: ["--host", "0.0.0.0", "--port", "8080"]
            env: *env
            envFrom: *envFrom
            securityContext: *securityContext
            probes:
              # Liveness is shallow; readiness pings Temporal. Sharing one
              # probe meant readiness carried no information.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /healthz, port: 8080}
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /readyz, port: 8080}
                  initialDelaySeconds: 10
                  periodSeconds: 30
            resources:
              # Measured 2026-09-09: both controllers idle at ~103Mi, flat over
              # every pod generation, so the 64Mi request was below steady state
              # -- a Burstable pod over its memory request is evicted first under
              # node pressure. CPU p95 is 9m on both.
              requests:
                cpu: 15m
                memory: 160Mi
              limits:
                memory: 512Mi
    serviceAccount:
      # The chart creates this and names it after the release, so both
      # controllers run as ServiceAccount/ai-orchestrator. rbac.yaml binds that
      # name into ai-jobs rather than declaring its own account, which would
      # collide with this one.
      default: {}
    service:
      app:
        controller: api
        ports:
          http:
            port: 8080
    route:
      # Internal only, and only the webhook path. kan reaches this by DNS name
      # over HTTPS, which its own SSRF guard requires — it rejects a literal
      # RFC1918 address but resolves a hostname that points at one.
      #
      # No forward auth: kan cannot present an Authentik session, and
      # `sendWebhookToUrl` sets exactly three headers, none of them
      # Authorization. The route's authentication is the HMAC signature the API
      # verifies over the raw body.
      internal:
        hostnames: ["ai-orchestrator.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /webhooks/board
            backendRefs:
              - identifier: app
                port: 8080
    persistence:
      config:
        type: configMap
        name: ai-orchestrator-projects
        globalMounts:
          - path: /config
            readOnly: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
