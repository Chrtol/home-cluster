---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./rbac.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: ai-orchestrator-projects
    files:
      - projects.yaml
generatorOptions:
  # A content hash in the name would change the ConfigMap's name on every edit,
  # which the HelmRelease references by a fixed name. Reloader restarts the pods
  # on a change instead.
  disableNameSuffixHash: true
