---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/externalsecret_v1.json
#
# 1Password item: memini
#   MEMINI_API_KEY               break-glass admin bearer token. At least 32
#                                random URL-safe characters. This is the
#                                recovery credential, not a day-to-day one --
#                                the named keys below are what clients use.
#   MEMINI_CLAUDE_CODE_KEY       per-client key, same format
#   MEMINI_CODEX_KEY             per-client key for Codex, same format
#   MEMINI_ORCHESTRATOR_KEY      per-client key, same format
#   MEMINI_CLAUDE_DESKTOP_KEY    per-client key, same format. Separate from the
#                                Claude Code key on purpose: it is pasted into
#                                claude_desktop_config.json in cleartext on a
#                                workstation, so it must be revocable on its own.
#
# 1Password item: litellm  (already created for the gateway)
#   LITELLM_MASTER_KEY           reused here as the embeddings credential
#
# Two items are merged below and `dataFrom.extract` flattens both into one map,
# so every label must be unique across them -- which the MEMINI_ / LITELLM_
# prefixes guarantee.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: memini-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        # Memini reaches every model through LiteLLM, so its embeddings
        # credential is the gateway's key, not a model vendor's.
        MEMINI_EMBED_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
  dataFrom:
    - extract:
        key: memini
    - extract:
        key: litellm
---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/externalsecret_v1.json
#
# Declarative named API keys, one per client, each pinned to its own namespace
# so a key issued to one client cannot read another's memories. Loaded once at
# boot with fail-loud validation, so a malformed file stops the pod rather than
# quietly falling back to the single admin token.
#
# `read_only: true` is refused server-side, not merely undeclared in a tool
# description -- the right setting for anything unattended.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini-api-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: memini-api-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api-keys.yaml: |
          keys:
            - name: claude-code
              secret: "{{ .MEMINI_CLAUDE_CODE_KEY }}"
              default_namespace: home-cluster
            - name: codex
              secret: "{{ .MEMINI_CODEX_KEY }}"
              default_namespace: home-cluster
            - name: ai-orchestrator
              secret: "{{ .MEMINI_ORCHESTRATOR_KEY }}"
              default_namespace: home-cluster
            # Same namespace as the others -- that shared namespace is what
            # makes a fact written in one client readable in another.
            - name: claude-desktop
              secret: "{{ .MEMINI_CLAUDE_DESKTOP_KEY }}"
              default_namespace: home-cluster
  dataFrom:
    - extract:
        key: memini
