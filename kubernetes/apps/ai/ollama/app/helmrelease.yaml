---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      ollama:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          affinity:
            nodeAffinity:
              # Require dell1 (UHD 770 is faster than UHD 630)
              #
              # BEFORE RE-ENABLING THIS APP, READ THIS. Plex was moved onto dell1 on
              # 2026-07-20 (while this app was disabled) and now holds its single
              # gpu.intel.com/i915 slot. Re-enabling ollama as-is will NOT work and
              # will NOT be obvious:
              #   - this affinity is `required`, so ollama cannot fall back elsewhere
              #   - dell1's one i915 slot is taken, making the node infeasible
              #   - Plex is priorityClass media-high (300), ollama has none (0), so
              #     the scheduler will never evict Plex to make room
              # Net effect: the pod sits Pending indefinitely with no alert and no
              # crash -- it simply never starts.
              #
              # Pick one when the time comes:
              #   A) soften this to preferredDuringScheduling... so ollama lands on a
              #      lenovo (HD 630) instead of hanging
              #   B) drop Plex's dell1 preference in
              #      kubernetes/apps/media/plex/app/helmrelease.yaml so it moves back
              #   C) run ollama CPU-only by removing the gpu.intel.com/i915 limit
              # Context: this was parked because no model small enough for this GPU
              # (~5B ceiling) tagged well enough for paperless without heavy CPU use.
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["dell1"]
        containers:
          app:
            image:
              repository: intelanalytics/ipex-llm-inference-cpp-xpu
              tag: 2.3.0-SNAPSHOT
            command:
              - /bin/sh
              - -c
              - mkdir -p /llm/ollama && cd /llm/ollama && init-ollama && exec ./ollama serve
            env:
              TZ: ${SECRET_TIMEZONE}
              OLLAMA_HOST: "0.0.0.0"
              OLLAMA_MODELS: /models
              OLLAMA_INTEL_GPU: "true"
              # Limit GPU layers to prevent memory overcommit (iGPU has limited shared memory)
              OLLAMA_NUM_GPU: "24"
              # Keep model loaded to avoid reload cycles
              OLLAMA_KEEP_ALIVE: "60m"
              ZES_ENABLE_SYSMAN: "1"
              # Enable SYCL kernel caching for stability
              SYCL_CACHE_PERSISTENT: "1"
            resources:
              requests:
                cpu: 15m
                memory: 4352Mi
              limits:
                cpu: "4"
                memory: "16Gi"
                gpu.intel.com/i915: 1
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 11434
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false  # Ollama needs root for GPU access
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: ollama
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      models:
        existingClaim: ollama
        globalMounts:
          - path: /root/.ollama
            subPath: ollama
          - path: /models
            subPath: models
