---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
generatorOptions:
  # A content hash would rename the ConfigMap on every edit, and the
  # HelmRelease references it by fixed name. Reloader restarts the pod instead.
  disableNameSuffixHash: true
