---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/externalsecret_v1.json
#
# LITELLM_MASTER_KEY is the single credential this gateway accepts while it runs
# without a database. Every consumer -- Memini today, anything added later --
# presents it, so treat it as a shared secret and rotate it everywhere at once.
#
# 1Password item: litellm
#   LITELLM_MASTER_KEY   "sk-" followed by at least 32 random URL-safe
#                        characters. The "sk-" prefix is not decorative:
#                        LiteLLM rejects a master key without it.
#
# Field labels carry the LITELLM_ prefix because `dataFrom.extract` flattens
# every extracted item into one map -- an unprefixed label collides the moment
# a second item is merged in here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
  dataFrom:
    - extract:
        key: litellm
