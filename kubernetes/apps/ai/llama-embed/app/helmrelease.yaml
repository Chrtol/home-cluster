---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llama-embed
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      llama-embed:
        # RWO volume with one replica: a rolling update would leave the new pod
        # unable to attach while the old one still holds the claim.
        strategy: Recreate
        initContainers:
          # llama-server can fetch from Hugging Face itself, but that resolves
          # the tag at every start and needs a writable cache it manages. An
          # explicit URL keeps the exact artifact visible in Git, and the
          # .part-then-rename makes a half-finished download impossible to
          # mistake for a complete one -- `test -s` on the final name would
          # otherwise accept a truncated file forever.
          #
          # Written without a single shell variable on purpose. This file goes
          # through Flux postBuild envsubst before it reaches the cluster, and
          # an undefined $name there expands to the empty string rather than
          # failing -- a `mv "$model.part" "$model"` would arrive as `mv`.
          download-model:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.22.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                if [ -s /models/Qwen3-Embedding-0.6B-Q8_0.gguf ]; then
                  echo "model already present, skipping download"
                  exit 0
                fi
                curl -fL --retry 5 --retry-delay 5 -C - \
                  -o /models/Qwen3-Embedding-0.6B-Q8_0.gguf.part \
                  https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
                mv /models/Qwen3-Embedding-0.6B-Q8_0.gguf.part /models/Qwen3-Embedding-0.6B-Q8_0.gguf
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server@sha256:9116e6ed0f288247a9daaa610a3a30c061af2b1d6ee8c9acc0d402b65ec87c29
            args:
              - --model
              - /models/Qwen3-Embedding-0.6B-Q8_0.gguf
              # the name LiteLLM forwards as the model; keep it in step with
              # litellm's config.yaml and memini's MEMINI_EMBED_MODEL
              - --alias
              - qwen3-embedding
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              - --embeddings
              # Qwen3-Embedding is a causal model that encodes the sequence into
              # its FINAL token. Mean pooling (llama.cpp's default for embedding
              # models) silently produces vectors that are the wrong shape of
              # wrong: valid floats, plausible cosine scores, poor recall.
              - --pooling
              - last
              # a single sequence must fit in one micro-batch, so ubatch is held
              # equal to ctx rather than left at its 512 default
              - --ctx-size
              - "4096"
              - --batch-size
              - "4096"
              - --ubatch-size
              - "4096"
              - --threads
              - "4"
              # Pin the slot count. Without this llama-server defaults to 4
              # slots and allocates n_ctx_slot of KV for EACH -- 4 x 4096 =
              # 16384 tokens, ~1.9GB, which OOMKilled the pod at a 3Gi limit
              # on 2026-09-11. Memini never sends more than
              # MEMINI_EMBED_MAX_CONCURRENCY (2) concurrent embed requests, so
              # the other two slots were pure cost. Keep these two numbers in
              # step: raising memini's concurrency without raising this will
              # queue requests, and raising this without more memory will OOM.
              - --parallel
              - "2"
              # THE bound on this container's memory growth. llama-server keeps a
              # prompt cache in host RAM whose ceiling is --cache-ram, and that
              # ceiling DEFAULTS TO 8192 MiB -- nearly double the memory limit
              # below. A cache that only evicts at 8GiB inside a container that
              # dies at 4300Mi never evicts: the OOM killer always wins the race.
              # That is what OOMKilled the pod twice on 2026-09-11, and why
              # pinning --parallel 2 changed the starting point but not the slope.
              #
              # 0 disables it. Prefix reuse is worth nothing to an embedder --
              # Memini embeds each document once and stores the vector, so there
              # is no second request with the same prefix to serve from cache.
              # The cache was pure cost. This also disables --cache-idle-slots
              # (the server logs "requires --cache-ram, disabling"), which was
              # copying each idle slot's KV into that same cache.
              #
              # Measured 2026-09-11 on an isolated probe pod at this digest with
              # these args, against the live pod as a concurrent control -- same
              # node, same model, same 15 minutes, this flag the only difference
              # (Prometheus container_memory_working_set_bytes):
              #   --cache-ram 0  150 distinct ~500-token embeds, 0 errors:
              #                  2781Mi -> 2784Mi   (+2.5Mi)
              #   default 8192   lighter organic traffic:
              #                  1649Mi -> 2595Mi   (+946Mi)
              # The heavier-load arm is the one that stayed flat, so the growth
              # cannot be attributed to load.
              #
              # Disabling it costs nothing measurable. A repeated prompt is still
              # answered in 0.11s against 6.17s cold, because that reuse is the
              # slot's own retained KV -- which is what Memini's duplicate embed
              # of the same text actually hits -- and not this cache.
              - --cache-ram
              - "0"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext: *securityContext
            resources:
              # ESTIMATES, not measurements -- ~640Mi of weights plus KV cache
              # and compute buffers sized by ctx/ubatch. Replace both from
              # Goldilocks once this has served real traffic. No CPU limit
              # (plan section 6): throttling an embedder just makes recall slow.
              requests:
                cpu: 100m
                # Start-up footprint with --parallel 2, measured 2026-09-11:
                # ~830Mi at load, ~1.2Gi once the model is resident. 2Gi is a
                # comfortable floor for scheduling; it is NOT the ceiling --
                # see the limit below.
                memory: 2Gi
              limits:
                # Raised 3Gi -> 4300Mi (4.2GiB) on 2026-09-11 after a second
                # OOMKill, this one WITH --parallel 2 already running. The
                # previous note here claimed ~2Gi was "the real floor" once the
                # slot count was pinned; that is disproved. Working set climbed
                # 831Mi -> 3065Mi over 2.5h of light traffic and hit the limit:
                # the slot fix moved the starting point, not the slope.
                #
                # The cause is now known and bounded in the args above: the
                # prompt cache, ceiling set by --cache-ram, which defaulted to
                # 8192Mi. With --cache-ram 0 the growth is gone, so this limit no
                # longer has to outrun a leak -- it only has to cover the real
                # steady-state footprint.
                #
                # Deliberately left at 4300Mi rather than lowered with the same
                # commit. The bounded config has been measured over a
                # request-dense window (150 embeds, +2.5Mi drift), not over 24
                # hours, and the highest working set seen under it was 2784Mi
                # with prompts near the 2048-token slot ctx. Lowering the limit
                # on 15 minutes of evidence would repeat the mistake this
                # workstream exists to fix -- a flat stretch is not a ceiling.
                # Lower it once a 24h series on --cache-ram 0 exists; expect
                # somewhere around 3500Mi.
                #
                # Judge that series by request count, not elapsed time. This
                # container sat dead flat at 1161Mi for 96 minutes purely because
                # no embed requests arrived, then stepped the moment one did.
                # Source of record is Prometheus
                # container_memory_working_set_bytes, not kubectl top; the two
                # disagree and mixing them produced a bogus reading during the
                # incident.
                memory: 4300Mi
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: llama-embed
        ports:
          http:
            port: 8080
    persistence:
      models:
        existingClaim: llama-embed-models
        globalMounts:
          - path: /models
