---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  interval: 1h
  # Longer than the startup probe budget above; the default 5m expired while BDS
  # was still coming up and Helm uninstall-remediated the release in a loop.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      minecraft:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Seeds the broadcaster config ONLY if absent (`cp -n`). MCXboxBroadcast
          # rewrites config.yml itself (stamping a configVersion) and keeps its Xbox
          # token cache in the same directory, so git can't be authoritative here --
          # to apply a change from the ConfigMap, delete the file from the PVC first.
          # Reuses the bedrock image purely so there's no third image to track.
          seed-broadcast-config:
            image: &bdsImage
              repository: docker.io/itzg/minecraft-bedrock-server
              tag: 2026.8.2@sha256:6bb1cb8ee0c1fdf96dbd9dfe77bed4e20c8e3946112bed4f9be609e8f14efe9a
            command:
              - /bin/sh
              - -c
              # cp -f, not -n: the tool rewrites config.yml at runtime, so seeding
              # only-if-absent lets its version win permanently and git silently
              # stops applying. Auth tokens live in cache/ and survive this.
              # 0664 because the broadcast container runs as the image's own `app`
              # user and reaches this file via the fsGroup supplementary group.
              - cp -f /seed/config.yml /broadcast/config.yml; chmod 0664 /broadcast/config.yml || true
            securityContext: &appUser
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
        containers:
          app:
            image: *bdsImage
            env:
              EULA: "TRUE"
              TZ: ${SECRET_TIMEZONE}
              # The BDS binary is downloaded at container start, not baked into the
              # image -- so the running Minecraft version can change without a git
              # commit. LATEST is deliberate: consoles auto-update and there are no
              # plugins to break, so pinning mostly buys an outage when she updates.
              VERSION: LATEST
              SERVER_NAME: Minecraft
              SERVER_PORT: "19132"
              LEVEL_NAME: world
              GAMEMODE: survival
              DIFFICULTY: normal
              ALLOW_CHEATS: "false"
              # Not sized to the current household -- the allowlist is what actually
              # controls access, so this only caps CONCURRENT players. Sized for a
              # friend group; view-distance is the lever to drop first if it lags.
              MAX_PLAYERS: "10"
              VIEW_DISTANCE: "16"
              ONLINE_MODE: "true"
              # Enforce the allowlist, but do NOT set ALLOW_LIST_USERS. That variable
              # GENERATES allowlist.json, which would fight (and on restart silently
              # overwrite) the in-game `/allowlist add` edits made by an operator.
              # allowlist.json is runtime state on the PVC; volsync is its only copy.
              ALLOW_LIST: "true"
              # MUST be explicitly true, not merely omitted. Despite the name, this
              # gates whether the server answers unconnected RakNet pings at all --
              # how mc-monitor health-checks it AND how every Bedrock client probes a
              # server before connecting. With it false the probe gets `empty response
              # from bedrock server` while the server logs a healthy `Server started`
              # and holds a correct 0.0.0.0:19132 UDP socket.
              # Omitting it does NOT restore the default: server.properties lives on
              # the PVC and the image only ever writes env values into it, so a
              # deleted variable leaves the old value in place forever.
              ENABLE_LAN_VISIBILITY: "true"
              UID: "1000"
              GID: "1000"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /usr/local/bin/mc-monitor
                      - status-bedrock
                      - --host
                      - 127.0.0.1
                      - --port
                      - "19132"
                  # custom:true drops the chart defaults entirely, including the 1s
                  # timeout -- every field has to be spelled out or the probe flaps.
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /usr/local/bin/mc-monitor
                      - status-bedrock
                      - --host
                      - 127.0.0.1
                      - --port
                      - "19132"
                  # First boot downloads the whole BDS zip from Mojang before the
                  # server ever listens; a short startup budget would liveness-kill
                  # it into a permanent crashloop. 10m.
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
                  # 5m, kept below both the Deployment progressDeadline (10m) and the
                  # HelmRelease timeout (15m). If this budget outlasts either, a slow
                  # start is rolled back mid-boot and reinstalls forever.
                  failureThreshold: 30
            securityContext:
              <<: *appUser
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              # Sized for MAX_PLAYERS=10 at view-distance 16. BDS holds loaded chunks
              # per player, so memory scales with concurrent players, not world size.
              # No CPU limit on purpose: throttling a game server's tick loop shows up
              # as rubber-banding, and the main tick is largely single-threaded.
              requests:
                cpu: 500m
                memory: 1500Mi
              limits:
                memory: 6Gi
          broadcast:
            image:
              repository: ghcr.io/mcxboxbroadcast/standalone
              tag: latest@sha256:11b74fc32de317f3650e981f42c10e5f06691fc284aaa26b6a32dad4be043d83
            env:
              TZ: ${SECRET_TIMEZONE}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      # Give BDS room to flush the world on SIGTERM. With volsync-only backups the
      # clean shutdown save is what keeps a snapshot from catching a torn world.
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Keep off lenovo1: its kernel WireGuard softirq load from seeding
                  # already saturates that node, and this is latency-sensitive UDP.
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["lenovo1"]
      securityContext:
        # Only fsGroup here -- the user is set PER CONTAINER on purpose.
        # BDS must run as 1000: its entrypoint-demoter demotes root -> UID/GID, which
        # needs CAP_SETUID/CAP_SETGID that `drop: ["ALL"]` removes, so it dies with
        # `fork/exec /opt/bedrock-entry.sh: operation not permitted`. Starting as
        # non-root makes the demoter a no-op.
        # The broadcaster must NOT: its image runs as its own `app` user and /opt/app
        # is not traversable by uid 1000, giving `Unable to access jarfile`. It reaches
        # the PVC through the fsGroup supplementary group instead. And it can't take a
        # bare runAsNonRoot either -- the image declares a NAMED user, which the kubelet
        # refuses to verify as non-root.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: minecraft
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.0.30.67
        # externalTrafficPolicy is deliberately unset (defaults to Cluster). With
        # Local, Cilium's L2 announcement leader drops traffic whenever it isn't
        # also the pod's node -- the failure Owncast RTMP hit.
        ports:
          bedrock:
            port: 19132
            protocol: UDP
    persistence:
      # sqlite-jdbc (broadcaster player-history DB) unpacks its native .so into
      # java.io.tmpdir at startup; with readOnlyRootFilesystem that fails as
      # `NativeLibraryNotFoundException` rather than anything mentioning /tmp.
      tmp:
        type: emptyDir
        advancedMounts:
          minecraft:
            broadcast:
              - path: /tmp
      data:
        existingClaim: minecraft
        advancedMounts:
          minecraft:
            app:
              - path: /data
            broadcast:
              - path: /opt/app/config
                subPath: mcxboxbroadcast
            seed-broadcast-config:
              - path: /broadcast
                subPath: mcxboxbroadcast
      broadcast-seed:
        type: configMap
        name: minecraft-broadcast-config
        advancedMounts:
          minecraft:
            seed-broadcast-config:
              - path: /seed
