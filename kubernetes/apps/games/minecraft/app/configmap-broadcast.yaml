---
# Config for MCXboxBroadcast (standalone).
#
# KEYS ARE KEBAB-CASE. The Java config interface declares camelCase methods
# (sessionInfo(), hostName()), but Configurate maps those to kebab-case YAML keys.
# Writing camelCase produces a file the tool parses without error and then IGNORES
# ENTIRELY -- it silently falls back to defaults, whose `ip` is test.geysermc.org.
# The symptom is joining the public GeyserMC demo server instead of your own, with
# nothing wrong in any log. Match this file's casing exactly.
#
# `config-version` must be present and current or the loader treats the file as
# needing migration.
#
# The init container copies this over the PVC copy on EVERY start (cp -f), so git
# stays authoritative. The tool rewrites the file at runtime; without the forced
# copy its rewrite wins and git silently stops mattering. Auth tokens live in
# cache/ and are untouched by this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-broadcast-config
data:
  config.yml: |
    session:
      update-interval: 30
      # Off deliberately: in Standalone the queried host is the same field we
      # advertise (the public VPS address), so querying would have to hairpin out
      # of the cluster and back through the tunnel. Static values below are used
      # instead; the cost is that the Friends-tab player count is not live.
      query-server: false
      web-query-fallback: false
      config-fallback: true
      session-info:
        host-name: "Minecraft"
        world-name: "world"
        players: 0
        max-players: 10
        # What the console actually dials -- MUST be the public VPS address, not
        # the in-cluster LB IP.
        ip: "${VPS_PUBLIC_IP}"
        port: 19132
      ice-port-range:
        min: 0
        max: 0
    friend-sync:
      update-interval: 60
      auto-follow: true
      auto-unfollow: true
      initial-invite: true
      expiry:
        # Upstream defaults this to true/15d, silently unfriending anyone who
        # hasn't joined in a fortnight -- they just lose access with no error.
        enabled: false
        days: 15
        check: 1800
    notifications:
      enabled: false
      webhook-url: ''
    debug-mode: false
    suppress-session-update-message: false
    config-version: 2
