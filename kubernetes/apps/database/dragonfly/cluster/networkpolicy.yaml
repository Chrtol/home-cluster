---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-allow-prometheus
spec:
  podSelector:
    matchLabels:
      app: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9999
---
# The dragonfly-operator regenerates its own `dragonfly` NetworkPolicy whose 6379
# ingress rule is `podSelector: {}` (same-namespace only) — this broke cross-namespace
# clients (outline/homarr in default, an app in media) on the v1.5.0 -> v1.6.1 bump.
# NetworkPolicies are additive (OR'd), so this repo-managed policy restores 6379 access
# for the client namespaces without fighting the operator-managed policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-allow-clients
spec:
  podSelector:
    matchLabels:
      app: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        # default: outline, homarr, reptile-tracker (+ its celery worker share the label)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [outline, homarr, reptile-tracker, paperless, postiz, affine]
        # media: readmeabook, tracearr, immich
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [readmeabook, tracearr, immich]
        # security: authentik (uses dragonfly as its cache/broker)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [authentik]
      ports:
        - protocol: TCP
          port: 6379
