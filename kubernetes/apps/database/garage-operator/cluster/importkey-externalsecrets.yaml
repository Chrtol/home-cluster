---
# --- postgres-backup (key: postgres-backup, bucket: postgres-wal) ---
# Uses the CNPG_S3_* convention (matching outline/kan/tempo). Add these fields to the
# cloudnative-pg 1Password item with the SAME values as the existing S3_ACCESS_KEY /
# S3_SECRET_KEY (the creds CNPG surfaces as aws-access-key-id / aws-secret-access-key):
#   CNPG_S3_ACCESS_KEY_ID
#   CNPG_S3_SECRET_ACCESS_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-import-postgres
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: garage-import-postgres
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        access-key-id: "{{ .CNPG_S3_ACCESS_KEY_ID }}"
        secret-access-key: "{{ .CNPG_S3_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
---
# --- zipline (key: zipline, bucket: zipline) ---
# Zipline had no S3 before, so its key was MINTED by the operator (GK3fb1…). Its creds
# were then copied into the zipline 1Password item as ZIPLINE_S3_ACCESS_KEY_ID /
# ZIPLINE_S3_SECRET_ACCESS_KEY, so it now follows the same import pattern as the rest.
# Because the imported creds equal the already-minted ones, the GarageKey switch to
# importKey is a no-op on the operated cluster (same GK id).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-import-zipline
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: garage-import-zipline
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        access-key-id: "{{ .ZIPLINE_S3_ACCESS_KEY_ID }}"
        secret-access-key: "{{ .ZIPLINE_S3_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: zipline
