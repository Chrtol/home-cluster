---
# Import-key secrets: each pulls an app's EXISTING S3 access key pair from 1Password
# into a database-namespace Secret shaped for GarageKey.spec.importKey.secretRef
# (default keys: access-key-id / secret-access-key).
#
# WHY import instead of mint: Garage derives the access-key-id deterministically
# from the secret access key, so importing the same secret onto garage-operated
# reproduces the IDENTICAL credentials the apps already use. Cutover (P5) then
# becomes a pure endpoint repoint -- no app ever sees new creds, and reverting is
# just pointing the endpoint back at the old Garage. 1Password stays the source of
# truth for these creds (consistent with every other app in the repo).
#
# These secrets are consumed only by the operator (to recreate the key on the new
# cluster). Apps continue to read their OWN existing secrets, unchanged, until P5.

# --- outline (key: outline-key, bucket: outline) ---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-import-outline
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: garage-import-outline
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        access-key-id: "{{ .OUTLINE_S3_ACCESS_KEY_ID }}"
        secret-access-key: "{{ .OUTLINE_S3_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: outline
---
# --- tempo (key: tempo, bucket: tempo-traces) ---
