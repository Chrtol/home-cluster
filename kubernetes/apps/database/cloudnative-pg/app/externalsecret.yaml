---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudnative-pg-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .POSTGRES_SUPER_USER }}"
        password: "{{ .POSTGRES_SUPER_PASS }}"

        # S3 creds for barman-cloud WAL archiving. Uses the CNPG_S3_* naming
        # convention (matching outline/kan/tempo). Region is a non-secret constant
        # ("homelab"), so it's hardcoded rather than pulled from 1Password.
        aws-access-key-id: "{{ .CNPG_S3_ACCESS_KEY_ID }}"
        aws-secret-access-key: "{{ .CNPG_S3_SECRET_ACCESS_KEY }}"
        aws-default-region: "homelab"
  dataFrom:
    - extract:
        key: cloudnative-pg
