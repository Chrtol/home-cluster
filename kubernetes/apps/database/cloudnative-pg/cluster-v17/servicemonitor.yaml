---
apiVersion: v1
kind: Service
metadata:
  name: postgres17-metrics
  namespace: database
  labels:
    cnpg.io/cluster: postgres17
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
      protocol: TCP
  selector:
    cnpg.io/cluster: postgres17
    cnpg.io/podRole: instance
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres17
  namespace: database
  labels:
    cnpg.io/cluster: postgres17
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres17
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
