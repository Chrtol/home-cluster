---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: &app postgres17
spec:
  instances: 3
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4@sha256:3c0ba08ea353c9705a755c113e4ae395be76553e0ed68076e5410cb09b9d17d9
  primaryUpdateStrategy: unsupervised
  storage:
    size: 80Gi
    storageClass: csi-rbd-sc
  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-secret
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: aws-access-key-id
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: aws-secret-access-key
    - name: AWS_DEFAULT_REGION
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: aws-default-region
  postgresql:
    parameters:
      max_connections: "600"
      shared_buffers: 512MB
      archive_mode: "on"
      wal_keep_size: "512MB"
      # --- Tuned for high-latency Ceph backing (one slow SATA-SSD OSD ~46ms) ---
      # Fewer, larger checkpoints so data-file write bursts hit the slow disk
      # less often (default 1GB caused checkpoints every few minutes).
      max_wal_size: "8GB"
      min_wal_size: "2GB"
      # Spread checkpoint writes across 90% of the interval instead of bursting.
      checkpoint_completion_target: "0.9"
      checkpoint_timeout: "30min"
      # Larger WAL buffer eliminates mid-transaction WAL flushes to the slow disk
      # (pg_stat_wal.wal_buffers_full was in the millions with the ~16MB default).
      wal_buffers: "128MB"
      # Group concurrent commits into a single fsync (commit_delay in microseconds).
      # On a 46ms-fsync disk this batches many commits per flush, trading <2ms of
      # latency for a large drop in fsync count.
      commit_delay: "2000"
      commit_siblings: "5"
      # Spread background writer load so dirty pages trickle out between checkpoints.
      bgwriter_lru_maxpages: "1000"
      bgwriter_delay: "200ms"
    #shared_preload_libraries:
    #  - "vectors.so"

  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  
  bootstrap:
    initdb:
      options:
        - "--data-checksums"
      postInitSQL:
        - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
  
  startDelay: 30
  stopDelay: 30
  switchoverDelay: 60
  
  priorityClassName: database-high-priority
  
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  monitoring:
    enablePodMonitor: true
    # Ref: https://github.com/cloudnative-pg/cloudnative-pg/issues/2501
    podMonitorMetricRelabelings:
      - { sourceLabels: ["cluster"], targetLabel: cnpg_cluster, action: replace }
      - { regex: cluster, action: labeldrop }
  backup:
    retentionPolicy: 7d
    barmanObjectStore: &barmanObjectStore
      data:
        compression: bzip2
      # WAL archiving re-enabled with Garage S3 support
      wal:
        compression: bzip2
        maxParallel: 2
      destinationPath: s3://postgres-wal/
      endpointURL: http://garage.database.svc.cluster.local:3900
      serverName: &currentCluster postgres17-v1
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: aws-access-key-id
        secretAccessKey:
          name: cloudnative-pg-secret
          key: aws-secret-access-key
        region:
          name: cloudnative-pg-secret
          key: aws-default-region