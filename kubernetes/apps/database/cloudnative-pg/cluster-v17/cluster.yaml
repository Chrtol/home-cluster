---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: &app postgres17
spec:
  instances: 3
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4@sha256:3c0ba08ea353c9705a755c113e4ae395be76553e0ed68076e5410cb09b9d17d9
  primaryUpdateStrategy: unsupervised
  storage:
    size: 80Gi
    storageClass: csi-rbd-sc
  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-secret
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: aws-access-key-id
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: aws-secret-access-key
    - name: AWS_DEFAULT_REGION
      valueFrom:
        secretKeyRef:
          name: cloudnative-pg-secret
          key: aws-default-region
  postgresql:
    parameters:
      max_connections: "600"
      shared_buffers: 512MB
      # No table here is big enough for JIT to pay off (largest honest full scan
      # costs ~27k against the 100k threshold), so it only ever fired on
      # mis-estimates from never-analyzed tables: authentik's login page spent
      # 810 ms compiling a query that ran in 0.2 ms, on every render.
      jit: "off"
      # Every OSD is an SSD (5-6 ms commit latency over the network), but the
      # defaults of 4 and 1 describe a spinning disk and push the planner toward
      # sequential scans.
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      # Bind parameters are left out because these logs are shipped off the pod.
      log_min_duration_statement: "1s"
      log_parameter_max_length: "0"
      archive_mode: "on"
      wal_keep_size: "512MB"
      # --- Write path ---
      # Chosen when osd.1 was a failing Samsung 850 PRO with ~46 ms fsync. That disk
      # was replaced on 2026-09-05 and the OSDs now commit in 0.05-6 ms; the values
      # stay because none of them costs anything on a fast disk.
      #
      # Fewer, larger checkpoints (the 1GB default caused one every few minutes).
      max_wal_size: "8GB"
      min_wal_size: "2GB"
      # Spread checkpoint writes across 90% of the interval instead of bursting.
      checkpoint_completion_target: "0.9"
      checkpoint_timeout: "30min"
      # pg_stat_wal.wal_buffers_full was in the millions with the ~16MB default.
      wal_buffers: "128MB"
      # Group commit, in microseconds. Only engages with 5+ transactions in flight,
      # which this cluster rarely reaches.
      commit_delay: "2000"
      commit_siblings: "5"
      # Spread background writer load so dirty pages trickle out between checkpoints.
      bgwriter_lru_maxpages: "1000"
      bgwriter_delay: "200ms"
    #shared_preload_libraries:
    #  - "vectors.so"

  # Require one instance per node (hard anti-affinity). With 3 instances on 3
  # nodes this guarantees a 1:1 spread, so draining a node can never stack two
  # replicas onto a single surviving node during a rolling reboot. A displaced
  # instance stays Pending until a node frees up — the desired behaviour when
  # rebooting one node at a time.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  
  bootstrap:
    initdb:
      options:
        - "--data-checksums"
      postInitSQL:
        - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
  
  startDelay: 30
  stopDelay: 30
  switchoverDelay: 60
  
  priorityClassName: database-high-priority
  
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  monitoring:
    enablePodMonitor: true
    # Ref: https://github.com/cloudnative-pg/cloudnative-pg/issues/2501
    podMonitorMetricRelabelings:
      - { sourceLabels: ["cluster"], targetLabel: cnpg_cluster, action: replace }
      - { regex: cluster, action: labeldrop }
  backup:
    retentionPolicy: 7d
    barmanObjectStore: &barmanObjectStore
      # snappy, not bzip2: compression runs on the primary for every WAL segment,
      # and bzip2 is the most CPU-expensive codec barman offers. Older bzip2 objects
      # stay restorable -- barman picks the codec per object.
      data:
        compression: snappy
      # WAL archiving re-enabled with Garage S3 support
      wal:
        compression: snappy
        maxParallel: 2
      destinationPath: s3://postgres-wal/
      # Cutover to the operator-managed cluster (garage-operated), internal svc DNS --
      # backend-only, keeps WAL/backup traffic in-cluster. serverName bumped v1 -> v2 so
      # a FRESH backup lineage starts on the new (empty) bucket; the old postgres17-v1
      # base backups + WAL stay intact on the OLD cluster as a fallback recovery source
      # until retired (P7), gated behind a verified fresh base backup on garage-operated.
      endpointURL: http://garage-operated.database.svc.cluster.local:3900
      serverName: &currentCluster postgres17-v2
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: aws-access-key-id
        secretAccessKey:
          name: cloudnative-pg-secret
          key: aws-secret-access-key
        region:
          name: cloudnative-pg-secret
          key: aws-default-region