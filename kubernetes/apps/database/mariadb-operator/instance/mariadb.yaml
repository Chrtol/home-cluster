---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/k8s.mariadb.com/mariadb_v1alpha1.json
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-operator
spec:
  rootPasswordSecretKeyRef:
    name: mariadb-operator-secret
    key: mariadb-root-password

  image: docker-registry1.mariadb.com/library/mariadb:12.3

  port: 3306

  env:
    # Run mariadb-upgrade automatically when the entrypoint detects the datadir was
    # created by an older server. Without this the image DETECTS the need and skips
    # it (docker-entrypoint.sh:595), leaving stale system tables while the server
    # runs happily -- MariaDB does not refuse to start the way CNPG does on a major
    # version mismatch. That is exactly what happened on the 11.4 -> 12.3 bump:
    # mysql.proc kept 21 of 22 columns and every mariadb-dump aborted with error
    # 1558, which went unnoticed for as long as there were no backups. Upgraded
    # by hand 2026-08-04; this makes the next bump self-healing.
    #
    # MARIADB_DISABLE_UPGRADE_BACKUP is deliberately left unset, so the entrypoint
    # dumps the system tables into the datadir before touching them.
    - name: MARIADB_AUTO_UPGRADE
      value: "1"

  storage:
    size: 8Gi
    storageClassName: csi-rbd-sc

  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=row
    innodb_autoinc_lock_mode=2
    innodb_buffer_pool_size=256M
    max_allowed_packet=256M
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci

    [client]
    default-character-set=utf8mb4

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  metrics:
    enabled: true

  podMetadata:
    annotations:
      reloader.stakater.com/auto: "true"

  updateStrategy:
    type: ReplicasFirstPrimaryLast
