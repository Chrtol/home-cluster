---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: mariadb-operator
      version: 26.10.1
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    # Off because of a name collision, not because the data is unwanted. This chart
    # names its Service mariadb-operator-metrics; the MariaDB instance is also called
    # mariadb-operator, so the operator wants that same name for the instance's
    # mysqld-exporter Service. Merging the two gave two ports named "metrics", the
    # API rejected it, and every failed reconcile re-stamped the CR's Ready condition
    # and so triggered the next one at once: ~15 reconciles/s, 69 of the cluster's
    # 122 API requests/s on 2026-09-21, with mysql_up never scraped. Nothing in this
    # repo reads the operator's own controller metrics; the instance exporter wins.
    metrics:
      enabled: false
    webhook:
      cert:
        certManager:
          enabled: false
