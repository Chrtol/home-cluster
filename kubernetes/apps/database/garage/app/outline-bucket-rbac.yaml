---
# ServiceAccount for the job to create secrets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-bucket-creator
  namespace: database
---
# Role to allow creating secrets in the default namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-secret-creator
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "delete", "list"]
---
# RoleBinding to grant the ServiceAccount permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-bucket-creator-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-secret-creator
subjects:
  - kind: ServiceAccount
    name: garage-bucket-creator
    namespace: database