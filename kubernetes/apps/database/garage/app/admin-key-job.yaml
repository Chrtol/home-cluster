---
# This Job automatically creates the garage-admin key needed by the s3-bucket component
# It runs once after Garage is deployed and creates the admin credentials
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-admin-key-setup
  namespace: database
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: garage-admin-setup
      containers:
      - name: setup
        image: ghcr.io/chrtol/garage-kubectl:v1.3.0
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Checking if garage-admin secret already exists..."
            if kubectl get secret garage-admin -n database >/dev/null 2>&1; then
              echo "garage-admin secret already exists, skipping creation"
              exit 0
            fi

            echo "Waiting for Garage to be ready..."
            until /garage -c /etc/garage.toml status 2>/dev/null | grep -q "HEALTHY"; do
              echo "Waiting for Garage to be healthy..."
              sleep 5
            done

            echo "Creating garage-admin key..."
            KEY_OUTPUT=$(/garage -c /etc/garage.toml key create garage-admin)
            ACCESS_KEY=$(echo "$KEY_OUTPUT" | grep "Key ID" | awk '{print $3}')
            SECRET_KEY=$(echo "$KEY_OUTPUT" | grep "Secret key" | awk '{print $3}')

            echo "Granting admin permissions..."
            /garage -c /etc/garage.toml key allow --create-bucket garage-admin

            echo "Creating Kubernetes secret..."
            kubectl create secret generic garage-admin \
              --namespace=database \
              --from-literal=ACCESS_KEY="$ACCESS_KEY" \
              --from-literal=SECRET_KEY="$SECRET_KEY"

            echo "garage-admin key setup complete!"
        volumeMounts:
        - name: garage-config
          mountPath: /etc/garage.toml
          subPath: config.toml
          readOnly: true
      volumes:
      - name: garage-config
        configMap:
          name: config.toml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-admin-setup
  namespace: database
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-admin-setup
  namespace: database
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-admin-setup
  namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-admin-setup
subjects:
- kind: ServiceAccount
  name: garage-admin-setup
  namespace: database