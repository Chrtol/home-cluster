---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config.toml
  namespace: database
data:
  config.toml: |
    metadata_dir = "/mnt/meta"
    data_dir = "/mnt/data"

    replication_factor = 1
    consistency_mode = "consistent"
    compression_level = 1

    rpc_bind_addr = "0.0.0.0:3901"
    rpc_public_addr = "garage.database.svc.cluster.local:3901"
    rpc_secret = "${SECRET_GARAGE_RPC_SECRET}"

    [s3_api]
    s3_region = "homelab"
    api_bind_addr = "0.0.0.0:3900"
    root_domain = ".s3.${SECRET_DOMAIN}"

    # CORS configuration for browser uploads
    # Note: Garage requires CORS to be configured per-bucket via S3 API, not in config file
    # We'll need to set CORS rules using the S3 API after deployment

    [s3_web]
    bind_addr = "0.0.0.0:3902"
    root_domain = ".web.${SECRET_DOMAIN}"

    [admin]
    api_bind_addr = "0.0.0.0:3903"