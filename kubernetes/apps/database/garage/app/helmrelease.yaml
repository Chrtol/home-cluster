# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app garage
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      garage:
        strategy: RollingUpdate
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: dxflrs/garage
              tag: v2.3.0
            command:
              - /garage
              - server
            ports:
              - name: api
                containerPort: 3900
              - name: rpc
                containerPort: 3901
              - name: web
                containerPort: 3902
              - name: admin
                containerPort: 3903
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3901
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3901
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          api:
            port: 3900
          rpc:
            port: 3901
          web:
            port: 3902
          admin:
            port: 3903
    # S3 routes (s3.${SECRET_DOMAIN} + s3-local.${SECRET_DOMAIN}) were MOVED to the
    # operator-managed cluster during the garage-operator migration -- they now live in
    # garage-operator/cluster/httproute.yaml pointing at the garage-operated Service.
    # This old cluster keeps serving its buckets over the in-cluster garage.database.svc
    # endpoint only, until it's decommissioned (P7). To roll back, restore this route:
    # block and remove the operated HTTPRoutes.
    persistence:
      data:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/s3/data
        globalMounts:
          - path: /mnt/data
            readOnly: false
      meta:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/s3/meta
        globalMounts:
          - path: /mnt/meta
            readOnly: false
      config:
        type: configMap
        name: config.toml
        globalMounts:
          - path: /etc/garage.toml
            subPath: config.toml
            readOnly: true