---
# This Job creates the Garage bucket and access key for Outline
# The credentials are output to logs for manual copying to 1Password
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-outline-bucket-setup
  namespace: database
spec:
  # Clean up after success
  ttlSecondsAfterFinished: 300  # 5 minutes
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: dxflrs/garage:v1.0.0
          command:
            - /garage
            - bucket
            - list
          env:
            - name: GARAGE_RPC_HOST
              value: "garage.database.svc.cluster.local:3901"
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-secret
                  key: SECRET_GARAGE_RPC_SECRET