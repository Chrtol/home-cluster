---
# This Job creates the Garage bucket and access key for Outline
# The credentials are output to logs for manual copying to 1Password
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-outline-bucket-setup
  namespace: database
spec:
  # Clean up after success
  ttlSecondsAfterFinished: 300  # 5 minutes
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: debian:13-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # Install required tools
              echo "Installing required tools..."
              apt-get update && apt-get install -y wget unzip

              # Install garage CLI
              echo "Installing Garage CLI..."
              wget -q https://github.com/Deuxfleurs/garage/releases/download/v1.0.0/garage-x86_64-unknown-linux-gnu.zip
              unzip -q garage-x86_64-unknown-linux-gnu.zip
              chmod +x garage
              mv garage /usr/local/bin/

              # Set garage host for CLI
              export GARAGE_RPC_HOST=garage.database.svc.cluster.local:3901
              export GARAGE_RPC_SECRET="${GARAGE_RPC_SECRET}"

              echo "========================================="
              echo "Creating Garage S3 Bucket for Outline"
              echo "========================================="

              # Create bucket
              echo "Creating bucket 'outline'..."
              garage bucket create outline || echo "Bucket 'outline' already exists"

              # Create key if it doesn't exist
              echo "Creating access key 'outline-key'..."
              garage key create outline-key || echo "Key 'outline-key' already exists"

              # Grant permissions to the key for the bucket
              echo "Granting permissions..."
              garage bucket allow outline --read --write --owner --key outline-key

              # Get key info with secret
              echo "Getting credentials..."
              KEY_OUTPUT=$(garage key info outline-key --show-secret)

              # Extract credentials
              ACCESS_KEY=$(echo "$KEY_OUTPUT" | grep "Key ID" | awk '{print $3}')
              SECRET_KEY=$(echo "$KEY_OUTPUT" | grep "Secret key" | awk '{print $3}')

              echo ""
              echo "========================================="
              echo "SUCCESS! Copy these to 1Password:"
              echo "========================================="
              echo ""
              echo "Add these to the 'outline' item in 1Password:"
              echo ""
              echo "OUTLINE_S3_ACCESS_KEY_ID=$ACCESS_KEY"
              echo "OUTLINE_S3_SECRET_ACCESS_KEY=$SECRET_KEY"
              echo ""
              echo "Fixed values (also add to 1Password):"
              echo "OUTLINE_S3_REGION=homelab"
              echo "OUTLINE_S3_BUCKET=outline"
              echo ""
              echo "========================================="
              echo ""
              echo "After adding to 1Password, update the ExternalSecret"
              echo "to pull these values and create the S3 environment vars."
              echo "========================================="

          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-secret
                  key: SECRET_GARAGE_RPC_SECRET