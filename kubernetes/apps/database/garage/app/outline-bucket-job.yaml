---
# This Job creates the Garage bucket and access key for Outline
# and stores the credentials in a Kubernetes secret
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-outline-bucket-setup
  namespace: database
spec:
  # Clean up after success
  ttlSecondsAfterFinished: 300  # 5 minutes
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: garage-bucket-creator
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # Install garage CLI
              echo "Installing Garage CLI..."
              apt-get update && apt-get install -y wget unzip
              wget -q https://github.com/Deuxfleurs/garage/releases/download/v1.3.0/garage-x86_64-unknown-linux-gnu.zip
              unzip -q garage-x86_64-unknown-linux-gnu.zip
              mv garage /usr/local/bin/
              chmod +x /usr/local/bin/garage

              # Test kubectl access
              echo "Testing kubectl access..."
              kubectl auth can-i create secrets -n default || (echo "ERROR: Cannot create secrets in default namespace" && exit 1)

              # Configure garage CLI
              export GARAGE_RPC_HOST=garage.database.svc.cluster.local:3901

              echo "========================================="
              echo "Garage Outline Bucket Setup"
              echo "========================================="
              echo ""
              echo "Waiting for Garage to be ready..."

              # Wait for Garage to be ready
              for i in {1..30}; do
                if garage status 2>/dev/null; then
                  echo "Garage is ready!"
                  break
                fi
                if [ $i -eq 30 ]; then
                  echo "ERROR: Garage not ready after 30 attempts"
                  exit 1
                fi
                echo "Attempt $i/30: Garage not ready yet..."
                sleep 5
              done

              echo ""
              echo "Creating outline bucket..."
              if ! garage bucket info outline 2>/dev/null; then
                garage bucket create outline
                echo "✓ Bucket 'outline' created"
              else
                echo "✓ Bucket 'outline' already exists"
              fi

              echo ""
              echo "Checking for existing outline-app key..."
              if garage key info outline-app 2>/dev/null; then
                echo "Key 'outline-app' already exists. Deleting old key..."
                garage key delete outline-app --yes
              fi

              echo "Creating new outline-app access key..."
              # Create the key
              garage key create outline-app

              # Get the credentials
              echo "Extracting credentials..."
              ACCESS_KEY=$(garage key info outline-app 2>/dev/null | grep "Key ID" | awk '{print $3}')
              SECRET_KEY=$(garage key info outline-app --show-secret 2>/dev/null | grep "Secret key" | awk '{print $3}')

              if [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ]; then
                echo "ERROR: Failed to extract credentials"
                garage key info outline-app --show-secret
                exit 1
              fi

              echo "✓ Key 'outline-app' created successfully"

              echo ""
              echo "Granting permissions to outline bucket..."
              garage bucket allow outline --read --write --owner --key outline-app
              echo "✓ Permissions granted"

              echo ""
              echo "Creating Kubernetes secret..."

              # Delete existing secret if it exists
              kubectl delete secret garage-outline-credentials -n default 2>/dev/null || true

              # Create the secret in the default namespace (where Outline runs)
              kubectl create secret generic garage-outline-credentials \
                --namespace=default \
                --from-literal=AWS_ACCESS_KEY_ID="$ACCESS_KEY" \
                --from-literal=AWS_SECRET_ACCESS_KEY="$SECRET_KEY" \
                --from-literal=AWS_REGION="homelab" \
                --from-literal=AWS_S3_UPLOAD_BUCKET_NAME="outline" \
                --from-literal=AWS_S3_UPLOAD_BUCKET_URL="https://s3.${SECRET_DOMAIN}" \
                --from-literal=AWS_S3_FORCE_PATH_STYLE="true" \
                --from-literal=AWS_S3_ACL="private" \
                --from-literal=FILE_STORAGE="s3"

              echo "✓ Secret 'garage-outline-credentials' created in namespace 'default'"

              echo ""
              echo "========================================="
              echo "Setup Complete!"
              echo "========================================="
              echo "Bucket 'outline' and credentials have been created."
              echo "The secret 'garage-outline-credentials' is ready to use."
              echo ""
              echo "Access Key: $ACCESS_KEY"
              echo "Bucket: outline"
              echo "Region: homelab"
              echo "========================================="
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-secret
                  key: SECRET_GARAGE_RPC_SECRET
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: config.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: config.toml