---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-operator
  namespace: &namespace database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  dependsOn:
    # conversion/admission webhooks are cert-manager backed
    - name: cert-manager
      namespace: cert-manager
  path: "./kubernetes/apps/database/garage/operator/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m
  wait: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-operated-cluster
  namespace: &namespace database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  dependsOn:
    # the operator + its CRDs/webhooks must be up before we apply a GarageCluster
    - name: garage-operator
      namespace: database
  path: "./kubernetes/apps/database/garage/operator/cluster"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  targetNamespace: *namespace
  timeout: 10m
  wait: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-operated-volsync
  namespace: &namespace database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Backs up Garage's LMDB metadata PVC (Ceph RBD). The data blocks live on the NAS
  # and are already covered by the NAS->Hetzner rsync, but the metadata is the index
  # that maps those content-addressed blocks back to objects -- without it the blocks
  # are unrecoverable, and being on Ceph it is in NO other backup. Kept as its own
  # Kustomization rather than folded into garage-operated-cluster because that one is
  # wait: true and a ReplicationSource does not report Ready until its first run.
  dependsOn:
    - name: garage-operated-cluster
      namespace: database
    - name: nas
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/database/garage/operator/backup
  postBuild:
    substitute:
      APP: garage-operated
      # Operator-generated StatefulSet volumeClaimTemplate name, not the app name.
      VOLSYNC_PVC: metadata-garage-operated-storage-0-0
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-webui
  namespace: &namespace database
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Management UI for the operator-managed cluster (garage-operated). The old
  # hand-managed garage it used to point at was decommissioned; the admin token +
  # endpoints now come from garage-operated (garage-operated-secret).
  dependsOn:
    - name: garage-operated-cluster
      namespace: database
  path: ./kubernetes/apps/database/garage/webui/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
