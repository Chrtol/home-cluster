---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./garagecluster.yaml
  # P3: declarative buckets + keys on garage-operated
  - ./buckets.yaml
  - ./importkey-externalsecrets.yaml
  - ./keys.yaml
  # P5: public + internal S3 routes for browser-reachable cutover (e.g. Outline)
  - ./httproute.yaml
  # P7: allow app namespaces to provision buckets/keys via the s3-bucket component
  - ./referencegrant.yaml
