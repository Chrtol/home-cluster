---
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
# NOT named "garage": the operator creates Services named after the cluster, and a
# cluster named "garage" collides with the OLD hand-managed Garage's own "garage"
# Service (breaking every app's S3 access + the old node's RPC). "garage-operated"
# keeps the new cluster's Services (garage-operated, garage-operated-headless)
# distinct during coexistence.
metadata:
  name: garage-operated
  namespace: database
spec:
  # Pinned to match the version our existing data was written with (v2.3.0 LMDB).
  image: dxflrs/garage:v2.3.0
  zone: homelab

  # Single node, one copy per object. Durability comes from TrueNAS ZFS underneath;
  # replicas across the same NAS would add storage cost without real fault tolerance.
  replication:
    factor: 1
    consistencyMode: consistent

  database:
    engine: lmdb

  storage:
    replicas: 1
    # Run as the NAS `kubernetes` user (UID/GID 1000) that owns the s3/operated
    # export, so Garage's writes to the NFS data volume land as the dataset owner.
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      # Without this, fsGroup defaults to Always → kubelet recursively chowns EVERY
      # file in the data volume on every pod start. On the NFS data PVC (10k+ files)
      # that's a slow I/O walk each restart (seen: "Setting volume ownership ...
      # processed 10460 files"). OnRootMismatch chowns only when the volume ROOT's
      # ownership is wrong, so after the first pass restarts skip the recursive walk.
      fsGroupChangePolicy: OnRootMismatch
    # K8s mounts secret files world-readable (0644); Garage refuses to start with a
    # group/world-readable rpc-secret unless this is set. Safe in-cluster: the secret
    # is namespace-isolated + RBAC-protected, and this only relaxes the check on the
    # pod's own mount. This is the operator's documented way to handle it.
    env:
      - name: GARAGE_ALLOW_WORLD_READABLE_SECRETS
        value: "true"
    # Metadata (LMDB, mmap) on Ceph RBD block storage -- safe, fast. NEVER on NFS.
    metadata:
      storageClassName: csi-rbd-sc
      size: 5Gi
    # Object blocks on the NAS via the Retain NFS StorageClass. Whole-object,
    # write-once/read-occasionally access -- fine on 7200rpm spindles.
    data:
      storageClassName: nfs-k8s-retain
      size: 200Gi
    # Never auto-delete the data/metadata PVCs (protect against accidental removal).
    pvcRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain

  network:
    rpcSecretRef:
      name: garage-operated-secret
      key: rpc-secret

  s3Api:
    region: homelab
    rootDomain: .s3.${SECRET_DOMAIN}

  admin:
    adminTokenSecretRef:
      name: garage-operated-secret
      key: admin-token
