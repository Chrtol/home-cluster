---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
# Admin token (operator -> Garage admin API) and RPC secret (node identity) for the
# NEW operator-managed Garage cluster. Deliberately SEPARATE from the old hand-managed
# Garage's GARAGE_ADMIN_TOKEN / GARAGE_RPC_SECRET so the two clusters stay isolated
# during coexistence.
#
# Required 1Password fields on item `garage`:
#   GARAGE_OPERATOR_ADMIN_TOKEN  (admin API token)
#   GARAGE_OPERATOR_RPC_SECRET   (32-byte hex, e.g. openssl rand -hex 32)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-operated
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: garage-operated-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-token: "{{ .GARAGE_OPERATOR_ADMIN_TOKEN }}"
        rpc-secret: "{{ .GARAGE_OPERATOR_RPC_SECRET }}"
  dataFrom:
    - extract:
        key: garage
