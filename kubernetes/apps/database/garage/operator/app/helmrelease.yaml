---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app garage-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: garage-operator
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    replicaCount: 1
    image:
      # This overrides the chart's default operator image, so it must be bumped
      # alongside the chart (the OCIRepository tag in flux/meta/oci). Renovate tracks
      # it here so the two stay in lockstep.
      # renovate: datasource=docker depName=ghcr.io/rajsinghtech/garage-operator
      tag: v0.7.8
    # Default Garage image for GarageClusters that omit spec.image. Pinned to the
    # version our existing data was written with (v2.3.0 LMDB) for S3 compatibility.
    defaultGarageImage: dxflrs/garage:v2.3.0
    # Conversion + admission webhooks (cert-manager backed).
    webhooks:
      enabled: true
    crds:
      # Let Flux manage CRD lifecycle via the HelmRelease crds: CreateReplace above.
      install: true
    # Observability (this cluster runs Prometheus + Grafana).
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
    prometheusRules:
      enabled: true
    resources:
      requests:
        cpu: 25m
        # Idle baseline is ~145Mi (already over the old 128Mi request); reconcile
        # bursts spike higher. Request reserves for the baseline.
        memory: 192Mi
      limits:
        # v0.6.28 OOMKilled (exit 137) against the old 256Mi limit during a reconcile
        # spike. 512Mi gives headroom over the ~145Mi idle + burst.
        memory: 512Mi
