---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name home-cluster-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: flux-system
  interval: 1h
  # Helm diffs custom resources against the previous release manifest, not the
  # live object, so a field the API server dropped (listenerConfig, before the
  # CRD was replaced) is never re-sent. Drift detection compares against live.
  driftDetection:
    mode: enabled
  # A controller deletes any AutoscalingRunnerSet whose version label differs from
  # its own. The two charts come from separate OCIRepositories, so a Renovate bump
  # can upgrade this release first and the old controller deletes the new set.
  # dependsOn holds it while the controller is mid-upgrade; the retries cover the
  # case where this source updates before the controller's has even started.
  dependsOn:
    - name: actions-runner-controller
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    githubConfigUrl: https://github.com/chrtol/home-cluster
    githubConfigSecret: home-cluster-runner-secret
    runnerScaleSetName: home-cluster
    minRunners: 1
    maxRunners: 3
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes:
          - ReadWriteOnce
        storageClassName: csi-rbd-sc
        resources:
          requests:
            storage: 5Gi
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.338.2@sha256:2dd7caa094a425c041539447cb0e6ae63cda10b5242773764683b695b8fa5613
            command:
              - /home/runner/run.sh
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
        serviceAccountName: *name
