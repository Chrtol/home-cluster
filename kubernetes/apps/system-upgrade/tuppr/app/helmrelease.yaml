---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
    namespace: flux-system
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apiextensions.k8s.io
              version: v1
              kind: CustomResourceDefinition
              name: talosupgrades.tuppr.home-operations.com
            patch: |
              - op: replace
                path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/phase/enum
                value:
                  - Pending
                  - InProgress
                  - Completed
                  - Failed
                  - Upgrading
                  - Rebooting
                  - Draining
                  - WaitingForHealthChecks
          - target:
              group: apiextensions.k8s.io
              version: v1
              kind: CustomResourceDefinition
              name: kubernetesupgrades.tuppr.home-operations.com
            patch: |
              - op: replace
                path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/phase/enum
                value:
                  - Pending
                  - InProgress
                  - Completed
                  - Failed
                  - Upgrading
                  - Rebooting
                  - Draining
                  - WaitingForHealthChecks
  values:
    replicaCount: 2
    monitoring:
      serviceMonitor:
        enabled: true
