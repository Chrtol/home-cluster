---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.14.5
  policy:
    rebootMode: powercycle
  maintenance:
    windows:
      - start: "0 4 * * *"
        duration: 2h
        timezone: ${SECRET_TIMEZONE}
  healthChecks:
    # Hold each node's reboot while any kopiur backup is queued or copying, so a
    # powercycle can't kill a mover mid-snapshot. A Snapshot too new to have a phase
    # counts as queued. Checked across every namespace.
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      description: no kopiur backup is pending or running
      expr: |-
        has(object.status) && has(object.status.phase) && !(object.status.phase in ["Pending", "Running"])
