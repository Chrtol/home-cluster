---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.1
  healthChecks:
    # Same gate as the TalosUpgrade: no node restarts while a kopiur backup is queued
    # or copying.
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      description: no kopiur backup is pending or running
      expr: |-
        has(object.status) && has(object.status.phase) && !(object.status.phase in ["Pending", "Running"])
