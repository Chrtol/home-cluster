---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cnpg-ca-store
  namespace: external-secrets
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1beta1
      kind: ClusterSecretStore
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 30m
  path: ./kubernetes/apps/external-secrets/cnpg-ca/store
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Deliberately no targetNamespace: this Kustomization spans two namespaces --
  # the ServiceAccount + ClusterSecretStore live in external-secrets, while the
  # Role/RoleBinding granting access to postgres17-ca must live in database.
  # Setting targetNamespace would override the explicit namespace on the RBAC
  # objects and silently place them in the wrong namespace, granting nothing.
  timeout: 5m
  wait: true
