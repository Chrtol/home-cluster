---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/external-secrets.io/clustersecretstore_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cnpg-ca
  namespace: external-secrets
spec:
  provider:
    # Reads the CNPG-managed PKI out of the cluster itself. CNPG renews
    # postgres17-ca in place (same secret, new contents), so an ExternalSecret
    # backed by this store re-syncs the new CA automatically on its refresh
    # interval -- which in turn triggers Reloader to restart the consuming app.
    kubernetes:
      remoteNamespace: database
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: cnpg-ca-reader
          namespace: external-secrets
