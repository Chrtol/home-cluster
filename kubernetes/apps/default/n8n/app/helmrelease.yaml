---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 2.1.0
            env:
              DB_SQLITE_VACUUM_ON_STARTUP: true
              EXECUTIONS_DATA_PRUNE: true
              EXECUTIONS_DATA_MAX_AGE: 7
              EXECUTIONS_DATA_PRUNE_MAX_COUNT: 50000
              GENERIC_TIMEZONE: ${SECRET_TIMEZONE}
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
              N8N_PROTOCOL: "https"
              N8N_PORT: &port 8080
              N8N_HOST: &hostName n8n.${SECRET_DOMAIN}
              N8N_LOG_LEVEL: info
              N8N_LOG_OUTPUT: console
              N8N_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: N8N_ENCRYPTION_KEY
              # Task runner configuration for n8n 2.1+
              N8N_RUNNERS_ENABLED: "true"
              N8N_RUNNERS_MODE: "external"
              N8N_RUNNERS_AUTH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: N8N_RUNNERS_AUTH_TOKEN
            resources:
              requests:
                cpu: 15m
                memory: 512Mi
              limits:
                memory: 2Gi

          task-runner:
            image:
              repository: n8nio/runners
              tag: latest
            env:
              N8N_RUNNERS_AUTH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: N8N_RUNNERS_AUTH_TOKEN
              N8N_RUNNERS_TASK_BROKER_URI: "http://127.0.0.1:5679"
              N8N_RUNNERS_MAX_CONCURRENCY: "5"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

          token-server:
            image:
              repository: python
              tag: 3.12-alpine
            command:
              - python3
              - -u
              - -c
              - |
                from http.server import HTTPServer, BaseHTTPRequestHandler
                import sys
                class TokenHandler(BaseHTTPRequestHandler):
                    def do_GET(self):
                        try:
                            if self.path == '/token':
                                with open('/var/run/secrets/kubernetes.io/serviceaccount/token', 'r') as f:
                                    token = f.read().strip()
                                self.send_response(200)
                                self.send_header('Content-Type', 'text/plain')
                                self.end_headers()
                                self.wfile.write(token.encode())
                            else:
                                self.send_response(404)
                                self.end_headers()
                        except Exception as e:
                            print(f"ERROR: {e}", file=sys.stderr, flush=True)
                            self.send_response(500)
                            self.end_headers()
                    def log_message(self, format, *args):
                        pass  # Suppress access logs
                print("Token server starting on 127.0.0.1:8888...", flush=True)
                try:
                    HTTPServer(('127.0.0.1', 8888), TokenHandler).serve_forever()
                except Exception as e:
                    print(f"FATAL: Server failed to start: {e}", file=sys.stderr, flush=True)
                    sys.exit(1)
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: n8n
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.n8n

    ingress:
      app:
        className: internal
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
      webhooks:
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hosts:
          - host: &host "{{ .Release.Name }}-webhook.${SECRET_DOMAIN}"
            paths:
              - path: /webhook
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host

