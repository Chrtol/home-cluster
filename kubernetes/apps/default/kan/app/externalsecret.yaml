---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: outline-secret
    template:
      engineVersion: v2
      data:
        BETTER_AUTH_SECRET: "{{ .KAN_BETTER_AUTH_SECRET }}"
        DATABASE_URL: "postgres://{{ .KAN_POSTGRES_USER }}:{{ .KAN_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/kan?sslmode=disable"
        NEXT_PUBLIC_ALLOW_CREDENTIALS: "true"

        # OIDC configuration
        OIDC_CLIENT_ID: "{{ .KAN_OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .KAN_OIDC_CLIENT_SECRET }}"
        OIDC_DISCOVERY_URL: "{{ .KAN_OIDC_DISCOVERY_URL }}"

        # S3 Storage Configuration
        S3_ACCESS_KEY_ID: "{{ .KAN_S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .KAN_S3_SECRET_ACCESS_KEY }}"
        S3_REGION: "{{ .KAN_S3_REGION }}"
        S3_ENDPOINT: "{{ .KAN_S3_ENDPOINT }}"
        S3_FORCE_PATH_STYLE: "{{ .KAN_S3_FORCE_PATH_STYLE }}"
        NEXT_PUBLIC_STORAGE_URL: "{{ .KAN_NEXT_PUBLIC_STORAGE_URL }}"
        NEXT_PUBLIC_AVATAR_BUCKET_NAME: "{{ .KAN_NEXT_PUBLIC_AVATAR_BUCKET_NAME }}"
        NEXT_PUBLIC_ATTACHMENTS_BUCKET_NAME: "{{ .KAN_NEXT_PUBLIC_ATTACHMENTS_BUCKET_NAME }}"
        NEXT_PUBLIC_STORAGE_DOMAIN: "{{ .KAN_NEXT_PUBLIC_STORAGE_DOMAIN }}"

        # SMTP Configuration
        SMTP_HOST: "{{ .KAN_SMTP_HOST }}"
        SMTP_PORT: "{{ .KAN_SMTP_PORT }}"
        SMTP_USER: "{{ .KAN_SMTP_USER }}"
        SMTP_PASSWORD: "{{ .KAN_SMTP_PASSWORD }}"
        EMAIL_FROM: "{{ .KAN_EMAIL_FROM }}"
        SMTP_REJECT_UNAUTHORIZED: "{{ .KAN_SMTP_REJECT_UNAUTHORIZED }}"

  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: kan
