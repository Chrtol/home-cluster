---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kan
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kan-secret
    template:
      engineVersion: v2
      data:
        BETTER_AUTH_SECRET: "{{ .KAN_BETTER_AUTH_SECRET }}"
        # node-pg (drizzle) treats sslmode=require as verify-full and rejects CNPG's
        # self-signed CA; uselibpqcompat=true restores libpq semantics (encrypt, don't
        # verify). It is load-bearing — dropping it crashloops the app.
        # POSTGRES_URL is the runtime pool; DATABASE_URL is drizzle-kit migrations.
        POSTGRES_URL: "postgres://{{ .KAN_POSTGRES_USER }}:{{ .KAN_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/kan?sslmode=require&uselibpqcompat=true"
        DATABASE_URL: "postgres://{{ .KAN_POSTGRES_USER }}:{{ .KAN_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/kan?sslmode=require&uselibpqcompat=true"
        NEXT_PUBLIC_ALLOW_CREDENTIALS: "true"
        BETTER_AUTH_TRUSTED_ORIGINS: "https://kan.${SECRET_DOMAIN},https://kanban.${SECRET_DOMAIN}"

        # OIDC configuration
        OIDC_CLIENT_ID: "{{ .KAN_OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .KAN_OIDC_CLIENT_SECRET }}"
        OIDC_DISCOVERY_URL: "https://sso.${SECRET_DOMAIN}/application/o/kan/.well-known/openid-configuration"

        # S3 Storage Configuration
        S3_ACCESS_KEY_ID: "{{ .KAN_S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .KAN_S3_SECRET_ACCESS_KEY }}"
        S3_REGION: "homelab"
        S3_ENDPOINT: "https://s3.${SECRET_DOMAIN}"
        S3_FORCE_PATH_STYLE: "true"
        NEXT_PUBLIC_STORAGE_URL: "https://s3.${SECRET_DOMAIN}"
        NEXT_PUBLIC_AVATAR_BUCKET_NAME: "kan-avatars"
        NEXT_PUBLIC_ATTACHMENTS_BUCKET_NAME: "kan-attachments"
        NEXT_PUBLIC_STORAGE_DOMAIN: "s3.${SECRET_DOMAIN}"

        # SMTP Configuration (using local smtp-relay)
        SMTP_HOST: "smtp-relay.default.svc.cluster.local"
        SMTP_PORT: "2525"
        SMTP_SECURE: "false"
        EMAIL_FROM: "KAN <kan@${SECRET_DOMAIN}>"
        SMTP_REJECT_UNAUTHORIZED: "false"

  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: kan
