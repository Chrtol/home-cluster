---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kan
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # init-db initContainer + db.home.arpa/postgres pod label come from the cnpg component
  valuesFrom:
    - kind: ConfigMap
      name: ${APP}-cnpg-values
  values:
    controllers:
      kan:
        strategy: Recreate

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/kanbn/kan
              tag: 0.6.0@sha256:0087a72a123d8462c66ddce3a303049d4ec92f03cfba297d41466605ef8cb5b5
              pullPolicy: IfNotPresent
            env:
                NEXT_PUBLIC_BASE_URL: https://kan.${SECRET_DOMAIN}
                TZ: ${SECRET_TIMEZONE}
                PORT: &port 3000

            envFrom:
              - secretRef:
                  name: kan-secret
            resources:
              requests:
                cpu: 15m
                memory: 386Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        hostnames: ["kanban.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
          tmpfs:
            type: emptyDir
