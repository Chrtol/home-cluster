---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mealie-bring-api
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mealie-bring-api-secret
    template:
      engineVersion: v2
      data:
        # Bring! has no official API and issues no scoped tokens -- these are the
        # plain account credentials, so this secret grants full control of the
        # Bring account. Nothing else should mount it.
        BRING_USERNAME: "{{ .BRING_USERNAME }}"
        BRING_PASSWORD: "{{ .BRING_PASSWORD }}"
        # Must match the Bring list's display name EXACTLY (case included);
        # the bridge looks the list up by name, not by id.
        BRING_LIST_NAME: "{{ .BRING_LIST_NAME }}"
        # Mealie API token, needed only by the /move-ingredients-from-shopping-list
        # endpoint so it can read the list and delete the items it moved.
        # Generate at /user/profile/api-tokens and store on the mealie item.
        MEALIE_API_KEY: "{{ .MEALIE_API_KEY }}"
  dataFrom:
    - extract:
        key: bring
    - extract:
        key: mealie
