---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mealie-mcp-secret
    template:
      data:
        # A Mealie API token, minted by hand in Mealie (avatar -> Profile ->
        # API Tokens -> Create) and pasted into 1Password.
        #
        # Mealie tokens carry NO scopes -- this inherits the full permissions of
        # the account that created it. Every OIDC-authenticated user shares this
        # one identity: Authentik gates who may call the server, it does not map
        # callers onto Mealie users. Mint it from a dedicated Mealie account if
        # you want the audit trail to distinguish MCP writes from your own.
        MEALIE_API_KEY: "{{ .MEALIE_MCP_TOKEN }}"
  dataFrom:
    - extract:
        key: mealie
