---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      mealie-mcp:
        annotations:
          # Load-bearing: AUTHENTIK_AUDIENCE arrives by secretKeyRef, which is read
          # once at pod start. The server compares every token's `aud` against it
          # and refuses to start without it, so a regenerated Authentik client would
          # otherwise leave the pod rejecting all traffic until a manual restart.
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Fork of amercat37/mealie-mcp-server v1.0.22. Upstream publishes no
              # image -- it ships a Dockerfile but has no release workflow, and
              # GHCR has no package under that name (probed: DENIED, not a tag
              # list). The fork exists to build one, and carries two container
              # fixes that upstream's compose-oriented Dockerfile does not need:
              # a non-root user, and dropping the logging.FileHandler that writes
              # mealie_mcp_server.log into WORKDIR (fatal under the
              # readOnlyRootFilesystem below; stdout is what kubectl logs reads).
              repository: ghcr.io/chrtol/mealie-mcp-server
              tag: v1.0.22
            env:
              # In-cluster Service, not the public hostname. Keeps recipe traffic
              # off the VPS -> WireGuard -> OPNSense hairpin, and means the MCP
              # server keeps working when the external path is down.
              MEALIE_BASE_URL: http://mealie.default.svc.cluster.local:9000
              # The RFC 9728 resource identifier. The MCP SDK publishes this at
              # /.well-known/oauth-protected-resource/mcp and clients compare the
              # value against the origin they connected to, so it must be the ONE
              # public hostname -- hence a single route below, as with hass-mcp.
              MCP_SERVER_URL: https://mealie-mcp.${SECRET_DOMAIN}
              # Trailing slash is required: the server compares each token's `iss`
              # claim against this after rstrip("/"), but ALSO uses it verbatim to
              # build the discovery URL. Authentik's issuer carries the slash.
              AUTHENTIK_ISSUER: https://sso.${SECRET_DOMAIN}/application/o/mealie-mcp/
              # Fetch JWKS over the cluster Service instead of sso.${SECRET_DOMAIN},
              # which resolves to the public VPS even from inside the LAN (no split
              # DNS). Authentik routes by Host header, so AUTHENTIK_HOST below is
              # mandatory whenever this is set -- without it Authentik does not
              # recognise the request and the key fetch fails.
              AUTHENTIK_JWKS_URI: http://authentik-server.security.svc.cluster.local:80/application/o/mealie-mcp/jwks/
              AUTHENTIK_HOST: sso.${SECRET_DOMAIN}
              # Client ID of the provider generated by components/oidc-application
              # (see ks.yaml), landed in this namespace via OIDC_SECRET_NAMESPACE.
              # Required whenever AUTHENTIK_ISSUER is set -- the server refuses to
              # start without it rather than accept any token from the shared
              # issuer, which would let a token minted for another Authentik app be
              # replayed here (confused deputy).
              AUTHENTIK_AUDIENCE:
                valueFrom:
                  secretKeyRef:
                    name: mealie-mcp-oidc-authentik-application
                    key: clientID
              LOG_LEVEL: INFO
              TZ: ${SECRET_TIMEZONE}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              # The RFC 9728 metadata document: registered by the SDK from
              # AuthSettings, served locally, and deliberately unauthenticated (a
              # client must read it BEFORE it holds a token). /mcp itself would 401
              # and the two /.well-known OAuth documents proxy Authentik on a cold
              # cache, which would make this pod's readiness depend on Authentik
              # being up. This one touches nothing upstream.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: &probePath /.well-known/oauth-protected-resource/mcp
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: *probePath, port: *port }
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: *probePath, port: *port }
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      # External only, and deliberately so. claude.ai connectors are fetched by
      # Anthropic's infrastructure (160.79.104.0/21), never by the phone or laptop
      # holding the conversation -- an internal route would be unreachable to them
      # no matter what VPN the device is on.
      #
      # NO ext-auth on this route, ever. Forward-auth intercepts the OAuth
      # handshake with an HTML login page, and the vendor never reaches /mcp.
      # Authentication here is the bearer token the server validates itself.
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["mealie-mcp.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # readOnlyRootFilesystem leaves Python with nowhere to write. The server
      # keeps no durable state of its own -- the JWKS and OIDC discovery documents
      # are in-memory caches that refill on start -- so this needs no PVC.
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
