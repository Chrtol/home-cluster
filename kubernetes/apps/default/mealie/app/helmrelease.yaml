---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mealie
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # init-db initContainer + db.home.arpa/postgres pod label come from the cnpg
  # component (see ks.yaml). spec.values below deep-merges over this.
  valuesFrom:
    - kind: ConfigMap
      name: mealie-cnpg-values
  values:
    controllers:
      mealie:
        strategy: Recreate

        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            instrumentation.opentelemetry.io/inject-python: "observability/python-instrumentation"
            instrumentation.opentelemetry.io/container-names: "app"

        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.22.0
              pullPolicy: IfNotPresent
            envFrom: # All values are created on the externalsecret
              - secretRef:
                  name: *app
            env:
              # OpenTelemetry custom attributes
              OTEL_SERVICE_NAME: "mealie"
              OTEL_RESOURCE_ATTRIBUTES: "service.name=mealie,service.namespace=default,deployment.environment=production"
            resources:
              requests:
                cpu: 15m
                memory: 477M
              limits:
                memory: 1Gi

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 9000
    route:
      internal:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Mealie
          gethomepage.dev/icon: mealie.svg
          gethomepage.dev/group: Home
          gethomepage.dev/href: https://mealie.${SECRET_DOMAIN}
          gethomepage.dev/widget.type: mealie
          gethomepage.dev/widget.url: http://mealie.default.svc.cluster.local:9000
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_MEALIE_API_KEY}}`}}"
          gethomepage.dev/widget.version: "2"
          gethomepage.dev/widget.fields: '["recipes", "users", "categories", "tags"]'
          hajimari.io/enable: "true"
          hajimari.io/icon: "food"
          hajimari.io/appName: "Mealie"
          hajimari.io/group: "Home"

        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["recipes.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data
