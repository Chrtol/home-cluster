---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mealie
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: &dbuser "{{ .POSTGRES_USER }}"
        POSTGRES_PASSWORD: &dbpass "{{ .POSTGRES_PASS }}"
        POSTGRES_SERVER: &dbserver "{{ .POSTGRES_RW_SVC }}"
        POSTGRES_PORT: "5432"
        POSTGRES_DB: &dbname ${APP}
        DB_ENGINE: "postgres"
        
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_HOST: *dbserver
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # Base Values
        BASE_URL: https://mealie.${SECRET_DOMAIN}
        ALLOW_SIGNUP: "false"
        AUTO_BACKUP_ENABLED: "true"
        API_DOCS: "false"
        TZ: ${SECRET_TIMEZONE}
        WORKERS_PER_CORE: "1"
        MAX_WORKERS: "1"
        WEB_CONCURRENCY: "1"

  dataFrom:
    - extract:
        key: mealie
    - extract:
        key: cloudnative-pg