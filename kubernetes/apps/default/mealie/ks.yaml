---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mealie
  namespace: default
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 10m
  path: "./kubernetes/apps/default/mealie/app"
  components:
    - ../../../../components/cnpg
    - ../../../../components/kopiur
  dependsOn:
    - name: kopiur-repository
      namespace: kopiur-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: recipes
      # Split off the shared "app" role: mealie now owns its DB with its own
      # role and password (field on the mealie 1Password item).
      DB_OP_ITEM: mealie
      DB_PASS_FIELD: MEALIE_POSTGRES_PASS
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mealie-bring-api
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/default/mealie/bring-api
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mealie-mcp
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # The generated clientID is a hard start dependency: it becomes
    # AUTHENTIK_AUDIENCE by secretKeyRef, and the server refuses to start without
    # it. No volsync/ceph-rbd -- this app has no PVC, its only state is an
    # in-memory JWKS cache.
    - ../../../../components/oidc-application
  dependsOn:
    - name: authentik
      namespace: security
    - name: mealie
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/mealie/mcp
  postBuild:
    substitute:
      APP: *app
      # OIDC component variables. SUBDOMAIN must match MCP_SERVER_URL in the
      # HelmRelease: it is the RFC 9728 resource identifier, and a client compares
      # it against the origin it connected to.
      GROUP: "Default"
      SUBDOMAIN: mealie-mcp
      DISPLAY_NAME: "Mealie MCP"
      DESCRIPTION: "Recipes, meal plans and shopping lists via MCP"
      # Unused by this app -- it is a resource server and never receives a
      # callback of its own. Retained for the component's application-host entry.
      REDIRECT_PATH: "/auth/callback"
      # Primary callback: the OAuth client's, independent of SUBDOMAIN above.
      # Authentik 2026.5 advertises no
      # registration_endpoint, so the vendor cannot self-register and this URI has
      # to be pre-registered. Keep the existing split variables for this callback.
      OIDC_CLIENT_SUBDOMAIN: claude
      OIDC_CLIENT_DOMAIN: ai
      OIDC_CLIENT_PATH: /api/mcp/auth_callback
      # OIDC_REDIRECT_URI can override these parts with a fully resolved URI.
      # Keep the split parts here to avoid embedding a literal domain in Git.

      # MCP clients hold a long-lived connection and cannot bounce through a
      # browser to re-authenticate. Without a refresh token the session dies after
      # tokenDuration (minutes=5) -- the exact failure hass-mcp hit.
      OIDC_EXTRA_SCOPE: offline_access
      OIDC_SECRET_NAMESPACE: default
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
