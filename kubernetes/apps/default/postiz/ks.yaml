---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app postiz-temporal
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  components:
    - ../../../../components/cnpg
  dependsOn:
    - name: cloudnative-pg
      namespace: database
  path: "./kubernetes/apps/default/postiz/temporal"
  postBuild:
    substitute:
      APP: *app
      DB_NAME: "temporal temporal_visibility"
      DB_USER: temporal
      DB_OP_ITEM: postiz
      DB_PASS_FIELD: TEMPORAL_POSTGRES_PASS
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app postiz
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  components:
    - ../../../../components/cnpg
    - ../../../../components/dragonfly
    - ../../../../components/ceph-rbd
    - ../../../../components/oidc-application
  dependsOn:
    - name: postiz-temporal
      namespace: default
    - name: cloudnative-pg
      namespace: database
    - name: dragonfly
      namespace: database
    - name: authentik
      namespace: security
  path: "./kubernetes/apps/default/postiz/app"
  postBuild:
    substitute:
      APP: *app
      CEPH_RBD_CAPACITY: 20Gi
      GATUS_SUBDOMAIN: post
      DB_OP_ITEM: *app
      DB_PASS_FIELD: POSTIZ_POSTGRES_PASS
      # OIDC component variables
      GROUP: "Default"
      SUBDOMAIN: post
      DISPLAY_NAME: "Postiz"
      DESCRIPTION: "Social media scheduling & management"
      REDIRECT_PATH: "/settings"
      OIDC_SECRET_NAMESPACE: default
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m
