---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app postiz-temporal
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  # init-db initContainer (creates both temporal DBs via space-separated DB_NAME)
  # + db.home.arpa/postgres pod label come from the cnpg component
  valuesFrom:
    - kind: ConfigMap
      name: ${APP}-cnpg-values
  values:
    controllers:
      postiz-temporal:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/temporalio/auto-setup
              tag: 1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
              pullPolicy: IfNotPresent
            env:
              # SQL persistence on CloudNative-PG, Postgres-based visibility (no Elasticsearch)
              DB: postgres12
              DB_PORT: "5432"
              DBNAME: temporal
              VISIBILITY_DBNAME: temporal_visibility
              ENABLE_ES: "false"
              # Databases are pre-created by the initContainers above
              SKIP_DB_CREATE: "true"
              # SQL visibility allows only 3 Text search attributes; the demo
              # CustomStringField/CustomTextField would consume 2, leaving too few
              # for Postiz's organizationId + postId. Don't seed the demo attributes.
              SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES: "true"
              BIND_ON_IP: 0.0.0.0
              DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
            envFrom:
              - secretRef:
                  name: postiz-temporal-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          grpc:
            port: 7233
    persistence:
      dynamicconfig:
        type: configMap
        name: postiz-temporal-dynamicconfig
        globalMounts:
          - path: /etc/temporal/config/dynamicconfig/development-sql.yaml
            subPath: development-sql.yaml
            readOnly: true
