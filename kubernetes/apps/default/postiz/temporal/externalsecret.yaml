---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz-temporal
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postiz-temporal-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Postgres connection used by the Temporal server (postgres12 plugin)
        POSTGRES_SEEDS: "{{ .POSTGRES_RW_SVC }}"
        POSTGRES_USER: "{{ .TEMPORAL_POSTGRES_USER }}"
        POSTGRES_PWD: "{{ .TEMPORAL_POSTGRES_PASS }}"

        # postgres-init (initContainers) — create the temporal databases + role
        INIT_POSTGRES_HOST: "{{ .POSTGRES_RW_SVC }}"
        INIT_POSTGRES_PORT: "5432"
        INIT_POSTGRES_USER: "{{ .TEMPORAL_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .TEMPORAL_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: postiz
