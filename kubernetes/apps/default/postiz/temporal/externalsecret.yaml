---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz-temporal
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postiz-temporal-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Postgres connection used by the Temporal server (postgres12 plugin)
        POSTGRES_SEEDS: "{{ .POSTGRES_RW_SVC }}"
        POSTGRES_USER: "{{ .TEMPORAL_POSTGRES_USER }}"
        POSTGRES_PWD: "{{ .TEMPORAL_POSTGRES_PASS }}"

        # Encrypt the DB connection. The image's config_template.yaml renders
        #   tls.enabled:                {{ default .Env.SQL_TLS_ENABLED "false" }}
        #   tls.enableHostVerification: {{ default .Env.SQL_HOST_VERIFICATION "false" }}
        # for BOTH the default and visibility datastores, so this one var covers the
        # temporal and temporal_visibility databases. Host verification stays off (its
        # default) because CNPG serves a self-signed cert -- the same posture as
        # outline's rejectUnauthorized:false. Temporal is Go and does not have
        # node-pg's "require implies verify" behaviour.
        SQL_TLS_ENABLED: "true"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: postiz
