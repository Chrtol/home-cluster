---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app postiz
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  # Postiz runs DB migrations on boot and depends on temporal; its startup probe
  # allows up to ~5m. Raise the HR timeout above that so a slow boot doesn't trip
  # the default 5m wait, and let upgrades self-heal instead of stalling.
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # init-db initContainer + db.home.arpa/* pod labels come from the cnpg/dragonfly components
  valuesFrom:
    - kind: ConfigMap
      name: ${APP}-cnpg-values
    - kind: ConfigMap
      name: ${APP}-dragonfly-values
  values:
    controllers:
      postiz:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gitroomhq/postiz-app
              tag: v2.23.0@sha256:785f97312f66a347fb96cdccc4ded5a33ced69a672c89a9adc8054e7d6a21dc5
            env:
              TZ: ${SECRET_TIMEZONE}
              # Public URLs (same host internal + external)
              MAIN_URL: https://post.${SECRET_DOMAIN}
              FRONTEND_URL: https://post.${SECRET_DOMAIN}
              NEXT_PUBLIC_BACKEND_URL: https://post.${SECRET_DOMAIN}/api
              BACKEND_INTERNAL_URL: http://localhost:3000
              # Combined "general" image (frontend + backend + workers + cron behind Caddy on :5000)
              IS_GENERAL: "true"
              RUN_CRON: "true"
              # Locked down after first OAuth login — no public sign-ups
              DISABLE_REGISTRATION: "true"
              # Local storage on the Ceph-RBD PVC
              STORAGE_PROVIDER: local
              UPLOAD_DIRECTORY: /uploads
              NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
              API_LIMIT: "30"
              NX_ADD_PLUGINS: "false"
              # Temporal workflow engine (in-cluster, postgres-backed)
              TEMPORAL_ADDRESS: postiz-temporal.default.svc.cluster.local:7233
              TEMPORAL_NAMESPACE: default
              # Map the Authentik blueprint secret keys onto the names Postiz expects
              POSTIZ_OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-oidc-authentik-application"
                    key: clientID
              POSTIZ_OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-oidc-authentik-application"
                    key: clientSecret
            envFrom:
              - secretRef:
                  name: postiz-secret
            securityContext:
              readOnlyRootFilesystem: false
            probes:
              # Backend (NestJS) binds :3000 last, only after migrations + Temporal/Redis init.
              # nginx(:5000), frontend(:4200), orchestrator(:3002) come up first, so probing
              # :3000 is the true "Postiz is actually serving /api" signal. TCP, not HTTP,
              # because /api/user/self returns 401 when healthy (which an httpGet probe would
              # treat as failure). A wedged backend never binds :3000 -> TCP probe catches it.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30   # up to ~5min cold-boot headroom (orchestrator alone took 33s)
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3    # ~90s wedged -> kubelet restarts container -> self-heal
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 3Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: &port 5000
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["post.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: postiz
        advancedMounts:
          postiz:
            app:
              - path: /config
                subPath: config
      # Media/uploads on TrueNAS NFS (bulk storage) instead of the Ceph-RBD PVC.
      # Postiz still serves these via the backend /uploads -> /api/uploads rewrite,
      # so the public HTTPS URL is unchanged (needed for TikTok/YouTube pull-from-URL).
      uploads:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/applications/postiz
        advancedMounts:
          postiz:
            app:
              - path: /uploads
                readOnly: false
