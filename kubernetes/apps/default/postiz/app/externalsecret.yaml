---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postiz-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Core
        JWT_SECRET: "{{ .POSTIZ_JWT_SECRET }}"

        # PostgreSQL (CloudNative-PG)
        DATABASE_URL: "postgresql://{{ .POSTIZ_POSTGRES_USER }}:{{ .POSTIZ_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/postiz?sslmode=disable"

        # postgres-init (initContainer) — create the postiz database + role
        INIT_POSTGRES_DBNAME: postiz
        INIT_POSTGRES_HOST: "{{ .POSTGRES_RW_SVC }}"
        INIT_POSTGRES_PORT: "5432"
        INIT_POSTGRES_USER: "{{ .POSTIZ_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTIZ_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

        # Redis (Dragonfly) — dedicated logical DB index (3 + 4 used by outline)
        REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/5"

        # Generic OAuth (Authentik) — client id/secret come from the
        # postiz-oidc-authentik-application secret created by the oidc-application component
        POSTIZ_GENERIC_OAUTH: "true"
        POSTIZ_OAUTH_URL: "https://sso.${SECRET_DOMAIN}"
        POSTIZ_OAUTH_AUTH_URL: "https://sso.${SECRET_DOMAIN}/application/o/authorize/"
        POSTIZ_OAUTH_TOKEN_URL: "https://sso.${SECRET_DOMAIN}/application/o/token/"
        POSTIZ_OAUTH_USERINFO_URL: "https://sso.${SECRET_DOMAIN}/application/o/userinfo/"
        POSTIZ_OAUTH_SCOPE: "openid profile email"
        NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME: "Authentik"
        NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/master/png/authentik.png"

        # Social media provider credentials (add keys to the "postiz" 1Password item)
        # TikTok: use the *Sandbox* Client key/secret from the TikTok developer portal
        TIKTOK_CLIENT_ID: "{{ .TIKTOK_CLIENT_ID }}"
        TIKTOK_CLIENT_SECRET: "{{ .TIKTOK_CLIENT_SECRET }}"
        # Instagram (standalone — "Instagram API with Instagram Login", no Facebook Page)
        # Use the Instagram App ID/Secret from the Meta app's Instagram product
        # (API setup with Instagram login), NOT the Facebook App ID/secret.
        INSTAGRAM_APP_ID: "{{ .INSTAGRAM_APP_ID }}"
        INSTAGRAM_APP_SECRET: "{{ .INSTAGRAM_APP_SECRET }}"
        # YouTube (Google Cloud OAuth client — YouTube Data API v3 enabled)
        # Authorized redirect URI: https://post.${SECRET_DOMAIN}/integrations/social/youtube
        YOUTUBE_CLIENT_ID: "{{ .YOUTUBE_CLIENT_ID }}"
        YOUTUBE_CLIENT_SECRET: "{{ .YOUTUBE_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: postiz
