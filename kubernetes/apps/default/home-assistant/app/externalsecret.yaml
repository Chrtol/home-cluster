---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant-secret
    template:
      data:
        # HASS_DARKSKY_API_KEY: "{{ .HASS_DARKSKY_API_KEY }}"
        HASS_ELEVATION: "{{ .HASS_ELEVATION }}"
        HASS_GOOGLE_PROJECT_ID: "{{ .HASS_GOOGLE_PROJECT_ID }}"
        # HASS_GOOGLE_SECURE_DEVICES_PIN: "{{ .HASS_GOOGLE_SECURE_DEVICES_PIN }}"
        HASS_LATITUDE: "{{ .HASS_LATITUDE }}"
        HASS_LONGITUDE: "{{ .HASS_LONGITUDE }}"
        # HASS_PIRATE_WEATHER_API_KEY: "{{ .HASS_PIRATE_WEATHER_API_KEY }}"
        # Recorder backend. Consumed by /config/configuration.yaml as
        #   recorder:
        #     db_url: !env_var HASS_DB_URL
        # (configuration.yaml lives in the PVC, not in git.)
        #
        # sslmode=require with no uselibpqcompat: HA's recorder is SQLAlchemy on
        # psycopg2, i.e. real libpq, where require means encrypt-but-do-not-verify
        # and connects fine against CNPG's self-signed cert. The node-pg apps here
        # (kan, homarr, postiz) need uselibpqcompat=true only because node-pg
        # misreads require as verify-full; adding it here would do nothing.
        #
        # HASS_POSTGRES_PASS must be URL-safe (alphanumeric): it is interpolated
        # into the userinfo of a URL, so @ : / ? # & would corrupt it.
        HASS_DB_URL: "postgresql://home_assistant:{{ .HASS_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/home_assistant?sslmode=require"
  dataFrom:
    - extract:
        key: home-assistant
    # POSTGRES_RW_SVC
    - extract:
        key: cloudnative-pg
