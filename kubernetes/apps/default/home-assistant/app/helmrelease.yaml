---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # init-db initContainer + db.home.arpa/postgres pod label come from the cnpg
  # component (see ks.yaml). The component keys its initContainer off
  # ${DB_CONTROLLER:=${APP}}, which resolves to the "home-assistant" controller
  # below. spec.values deep-merges over this, so the defaultPodOptions here keep
  # their nodeSelector/hostNetwork/securityContext and only gain the label.
  valuesFrom:
    - kind: ConfigMap
      name: home-assistant-cnpg-values
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # auth_oidc is pinned here rather than click-installed via HACS because it
          # gates login. HACS keeps its existing Lovelace cards and themes
          # (/config/www/community, /config/themes) -- a deliberate split: git for the
          # auth path, HACS for cosmetics.
          #
          # NON-FATAL by design. HA already cannot start without Postgres and must not
          # also depend on github.com being reachable; any failure here keeps whatever
          # is installed and exits 0.
          01-install-oidc-component:
            # Same image ref as the app container on purpose: it already carries curl,
            # unzip and the right uid, it is already on the node, and pinning both to
            # one ref means Renovate can never leave the two skewed.
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.8.0@sha256:99c0293b3ad103151a9d8b860232fd1c6db425eadb9eb4905c0ecbef65b27363
            env:
              # renovate: datasource=github-releases depName=christiaangoossens/hass-oidc-auth
              OIDC_COMPONENT_VERSION: v1.1.1
            # $$ escapes shield the shell vars from Flux envsubst -- this manifest
            # genuinely needs ${SECRET_DOMAIN}/${SECRET_TIMEZONE} substituted, so the
            # kustomize.toolkit.fluxcd.io/substitute: disabled annotation is not an
            # option here. An unescaped ${dest} would be replaced with the empty string
            # and the script would silently rm -rf the wrong path.
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -uo pipefail
                dest=/config/custom_components/auth_oidc
                stage=/config/custom_components/.auth_oidc.stage

                if [ "$(cat "$${dest}/.version" 2>/dev/null)" = "$${OIDC_COMPONENT_VERSION}" ]; then
                  echo "auth_oidc $${OIDC_COMPONENT_VERSION} already installed"
                  exit 0
                fi

                # The release zip ONLY. A source checkout/tarball ships no compiled
                # static/style.css, and upstream's FAQ calls out that the login screens
                # then render completely unstyled.
                url="https://github.com/christiaangoossens/hass-oidc-auth/releases/download/$${OIDC_COMPONENT_VERSION}/hass-oidc-auth.zip"
                rm -rf "$${stage}" "$${stage}.zip"
                mkdir -p "$${stage}"

                if ! curl -fsSL --retry 3 --retry-delay 2 -o "$${stage}.zip" "$${url}"; then
                  echo "WARN: could not download $${url} -- keeping the existing install"
                  rm -rf "$${stage}" "$${stage}.zip"
                  exit 0
                fi

                # The zip is FLAT: manifest.json sits at the archive root, so it unpacks
                # straight into the component directory with no wrapper to strip. Both
                # probes below double as a "did I get a real release" check.
                if ! unzip -q "$${stage}.zip" -d "$${stage}" \
                   || [ ! -f "$${stage}/manifest.json" ] \
                   || [ ! -f "$${stage}/static/style.css" ]; then
                  echo "WARN: $${url} is not a usable release zip -- keeping the existing install"
                  rm -rf "$${stage}" "$${stage}.zip"
                  exit 0
                fi

                # Stamp inside the staging dir so the swap is atomic: there is no state
                # in which the files are new but the version marker still reads old.
                echo "$${OIDC_COMPONENT_VERSION}" > "$${stage}/.version"
                rm -rf "$${dest}"
                mv "$${stage}" "$${dest}"
                rm -f "$${stage}.zip"
                echo "installed auth_oidc $${OIDC_COMPONENT_VERSION}"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.8.0@sha256:99c0293b3ad103151a9d8b860232fd1c6db425eadb9eb4905c0ecbef65b27363
            env:
              TZ: ${SECRET_TIMEZONE}
              HASS_HTTP_TRUSTED_PROXY_1: 10.42.0.0/16
              HASS_HTTP_TRUSTED_PROXY_2: 10.43.0.0/16
              HASS_HTTP_TRUSTED_PROXY_3: 10.0.0.0/8
              # HASS_HTTP_TRUSTED_PROXY_2: 10.0.10.0/24
              # HASS_HTTP_TRUSTED_PROXY_3: 10.0.20.0/24
              # HASS_HTTP_TRUSTED_PROXY_4: 10.0.30.0/24
              HOME_ASSISTANT_EXTERNAL_URL: https://hass.${SECRET_DOMAIN}
              HOME_ASSISTANT_UNIT_SYSTEM: metric
              # Consumed by !env_var in the oidc.yaml package (see configmap.yaml).
              # Named keys rather than envFrom: the Authentik secret also carries
              # issuerURL/redirectURL/tokenDuration/bindPolicyID that HA has no use
              # for. secretKeyRef is read once at pod start, so the controller's
              # reloader annotation is what makes a rotation actually take effect.
              HASS_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-oidc-authentik-application
                    key: clientID
              HASS_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-oidc-authentik-application
                    key: clientSecret
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            securityContext:
              privileged: true
              capabilities:
                add: ["NET_RAW", "NET_ADMIN", "SYS_ADMIN", "DAC_OVERRIDE"]
            resources:
              requests:
                cpu: 23m
                memory: 384Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      priorityClassName: external-facing
      nodeSelector:
        kubernetes.io/hostname: lenovo2
      # hostNetwork is REQUIRED for mDNS/zeroconf discovery (Apple TV, Matter, etc.).
      # On the pod network Cilium does not deliver L2 multicast (224.0.0.251 / ff02::fb),
      # so HA bound no :5353 socket at all and discovered nothing — every integration
      # here had to be added by hand. hostNetwork puts HA on the node's ens18, where the
      # mDNS groups are joined. (The old multus-wlan annotation attempted the same thing
      # via a NAD that is ipvlan-L3 over a down bond0 — dead, and ipvlan-L3 strips
      # multicast regardless. Removed.)
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: &port 8123

    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["hass.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        existingClaim: home-assistant
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: home-assistant-cache
        globalMounts:
          - path: /config/.venv
      # Git-managed HA config fragments, nested inside the /config PVC mount.
      # advancedMounts (app only) rather than globalMounts so the install
      # initContainer isn't handed a mount it has no use for.
      packages:
        type: configMap
        name: home-assistant-packages
        advancedMounts:
          home-assistant:
            app:
              - path: /config/packages
                readOnly: true
      usb-devices:
        type: hostPath
        hostPath: /dev/bus/usb
        globalMounts:
          - path: /dev/bus/usb
      # NOTE: no ZBT-2 serial mounts here. The radio was flashed to OpenThread RCP and
      # now lives on the Proxmox HOST, owned by otbr-agent in CT103 (serial is
      # single-owner). /dev/ttyACM0 and /dev/serial do not exist inside this VM — the
      # old hostPath mounts silently materialised as empty dirs. HA reaches Thread via
      # the OTBR REST API and matter-server's WebSocket, never the radio directly.
      tmpfs:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /config/logs
                subPath: logs
              - path: /config/tts
                subPath: tts
              - path: /tmp
                subPath: tmp
