---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # init-db initContainer + db.home.arpa/postgres pod label come from the cnpg
  # component (see ks.yaml). The component keys its initContainer off
  # ${DB_CONTROLLER:=${APP}}, which resolves to the "home-assistant" controller
  # below. spec.values deep-merges over this, so the defaultPodOptions here keep
  # their nodeSelector/hostNetwork/securityContext and only gain the label.
  valuesFrom:
    - kind: ConfigMap
      name: home-assistant-cnpg-values
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # auth_oidc is pinned here rather than click-installed via HACS because it
          # gates login. HACS keeps its existing Lovelace cards and themes
          # (/config/www/community, /config/themes) -- a deliberate split: git for the
          # auth path, HACS for cosmetics.
          #
          # NON-FATAL by design. HA already cannot start without Postgres and must not
          # also depend on github.com being reachable; any failure here keeps whatever
          # is installed and exits 0.
          01-install-oidc-component:
            # Same image ref as the app container on purpose: it already carries curl,
            # unzip and the right uid, it is already on the node, and pinning both to
            # one ref means Renovate can never leave the two skewed.
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.1@sha256:1bcf770d15bd91a55491d04f12494febb35da68b025e1f6612a167a2e190a8c7
            env:
              # renovate: datasource=github-releases depName=christiaangoossens/hass-oidc-auth
              OIDC_COMPONENT_VERSION: v1.2.1
            # $$ escapes shield the shell vars from Flux envsubst -- this manifest
            # genuinely needs ${SECRET_DOMAIN}/${SECRET_TIMEZONE} substituted, so the
            # kustomize.toolkit.fluxcd.io/substitute: disabled annotation is not an
            # option here. An unescaped ${dest} would be replaced with the empty string
            # and the script would silently rm -rf the wrong path.
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -uo pipefail
                dest=/config/custom_components/auth_oidc
                stage=/config/custom_components/.auth_oidc.stage

                if [ "$(cat "$${dest}/.version" 2>/dev/null)" = "$${OIDC_COMPONENT_VERSION}" ]; then
                  echo "auth_oidc $${OIDC_COMPONENT_VERSION} already installed"
                  exit 0
                fi

                # The release zip ONLY. A source checkout/tarball ships no compiled
                # static/style.css, and upstream's FAQ calls out that the login screens
                # then render completely unstyled.
                url="https://github.com/christiaangoossens/hass-oidc-auth/releases/download/$${OIDC_COMPONENT_VERSION}/hass-oidc-auth.zip"
                rm -rf "$${stage}" "$${stage}.zip"
                mkdir -p "$${stage}"

                if ! curl -fsSL --retry 3 --retry-delay 2 -o "$${stage}.zip" "$${url}"; then
                  echo "WARN: could not download $${url} -- keeping the existing install"
                  rm -rf "$${stage}" "$${stage}.zip"
                  exit 0
                fi

                # The zip is FLAT: manifest.json sits at the archive root, so it unpacks
                # straight into the component directory with no wrapper to strip. Both
                # probes below double as a "did I get a real release" check.
                if ! unzip -q "$${stage}.zip" -d "$${stage}" \
                   || [ ! -f "$${stage}/manifest.json" ] \
                   || [ ! -f "$${stage}/static/style.css" ]; then
                  echo "WARN: $${url} is not a usable release zip -- keeping the existing install"
                  rm -rf "$${stage}" "$${stage}.zip"
                  exit 0
                fi

                # Stamp inside the staging dir so the swap is atomic: there is no state
                # in which the files are new but the version marker still reads old.
                echo "$${OIDC_COMPONENT_VERSION}" > "$${stage}/.version"
                rm -rf "$${dest}"
                mv "$${stage}" "$${dest}"
                rm -f "$${stage}.zip"
                echo "installed auth_oidc $${OIDC_COMPONENT_VERSION}"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          # ha_health_check serves /healthz, which is what lets kubelet probe the
          # event loop and the recorder rather than just "did the process exit".
          # Git-managed for the same reason as auth_oidc: a probe target that HACS
          # could silently uninstall would take the pod down with it.
          02-install-health-check-component:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.1@sha256:1bcf770d15bd91a55491d04f12494febb35da68b025e1f6612a167a2e190a8c7
            env:
              # renovate: datasource=github-releases depName=Tobix99/ha-health-check
              HEALTH_CHECK_COMPONENT_VERSION: v1.2.0
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -uo pipefail
                dest=/config/custom_components/ha_health_check
                stage=/config/custom_components/.ha_health_check.stage

                if [ "$(cat "$${dest}/.version" 2>/dev/null)" = "$${HEALTH_CHECK_COMPONENT_VERSION}" ]; then
                  echo "ha_health_check $${HEALTH_CHECK_COMPONENT_VERSION} already installed"
                  exit 0
                fi

                # Source archive, not a release asset: this project publishes releases
                # with ZERO assets (hacs.json sets no zip_release, so HACS also installs
                # from the tree). There is no .zip to download like auth_oidc has.
                url="https://github.com/Tobix99/ha-health-check/archive/refs/tags/$${HEALTH_CHECK_COMPONENT_VERSION}.zip"
                rm -rf "$${stage}" "$${stage}.zip"
                mkdir -p "$${stage}"

                if ! curl -fsSL --retry 3 --retry-delay 2 -o "$${stage}.zip" "$${url}"; then
                  echo "WARN: could not download $${url} -- keeping the existing install"
                  rm -rf "$${stage}" "$${stage}.zip"
                  exit 0
                fi

                if ! unzip -q "$${stage}.zip" -d "$${stage}"; then
                  echo "WARN: $${url} is not a usable archive -- keeping the existing install"
                  rm -rf "$${stage}" "$${stage}.zip"
                  exit 0
                fi

                # GitHub nests the tree under ha-health-check-<tag minus the leading v>/.
                # Globbed rather than reconstructed from the tag, so a tag that stops
                # matching that convention fails the manifest.json probe below instead of
                # installing something half-empty.
                src=$(echo "$${stage}"/*/custom_components/ha_health_check)
                if [ ! -f "$${src}/manifest.json" ]; then
                  echo "WARN: no ha_health_check component in $${url} -- keeping the existing install"
                  rm -rf "$${stage}" "$${stage}.zip"
                  exit 0
                fi

                # Stamped inside the staging tree, so the mv is the only visible
                # transition: there is no window where the files are new but .version
                # still reads old. Both paths are on the /config PVC, so it is a rename.
                echo "$${HEALTH_CHECK_COMPONENT_VERSION}" > "$${src}/.version"
                rm -rf "$${dest}"
                mv "$${src}" "$${dest}"
                rm -rf "$${stage}" "$${stage}.zip"
                echo "installed ha_health_check $${HEALTH_CHECK_COMPONENT_VERSION}"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.1@sha256:1bcf770d15bd91a55491d04f12494febb35da68b025e1f6612a167a2e190a8c7
            env:
              TZ: ${SECRET_TIMEZONE}
              # NO HASS_HTTP_TRUSTED_PROXY_* here any more, and adding them back
              # would do nothing. HA 2026.8 migrated the http config out of YAML
              # into /config/.storage/http on the PVC ("yaml_migration_done": true)
              # and now IGNORES any http: block -- a repair warned about exactly
              # that, and YAML support disappears entirely in 2027.2.0. The block
              # was removed from configuration.yaml on 2026-08-06.
              #
              # trusted_proxies (10.42.0.0/16, 10.43.0.0/16, 10.0.0.0/8) and
              # use_x_forwarded_for now live ONLY in that store, editable at
              # Settings -> System -> Network. They are NOT in git: losing the PVC
              # loses them, and HA rejects proxied requests without them.
              HOME_ASSISTANT_EXTERNAL_URL: https://hass.${SECRET_DOMAIN}
              HOME_ASSISTANT_UNIT_SYSTEM: metric
              # Consumed by !env_var in the oidc.yaml package (see configmap.yaml).
              # Named keys rather than envFrom: the Authentik secret also carries
              # issuerURL/redirectURL/tokenDuration/bindPolicyID that HA has no use
              # for. secretKeyRef is read once at pod start, so the controller's
              # reloader annotation is what makes a rotation actually take effect.
              HASS_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-oidc-authentik-application
                    key: clientID
              HASS_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-oidc-authentik-application
                    key: clientSecret
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            # /healthz comes from the ha_health_check custom component installed by
            # the 02-install-* initContainer above. It 404s until the integration is
            # added through HA's UI once (config-flow only -- there is no YAML/package
            # equivalent), so these probes are only safe after that has been done.
            #
            # Every field is spelled out because custom: true discards the chart's
            # probe defaults wholesale -- inheriting timeoutSeconds: 1 is what killed
            # shelfmark 77 times in three days.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: 8123 }
                  # 5 x 30s of sustained unhealth on top of the component's own 60s
                  # staleness threshold, so ~3.5 min before a restart. Deliberately
                  # slack: a restart takes Zigbee, Matter and the BLE radio down with
                  # it, so a Postgres blip must never be able to trigger one.
                  periodSeconds: 30
                  # The handler reads the keepalive sensor back out of the recorder,
                  # so this is a Postgres round-trip, not a static response.
                  timeoutSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: 8123 }
                  periodSeconds: 10
                  # ~5 min to bind :8123. init-db blocks on Postgres first and the
                  # .venv lives on its own PVC. The component answers 200 as soon as
                  # the HTTP server is up (hass.state != running short-circuits to
                  # healthy), so this hands off to liveness without waiting for every
                  # integration to load.
                  failureThreshold: 30
              # Off on purpose. HA is a single replica behind two HTTPRoutes: a failing
              # readiness probe would empty the Service endpoints and 503 the UI --
              # removing the only way to diagnose a half-broken HA -- while buying
              # nothing, because there is no second replica to shift traffic to.
              readiness:
                enabled: false
            securityContext:
              privileged: true
              capabilities:
                add: ["NET_RAW", "NET_ADMIN", "SYS_ADMIN", "DAC_OVERRIDE"]
            resources:
              requests:
                cpu: 23m
                memory: 384Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      priorityClassName: external-facing
      nodeSelector:
        kubernetes.io/hostname: lenovo2
      # hostNetwork is REQUIRED for mDNS/zeroconf discovery (Apple TV, Matter, etc.).
      # On the pod network Cilium does not deliver L2 multicast (224.0.0.251 / ff02::fb),
      # so HA bound no :5353 socket at all and discovered nothing — every integration
      # here had to be added by hand. hostNetwork puts HA on the node's ens18, where the
      # mDNS groups are joined. (The old multus-wlan annotation attempted the same thing
      # via a NAD that is ipvlan-L3 over a down bond0 — dead, and ipvlan-L3 strips
      # multicast regardless. Removed.)
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: &port 8123

    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["hass.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        existingClaim: home-assistant
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: home-assistant-cache
        globalMounts:
          - path: /config/.venv
      # Git-managed HA config fragments, nested inside the /config PVC mount.
      # advancedMounts (app only) rather than globalMounts so the install
      # initContainer isn't handed a mount it has no use for.
      packages:
        type: configMap
        name: home-assistant-packages
        advancedMounts:
          home-assistant:
            app:
              - path: /config/packages
                readOnly: true
      usb-devices:
        type: hostPath
        hostPath: /dev/bus/usb
        globalMounts:
          - path: /dev/bus/usb
      # NOTE: no ZBT-2 serial mounts here. The radio was flashed to OpenThread RCP and
      # now lives on the Proxmox HOST, owned by otbr-agent in CT103 (serial is
      # single-owner). /dev/ttyACM0 and /dev/serial do not exist inside this VM — the
      # old hostPath mounts silently materialised as empty dirs. HA reaches Thread via
      # the OTBR REST API and matter-server's WebSocket, never the radio directly.
      tmpfs:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /config/logs
                subPath: logs
              - path: /config/tts
                subPath: tts
              - path: /tmp
                subPath: tmp
