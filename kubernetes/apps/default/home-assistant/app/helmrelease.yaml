---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2025.10.3@sha256:94c9906ffd11a2958ca07235686ab30927a7b0a684856f9a8c2f7d2b1a6e2e21
            env:
              TZ: ${SECRET_TIMEZONE}
              HASS_HTTP_TRUSTED_PROXY_1: 10.42.0.0/16
              HASS_HTTP_TRUSTED_PROXY_2: 10.43.0.0/16
              HASS_HTTP_TRUSTED_PROXY_3: 10.0.0.0/8
              # HASS_HTTP_TRUSTED_PROXY_2: 10.0.10.0/24
              # HASS_HTTP_TRUSTED_PROXY_3: 10.0.20.0/24
              # HASS_HTTP_TRUSTED_PROXY_4: 10.0.30.0/24
              HOME_ASSISTANT_EXTERNAL_URL: https://hass.${SECRET_DOMAIN}
              HOME_ASSISTANT_UNIT_SYSTEM: metric
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            securityContext:
              privileged: true
              capabilities: 
                add: ["NET_RAW", "NET_ADMIN", "SYS_ADMIN", "DAC_OVERRIDE"]
            resources:
              requests:
                cpu: 23m
                memory: 549M
              limits:
                memory: 2Gi

    defaultPodOptions:
      priorityClassName: external-facing
      nodeSelector:
        kubernetes.io/hostname: lenovo2
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "multus-wlan",
            "namespace": "network",
            "ips": ["10.0.20.200/24"],
            "mac": "3e:59:e4:f7:43:09"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: 8123

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https

    ingress:
      internal:
        enabled: true
        className: internal
        hosts:
          - host: &internalHost "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
            - *internalHost
            
      external:
        enabled: true
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hosts:
          - host: &host hass.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
            - *host

    persistence:
      config:
        existingClaim: home-assistant
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: home-assistant-cache
        globalMounts:
          - path: /config/.venv
      usb-devices:
        type: hostPath
        hostPath: /dev/bus/usb
        globalMounts:
          - path: /dev/bus/usb
      tmpfs:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /config/logs
                subPath: logs
              - path: /config/tts
                subPath: tts
              - path: /tmp
                subPath: tmp
