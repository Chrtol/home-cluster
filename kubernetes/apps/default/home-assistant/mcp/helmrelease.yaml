---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      home-assistant-mcp:
        annotations:
          # Load-bearing: OIDC_CLIENT_ID/SECRET arrive by secretKeyRef, which is
          # read once at pod start. Without this a rotated Authentik client secret
          # would leave the pod running on the old value indefinitely.
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 8.1.1@sha256:e1d76a6ee54e26054a13a6c04089824b76d4d370246239591a02a2e4445ad2c9
            # ha-mcp-oidc, NOT the ha-mcp-web default. Standard web mode
            # authenticates purely by URL-path secrecy (MCP_SECRET_PATH), which on
            # a routed hostname means a token with full control of the house sits
            # behind a guessable path. The OIDC entrypoint puts Authentik in front
            # instead. Both are real entrypoints in pyproject.toml.
            command: ["ha-mcp-oidc"]
            env:
              FASTMCP_CHECK_FOR_UPDATES: "off"
              HA_MCP_CONFIG_DIR: &configDir /config
              HA_MCP_DISABLE_UPDATE_CHECK: true
              # ClusterIP rather than the public hostname: HA is hostNetwork, but
              # the Service still resolves to the node it is pinned to.
              HOMEASSISTANT_URL: http://home-assistant.default.svc.cluster.local:8123
              MCP_HEALTHZ: true
              MCP_HOST: 0.0.0.0
              # Upstream's own default. Nothing here needs a privileged port, and
              # binding <1024 as uid 999 only works while the runtime leaves
              # net.ipv4.ip_unprivileged_port_start at 0.
              MCP_PORT: &port 8086
              TZ: ${SECRET_TIMEZONE}
              # The settings UI does NOT go through OIDC -- its custom routes
              # bypass the auth middleware, so it would be gated only by
              # MCP_SETTINGS_SECRET_PATH, which regenerates on every restart when
              # unset ("set MCP_SETTINGS_SECRET_PATH for a stable URL" in the
              # startup log). Rather than leave an unauthenticated admin surface
              # inside an SSO-gated deployment, turn it off; tool visibility is
              # seedable through DISABLED_TOOLS/PINNED_TOOLS if it is ever needed.
              HA_MCP_DISABLE_SETTINGS_UI: true
              # Must be the single public origin: FastMCP derives the OAuth
              # metadata and callback from it, so a second route hostname would
              # advertise the wrong issuer. That is why the route below has one
              # hostname, not the usual pair.
              MCP_BASE_URL: https://hass-mcp.${SECRET_DOMAIN}
              OIDC_CONFIG_URL: https://sso.${SECRET_DOMAIN}/application/o/home-assistant-mcp/.well-known/openid-configuration
              # Generated by components/oidc-application (see ks.yaml), landed in
              # this namespace via OIDC_SECRET_NAMESPACE.
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-mcp-oidc-authentik-application
                    key: clientID
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-mcp-oidc-authentik-application
                    key: clientSecret
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              # /healthz is opt-in via MCP_HEALTHZ and is registered by main_oidc
              # too, not just main_web. It bypasses OIDC auth, which is what makes
              # it probeable at all.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: *port }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: *port }
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: *port }
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # 999, matching the image's mcpuser -- the Dockerfile pins that uid/gid
        # precisely because a volume records numeric ownership. /app/.venv is
        # chowned to it.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        # Deliberately ONE hostname -- see MCP_BASE_URL above.
        hostnames: ["hass-mcp.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: *configDir
          # $HOME must be writable, and HA_MCP_CONFIG_DIR does NOT cover it: that
          # env var only redirects ha-mcp's OWN data dir. FastMCP's OAuth proxy
          # keeps dynamically-registered clients under a platformdirs path
          # ($HOME/.local/share/...) and mkdirs it during OIDCProxy.__init__, which
          # is fatal under readOnlyRootFilesystem -- the pod crashlooped on
          # "OSError: [Errno 30] Read-only file system: '/home/mcpuser/.local'".
          #
          # Mounted here rather than fixed with HOME= or XDG_DATA_HOME= so it covers
          # every $HOME-relative path, whichever library reaches for one. On the PVC
          # rather than an emptyDir so DCR client registrations survive a restart.
          # Shadows the image's empty /home/mcpuser/.ha-mcp, which is unused anyway.
          - path: /home/mcpuser
            subPath: home
      # readOnlyRootFilesystem leaves Python and uvicorn with nowhere to write
      # temp files. HA_MCP_CONFIG_DIR keeps ha-mcp's own data on the PVC, so this
      # only has to cover the runtime's scratch writes.
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
