---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant-mcp-secret
    template:
      data:
        # A Home Assistant Long-Lived Access Token, minted by hand in HA
        # (Profile -> Security -> Long-lived access tokens) and pasted into
        # 1Password. Shown exactly once; only revocable, never retrievable.
        #
        # HA tokens carry NO scopes -- this inherits the full permissions of the
        # account that created it, and ha-mcp needs an admin to edit automations,
        # scripts and YAML at all. Treat it as root on the house.
        #
        # Every OIDC-authenticated user shares this one identity: OIDC mode is an
        # access gate only, not per-user HA authorization (docs/oidc.md).
        HOMEASSISTANT_TOKEN: "{{ .HASS_MCP_TOKEN }}"
  dataFrom:
    - extract:
        key: home-assistant-mcp