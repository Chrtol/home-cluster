---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-assistant
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
    - ../../../../components/cnpg
    - ../../../../components/oidc-application
  dependsOn:
    - name: mosquitto
      namespace: default
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
    - name: cloudnative-pg-cluster-v17
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/default/home-assistant/app
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: hass
      DB_NAME: home_assistant
      DB_USER: home_assistant
      DB_OP_ITEM: *app
      DB_PASS_FIELD: HASS_POSTGRES_PASS
      # OIDC component variables
      GROUP: "Default"
      SUBDOMAIN: hass
      OIDC_INTERNAL_SUBDOMAIN: home-assistant
      DISPLAY_NAME: "Home Assistant"
      DESCRIPTION: "Home automation"
      REDIRECT_PATH: "/auth/oidc/callback"
      OIDC_SECRET_NAMESPACE: default
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-assistant-mcp
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
    - ../../../../components/ceph-rbd
    # ha-mcp runs the ha-mcp-oidc entrypoint, so the generated clientID/Secret
    # are a hard start dependency (secretKeyRef, not an in-app config flow like
    # Home Assistant's own). Unlike the HA Kustomization above, this one really
    # cannot come up without Authentik.
    - ../../../../components/oidc-application
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
    - name: authentik
      namespace: security
    - name: home-assistant
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/home-assistant/mcp
  postBuild:
    substitute:
      APP: *app
      CEPH_RBD_CAPACITY: 1Gi
      # OIDC component variables. SUBDOMAIN must match MCP_BASE_URL in the
      # HelmRelease: it builds both the launch URL and the redirect URI, and
      # FastMCP compares the callback against the origin it advertised.
      GROUP: "Default"
      SUBDOMAIN: hass-mcp
      DISPLAY_NAME: "Home Assistant MCP"
      DESCRIPTION: "Home automation via MCP"
      REDIRECT_PATH: "/auth/callback"
      # No OIDC_INTERNAL_SUBDOMAIN: a second hostname would advertise an issuer
      # that does not match MCP_BASE_URL, so this app is single-host on purpose.
      #
      # MCP clients hold a long-lived connection and cannot bounce through a browser
      # to re-authenticate, so they need a refresh token. Without this the session
      # dies after access_token_validity (minutes=5) with "requires re-authorization".
      OIDC_EXTRA_SCOPE: offline_access
      OIDC_SECRET_NAMESPACE: default
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
