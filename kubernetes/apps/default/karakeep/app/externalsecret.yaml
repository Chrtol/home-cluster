---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: karakeep-secret
    template:
      data:
        # Config
        NEXTAUTH_SECRET: "{{ .KARAKEEP_ENCRYPTION_KEY }}"
        MEILI_MASTER_KEY: "{{ .KARAKEEP_MEILISEARCH_MASTER_KEY }}"

        # OAuth / OIDC
        OAUTH_WELLKNOWN_URL: "{{ .KARAKEEP_OAUTH_WELLKNOWN_URL }}"
        OAUTH_CLIENT_ID: "{{ .KARAKEEP_OAUTH_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .KARAKEEP_OAUTH_CLIENT_SECRET }}"
        OAUTH_SCOPE: "{{ .KARAKEEP_OAUTH_SCOPE | default \"openid email profile\" }}"
        OAUTH_PROVIDER_NAME: "{{ .KARAKEEP_OAUTH_PROVIDER_NAME | default \"OAuth Provider\" }}"
  dataFrom:
    - extract:
        key: karakeep
