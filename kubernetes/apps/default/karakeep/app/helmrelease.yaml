---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app karakeep
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    controllers:
      karakeep:
        forceRename: *app
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.33.1
            env:
              BROWSER_WEB_URL: http://karakeep-chrome.default.svc.cluster.local:9222
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_STORE_SCREENSHOT: true
              DATA_DIR: /data
              DISABLE_SIGNUPS: true
              DISABLE_PASSWORD_AUTH: true
              MEILI_ADDR: http://karakeep-meilisearch.default.svc.cluster.local:7700
              NEXTAUTH_URL: https://karakeep.${SECRET_DOMAIN}
              # AI tagging/titling via Google Gemini's OpenAI-compatible endpoint.
              # Base URL MUST include the trailing /openai/ — Karakeep uses the
              # OpenAI SDK, which appends /chat/completions; bare /v1beta 404s.
              OPENAI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
              INFERENCE_TEXT_MODEL: gemini-3.5-flash-lite
              INFERENCE_IMAGE_MODEL: gemini-3.5-flash-lite
              DISABLE_NEW_RELEASE_CHECK: true
              COREPACK_INTEGRITY_KEYS: 0
              TZ: ${SECRET_TIMEZONE}
              # V8 sizes its heap against host RAM, not the cgroup limit, so it
              # grows past the container limit before GC turns aggressive and the
              # kernel OOM-kills it. Cap the heap below the limit so GC reclaims
              # under pressure instead. The ~512Mi gap below the limit absorbs
              # non-heap spikes — chiefly the burst of concurrent /api/assets
              # (screenshot/image) reads served when the dashboard loads on boot.
              NODE_OPTIONS: --max-old-space-size=1536
            envFrom:
              - secretRef:
                  name: karakeep-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 23m
                memory: 549Mi
              limits:
                memory: 2Gi

      chrome:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: gcr.io/zenika-hub/alpine-chrome
              tag: 124
            command:
              - chromium-browser
            args:
              - --headless
              - --no-sandbox
              - --disable-gpu
              - --disable-dev-shm-usage
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
              - --hide-scrollbars
            securityContext:
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 35m
                memory: 1280M
              limits:
                memory: 2Gi

      meilisearch:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.53.1
            env:
              MEILI_NO_ANALYTICS: true
              # v1.52.0 renamed --experimental-dumpless-upgrade to --upgrade-db;
              # without it the engine refuses to open a DB from an older version.
              MEILI_UPGRADE_DB: true
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: MEILI_MASTER_KEY
            resources:
              requests:
                cpu: 15m
                memory: 105M
              limits:
                memory: 4Gi

    service:
      app:
        forceRename: *app
        primary: true
        controller: *app
        ports:
          http:
            port: &httpPort 3000
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700

    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          karakeep:
            app:
              - path: /data
      meilisearch-data:
        existingClaim: karakeep-meilisearch
        advancedMounts:
          meilisearch:
            app:
              - path: /meili_data
      cache:
        type: emptyDir
        advancedMounts:
          karakeep:
            app:
              - path: /.cache
      appcache:
        type: emptyDir
        advancedMounts:
          karakeep:
            app:
              - path: /app/apps/web/.next/cache

    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
          # gatus-sidecar: publicly reachable but returns a 307 auth redirect, so
          # accept any non-error status as healthy.
          gatus.home-operations.com/endpoint: |
            group: external
            conditions:
              - "[STATUS] < 400"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
      internal:
        hostnames: ["{{ .Release.Name }}-internal.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
