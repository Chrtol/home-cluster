---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filebrowser
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: filebrowser-secret
    template:
      engineVersion: v2
      data:
        # Signs Filebrowser session JWTs. Set explicitly (rather than letting
        # Quantum auto-generate one into the bbolt DB) so sessions survive a DB
        # restore / pod replacement. 32+ random chars.
        FILEBROWSER_JWT_TOKEN_SECRET: "{{ .FILEBROWSER_JWT_TOKEN_SECRET }}"
  dataFrom:
    # Provides FILEBROWSER_JWT_TOKEN_SECRET
    - extract:
        key: filebrowser
