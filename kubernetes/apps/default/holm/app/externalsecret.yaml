---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name holm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: holm-secret
    template:
      engineVersion: v2
      data:
        # Encrypts per-user integration logins and signs sessions. Changing it
        # logs everyone out and orphans every stored integration login.
        HOLM_SECRET_KEY: "{{ .HOLM_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: *name
