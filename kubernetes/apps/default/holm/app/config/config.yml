# Each user connects their own account in Configure → Integrations; searches
# then run as that user. Unlike apps, integrations ignore groups: every
# signed-in user sees every card. default_url pins the server, so nobody can aim
# one at an arbitrary internal host.
integrations:
  plex:
    default_url: "https://plex.${SECRET_DOMAIN}"
    surfaces: { search: true, widgets: false }
  # Connects on its own for anyone who connected Plex first.
  seerr:
    default_url: "https://request.${SECRET_DOMAIN}"
    surfaces: { search: true, widgets: false }
  audiobookshelf:
    default_url: "https://audiobooks.${SECRET_DOMAIN}"
    surfaces: { search: true, widgets: false }
  immich:
    default_url: "https://photos.${SECRET_DOMAIN}"
    surfaces: { search: true, widgets: false }
  mealie:
    default_url: "https://recipes.${SECRET_DOMAIN}"
    surfaces: { search: true, widgets: false }
  paperless:
    default_url: "https://paperless.${SECRET_DOMAIN}"
    surfaces: { search: true, widgets: false }
  karakeep:
    default_url: "https://karakeep.${SECRET_DOMAIN}"
    surfaces: { search: true, widgets: false }

weather:
  enabled: true

# The stock onboarding and privacy texts make promises (backups, retention)
# written for someone else's server; off until rewritten for this one.
onboarding:
  enabled: false
privacy:
  enabled: false

# Renovate already tracks releases.
update_check:
  enabled: false
