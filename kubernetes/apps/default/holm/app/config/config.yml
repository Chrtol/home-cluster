  - id: sabnzbd
    name: "SABnzbd"
    url: "https://sabnzbd.${SECRET_DOMAIN}"
    icon: "di:sabnzbd"
    groups: ["authentik Admins"]
    health: true
    tags: ["downloads"]
  - id: qbittorrent
    name: "qBittorrent Public"
    url: "https://qbittorrent.${SECRET_DOMAIN}"
    icon: "di:qbittorrent"
    groups: ["authentik Admins"]
    health: true
    tags: ["downloads"]
  - id: qbittorrent-private
    name: "qBittorrent Private"
    url: "https://qb-priv.${SECRET_DOMAIN}"
    icon: "di:qbittorrent"
    groups: ["authentik Admins"]
    health: true
    tags: ["downloads"]
  - id: proxmox
    name: "Proxmox"
    url: "https://proxmox.${SECRET_DOMAIN}"
    icon: "di:proxmox"
    groups: ["authentik Admins"]
    health: true
    tags: ["infra"]
  - id: truenas
    name: "TrueNAS"
    url: "https://nas.${SECRET_DOMAIN}"
    icon: "di:truenas"
    groups: ["authentik Admins"]
    health: true
    tags: ["infra"]
  - id: opnsense
    name: "OPNsense"
    url: "https://opnsense.${SECRET_DOMAIN}"
    icon: "di:opnsense"
    groups: ["authentik Admins"]
