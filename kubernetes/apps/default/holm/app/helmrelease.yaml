---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app holm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      holm:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/man15h/holm
              tag: 0.12.0@sha256:1bce0b3175fec60eb72d682808eb1ddcab15559b2dec7591e97268ac92e6cef5
            env:
              TZ: ${SECRET_TIMEZONE}
              CONFIG_PATH: /config/config.yml
              DATABASE_PATH: /app/data/holm.db
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: holm-oidc-authentik-application
                    key: clientID
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: holm-oidc-authentik-application
                    key: clientSecret
            envFrom:
              - secretRef:
                  name: holm-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: &port 3000
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
          gatus.home-operations.com/endpoint: |
            group: external
            conditions:
              - "[STATUS] < 400"
        hostnames: ["start.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data
      # Mounted as a directory, not a subPath, so ConfigMap edits reach the
      # running pod (subPath mounts never update).
      config:
        type: configMap
        name: holm-config
        globalMounts:
          - path: /config
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
