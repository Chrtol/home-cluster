---
apiVersion: v1
kind: ConfigMap
metadata:
  name: actual-gatus-ep
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: actual
        group: internal
        url: "http://actual.default.svc.cluster.local:5006"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover