---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mplus-cutoff
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mplus-cutoff-secret
    creationPolicy: Owner
    template:
      data:
        # DB_USER / DB_NAME are the ks.yaml postBuild values the cnpg component creates the role and database from.
        DATABASE_URL: "postgres://${DB_USER}:{{ .MPLUS_CUTOFF_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/${DB_NAME}?sslmode=require"
        USER_AGENT: "{{ .MPLUS_CUTOFF_USER_AGENT }}"
  dataFrom:
    - extract:
        key: mplus-cutoff
    - extract:
        key: cloudnative-pg
