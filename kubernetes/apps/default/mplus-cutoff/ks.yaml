---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mplus-cutoff
  namespace: &ns default
spec:
  targetNamespace: *ns
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudnative-pg-cluster-v17
      namespace: database
  path: ./kubernetes/apps/default/mplus-cutoff/app
  components:
    - ../../../../components/cnpg
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      DB_NAME: mplus_cutoff
      DB_USER: mplus_cutoff
      DB_OP_ITEM: *app
      DB_PASS_FIELD: MPLUS_CUTOFF_POSTGRES_PASS
    substituteFrom:
    - name: cluster-secrets
      kind: Secret
