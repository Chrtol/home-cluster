---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app outline
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  components:
        - ../../../../components/cnpg
        - ../../../../components/dragonfly
        - ../../../../components/gatus/external
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: authentik
      namespace: security
    - name: dragonfly
      namespace: database
    - name: garage
      namespace: database
  path: "./kubernetes/apps/default/outline/app"
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: docs
      DB_OP_ITEM: *app
      DB_PASS_FIELD: OUTLINE_POSTGRES_PASS
    substituteFrom:
    - name: cluster-secrets
      kind: Secret

  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m