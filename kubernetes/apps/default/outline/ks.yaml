---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app outline
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  components:
        - ../../../../components/cnpg
        - ../../../../components/dragonfly
        - ../../../../components/gatus/external
        # Outline uploads images browser-direct to S3 (presigned PUT) -> the bucket needs
        # a CORS rule for the docs origin. Applied via PutBucketCors (no GarageBucket CRD
        # field for it). Outline manages S3 in outline-secret (AWS_* keys), so override
        # the cred secret/keys from the component defaults.
        - ../../../../components/s3-bucket/cors
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: authentik
      namespace: security
    - name: dragonfly
      namespace: database
    - name: garage-operated-cluster
      namespace: database
  path: "./kubernetes/apps/default/outline/app"
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: docs
      DB_OP_ITEM: *app
      DB_PASS_FIELD: OUTLINE_POSTGRES_PASS
      # s3-bucket/cors component -- Outline's creds live in outline-secret (AWS_* keys),
      # not the component-default ${APP}-s3-credentials.
      NAMESPACE: *namespace
      S3_BUCKET: outline
      CORS_ORIGIN: https://docs.${SECRET_DOMAIN}
      CORS_SECRET_NAME: outline-secret
      CORS_ACCESS_KEY_KEY: AWS_ACCESS_KEY_ID
      CORS_SECRET_KEY_KEY: AWS_SECRET_ACCESS_KEY
    substituteFrom:
    - name: cluster-secrets
      kind: Secret

  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m