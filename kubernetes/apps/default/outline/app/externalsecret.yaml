---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: outline-secret
    template:
      engineVersion: v2
      data:
        # Core secrets
        SECRET_KEY: "{{ .OUTLINE_SECRET_KEY }}"
        UTILS_SECRET: "{{ .OUTLINE_UTILS_SECRET }}"

        # PostgreSQL configuration
        DATABASE_URL: "postgres://{{ .OUTLINE_POSTGRES_USER }}:{{ .OUTLINE_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/outline?sslmode=disable"

        # Postgres Init (for init container)
        INIT_POSTGRES_DBNAME: outline
        INIT_POSTGRES_HOST: "{{ .POSTGRES_RW_SVC }}"
        INIT_POSTGRES_PORT: "5432"
        INIT_POSTGRES_USER: "{{ .OUTLINE_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .OUTLINE_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

        # Redis configuration
        REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/3"
        # Disabled due to Dragonfly pub/sub compatibility issues
        # REDIS_COLLABORATION_URL: "redis://dragonfly.database.svc.cluster.local:6379/4"

        # OIDC configuration
        OIDC_CLIENT_ID: "{{ .OUTLINE_AUTHENTIK_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OUTLINE_AUTHENTIK_CLIENT_SECRET }}"
        OIDC_AUTH_URI: "https://sso.${SECRET_DOMAIN}/application/o/authorize/"
        OIDC_TOKEN_URI: "https://sso.${SECRET_DOMAIN}/application/o/token/"
        OIDC_USERINFO_URI: "https://sso.${SECRET_DOMAIN}/application/o/userinfo/"
        OIDC_LOGOUT_URI: "https://sso.${SECRET_DOMAIN}/application/o/outline/end-session/"
        OIDC_USERNAME_CLAIM: "email"
        OIDC_DISPLAY_NAME: "Authentik"
        OIDC_SCOPES: "openid profile email offline_access"

        # Optional settings
        ENABLE_UPDATES: "false"

        # S3 Storage Configuration
        FILE_STORAGE: "s3"
        AWS_ACCESS_KEY_ID: "{{ .OUTLINE_S3_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .OUTLINE_S3_SECRET_ACCESS_KEY }}"
        AWS_REGION: "homelab"
        AWS_S3_UPLOAD_BUCKET_NAME: "outline"
        AWS_S3_UPLOAD_BUCKET_URL: "http://garage.database.svc.cluster.local:3900"
        AWS_S3_FORCE_PATH_STYLE: "true"
        AWS_S3_ACL: "private"

  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: outline
