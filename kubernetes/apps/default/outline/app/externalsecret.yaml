---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: outline-secret
    template:
      engineVersion: v2
      data:
        # Core secrets
        SECRET_KEY: "{{ .OUTLINE_SECRET_KEY }}"
        UTILS_SECRET: "{{ .OUTLINE_UTILS_SECRET }}"

        # PostgreSQL configuration
        DATABASE_HOST: &dbHost "{{ .POSTGRES_RW_SVC }}"
        DATABASE_PORT: &dbPort "5432"
        DATABASE_NAME: &dbName outline
        DATABASE_USER: &dbUser "{{ .OUTLINE_POSTGRES_USER }}"
        DATABASE_PASSWORD: &dbPass "{{ .OUTLINE_POSTGRES_PASS }}"
        DATABASE_URL: "postgres://{{ .OUTLINE_POSTGRES_USER }}:{{ .OUTLINE_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/outline?sslmode=disable"

        # Postgres Init (for init container)
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_PORT: *dbPort
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

        # Redis configuration
        REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/3"

        # OIDC configuration
        OIDC_CLIENT_ID: "{{ .OUTLINE_AUTHENTIK_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OUTLINE_AUTHENTIK_CLIENT_SECRET }}"
        OIDC_AUTH_URI: "https://sso.${SECRET_DOMAIN}/application/o/authorize/"
        OIDC_TOKEN_URI: "https://sso.${SECRET_DOMAIN}/application/o/token/"
        OIDC_USERINFO_URI: "https://sso.${SECRET_DOMAIN}/application/o/userinfo/"
        OIDC_LOGOUT_URI: "https://sso.${SECRET_DOMAIN}/application/o/outline/end-session/"
        OIDC_USERNAME_CLAIM: "preferred_username"
        OIDC_DISPLAY_NAME: "Authentik"
        OIDC_SCOPES: "openid profile email offline_access"

        # Optional settings
        ENABLE_UPDATES: "false"

  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: outline
