---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app outline
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  # init-db initContainer + db.home.arpa/* pod labels come from the cnpg/dragonfly components
  valuesFrom:
    - kind: ConfigMap
      name: ${APP}-cnpg-values
    - kind: ConfigMap
      name: ${APP}-dragonfly-values
  values:
    controllers:
      outline:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/outlinewiki/outline
              tag: 1.9.1@sha256:9fe2cbdceccea0ffb82cbc8dc6f4c0d4ba1d377454e502d5d2bddececb34d4f1
            # --env selects a sequelize profile from server/config/database.js.
            # "production" sets dialectOptions.ssl = { rejectUnauthorized: false }:
            # TLS on, server cert not verified -- which is what we want against
            # CNPG's self-signed CA. "production-ssl-disabled" has no ssl options
            # at all, so node-postgres connects in plaintext.
            #
            # Do NOT set PGSSLMODE here. node-pg maps it onto node's TLS defaults
            # (rejectUnauthorized: true), which forces chain verification and dies
            # with SELF_SIGNED_CERT_IN_CHAIN against the CNPG CA.
            command: ["/bin/sh", "-c", "npm run db:migrate -- --env=production && npm run start -- --env=production"]
            env:
              TZ: ${SECRET_TIMEZONE}
              URL: https://docs.${SECRET_DOMAIN}
              LOG_LEVEL: info
              NODE_ENV: production
              FILE_STORAGE_IMPORT_MAX_SIZE: "5120000"
              FILE_STORAGE_UPLOAD_MAX_SIZE: "26214400"
              PORT: &port 8080
              SMTP_HOST: smtp-relay.default.svc.cluster.local
              SMTP_PORT: 2525
              SMTP_FROM_EMAIL: "outline@${SECRET_DOMAIN}"
              SMTP_SECURE: false
              WEB_CONCURRENCY: 1
            envFrom:
              - secretRef:
                  name: outline-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 15m
                memory: 824Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["docs.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      tmpfs:
        type: emptyDir
        advancedMounts:
          outline:
            app:
              - path: /home/node
                subPath: node
              - path: /tmp
                subPath: tmp