---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: joplin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: joplin-secret
    template:
      engineVersion: v2
      data:
        # App
        POSTGRES_HOST: &dbHost "{{ .POSTGRES_RW_SVC }}"
        POSTGRES_PORT: "5432"
        POSTGRES_DATABASE: &dbName joplin
        POSTGRES_USER: &dbUser "{{ .JOPLIN_POSTGRES_USER }}"
        POSTGRES_PASSWORD: &dbPass "{{ .JOPLIN_POSTGRES_PASS }}"

        # # SMTP
        # MAILER_HOST: "{{ .MAILER_HOST }}"
        # MAILER_AUTH_USER: "{{ .MAILER_AUTH_USER }}"
        # MAILER_AUTH_PASSWORD: "{{ .MAILER_AUTH_PASSWORD }}"
        # MAILER_NOREPLY_EMAIL: "{{ .MAILER_NOREPLY_EMAIL }}"

        # Postgres Init
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
      key: cloudnative-pg
    - extract:
      key: joplin
