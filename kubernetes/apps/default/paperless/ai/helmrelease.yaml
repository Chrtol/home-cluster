---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-ai
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      paperless-ai:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/clusterzx/paperless-ai
              tag: 4.0.0@sha256:bea1e218755ba7940da9748ce64e3d7020f15059eab8eb5c6e5470d3d60436a6
            env:
              TZ: ${SECRET_TIMEZONE}
              ACTIVATE_TAGGING: yes
              # Gemini via the OpenAI-compatible "custom" provider (Ollama removed).
              # Base URL needs the trailing /openai/ for the OpenAI-compat shim.
              AI_PROVIDER: custom
              CUSTOM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
              CUSTOM_MODEL: gemini-3.5-flash-lite
              PAPERLESS_API_URL: http://paperless.default.svc.cluster.local:8000/api
              PROCESS_PREDEFINED_DOCUMENTS: yes
              USE_EXISTING_DATA: yes
              RESTRICT_TO_EXISTING_TAGS: no
              RESTRICT_TO_EXISTING_DOCUMENT_TYPES: yes
              SCAN_INTERVAL: "*/30 * * * *"
              TAGS: AI
            envFrom:
              - secretRef:
                  name: paperless-ai-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 15m
                memory: 2312Mi
              limits:
                memory: 3080Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: &port 3000
    route:
      server:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/public/images
      home:
        type: emptyDir
        globalMounts:
          - path: /home/node/.pm2
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/logs
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      nltk:
        type: emptyDir
        globalMounts:
          - path: /home/node/nltk_data
      openapi:
        type: emptyDir
        globalMounts:
          - path: /app/OPENAPI
      hfcache:
        type: emptyDir
        globalMounts:
          - path: /home/node/.cache
