---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudnative-pg-cluster-v17
      namespace: database
    - name: dragonfly-cluster
      namespace: database
  components:
    - ../../../../components/ceph-rbd
    - ../../../../components/oidc-application
  path: ./kubernetes/apps/default/paperless/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      CEPH_RBD_CAPACITY: 5Gi
      # OIDC component variables
      GROUP: "Default"
      SUBDOMAIN: paperless
      DISPLAY_NAME: "Paperless"
      DESCRIPTION: "Document Management System"
      REDIRECT_PATH: "/accounts/oidc/authentik/login/callback/"
    substituteFrom:
    - name: cluster-secrets
      kind: Secret
---
