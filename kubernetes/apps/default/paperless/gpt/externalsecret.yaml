---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-gpt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-gpt-secret
    template:
      data:
        PAPERLESS_API_TOKEN: '{{ .PAPERLESS_API_KEY }}'
        # Native googleai provider expects GOOGLEAI_API_KEY
        GOOGLEAI_API_KEY: '{{ .GEMINI_API_KEY }}'
  dataFrom:
    - extract:
        key: gemini
    - extract:
        key: paperless
