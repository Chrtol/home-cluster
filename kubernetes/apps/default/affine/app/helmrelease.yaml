---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app affine
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      affine:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
              pullPolicy: IfNotPresent
            env:
              INIT_POSTGRES_UTF8: "true"
            envFrom: &envFrom
              - secretRef:
                  name: affine-secret
          init-config:
            dependsOn: init-db
            image:
              repository: ghcr.io/toeverything/affine-graphql
              tag: stable-0ab8655@sha256:b461dd09b968bd2f067e98ed3c4988f4711dd811df7624f19d53c899061c4347
            command: ["/bin/sh", "-c"]
            args:
              - |
                node ./scripts/self-host-predeploy.js
            envFrom: &envFrom
              - secretRef:
                  name: affine-secret
            resources:
              requests:
                cpu: 15m
                memory: 324M
              limits:
                memory: 512M
        containers:
          app:
            image:
              repository: ghcr.io/toeverything/affine-graphql
              tag: stable-0ab8655@sha256:b461dd09b968bd2f067e98ed3c4988f4711dd811df7624f19d53c899061c4347
            env:
              TZ: ${SECRET_TIMEZONE}
            envFrom: *envFrom
            probes:
              liveness:
                enabled: true
                path: /
                port: &port 3010
              readiness:
                enabled: true
                path: /
                port: *port
            resources:
              requests:
                cpu: 25m
                memory: 105M
        pod:
          securityContext:
            # TODO: non root should be done oneday
            runAsUser: 0
    service:
      app:
        controller: affine
        ports:
          http:
            port: *port
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      workspace:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /root/.affine
