---
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: affine-secret
    template:
      data:
        # Database
        REDIS_SERVER_HOST: dragonfly.database.svc.cluster.local
        DATABASE_URL: postgresql://{{ .AFFINE_POSTGRES_USER }}:{{ .AFFINE_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/affine
        INIT_POSTGRES_DBNAME: affine
        INIT_POSTGRES_HOST: "{{ .POSTGRES_RW_SVC }}"
        INIT_POSTGRES_USER: "{{ .AFFINE_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .AFFINE_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_ENCODING: "UTF8"

        # Config
        AFFINE_SERVER_HTTPS: "true"
        AFFINE_SERVER_HOST: "affine.${SECRET_DOMAIN}"

        # OAuth
        OAUTH_OIDC_CLIENT_ID: "{{ .AFFINE_OAUTH_CLIENT_ID }}"
        OAUTH_OIDC_CLIENT_SECRET: "{{ .AFFINE_OAUTH_CLIENT_SECRET }}"
        OAUTH_OIDC_ISSUER: "{{ .AFFINE_OAUTH_ISSUER }}"
        OAUTH_OIDC_ARGS: '{"scope": "openid profile email", "claim_id": "preferred_username", "claim_email": "email", "claim_name": "name"}'
  dataFrom:
    - extract:
        key: affine
    - extract:
        key: cloudnative-pg