---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homepage
  namespace: default
spec:
  refreshInterval: "30m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-secret
    creationPolicy: Owner
    template:
      data:
        engineVersion: v2
        ## Media
        HOMEPAGE_VAR_PLEX_KEY: "{{ .PLEX_TOKEN }}"
        HOMEPAGE_VAR_JELLYSEERR_KEY: "{{ .JELLYSEERR_API_KEY }}"

        ## Infrastructure
        HOMEPAGE_VAR_TRUENAS_TOKEN: "{{ .TRUENAS_API_TOKEN }}"
        HOMEPAGE_VAR_OPNSENSE_API_KEY: "{{ .HOMEPAGE_OPNSENSE_API_KEY }}"
        HOMEPAGE_VAR_OPNSENSE_API_SECRET: "{{ .HOMEPAGE_OPNSENSE_API_SECRET }}"
        HOMEPAGE_VAR_ADGUARD_USERNAME: "{{ .ADGUARD_USERNAME }}"
        HOMEPAGE_VAR_ADGUARD_PASSWORD: "{{ .ADGUARD_PASSWORD }}"
        HOMEPAGE_VAR_PROXMOX_API_TOKEN_ID: "{{ .PROXMOX_HOMEPAGE_API_TOKEN_ID }}"
        HOMEPAGE_VAR_PROXMOX_API_SECRET: "{{ .PROXMOX_HOMEPAGE_API_SECRET }}"

        ## Downloads
        HOMEPAGE_VAR_BAZARR_KEY: "{{ .BAZARR_API_KEY }}"
        HOMEPAGE_VAR_PROWLARR_KEY: "{{ .PROWLARR_API_KEY }}"
        HOMEPAGE_VAR_RADARR_KEY: "{{ .RADARR_API_KEY }}"
        HOMEPAGE_VAR_SONARR_KEY: "{{ .SONARR_API_KEY }}"
        HOMEPAGE_VAR_QBITTORRENT_USERNAME: "{{ .QBT_WEBUI_USERNAME }}"
        HOMEPAGE_VAR_QBITTORRENT_PASSWORD: "{{ .QBT_WEBUI_PASSWORD }}"
        # HOMEPAGE_VAR_LIDARR_TOKEN: "{{ .lidarr_token }}"

        ## Security
        HOMEPAGE_VAR_AUTHENTIK_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"

        ## Selfhosted
        # HOMEPAGE_VAR_IMMICH_TOKEN: "{{ .immich_token }}"
        # HOMEPAGE_VAR_AUDIOBOOKSHELF_TOKEN: "{{ .audiobookshelf_token }}"
        # HOMEPAGE_VAR_PAPERLESS_TOKEN: "{{ .paperless_token }}"
        # HOMEPAGE_VAR_NEXTCLOUD_TOKEN: "{{ .nextcloud_token }}"
  dataFrom:
    - extract:
        key: bazarr
    - extract:
        key: prowlarr
    - extract:
        key: sonarr
    - extract:
        key: radarr
    - extract:
        key: authentik
    - extract:
        key: truenas
    - extract:
        key: plex
    - extract:
        key: jellyseerr
    - extract:
        key: qbittorrent
    - extract:
        key: opnsense
    - extract:
        key: adguard-home
    - extract:
        key: proxmox
    # ## Non Cluster
    # # - secretKey: hass_token
    # #   remoteRef:
    # #     key: homeassistant
    # #     property: HASS_TOKEN
    # # - secretKey: truenas_token
    # #   remoteRef:
    # #     key: democratic-csi
    # #     property: TRUENAS_API_TOKEN
    # ## Downloads
    # - secretKey: bazarr_token
    #   remoteRef:
    #     key: bazarr
    #     property: API_KEY
    # - secretKey: prowlarr_token
    #   remoteRef:
    #     key: prowlarr
    #     property: PROWLARR_API_KEY
    # - secretKey: radarr_token
    #   remoteRef:
    #     key: radarr
    #     property: RADARR_API_KEY
    # - secretKey: sonarr_token
    #   remoteRef:
    #     key: sonarr
    #     property: SONARR_API_KEY
    # - secretKey: lidarr_token
    #   remoteRef:
    #     key: lidarr
    #     property: LIDARR_API_KEY
    # ## Security
    # - secretKey: authentik_token
    #   remoteRef:
    #     key: authentik
    #     property: AUTHENTIK_SECRET_KEY
    # - secretKey: immich_token
    #   remoteRef:
    #     key: immich
    #     property: HOMEPAGE_API_TOKEN
    # - secretKey: audiobookshelf_token
    #   remoteRef:
    #     key: audiobookshelf
    #     property: API_TOKEN
    # - secretKey: paperless_token
    #   remoteRef:
