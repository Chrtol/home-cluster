---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: default
data:
  bookmarks.yaml: |
    - Media:
        - YouTube:
            - href: https://youtube.com/feed/subscriptions
    - Tech:
        - HackerNews:
            - href: https://news.ycombinator.com
        - Moronix:
            - href: https://www.phoronix.com
    - Social:
        - Reddit:
            - href: https://reddit.com
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
    ingress: true
  services.yaml: |
    # - Calendar:
    #     - Agenda:
    #         widget:
    #           type: calendar
    #           view: agenda # optional - possible values monthly, agenda
    #           maxEvents: 20 # optional - defaults to 10
    #           integrations: # optional
    #             - type: sonarr # active widget type that is currently enabled on homepage - possible values: radarr, sonarr>
    #               service_group: Downloads # group name where widget exists
    #               service_name: Sonarr # service name for that widget
    #             - type: radarr # active widget type that is currently enabled on homepage - possible values: radarr, sonarr>
    #               service_group: Downloads # group name where widget exists
    #               service_name: Radarr # service name for that widget
    - Infrastructure:
        - TrueNAS:
            href: https://nas.${SECRET_DOMAIN}
            icon: truenas.png
            widget:
              type: truenas
              fields: []
              url: https://nas.${SECRET_DOMAIN}
              key: {{HOMEPAGE_VAR_TRUENAS_TOKEN}}
              enablePools: true
        - OPNSense:
            href: http://10.0.30.1
            icon: opnsense.png
            widget:
              type: opnsense
              url: http://10.0.30.1
              username: {{HOMEPAGE_VAR_OPNSENSE_API_KEY}}
              password: {{HOMEPAGE_VAR_OPNSENSE_API_SECRET}}
              wan: igc3
        - Proxmox:
            href: http://10.0.30.10:8006
            icon: proxmox.png
            widget:
              type: proxmox
              url: https://10.0.30.10:8006
              username: {{HOMEPAGE_VAR_PROXMOX_API_TOKEN_ID}}
              password: {{HOMEPAGE_VAR_PROXMOX_API_SECRET}}
    - System Applications:
        - Authentik:
            href: https://authentik.${SECRET_DOMAIN}
            icon: authentik.png
            widget:
              type: authentik
              url: https://authentik-server.security.svc.cluster.local
              key: {{HOMEPAGE_VAR_AUTHENTIK_KEY}}
        - Adguard Home:
            href: http://10.0.10.1
            icon: adguard.png
            widget:
              type: adguard
              url: http://10.0.10.1
              username: {{HOMEPAGE_VAR_ADGUARD_USERNAME}}
              password: {{HOMEPAGE_VAR_ADGUARD_PASSWORD}}
    - Media:
      - Plex:
          icon: plex.png
          href: https://plex.${SECRET_DOMAIN}
          description: Media Server
          widget:
            type: plex
            url: http://plex.media.svc.cluster.local:32400
            key: {{HOMEPAGE_VAR_PLEX_KEY}}
            enableNowPlaying: true
      - Jellyseer:
          icon: jellyseer.png
          href: https://request.${SECRET_DOMAIN}
          description: Media Requests
          widget:
            type: jellyseerr
            url: http://jellyseerr.media.svc.cluster.local
            key: {{HOMEPAGE_VAR_JELLYSEERR_KEY}}
      - qBittorrent:
          icon: qbittorrent.png
          href: https://qbittorrent.${SECRET_DOMAIN}
          description: Torrent Management
          widget:
            type: qbittorrent
            url: http://qbittorrent-app.media.svc.cluster.local
            username: {{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}
            password: {{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}
      - Radarr:
          icon: radarr.png
          href: https://radarr.${SECRET_DOMAIN}
          description: Movies Management
          widget:
            type: radarr
            url: http://radarr.media.svc.cluster.local:7878
            key: {{HOMEPAGE_VAR_RADARR_KEY}}
      - Sonarr:
          icon: sonarr.png
          href: https://sonarr.${SECRET_DOMAIN}
          description: TV Shows Management
          widget:
            type: sonarr
            url: http://sonarr.media.svc.cluster.local:80
            key: {{HOMEPAGE_VAR_SONARR_KEY}}
      - Bazarr:
          icon: bazarr.png
          href: https://bazarr.${SECRET_DOMAIN}
          description: Subtitles Management
          widget:
            type: bazarr
            url: http://bazarr.media.svc.cluster.local:6767
            key: {{HOMEPAGE_VAR_BAZARR_KEY}}
    - Favorites:
        - home-cluster:
            icon: si-github
            href: https://github.com/chrtol/home-cluster
            description: My Code Repository
  settings.yaml: |
    # General Settings
    title: Homepage Highland Escape
    theme: dark
    color: zinc
    headerStyle: clean
    useEqualHeights: true #<- This is a must!
    hideVersion: true
    target: _self

    providers:
      openweathermap: openweathermapapikey
      weatherapi: weatherapiapikey

    # layout: the order to show each of the sections defined in services.yaml
    # headers / labels are hidden - number of columns per section is set here

    layout:
      
      "Infrastructure":
        header: false
        style: row
        columns: 4
      "System Applications":
        header: false
        style: row
        columns: 4  
      "Media":
        header: false
        style: row
        columns: 5

  widgets.yaml: |
    - resources:
        backend: kubernetes
        cpu: true
        expanded: true
        memory: true
    - search:
        provider: [duckduckgo, google]
        focus: false
        target: _blank
    - kubernetes:
        cluster:
          cpu: true
          memory: true
          show: true
          showLabel: true
        nodes:
          cpu: true
          memory: true
          show: false
          showLabel: true
    - openmeteo:
        label: Home
        units: metric
        cache: 5
    - datetime:
        text_size: l
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
    - openmeteo:
        latitude: 59.9138918053718
        longitude: 10.788225884522408
        units: metric
        cache: 15
        format:
          maximumFractionDigits: 0
