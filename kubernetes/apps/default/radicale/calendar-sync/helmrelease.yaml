---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radicale-calendar-sync
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      radicale-calendar-sync:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          timeZone: ${SECRET_TIMEZONE}
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          # The next run is 15 minutes away; no point retrying sooner.
          backoffLimit: 0
          activeDeadlineSeconds: 600
        containers:
          app:
            image:
              repository: python
              tag: 3.15-alpine
            command: ["python", "-u", "-I", "/app/sync.py"]
            env:
              RADICALE_URL: http://radicale.default.svc.cluster.local:5232
            envFrom:
              - secretRef:
                  name: radicale-calendar-sync-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    persistence:
      script:
        type: configMap
        name: radicale-calendar-sync-script
        globalMounts:
          - path: /app
            readOnly: true
