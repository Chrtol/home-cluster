---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radicale-calendar-sync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: radicale-calendar-sync-secret
    template:
      engineVersion: v2
      data:
        ICLOUD_USERNAME: "{{ .RADICALE_APPLE_ID }}"
        ICLOUD_APP_PASSWORD: "{{ .RADICALE_APPLE_APP_PASSWORD }}"
        # "Calendar name = https://link", entries split by ';' or newlines.
        FEEDS: "{{ .RADICALE_FEEDS }}"
        RADICALE_ICLOUD_USER: "{{ .RADICALE_ICLOUD_USER }}"
        RADICALE_ICLOUD_PASSWORD: "{{ .RADICALE_ICLOUD_PASSWORD }}"
        RADICALE_LINKS_USER: "{{ .RADICALE_LINKS_USER }}"
        RADICALE_LINKS_PASSWORD: "{{ .RADICALE_LINKS_PASSWORD }}"
  dataFrom:
    - extract:
        key: radicale
