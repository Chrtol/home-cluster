---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app radicale
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      radicale:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/tomsquest/docker-radicale
              tag: 3.9.1.1@sha256:3869c5c013da5d76132cdeaba1fa0804324119d0ef6f3eaaf18f310f64c6bdc9
            # Straight to Radicale: the image's entrypoint chowns as root.
            command: ["/venv/bin/radicale", "--config", "/config/config"]
            env:
              TZ: ${SECRET_TIMEZONE}
            probes:
              liveness: &probe
                enabled: true
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    # Holm and calendar-sync reach it in-cluster; no route on purpose.
    service:
      app:
        ports:
          http:
            port: 5232
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      config:
        type: configMap
        name: radicale-config
        globalMounts:
          - path: /config
            readOnly: true
      auth:
        type: secret
        name: radicale-secret
        globalMounts:
          - path: /auth
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
