---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name radicale
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: radicale-secret
    template:
      engineVersion: v2
      data:
        users: |
          {{ .RADICALE_ICLOUD_USER }}:{{ .RADICALE_ICLOUD_PASSWORD }}
          {{ .RADICALE_LINKS_USER }}:{{ .RADICALE_LINKS_PASSWORD }}
  dataFrom:
    - extract:
        key: *name
