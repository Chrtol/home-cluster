# TEMPORARY kopiur pilot restore test -- remove this file and its kustomization entry once
# the checksums have been compared against the live volume. Restores the latest thelounge
# snapshot into a scratch claim and prints a checksum listing; the live PVC is untouched.
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: thelounge-restore-test
spec:
  credentialProjection:
    enabled: true
  source:
    fromPolicy:
      name: thelounge
      offset: 0
      sourcePath: /pvc/thelounge
  target:
    populator: {}
  policy:
    onMissingSnapshot: Fail
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thelounge-restore-test
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: csi-rbd-sc
  resources:
    requests:
      storage: 1Gi
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: thelounge-restore-test
---
apiVersion: batch/v1
kind: Job
metadata:
  name: thelounge-restore-test-verify
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: verify
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              cd /restore
              echo "files=$(find . -path ./lost+found -prune -o -type f -print | wc -l)"
              find . -path ./lost+found -prune -o -type f -exec sha256sum {} + | sort -k2
          volumeMounts:
            - name: restore
              mountPath: /restore
              readOnly: true
      volumes:
        - name: restore
          persistentVolumeClaim:
            claimName: thelounge-restore-test
