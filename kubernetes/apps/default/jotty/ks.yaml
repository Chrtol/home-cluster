---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jotty
  namespace: &ns default
spec:
  targetNamespace: *ns
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: authentik
      namespace: security
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
  path: ./kubernetes/apps/default/jotty/app
  components:
    - ../../../../components/gatus/external
    - ../../../../components/ceph-rbd
    - ../../../../components/volsync
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      CEPH_RBD_CAPACITY: 2Gi
    substituteFrom:
    - name: cluster-secrets
      kind: Secret
