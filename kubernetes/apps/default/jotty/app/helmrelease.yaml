---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jotty
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      jotty:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/fccview/jotty
              tag: 1.15.1@sha256:f4e5bd300c9f308c66befab53a856e5ce0f7ce27f3c889a34590d59880f15175
            env:
              TZ: ${SECRET_TIMEZONE}
              NODE_ENV: production
              APP_URL: jotty.${SECRET_DOMAIN}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false  # Changed to false as the app needs to write to cache
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 15m
                memory: 105M
              limits:
                memory: 128M
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: jotty
        ports:
          http:
            port: 3000
    ingress:
      app:
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
            - *host

    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          jotty:
            app:
              - path: /app/data
                readOnly: false
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: csi-rbd-sc
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        advancedMounts:
          jotty:
            app:
              - path: /app/config
                readOnly: false
      cache:
        enabled: true
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          jotty:
            app:
              - path: /app/.next/cache
                readOnly: false
