---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reptile-tracker
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: reptile-tracker-secret
    creationPolicy: Owner
    template:
      data:
        # Application secret key (generate with: openssl rand -hex 32)
        secret-key: "{{ .REPTILE_TRACKER_SECRET_KEY }}"

        # OIDC Configuration
        oidc-client-id: "{{ .REPTILE_TRACKER_OIDC_CLIENT_ID }}"
        oidc-client-secret: "{{ .REPTILE_TRACKER_OIDC_CLIENT_SECRET }}"
        oidc-discovery-url: "{{ .REPTILE_TRACKER_OIDC_DISCOVERY_URL }}"

        # Database Configuration
        REPTILE_TRACKER__POSTGRES__HOST: &dbHost "{{ .POSTGRES_RW_SVC }}"
        REPTILE_TRACKER__POSTGRES__PORT: "5432"
        REPTILE_TRACKER__POSTGRES__USER: &dbUser "{{ .REPTILE_TRACKER_POSTGRES_USER }}"
        REPTILE_TRACKER__POSTGRES__PASSWORD: &dbPass "{{ .REPTILE_TRACKER_POSTGRES_PASS }}"
        REPTILE_TRACKER__POSTGRES__MAINDB: reptile_tracker_main
        REPTILE_TRACKER__POSTGRES__LOGDB: reptile_tracker_log

        # Database URL for the application (asyncpg format)
        DATABASE_URL: "postgresql+asyncpg://{{ .REPTILE_TRACKER_POSTGRES_USER }}:{{ .REPTILE_TRACKER_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/reptile_tracker_main"

        INIT_POSTGRES_DBNAME: reptile_tracker_main reptile_tracker_log
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

  dataFrom:
    - extract:
        key: reptile-tracker
    - extract:
        key: cloudnative-pg
