---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reptile-tracker
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: reptile-tracker-secret
    creationPolicy: Owner
    template:
      data:
        # Application secret key (generate with: openssl rand -hex 32)
        secret-key: "{{ .REPTILE_TRACKER_SECRET_KEY }}"

        # OIDC Configuration
        oidc-client-id: "{{ .REPTILE_TRACKER_OIDC_CLIENT_ID }}"
        oidc-client-secret: "{{ .REPTILE_TRACKER_OIDC_CLIENT_SECRET }}"
        oidc-discovery-url: "{{ .REPTILE_TRACKER_OIDC_DISCOVERY_URL }}"

  dataFrom:
    - extract:
        key: reptile-tracker
