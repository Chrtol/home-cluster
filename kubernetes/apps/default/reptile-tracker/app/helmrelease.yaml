apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reptile-tracker
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      reptile-tracker:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.1
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: reptile-tracker-secret
        containers:
          backend:
            image:
              repository: ghcr.io/chrtol/reptile-tracker-backend
              tag: main-20251206001557 # {"$imagepolicy": "default:reptile-tracker-backend:tag"}
              pullPolicy: Always
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: DATABASE_URL
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: secret-key
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-client-secret
              OIDC_DISCOVERY_URL:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-discovery-url
              OIDC_REDIRECT_URI: "https://reptile-tracker.${SECRET_DOMAIN}/auth/callback"
              FRONTEND_URL: "https://reptile-tracker.${SECRET_DOMAIN}"
              WEBHOOK_URL: ""
              REDIS_HOST: "dragonfly.database.svc.cluster.local"
              REDIS_PORT: "6379"
              REDIS_DB: "0"
              ENVIRONMENT: "production"
              SQL_ECHO: "false"
              COOKIE_SECURE: "true"
              COOKIE_HTTPONLY: "true"
              COOKIE_SAMESITE: "lax"
              ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
              REFRESH_TOKEN_EXPIRE_DAYS: "7"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
          frontend:
            image:
              repository: ghcr.io/chrtol/reptile-tracker-frontend
              tag: main-20251206001600 # {"$imagepolicy": "default:reptile-tracker-frontend:tag"}
              pullPolicy: Always
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
      celery-worker:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: RollingUpdate
        containers:
          worker:
            image:
              repository: ghcr.io/chrtol/reptile-tracker-backend
              tag: main-20251206001557 # {"$imagepolicy": "default:reptile-tracker-backend:tag"}
              pullPolicy: Always
            command: ["python", "celery_worker.py"]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: DATABASE_URL
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: secret-key
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-client-secret
              OIDC_DISCOVERY_URL:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-discovery-url
              OIDC_REDIRECT_URI: "https://reptile-tracker.${SECRET_DOMAIN}/auth/callback"
              FRONTEND_URL: "https://reptile-tracker.${SECRET_DOMAIN}"
              WEBHOOK_URL: ""
              REDIS_HOST: "dragonfly.database.svc.cluster.local"
              REDIS_PORT: "6379"
              REDIS_DB: "0"
              ENVIRONMENT: "production"
              SQL_ECHO: "false"
              COOKIE_SECURE: "true"
              COOKIE_HTTPONLY: "true"
              COOKIE_SAMESITE: "lax"
              ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
              REFRESH_TOKEN_EXPIRE_DAYS: "7"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - "test -f /proc/1/status && grep -q 'python' /proc/1/cmdline"
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - "test -f /proc/1/status && grep -q 'python' /proc/1/cmdline"
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
    service:
      backend:
        controller: reptile-tracker
        ports:
          http:
            port: 8000
            targetPort: 8000
            protocol: HTTP
            appProtocol: http
      frontend:
        controller: reptile-tracker
        ports:
          http:
            port: 80
            targetPort: 80
            protocol: HTTP
            appProtocol: http
    ingress:
      main:
        className: external
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          hajimari.io/enable: "true"
          hajimari.io/icon: mdi:snake
          hajimari.io/group: apps
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hosts:
          - host: "reptile-tracker.${SECRET_DOMAIN}"
            paths:
              - path: /api
                pathType: Prefix
                service:
                  identifier: backend
                  port: http
              - path: /auth
                pathType: Prefix
                service:
                  identifier: backend
                  port: http
              - path: /
                pathType: Prefix
                service:
                  identifier: frontend
                  port: http
        tls:
          - hosts:
              - "reptile-tracker.${SECRET_DOMAIN}"
