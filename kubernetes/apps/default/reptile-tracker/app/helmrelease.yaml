apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reptile-tracker
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      reptile-tracker:
        annotations:
          reloader.stakater.com/auto: "true"
        # Note: This app has built-in OTEL instrumentation via opentelemetry-instrument in entrypoint.sh
        # Don't use Operator auto-instrumentation - it conflicts with app's own OTEL packages
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.1
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: reptile-tracker-secret
        containers:
          backend:
            image:
              repository: ghcr.io/chrtol/reptile-tracker-backend
              tag: main-20260203001236 # {"$imagepolicy": "default:reptile-tracker-backend:tag"}
              pullPolicy: Always
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: DATABASE_URL
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: secret-key
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-client-secret
              OIDC_DISCOVERY_URL:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-discovery-url
              OIDC_REDIRECT_URI: "https://reptile-tracker.${SECRET_DOMAIN}/auth/callback"
              FRONTEND_URL: "https://reptile-tracker.${SECRET_DOMAIN}"
              WEBHOOK_URL: ""
              REDIS_HOST: "dragonfly.database.svc.cluster.local"
              REDIS_PORT: "6379"
              REDIS_DB: "1"
              ENVIRONMENT: "production"
              SQL_ECHO: "false"
              COOKIE_SECURE: "true"
              COOKIE_HTTPONLY: "true"
              COOKIE_SAMESITE: "lax"
              ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
              REFRESH_TOKEN_EXPIRE_DAYS: "7"
              # Photo storage configuration
              PHOTO_STORAGE_BACKEND: "local"
              LOCAL_STORAGE_PATH: "/app/data/photos"
              # OpenTelemetry configuration
              OTEL_SERVICE_NAME: "reptile-tracker"
              OTEL_RESOURCE_ATTRIBUTES: "service.name=reptile-tracker,service.namespace=default,app.type=reptile-management,deployment.environment=production"
              OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo-distributor.observability.svc.cluster.local:4318"
              OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
              OTEL_TRACES_EXPORTER: "otlp"
              OTEL_LOGS_EXPORTER: "none"
              OTEL_METRICS_EXPORTER: "none"
              # Critical: Propagators for trace context extraction from incoming requests
              OTEL_PROPAGATORS: "tracecontext,baggage"
              # Critical: Sampler to always continue parent traces
              OTEL_TRACES_SAMPLER: "parentbased_always_on"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
          frontend:
            image:
              repository: ghcr.io/chrtol/reptile-tracker-frontend
              tag: main-20260203001230 # {"$imagepolicy": "default:reptile-tracker-frontend:tag"}
              pullPolicy: Always
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
      celery-worker:
        annotations:
          reloader.stakater.com/auto: "true"
        # Note: This app has built-in OTEL instrumentation - don't use Operator auto-instrumentation
        replicas: 1
        strategy: RollingUpdate
        containers:
          worker:
            image:
              repository: ghcr.io/chrtol/reptile-tracker-backend
              tag: main-20260203001236 # {"$imagepolicy": "default:reptile-tracker-backend:tag"}
              pullPolicy: Always
            command: ["opentelemetry-instrument", "python", "celery_worker.py"]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: DATABASE_URL
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: secret-key
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-client-secret
              OIDC_DISCOVERY_URL:
                valueFrom:
                  secretKeyRef:
                    name: reptile-tracker-secret
                    key: oidc-discovery-url
              OIDC_REDIRECT_URI: "https://reptile-tracker.${SECRET_DOMAIN}/auth/callback"
              FRONTEND_URL: "https://reptile-tracker.${SECRET_DOMAIN}"
              WEBHOOK_URL: ""
              REDIS_HOST: "dragonfly.database.svc.cluster.local"
              REDIS_PORT: "6379"
              REDIS_DB: "1"
              ENVIRONMENT: "production"
              SQL_ECHO: "false"
              COOKIE_SECURE: "true"
              COOKIE_HTTPONLY: "true"
              COOKIE_SAMESITE: "lax"
              ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
              REFRESH_TOKEN_EXPIRE_DAYS: "7"
              # OpenTelemetry configuration
              OTEL_SERVICE_NAME: "reptile-tracker-celery"
              OTEL_RESOURCE_ATTRIBUTES: "service.name=reptile-tracker-celery,service.namespace=default,app.type=reptile-management,component=celery-worker,deployment.environment=production"
              OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo-distributor.observability.svc.cluster.local:4318"
              OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
              OTEL_TRACES_EXPORTER: "otlp"
              OTEL_LOGS_EXPORTER: "none"
              OTEL_METRICS_EXPORTER: "none"
              # Critical: Propagators for trace context extraction
              OTEL_PROPAGATORS: "tracecontext,baggage"
              # Critical: Sampler to always continue parent traces
              OTEL_TRACES_SAMPLER: "parentbased_always_on"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - "test -f /proc/1/status && grep -q 'python' /proc/1/cmdline"
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - "test -f /proc/1/status && grep -q 'python' /proc/1/cmdline"
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
    persistence:
      photos:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: reptile-tracker
        advancedMounts:
          reptile-tracker:
            backend:
              - path: /app/data/photos
    service:
      backend:
        controller: reptile-tracker
        ports:
          http:
            port: 8000
            targetPort: 8000
            protocol: HTTP
            appProtocol: http
      frontend:
        controller: reptile-tracker
        ports:
          http:
            port: 80
            targetPort: 80
            protocol: HTTP
            appProtocol: http
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["reptile-tracker.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - identifier: backend
                port: 8000
          - matches:
              - path:
                  type: PathPrefix
                  value: /auth
            backendRefs:
              - identifier: backend
                port: 8000
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: frontend
                port: 80
