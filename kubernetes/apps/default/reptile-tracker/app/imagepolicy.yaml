---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: reptile-tracker-backend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: reptile-tracker-backend
  policy:
    alphabetical:
      order: asc
  filterTags:
    pattern: '^main-[a-f0-9]+$'
    extract: '$0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: reptile-tracker-frontend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: reptile-tracker-frontend
  policy:
    alphabetical:
      order: asc
  filterTags:
    pattern: '^main-[a-f0-9]+$'
    extract: '$0'
