type: Opaque
stringData:
  database-url: "postgresql+asyncpg://reptile_tracker:CHANGE_ME@reptile-tracker-postgres-rw.database.svc.cluster.local:5432/reptile_tracker"
  secret-key: "CHANGE_ME_GENERATE_SECURE_KEY"
