---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reptile-tracker-envoy-test
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
spec:
  parentRefs:
    - name: external
      namespace: network
      kind: Gateway
  hostnames:
    - reptile-tracker-test.${SECRET_DOMAIN}
  rules:
    # API routes to backend
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: reptile-tracker-backend
          port: 8000
    # Auth routes to backend
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: reptile-tracker-backend
          port: 8000
    # All other routes to frontend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: reptile-tracker-frontend
          port: 80
