---
# Separate GitRepository with SSH write access for image automation
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: home-cluster-write
  namespace: default
spec:
  interval: 1m
  url: ssh://git@github.com/chrtol/home-cluster.git
  ref:
    branch: main
  secretRef:
    name: flux-system-ssh
