---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: node-red
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: node-red-secret
    creationPolicy: Owner
    template:
      data:
        NODE_RED_CREDENTIAL_SECRET: "{{ .NODE_RED_CREDENTIAL_SECRET }}"
        # OIDC URLs - templated here because settings.js can't use Flux substitution
        # Note: clientID, clientSecret, issuerURL, redirectURL come from node-red-oidc-authentik-application secret
        NODE_RED_OIDC_AUTH_URL: "https://sso.${SECRET_DOMAIN}/application/o/authorize/"
        NODE_RED_OIDC_TOKEN_URL: "https://sso.${SECRET_DOMAIN}/application/o/token/"
        NODE_RED_OIDC_USERINFO_URL: "https://sso.${SECRET_DOMAIN}/application/o/userinfo/"
  dataFrom:
    - extract:
        key: node-red
