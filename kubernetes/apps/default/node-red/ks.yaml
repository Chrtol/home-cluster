---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app node-red
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/ceph-rbd
    - ../../../../components/oidc-application
  path: ./kubernetes/apps/default/node-red/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      CEPH_RBD_CAPACITY: 1Gi
      # OIDC component variables
      GROUP: "Default"
      SUBDOMAIN: nodered
      DISPLAY_NAME: "Node-RED"
      DESCRIPTION: "Low-code programming for event-driven applications"
      REDIRECT_PATH: "/auth/strategy/callback"
      OIDC_SECRET_NAMESPACE: default
    substituteFrom:
    - name: cluster-secrets
      kind: Secret
