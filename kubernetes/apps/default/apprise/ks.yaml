---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app apprise
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
    - name: external-secrets
      namespace: external-secrets
  components:
    - ../../../../components/gatus/guarded
    - ../../../../components/ceph-cbd
  path: ./kubernetes/apps/default/apprise/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      CEPH_RBD_CAPACITY: 1Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret