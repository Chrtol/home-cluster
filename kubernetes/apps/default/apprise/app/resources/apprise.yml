version: 1

# Rendered by the ExternalSecret via templateFrom, using ESO Go-template syntax
# (values from the pushover + apprise 1Password items). Do NOT use flux envsubst
# dollar-brace placeholders here: flux post-build substitution claims them first
# and fails strict mode, since the keys are not in cluster-secrets. Both engines
# scan the whole ConfigMap as plain text, so neither placeholder style may appear
# even inside a comment like this one.
urls:
  - pover://{{ .PUSHOVER_USER_KEY }}@{{ .APPRISE_PUSHOVER_API_TOKEN }}