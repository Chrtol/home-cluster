---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app zipline
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  # init-db initContainer + db.home.arpa/postgres pod label come from the cnpg component
  valuesFrom:
    - kind: ConfigMap
      name: ${APP}-cnpg-values
  values:
    controllers:
      zipline:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/diced/zipline
              tag: 4.7.0@sha256:526fa08d2d3cf46bd959b2008987ca8d2a38b1ba840991b68cd9ff4b8c6a3fab
            env:
              TZ: ${SECRET_TIMEZONE}
              CORE_PORT: &port 3000
              CORE_HOSTNAME: 0.0.0.0
              # Generate absolute https links (behind the gateway) for shares.
              CORE_RETURN_HTTPS_URLS: "true"
              # Upload spool (every upload lands here before the S3 PUT, plus
              # chunk reassembly and ffmpeg thumbnail scratch). Zipline's default
              # is ./uploads/.tmp -> /zipline/uploads/.tmp, which readOnlyRootFilesystem
              # makes uncreatable, so this MUST point at the emptyDir below.
              CORE_TEMP_DIRECTORY: /tmp/zipline
              # Stamped onto every upload that doesn't send x-zipline-deletes-at;
              # pick "Never" in the upload options to keep one indefinitely.
              # Applied at upload time only -- pre-existing files never expire.
              # Sweep runs on tasks.deleteInterval (30m default), so deletion is lazy.
              # The companion "Max Expiration" has no env var in v4.x -- UI only.
              FILES_DEFAULT_EXPIRATION: 30d
              # Zipline marks env-sourced settings as "tampered" and disables the
              # matching Server Settings inputs, so these six are now git-only.
              PWA_ENABLED: "true"
              PWA_TITLE: Zipline
              PWA_SHORT_NAME: Zipline
              PWA_DESCRIPTION: Zipline
              PWA_THEME_COLOR: "#000000"
              PWA_BACKGROUND_COLOR: "#000000"
              # Object storage: Garage S3 (on the NAS).
              DATASOURCE_TYPE: s3
              DATASOURCE_S3_FORCE_PATH_STYLE: "true"
              # OIDC: allow first-login to auto-provision the account and send
              # users straight to Authentik instead of the local login form.
              # Bypass the local login page entirely -> redirect straight to Authentik.
              # NOTE: this env var is authoritative; the in-app "Bypass Local Login"
              # toggle is locked/ignored because the value comes from the environment
              # (Zipline's declarative-override behaviour). Only works with exactly one
              # OAuth provider enabled -- we have one (OIDC/Authentik).
              FEATURES_OAUTH_REGISTRATION: "true"
              OAUTH_BYPASS_LOCAL_LOGIN: "true"
              # Client id/secret remapped from the component-generated secret.
              OAUTH_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: zipline-oidc-authentik-application
                    key: clientID
              OAUTH_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: zipline-oidc-authentik-application
                    key: clientSecret
              # S3 creds/bucket/endpoint remapped from the s3-bucket secret.
              DATASOURCE_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: zipline-s3-credentials
                    key: ACCESS_KEY
              DATASOURCE_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: zipline-s3-credentials
                    key: SECRET_KEY
              DATASOURCE_S3_BUCKET:
                valueFrom:
                  secretKeyRef:
                    name: zipline-s3-credentials
                    key: BUCKET
              DATASOURCE_S3_ENDPOINT:
                valueFrom:
                  secretKeyRef:
                    name: zipline-s3-credentials
                    key: ENDPOINT
              DATASOURCE_S3_REGION:
                valueFrom:
                  secretKeyRef:
                    name: zipline-s3-credentials
                    key: REGION
            # CORE_SECRET, DATABASE_URL, and the static OAUTH_OIDC_* URLs.
            envFrom:
              - secretRef:
                  name: zipline-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["zipline.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # Zipline buffers uploads to a temp dir before shipping to S3.
      # Nothing here is authoritative -- chunked-upload state lives in process
      # memory, so a restart loses the session either way. Wiping on restart is
      # a feature: v4.6.5 has no orphan sweep, so stranded chunks would otherwise
      # accumulate until someone hits Server Actions -> Clear Temporary Files.
      # Capped because this is the node's ephemeral disk, shared with everything else.
      tmp:
        type: emptyDir
        sizeLimit: 4Gi
        globalMounts:
          - path: /tmp
      # favicon.js resolves PUBLIC_DIR as $PWD/public and reads the icons ONCE at
      # startup, so this has to be mounted before the process boots, not injected later.
      public:
        type: configMap
        name: zipline-public
        globalMounts:
          - path: /zipline/public
            readOnly: true
