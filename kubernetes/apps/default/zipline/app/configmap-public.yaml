---
# The v4.6.5 image never COPYs the repo's public/ dir into the runtime stage
# (upstream Dockerfile bug), so favicon.js finds nothing at $PWD/public and every
# /favicon-*.png 404s -- which would leave PWA_ENABLED with an icon-less manifest
# that Chrome refuses to install. These are the upstream assets, verbatim.
# Drop this once an image ships public/ (check: `ls /zipline/public` in the pod).
apiVersion: v1
kind: ConfigMap
metadata:
  name: zipline-public
binaryData:
  favicon-16x16.png: 
  favicon-32x32.png: 
  favicon-64x64.png: 
  favicon-128x128.png: 
  favicon-512x512.png: 
