---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zipline
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zipline-secret
    template:
      engineVersion: v2
      data:
        # Core: 32+ char secret used to sign sessions/tokens.
        CORE_SECRET: "{{ .ZIPLINE_CORE_SECRET }}"

        # PostgreSQL (Prisma).
        # sslmode=disable on purpose: Prisma verifies TLS chains and would die with
        # a self-signed-cert error against CNPG's CA. The connection is to the
        # in-cluster RW service over the pod network, so plaintext is acceptable.
        # (Same reasoning as the other Prisma/node-pg apps in this repo.)
        DATABASE_URL: "postgres://{{ .ZIPLINE_POSTGRES_USER }}:{{ .ZIPLINE_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/zipline?sslmode=disable"

        # OIDC static URLs (Authentik). Client id/secret are NOT here -- they come
        # from the component-generated zipline-oidc-authentik-application secret,
        # remapped to Zipline's env var names via secretKeyRef in the HelmRelease.
        OAUTH_OIDC_AUTHORIZE_URL: "https://sso.${SECRET_DOMAIN}/application/o/authorize/"
        OAUTH_OIDC_TOKEN_URL: "https://sso.${SECRET_DOMAIN}/application/o/token/"
        OAUTH_OIDC_USERINFO_URL: "https://sso.${SECRET_DOMAIN}/application/o/userinfo/"
        OAUTH_OIDC_REDIRECT_URI: "https://zipline.${SECRET_DOMAIN}/api/auth/oauth/oidc"
  dataFrom:
    # Provides POSTGRES_RW_SVC
    - extract:
        key: cloudnative-pg
    # Provides ZIPLINE_CORE_SECRET, ZIPLINE_POSTGRES_USER, ZIPLINE_POSTGRES_PASS
    - extract:
        key: zipline
