---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openflow
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  values:
    controllers:
      openflow:
        replicas: 1
        strategy: RollingUpdate

        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/chrtol/openflow
              tag: latest
              
            resources:
              requests:
                cpu: 15m
                memory: 105M
              limits:
                memory: 128M

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
            env:
              TZ: ${SECRET_TIMEZONE}

    service:
      app:
        ports:
          http:
            port: 80

    persistence:
      nginx-cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
            subPath: cache
      nginx-run:
        type: emptyDir
        globalMounts:
          - path: /var/run
            subPath: run

    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
        hosts:
          - host: &host "openflow.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host