---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-envoy-test
  namespace: default
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      kind: Gateway
  hostnames:
    - echo-test.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo
          port: 80