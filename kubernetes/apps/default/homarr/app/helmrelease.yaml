---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      homarr:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.1
              pullPolicy: IfNotPresent
            envFrom: &envFrom
            - secretRef:
                name: homarr-secret
        containers:
          app:
            image:
              repository: ghcr.io/ajnart/homarr
              tag: 0.15.4
            env:
              TZ: ${SECRET_TIMEZONE}
              DB_DIALECT: postgresql
              DB_DRIVER: node-postgres  # Some versions check this
              AUTH_PROVIDER: oidc
              AUTH_OIDC_URI: https://sso.${SECRET_DOMAIN}/application/o/homarr/.well-known/openid-configuration
              AUTH_OIDC_CLIENT_NAME: Authentik
              AUTH_OIDC_REDIRECT_URI: https://start.${SECRET_DOMAIN}/api/auth/callback/oidc
              AUTH_OIDC_SCOPE_OVERWRITE: "openid email profile groups"
              HOSTNAME: 0.0.0.0
              PORT: &port 7575
              NODE_ENV: production
              # SKIP_MIGRATION: "false"  # Explicitly run migrations
              NEXTAUTH_URL: https://start.${SECRET_DOMAIN}
              REDIS_IS_EXTERNAL: true
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 200Mi
              limits:
                memory: 500Mi
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: homarr
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    ingress:
      app:
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hosts:
          - host: &host start.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
            - *host
    persistence:
      config:
        existingClaim: homarr
        globalMounts:
          - path: /app/data/configs
            subPath: configs
          - path: /app/public/icons
            subPath: icons
          - path: /data
            subPath: data