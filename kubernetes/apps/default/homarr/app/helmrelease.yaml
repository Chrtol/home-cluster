---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: homarr-labs
    namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: homarr
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: homarr
              spec:
                template:
                  spec:
                    initContainers:
                      - name: init-db
                        image: ghcr.io/home-operations/postgres-init:18.1
                        envFrom:
                          - secretRef:
                              name: homarr-secret

  values:
    rbac:
      enabled: true
    env:
      TZ: ${SECRET_TIMEZONE}
      BASE_URL: https://start.${SECRET_DOMAIN}
      AUTH_PROVIDERS: oidc
      AUTH_OIDC_URI: https://sso.${SECRET_DOMAIN}/application/o/homarr/.well-known/openid-configuration
      AUTH_OIDC_CLIENT_NAME: authentik
      AUTH_OIDC_REDIRECT_URI: https://start.${SECRET_DOMAIN}/api/auth/callback/oidc
      AUTH_OIDC_SCOPE_OVERWRITE: "openid email profile groups"
      AUTH_OIDC_GROUPS_ATTRIBUTE: groups
      AUTH_LOGOUT_REDIRECT_URL: https://sso.${SECRET_DOMAIN}/application/o/homarr/end-session/
      AUTH_OIDC_AUTO_LOGIN: true
      PORT: 7575
      NODE_ENV: production
      NEXTAUTH_URL: https://start.${SECRET_DOMAIN}
      # Redis configuration - put directly in env since chart might not support it in envSecrets
      REDIS_IS_EXTERNAL: true
      REDIS_HOST: dragonfly.database.svc.cluster.local
      REDIS_PORT: "6379"
      REDIS_DATABASE_INDEX: "2"

    replicas: 1

    deploymentStrategy:
      type: Recreate

    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      httpGet:
        path: /api/health/live
        port: 7575

    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      httpGet:
        path: /api/health/ready
        port: 7575

    lifecycle:
      preStop:
        exec:
          command: ["/bin/sh", "-c", "sleep 10"]

    ingress:
      enabled: false
    podSecurityContext:
      fsGroup: 0
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      allowPrivilegeEscalation: false
    httproute:
      enabled: true
      parentRefs:
          - name: internal
            namespace: network
            sectionName: https

      hostnames:
        - start.${SECRET_DOMAIN}
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: homarr
              port: 7575

    database:
      type: postgresql

    # Secrets are automatically picked up by the chart with their standard names:
    # - auth-oidc-secret (OIDC authentication)
    # - db-secret (Database connection)
    # - db-encryption (Database encryption key)

    persistence:
      homarrDatabase:
        enabled: false  # Using external PostgreSQL
      homarrImages:
        enabled: true
        existingClaim: homarr
        mountPath: /images
        subPath: images
      homarrConfigs:
        enabled: true
        existingClaim: homarr
        mountPath: /app/data/configs
        subPath: configs
      homarrIcons:
        enabled: true
        existingClaim: homarr
        mountPath: /app/public/icons
        subPath: icons