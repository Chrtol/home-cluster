---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: homarr-labs
    namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          # gatus-sidecar: the homarr-labs chart doesn't propagate httproute
          # annotations, so stamp the guarded endpoint annotation onto the rendered
          # HTTPRoute here. homarr is on the external gateway but was deliberately
          # DNS-checked, so override the external-gateway HTTP default.
          - target:
              kind: HTTPRoute
              name: homarr
            patch: |-
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: homarr
                annotations:
                  gatus.home-operations.com/endpoint: |
                    group: guarded
                    guarded: true
          - target:
              kind: Deployment
              name: homarr
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: homarr
                annotations:
                  # DB_URL is injected from db-secret via secretKeyRef, which is only
                  # read at pod start. Without this, a changed db-url sits in the
                  # secret while the running pod keeps the old value indefinitely.
                  reloader.stakater.com/auto: "true"
              spec:
                template:
                  spec:
                    initContainers:
                      - name: init-db
                        image: ghcr.io/home-operations/postgres-init:18.4
                        envFrom:
                          - secretRef:
                              name: homarr-secret

  values:
    image:
      repository: ghcr.io/homarr-labs/homarr
      tag: v1.71.0@sha256:ae875bfbcfd6d5cb5d9f40ba656920373c058d73ca3f360d2ffea835c7b76fa9
      pullPolicy: IfNotPresent


    rbac:
      enabled: true
    env:
      TZ: ${SECRET_TIMEZONE}
      BASE_URL: https://start.${SECRET_DOMAIN}
      AUTH_PROVIDERS: oidc
      AUTH_OIDC_URI: https://sso.${SECRET_DOMAIN}/application/o/homarr/.well-known/openid-configuration
      AUTH_OIDC_CLIENT_NAME: authentik
      AUTH_OIDC_REDIRECT_URI: https://start.${SECRET_DOMAIN}/api/auth/callback/oidc
      AUTH_OIDC_SCOPE_OVERWRITE: "openid email profile groups"
      AUTH_OIDC_GROUPS_ATTRIBUTE: groups
      AUTH_LOGOUT_REDIRECT_URL: https://sso.${SECRET_DOMAIN}/application/o/homarr/end-session/
      AUTH_OIDC_ISSUER: https://sso.${SECRET_DOMAIN}/application/o/homarr/
      AUTH_OIDC_AUTO_LOGIN: true
      NODE_ENV: production
      NEXTAUTH_URL: https://start.${SECRET_DOMAIN}
      REDIS_IS_EXTERNAL: true
      REDIS_HOST: dragonfly.database.svc.cluster.local
      REDIS_PORT: "6379"
      REDIS_DATABASE_INDEX: "2"

    replicas: 1

    strategyType: Recreate

    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5

    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    startupProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

    lifecycle:
      preStop:
        exec:
          command: ["/bin/sh", "-c", "sleep 10"]

    podSecurityContext:
      fsGroup: 0
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      allowPrivilegeEscalation: false

    resources:
      requests:
        cpu: 78m
        memory: 896Mi
      limits:
        cpu: 100m
        memory: 1280Mi

    httproute:
      enabled: true
      parentRefs:
          - name: external
            namespace: network
            sectionName: https
      hostnames:
        - start.${SECRET_DOMAIN}
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: homarr
              port: 7575

    database:
      type: postgresql

    # Secrets are automatically picked up by the chart with their standard names:
    # - auth-oidc-secret (OIDC authentication)
    # - db-secret (Database connection)
    # - db-encryption (Database encryption key)

    persistence:
      homarrDatabase:
        enabled: false  # Using external PostgreSQL
      homarrImages:
        enabled: true
        existingClaim: homarr
        mountPath: /images
        subPath: images
      homarrConfigs:
        enabled: true
        existingClaim: homarr
        mountPath: /app/data/configs
        subPath: configs
      homarrIcons:
        enabled: true
        existingClaim: homarr
        mountPath: /app/public/icons
        subPath: icons