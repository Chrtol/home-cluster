---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homarr-secret
    template:
      engineVersion: v2
      data:
        # For postgres-init container
        DATABASE_HOST: &dbHost "{{ .POSTGRES_RW_SVC }}"
        DATABASE_PORT: &dbPort "5432"
        DATABASE_NAME: &dbName homarr
        DATABASE_USER: &dbUser "{{ .HOMARR_POSTGRES_USER }}"
        DATABASE_PASSWORD: &dbPass "{{ .HOMARR_POSTGRES_PASS }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_PORT: *dbPort
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: homarr
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: auth-oidc-secret
    template:
      engineVersion: v2
      data:
        oidc-client-id: "{{ .HOMARR_AUTHENTIK_CLIENT_ID }}"
        oidc-client-secret: "{{ .HOMARR_AUTHENTIK_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: homarr
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: db-secret
    template:
      engineVersion: v2
      data:
        db-url: "postgresql://{{ .HOMARR_POSTGRES_USER }}:{{ .HOMARR_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}:5432/homarr?sslmode=require"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: homarr
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-db-encryption
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: db-encryption
    template:
      engineVersion: v2
      data:
        db-encryption-key: "{{ .HOMARR_SECRET_ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: homarr