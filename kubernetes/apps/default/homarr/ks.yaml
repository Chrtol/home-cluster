---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app homarr
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudnative-pg-cluster-v17
      namespace: database
    - name: authentik
      namespace: security
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
  interval: 1h
  path: ./kubernetes/apps/default/homarr/app
  components:
    - ../../../../components/gatus/guarded
    - ../../../../components/ceph-rbd
  postBuild:
    substitute:
      APP: *app
      CEPH_RBD_CAPACITY: 2Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false