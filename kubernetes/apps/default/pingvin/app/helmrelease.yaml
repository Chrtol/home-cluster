---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pingvin
spec:
  chartRef:
    kind: OCIRepository
    name: app-template-upgrade
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      pingvin:
        containers:
          app:
            image:
              repository: stonith404/pingvin-share
              tag: v1.13.0
            env:
              TRUST_PROXY: "true"
              TZ: ${SECRET_TIMEZONE}
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000
    ingress:
      app:
        className: internal
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app 
                  port: http
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          main:
            main:
              - path: /opt/app/backend/data
      uploads:
        type: nfs
        server: nas.cftollefsen.com
        path: /mnt/truenas/cf-nas/applications/pingvin
        advancedMounts:
          main:
            main:
              - path: /opt/app/backend/data