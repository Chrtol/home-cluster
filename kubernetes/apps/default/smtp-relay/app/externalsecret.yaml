---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-relay
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: smtp-relay-secret
    template:
      data:
        # Mailjet reuses its REST API credentials for SMTP — the API key is the
        # SMTP username and the secret key is the password. There is no
        # SMTP-only credential pair, and the account login will not work.
        MAILJET_API_KEY: "{{ .MAILJET_API_KEY }}"
        MAILJET_SECRET_KEY: "{{ .MAILJET_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: mailjet