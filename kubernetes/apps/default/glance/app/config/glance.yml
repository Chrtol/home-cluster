server:
  proxied: true

theme:
  background-color: 240 21 15
  contrast-multiplier: 1.2
  primary-color: 217 92 83
  positive-color: 115 54 76
  negative-color: 347 70 65
pages:
  - name: Startpage
    width: slim
    # hide-desktop-navigation: true
    center-vertically: true
    columns:
    - size: full
      widgets:
        - type: search
          autofocus: true

        - type: monitor
          cache: 1m
          title: Services
          sites:
              - title: Home Assistant
                url: https://hass.${SECRET_DOMAIN}
                icon: si:homeassistant
              - title: Plex
                url: https://plex.${SECRET_DOMAIN}/web/index.html
                icon: si:plex
              - title: Audiobookshelf
                url: https://audiobooks.${SECRET_DOMAIN}
                icon: si:audiobookshelf
              - title: Jellyseerr
                url: https://request.${SECRET_DOMAIN}
                icon: di:jellyseerr
              - title: Proxmox
                url: https://proxmox.${SECRET_DOMAIN}
                icon: si:proxmox
              - title: Immich
                url: https://photos.${SECRET_DOMAIN}
                icon: si:immich               

        - type: bookmarks
          groups:
            - title: General
              links:
                - title: Gmail
                  url: https://mail.google.com/mail/u/0/
                - title: Github
                  url: https://github.com/
            - title: Entertainment
              links:
                - title: YouTube
                  url: https://www.youtube.com/
                - title: Twitch
                  url: https://www.twitch.tv/
                - title: Plex
                  url: https://www.plex.${SECRET_DOMAIN}/
            - title: Social
