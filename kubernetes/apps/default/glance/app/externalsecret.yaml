---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name glance
  namespace: default
spec:
  refreshInterval: "30m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: glance-secret
    creationPolicy: Owner
    template:
      data:
        engineVersion: v2
        
        ## Media
        # GLANCE_VAR_PLEX_KEY: "{{ .PLEX_TOKEN }}"
        # GLANCE_VAR_JELLYSEERR_KEY: "{{ .JELLYSEERR_API_KEY }}"

        ## Infrastructure
        GLANCE_VAR_PROXMOX_API_TOKEN_ID: "{{ .PROXMOX_HOMEPAGE_API_TOKEN_ID }}"
        GLANCE_VAR_PROXMOX_API_SECRET: "{{ .PROXMOX_HOMEPAGE_API_SECRET }}"

  dataFrom:
    - extract:
        key: proxmox
