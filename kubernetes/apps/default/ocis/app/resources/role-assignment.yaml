---
# Merged into /etc/ocis/ocis.yaml by an init container, NOT mounted as a config file of
# its own: `ocis server` parses only the global config, so a /etc/ocis/proxy.yaml is
# silently ignored and the proxy keeps the `default` driver with nothing in the logs.
# role_mapping is why this has to be a file at all -- it has no environment variable.
proxy:
  role_assignment:
    driver: oidc
    oidc_role_mapper:
      role_claim: groups
      # Order is privilege order: ocis assigns one role and stops at the first entry
      # matching any of the user's groups, so admin must precede user. An unmatched
      # user is rejected outright, not defaulted, so every group with access to ocis
      # needs an entry here. claim_value is an anchored regex.
      role_mapping:
        - role_name: admin
          claim_value: "authentik Admins"
        - role_name: user
          claim_value: "bp-ocis-users"
