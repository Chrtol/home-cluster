---
# ocis' built-in CSP allows connect-src 'self' only, which blocks the web app from
# fetching its OIDC discovery document once the IdP is on another origin. The browser
# never sends the request, so every access-log line stays 200 and nothing is logged.
#
# Any other origin the web app must reach belongs in connect-src AND frame-src here.
# script-src has no 'unsafe-eval', matching upstream: a library trips it, but the
# violation does not block login.
directives:
  child-src:
    - "'self'"
  connect-src:
    - "'self'"
    - "blob:"
    - "https://raw.githubusercontent.com/owncloud/awesome-ocis/"
    - "https://marketplace.owncloud.com/"
    - "https://sso.${SECRET_DOMAIN}/"
    # The editor holds a websocket for the session, and ws: is connect-src.
    - "https://office.${SECRET_DOMAIN}/"
    - "wss://office.${SECRET_DOMAIN}/"
  default-src:
    - "'none'"
  font-src:
    - "'self'"
    - "data:"
  # Upstream ships 'none', which also stops ocis framing its own
  # /oidc-silent-redirect.html. 'self' still refuses every cross-origin frame.
  frame-ancestors:
    - "'self'"
  frame-src:
    - "'self'"
    - "blob:"
    - "https://embed.diagrams.net/"
    # The MFA re-auth path still frames the IdP, even though refresh tokens made the
    # ordinary renewal frameless.
    - "https://sso.${SECRET_DOMAIN}/"
    - "https://office.${SECRET_DOMAIN}/"
  img-src:
    - "'self'"
    - "data:"
    - "blob:"
    - "https://raw.githubusercontent.com/owncloud/awesome-ocis/"
    - "https://marketplace.owncloud.com/"
  manifest-src:
    - "'self'"
  media-src:
    - "'self'"
  object-src:
    - "'self'"
    - "blob:"
  script-src:
    - "'self'"
    - "'unsafe-inline'"
  style-src:
    - "'self'"
    - "'unsafe-inline'"
