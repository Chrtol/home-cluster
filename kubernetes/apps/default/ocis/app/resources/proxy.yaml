---
# Role assignment from Authentik group membership. This lives in a file rather than
# the HelmRelease because role_mapping is the one setting ocis exposes ONLY via
# config file -- there is no PROXY_ROLE_ASSIGNMENT_* env var for the list.
#
# The whole block is here, and PROXY_ROLE_ASSIGNMENT_DRIVER is deliberately absent
# from the HelmRelease: the proxy parses this file first and decodes env afterwards,
# so any env var would silently win over what is written here.
#
# No extra Authentik scope is needed. The stock `profile` mapping already returns
# `groups` as the member group display names, so "authentik Admins" is matched as-is.
proxy:
  role_assignment:
    driver: oidc
    oidc_role_mapper:
      role_claim: groups
      # ORDER IS THE PRIVILEGE ORDER. ocis assigns a single role and takes the FIRST
      # entry that matches any of the user's groups, so admin must precede user --
      # being in both groups otherwise lands you as a plain user.
      #
      # Every group that can reach ocis must appear here. A user whose groups match
      # nothing is rejected outright with "no role in claim maps to an ocis role",
      # so adding an OIDC_ACCESS_GROUP to the ks without adding it below locks that
      # group out of the app entirely. These two are what the oidc-application
      # component binds for access.
      #
      # claim_value is also compiled as an anchored regex, so a group name
      # containing regex metacharacters would need escaping.
      role_mapping:
        - role_name: admin
          claim_value: "authentik Admins"
        - role_name: user
          claim_value: "bp-ocis-users"
