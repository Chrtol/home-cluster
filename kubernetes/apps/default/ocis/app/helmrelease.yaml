---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ocis
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      ocis:
        annotations:
          # The clientID arrives by secretKeyRef, which is read once at container
          # start -- without this a regenerated Authentik client leaves ocis holding
          # the old ID until someone notices the login is broken.
          reloader.stakater.com/auto: "true"
        initContainers:
          # `ocis init` writes /etc/ocis/ocis.yaml with 16 generated values -- five
          # UUIDs (system/admin user, graph application, storage mount, service
          # account) and eleven secrets (JWT, transfer, machine-auth, WOPI, the IDM
          # service passwords...). Guarded on the file rather than upstream's
          # `ocis init || true`, which also swallows a genuine init failure and leaves
          # the pod to fail later and less clearly.
          init-config:
            image: &image
              repository: docker.io/owncloud/ocis
              tag: 8.2.0@sha256:1b9e3945890f2cb57283d15d3937a2d8180036db003bec4cc499bf95a2c82446
            command:
              - /bin/sh
              - -c
              - "[ -f /etc/ocis/ocis.yaml ] || ocis init"
            securityContext: &hardened
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          # The role mapping has to live inside ocis.yaml: `ocis server` parses only
          # the global config, so a per-service proxy.yaml is never read. Deep-merging
          # keeps the generated secrets and is a no-op when the values already match,
          # and `ocis init` above skips an initialised volume, so the block survives
          # every restart.
          merge-role-config:
            image:
              repository: ghcr.io/mikefarah/yq
              tag: 4.53.6@sha256:cfc4eee658595834ef304eadb0c3ea721f3b7cb6404ad8b7cb909cc5b5145b23
            args:
              - -i
              - '. *= load("/config-fragment/role-assignment.yaml")'
              - /etc/ocis/ocis.yaml
            securityContext: *hardened
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          app:
            image: *image
            # No command: the image's entrypoint is /usr/bin/ocis with `server` as its
            # default argument, and init now happens above.
            env:
              TZ: ${SECRET_TIMEZONE}
              # Single canonical host. Every OIDC redirect, WOPI callback and asset
              # URL is built from this, so ocis cannot be reached on a second
              # hostname -- same constraint as karakeep's NEXTAUTH_URL, which is why
              # there is no internal route below.
              OCIS_URL: https://drive.${SECRET_DOMAIN}
              OCIS_LOG_LEVEL: info
              OCIS_LOG_COLOR: "false"
              # Envoy terminates TLS; ocis serves plaintext behind it.
              PROXY_TLS: "false"
              OCIS_INSECURE: "false"
              # Drop the bundled LibreGraph Connect IdP. Upstream: "mainly targeted at
              # smaller installations. For larger setups it is recommended to replace
              # IDP with an external OpenID Connect Provider."
              OCIS_EXCLUDE_RUN_SERVICES: idp
              OCIS_OIDC_ISSUER: https://sso.${SECRET_DOMAIN}/application/o/ocis/
              PROXY_OIDC_REWRITE_WELLKNOWN: "true"
              # Without this the built-in CSP allows connect-src 'self' only, and the
              # browser refuses to fetch the discovery document from Authentik.
              PROXY_CSP_CONFIG_FILE_LOCATION: /etc/ocis/csp.yaml
              # offline_access is what makes the session outlive the 5-minute access
              # token. oidc-client-ts only takes the refresh-grant path when a refresh
              # token is actually present; otherwise it renews through a hidden iframe
              # pointed at Authentik, which the CSP below blocks -- the renewal fails
              # in the browser with no server-side trace and the user is bounced back
              # to the login screen. The provider must offer the scope too: see
              # OIDC_EXTRA_SCOPE in ks.yaml.
              WEB_OIDC_SCOPE: openid profile email offline_access
              WEB_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: ocis-oidc-authentik-application
                    key: clientID
              # No local user store: the first login through Authentik creates the
              # ocis account from the token's claims.
              PROXY_AUTOPROVISION_ACCOUNTS: "true"
              PROXY_USER_OIDC_CLAIM: preferred_username
              PROXY_USER_CS3_CLAIM: username
              GRAPH_USERNAME_MATCH: "none"
              # Roles come from Authentik group membership -- see resources/proxy.yaml.
              # PROXY_ROLE_ASSIGNMENT_DRIVER is intentionally NOT set here: env is
              # decoded after that file, so setting it would override the file.
              #
              # False so the OIDC mapping is the only thing that assigns a role;
              # otherwise a default role is handed out before the claim is consulted.
              GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
              # Blobs and metadata both on the PVC. `s3ng` would put blobs in Garage,
              # but then a restore pairs a PVC snapshot with a bucket captured at a
              # different moment.
              STORAGE_USERS_DRIVER: ocis
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9200
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # ocis starts ~25 services in one process and runs init on first boot;
              # a cold start on an empty volume is far slower than a warm one.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext: *hardened
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # Single Go binary hosting every service, including an embedded NATS.
                # Thumbnailing and search indexing are the spiky parts.
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      # External only, and deliberately no internal twin: OCIS_URL is a single
      # canonical host (see the env comment above). LAN clients hairpin out to the
      # VPS and back, as karakeep already does.
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
          # Unauthenticated GET / returns the web app shell, which redirects to
          # Authentik rather than 200-ing.
          gatus.home-operations.com/endpoint: |
            group: external
            conditions:
              - "[STATUS] < 400"
        hostnames: ["drive.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          ocis:
            # ocis.yaml holds the transfer secret and the storage mount ID. Lose
            # this subPath and the data in the other one is unreadable, so both
            # live on one volume and ride the same kopiur snapshot.
            init-config: &volume-mounts
              - path: /etc/ocis
                subPath: config
              - path: /var/lib/ocis
                subPath: data
            # Writes ocis.yaml in place, so this one is not read-only.
            merge-role-config:
              - path: /etc/ocis
                subPath: config
            app: *volume-mounts
      config-files:
        type: configMap
        name: ocis-config
        advancedMounts:
          ocis:
            # csp.yaml IS read as a config file, mounted over the PVC's config
            # subPath so it sits beside the generated ocis.yaml without hiding it.
            app:
              - path: /etc/ocis/csp.yaml
                subPath: csp.yaml
                readOnly: true
            # role-assignment.yaml is merged INTO ocis.yaml instead, so it is staged
            # outside /etc/ocis -- dropping it in there would just be an unread file.
            merge-role-config:
              - path: /config-fragment/role-assignment.yaml
                subPath: role-assignment.yaml
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
