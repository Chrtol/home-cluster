---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ocis
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      ocis:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Guarded on the file rather than upstream's `ocis init || true`, which also
          # swallows a real init failure.
          init-config:
            image: &image
              repository: docker.io/owncloud/ocis
              tag: 8.2.0@sha256:1b9e3945890f2cb57283d15d3937a2d8180036db003bec4cc499bf95a2c82446
            command:
              - /bin/sh
              - -c
              - "[ -f /etc/ocis/ocis.yaml ] || ocis init"
            securityContext: &hardened
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          # `ocis server` parses only the global config, so a per-service proxy.yaml is
          # never read -- the role mapping has to be merged into ocis.yaml itself.
          merge-role-config:
            image:
              repository: ghcr.io/mikefarah/yq
              tag: 4.53.6@sha256:cfc4eee658595834ef304eadb0c3ea721f3b7cb6404ad8b7cb909cc5b5145b23
            args:
              - -i
              - '. *= load("/config-fragment/role-assignment.yaml")'
              - /etc/ocis/ocis.yaml
            securityContext: *hardened
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          app:
            image: *image
            env:
              TZ: ${SECRET_TIMEZONE}
              # Single canonical host: every OIDC redirect, WOPI callback and asset URL
              # is built from it, so there can be no internal twin.
              OCIS_URL: https://drive.${SECRET_DOMAIN}
              OCIS_LOG_LEVEL: info
              OCIS_LOG_COLOR: "false"
              PROXY_TLS: "false"
              OCIS_INSECURE: "false"
              OCIS_EXCLUDE_RUN_SERVICES: idp
              OCIS_OIDC_ISSUER: https://sso.${SECRET_DOMAIN}/application/o/ocis/
              PROXY_OIDC_REWRITE_WELLKNOWN: "true"
              # The built-in CSP allows connect-src 'self' only, which blocks the
              # discovery fetch from Authentik.
              PROXY_CSP_CONFIG_FILE_LOCATION: /etc/ocis/csp.yaml
              # Without offline_access the web app renews through a hidden iframe
              # pointed at Authentik, which the CSP blocks. The provider must offer the
              # scope too -- OIDC_EXTRA_SCOPE in ks.yaml.
              WEB_OIDC_SCOPE: openid profile email offline_access
              WEB_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: ocis-oidc-authentik-application
                    key: clientID
              PROXY_AUTOPROVISION_ACCOUNTS: "true"
              PROXY_USER_OIDC_CLAIM: preferred_username
              PROXY_USER_CS3_CLAIM: username
              GRAPH_USERNAME_MATCH: "none"
              # PROXY_ROLE_ASSIGNMENT_DRIVER is deliberately absent: env is decoded
              # after resources/role-assignment.yaml, so setting it here would win.
              # False keeps the OIDC claim the only source of a role.
              GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
              # A registry name, not a URL.
              FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR: com.owncloud.api.collaboration.CollaboraOnline
              # All-or-nothing: unset, ocis uses a hardcoded set without the secure-view
              # role. One line -- a folded scalar would put a space inside a UUID.
              GRAPH_AVAILABLE_ROLES: "b1e2218d-eef8-4d4c-b82d-0f1a1b48f3b5,a8d5fe5e-96e3-418d-825b-534dbdf22b99,fb6c3e19-e378-47e5-b277-9732f9de6e21,58c63c02-1d89-4572-916a-870abc5a1b7d,2d00ce52-1fc2-4dbc-8b95-a73b73395f5a,1c996275-f1c9-4e71-abdf-a42f6495e960,312c0871-5ef7-4b3a-85b6-0e4074c64049,aa97fe03-7980-45ac-9e50-b325749fd7e6"
              # Not s3ng: a restore would pair a PVC snapshot with a bucket captured at
              # a different moment.
              STORAGE_USERS_DRIVER: ocis
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9200
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext: *hardened
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

          # `collaboration` is absent from the single process' service registry, so it
          # can only run as its own process. It shares this pod because it needs the
          # secrets in ocis.yaml, which sits on a ReadWriteOnce volume.
          collaboration:
            image: *image
            args: ["collaboration", "server"]
            env:
              TZ: ${SECRET_TIMEZONE}
              OCIS_URL: https://drive.${SECRET_DOMAIN}
              OCIS_LOG_LEVEL: info
              OCIS_LOG_COLOR: "false"
              COLLABORATION_HTTP_ADDR: 0.0.0.0:9300
              COLLABORATION_GRPC_ADDR: 127.0.0.1:9301
              MICRO_REGISTRY: nats-js-kv
              MICRO_REGISTRY_ADDRESS: 127.0.0.1:9233
              # Must have no path component or the service refuses to start.
              COLLABORATION_WOPI_SRC: http://ocis:9300
              COLLABORATION_APP_NAME: CollaboraOnline
              COLLABORATION_APP_PRODUCT: Collabora
              # Internal on purpose: only used to GET /hosting/discovery. The editor
              # URLs the browser loads come from inside that document, built from
              # Collabora's server_name, so they are public either way.
              COLLABORATION_APP_ADDR: http://collabora:9980
              COLLABORATION_APP_ICON: https://office.${SECRET_DOMAIN}/favicon.ico
              COLLABORATION_APP_INSECURE: "false"
              COLLABORATION_CS3API_DATAGATEWAY_INSECURE: "false"
              # Defaults to loopback, which the kubelet cannot probe. The WOPI server
              # 404s on / and on /hosting/discovery, so this is the only probe target.
              COLLABORATION_DEBUG_ADDR: 0.0.0.0:9304
            probes:
              # A not-ready container here pulls the whole ocis pod out of the service
              # endpoints, so liveness is slack on purpose.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &debug-port 9304
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *debug-port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext: *hardened
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
          # Collabora calls back in here. A second PORT, not a second service --
          # app-template renames the first service once a second one appears.
          wopi:
            port: 9300

    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
          # < 400, not == 200: an unauthenticated GET redirects to Authentik.
          gatus.home-operations.com/endpoint: |
            group: external
            conditions:
              - "[STATUS] < 400"
        hostnames: ["drive.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          ocis:
            # Config and data are two subPaths of one volume so a single snapshot
            # captures both: ocis.yaml holds the key that makes the data readable.
            init-config: &volume-mounts
              - path: /etc/ocis
                subPath: config
              - path: /var/lib/ocis
                subPath: data
            # Writes ocis.yaml in place, so not read-only.
            merge-role-config:
              - path: /etc/ocis
                subPath: config
            # Config only: file bytes arrive over the CS3 data gateway, not the volume.
            collaboration:
              - path: /etc/ocis
                subPath: config
                readOnly: true
            app: *volume-mounts
      config-files:
        type: configMap
        name: ocis-config
        advancedMounts:
          ocis:
            app:
              - path: /etc/ocis/csp.yaml
                subPath: csp.yaml
                readOnly: true
            # Staged outside /etc/ocis: this one is merged into ocis.yaml, and dropping
            # it in there would just be a file nothing reads.
            merge-role-config:
              - path: /config-fragment/role-assignment.yaml
                subPath: role-assignment.yaml
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
