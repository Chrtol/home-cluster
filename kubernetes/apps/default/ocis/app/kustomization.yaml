---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
configMapGenerator:
  - name: ocis-csp
    files:
      - ./resources/csp.yaml
generatorOptions:
  # Stable name so the HelmRelease can reference it; Reloader handles the restart on
  # content change instead of a name-suffix roll.
  disableNameSuffixHash: true
