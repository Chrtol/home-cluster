---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ocis
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
    - name: kopiur-repository
      namespace: kopiur-system
    # The collaboration sidecar in the ocis pod resolves Collabora's
    # /hosting/discovery once at startup and exits on failure, and a container that
    # will not start keeps the whole pod out of the service endpoints. Collabora's
    # Kustomization sets wait: true, so this holds the roll until coolwsd answers.
    # It only gates reconciliation -- a broken Collabora stalls this Kustomization
    # but never stops the ocis Deployment that is already running.
    - name: collabora
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/ocis/app
  components:
    - ../../../../components/ceph-rbd
    - ../../../../components/kopiur
    # Native OIDC against Authentik, not ext-auth: ocis is an OIDC *client*. The
    # built-in LibreGraph Connect IdP is excluded from the run list in the
    # HelmRelease, so Authentik stays the only identity provider -- including the
    # Plex federation source, which reaches ocis as an ordinary Authentik login.
    - ../../../../components/oidc-application
  postBuild:
    substitute:
      APP: *app
      # Documents, not media -- bulk stays on the NAS. Holds the config (16 secrets
      # generated by `ocis init`) AND the file data as two subPaths of one volume, so
      # a single kopiur snapshot captures both at the same instant. Ceph RBD grows
      # online if this fills.
      CEPH_RBD_CAPACITY: 50Gi
      GROUP: "Default"
      # Not files.* -- that hostname is filebrowser's external route, and two routes
      # claiming one host on the same gateway are resolved by creation timestamp, so
      # the older one silently wins.
      SUBDOMAIN: drive
      DESCRIPTION: Files, sharing and sync
      # ownCloud Web runs the code exchange in the browser, so it cannot hold a
      # client secret. Upstream's reference realm registers `web` as a public client;
      # Authentik enforces PKCE for those.
      OIDC_CLIENT_TYPE: public
      # Makes Authentik issue a REFRESH token. Without it ownCloud Web renews the
      # access token by navigating a hidden iframe to the IdP, which ocis' own CSP
      # blocks (frame-src has no Authentik origin) -- so the renewal fails and the
      # session ends the moment the 5-minute access token expires. With a refresh
      # token present, oidc-client-ts uses the refresh grant instead: a plain fetch
      # to the token endpoint, already allowed by connect-src. grant_types on the
      # provider already carries refresh_token.
      OIDC_EXTRA_SCOPE: offline_access
      # From web-runtime's userManager.ts: redirect_uri is /oidc-callback.html and
      # silent_redirect_uri is /oidc-silent-redirect.html. Both must be registered or
      # login succeeds and then token renewal silently fails.
      REDIRECT_PATH: /oidc-callback.html
      # Only the path differs from the primary callback, so the host parts default
      # through. Passing a whole URI here instead would smuggle an unexpanded
      # ${SECRET_DOMAIN} into Authentik -- envsubst never re-scans its own output.
      OIDC_EXTRA_PATH: /oidc-silent-redirect.html
      # Secret lands in this namespace so the HelmRelease can secretKeyRef the
      # generated clientID directly.
      OIDC_SECRET_NAMESPACE: *namespace
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 15m
  wait: false
