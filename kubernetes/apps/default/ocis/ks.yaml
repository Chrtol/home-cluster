---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ocis
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
    - name: kopiur-repository
      namespace: kopiur-system
    # The collaboration sidecar exits if Collabora does not answer at startup, and a
    # container that will not start keeps this pod out of the service endpoints.
    - name: collabora
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/ocis/app
  components:
    - ../../../../components/ceph-rbd
    - ../../../../components/kopiur
    # Native OIDC, not ext-auth: ocis is an OIDC *client*.
    - ../../../../components/oidc-application
  postBuild:
    substitute:
      APP: *app
      # Documents, not media -- bulk stays on the NAS. Grows online if it fills.
      CEPH_RBD_CAPACITY: 50Gi
      GROUP: "Default"
      # Not files.* -- that is filebrowser's external route, and two routes claiming
      # one host on a gateway are resolved by creation timestamp, silently.
      SUBDOMAIN: drive
      DESCRIPTION: Files, sharing and sync
      # ownCloud Web runs the code exchange in the browser, so it holds no secret.
      OIDC_CLIENT_TYPE: public
      # Makes Authentik issue a refresh token. Without one the web app renews through
      # a hidden iframe that ocis' own CSP blocks, so the session dies with the
      # 5-minute access token. Pairs with WEB_OIDC_SCOPE in the HelmRelease.
      OIDC_EXTRA_SCOPE: offline_access
      # Both callbacks must be registered or login works and renewal then fails.
      REDIRECT_PATH: /oidc-callback.html
      # Bare path, not a whole URI: a ${SECRET_DOMAIN} inside this value would reach
      # Authentik unexpanded, since envsubst never re-scans its own output.
      OIDC_EXTRA_PATH: /oidc-silent-redirect.html
      # App namespace, so the HelmRelease can secretKeyRef the generated clientID.
      OIDC_SECRET_NAMESPACE: *namespace
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 15m
  wait: false
