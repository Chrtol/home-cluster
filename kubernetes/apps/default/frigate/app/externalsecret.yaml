---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate-secret
    template:
      data:
        # Tapo "Camera Account" credentials -- the ones set in the Tapo app under
        # Advanced Settings > Camera Account, NOT the TP-Link cloud login. Frigate's
        # create_config.py picks up every FRIGATE_-prefixed env var and expands the
        # matching {FRIGATE_...} placeholders in config.yml, so these never hit git.
        # Kept per-camera rather than shared so one camera's password can be rotated
        # without touching the other.
        FRIGATE_ZIGGY_USER: "{{ .FRIGATE_ZIGGY_USER }}"
        FRIGATE_ZIGGY_PASSWORD: "{{ .FRIGATE_ZIGGY_PASSWORD }}"
        FRIGATE_SPYRO_USER: "{{ .FRIGATE_SPYRO_USER }}"
        FRIGATE_SPYRO_PASSWORD: "{{ .FRIGATE_SPYRO_PASSWORD }}"
  dataFrom:
    - extract:
        key: frigate
