---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app collabora
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      collabora:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/collabora/code
              tag: 26.04.4.1.1@sha256:1efda3043e8b9cb437d1b6c6efe20cc3753760e634de012b8dac391da488bf97
            env:
              TZ: ${SECRET_TIMEZONE}
              # ssl.termination does more than TLS: it makes the discovery document
              # use an `external-https` net-zone, and ocis reads only "external*"
              # zones. server_name is where the browser's editor URLs come from.
              extra_params: >-
                --o:ssl.enable=false
                --o:ssl.termination=true
                --o:welcome.enable=false
                --o:server_name=office.${SECRET_DOMAIN}
                --o:net.frame_ancestors=drive.${SECRET_DOMAIN}
              DONT_GEN_SSL_CERT: "YES"
              # Lowercase: the image reads these env names verbatim.
              username:
                valueFrom:
                  secretKeyRef:
                    name: collabora-secret
                    key: username
              password:
                valueFrom:
                  secretKeyRef:
                    name: collabora-secret
                    key: password
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9980
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 4
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              # No readOnlyRootFilesystem: coolwsd builds a chroot jail per document.
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      # No securityContext: coolwsd needs its own uid for the jails it creates, and
      # RuntimeDefault seccomp blocks the syscalls that build them.
      enableServiceLinks: false

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      # External only: server_name takes a single value, so every urlsrc in
      # /hosting/discovery names office.* and a second hostname could never reach the
      # editor. ocis does not use this route; its sidecar uses the cluster service.
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
          gatus.home-operations.com/endpoint: |
            group: external
            conditions:
              - "[STATUS] == 200"
        hostnames: ["office.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      proof-key:
        type: secret
        name: collabora-secret
        advancedMounts:
          collabora:
            app:
              - path: /etc/coolwsd/proof_key
                subPath: proof_key
                readOnly: true
