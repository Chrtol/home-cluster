---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collabora
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: collabora-secret
    template:
      engineVersion: v2
      data:
        # coolwsd signs every WOPI callback with this key and publishes the matching
        # public modulus in /hosting/discovery, which ocis caches for 12h. A key that
        # changes on restart therefore breaks editing until that cache expires -- which
        # is exactly why Collabora's own chart refuses to generate it under GitOps:
        # its lookup-based generator returns nothing under `helm template`, so Flux
        # would mint a fresh key on every render. Keeping it in 1Password makes it
        # declared state that survives restarts and needs no PVC or backup.
        proof_key: "{{ .COLLABORA_PROOF_KEY }}"

        # Lowercase on purpose -- the image reads `username`/`password` verbatim, not
        # an upper-case variant. They guard /browser/dist/admin/admin.html, which is
        # served on the same public hostname as the editor.
        username: "{{ .COLLABORA_ADMIN_USER }}"
        password: "{{ .COLLABORA_ADMIN_PASSWORD }}"
  dataFrom:
    # Provides COLLABORA_PROOF_KEY, COLLABORA_ADMIN_USER, COLLABORA_ADMIN_PASSWORD
    - extract:
        key: collabora
