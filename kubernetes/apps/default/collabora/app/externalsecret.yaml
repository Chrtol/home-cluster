---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collabora
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: collabora-secret
    template:
      engineVersion: v2
      data:
        # Not generated by the chart: its generator relies on `lookup`, which is empty
        # under `helm template`, so Flux would mint a new key every render. ocis caches
        # the matching public key for 12h, so a rotation breaks editing for that long.
        proof_key: "{{ .COLLABORA_PROOF_KEY }}"
        username: "{{ .COLLABORA_ADMIN_USER }}"
        password: "{{ .COLLABORA_ADMIN_PASSWORD }}"
  dataFrom:
    # Provides COLLABORA_PROOF_KEY, COLLABORA_ADMIN_USER, COLLABORA_ADMIN_PASSWORD
    - extract:
        key: collabora
