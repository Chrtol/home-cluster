---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app collabora
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # The proof key and admin credentials come from 1Password, and the pod cannot
    # start without them.
    - name: onepassword
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/default/collabora/app
  # No components. Nothing here is persisted -- documents live in ocis and coolwsd
  # keeps only per-session jails -- so there is no PVC and nothing to back up. No
  # oidc-application or ext-auth either: this is a WOPI app, not a user-facing one.
  # Every request that matters carries a WOPI token minted by ocis' collaboration
  # service, and putting a forward-auth in front would break the editor's own
  # callbacks, which never carry a browser session.
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  # True, unlike most apps here: ocis' collaboration sidecar fetches
  # /hosting/discovery once at startup and EXITS if it fails, so a cold start that
  # races Collabora leaves that container crash-looping -- and a not-ready container
  # takes the whole ocis pod out of the service endpoints. Waiting here lets ocis'
  # dependsOn hold it back until Collabora actually answers.
  wait: true
