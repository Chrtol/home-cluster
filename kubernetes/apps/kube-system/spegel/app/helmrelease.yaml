---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: spegel
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.7.4
  url: oci://ghcr.io/spegel-org/helm-charts/spegel
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: spegel
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: spegel-values
  # The chart hardcodes `service.kubernetes.io/topology-mode: auto` on the registry
  # Service and Helm values can't override it. On this single-zone flat cluster
  # (all nodes zone=home, uneven CPU) topology hints can't be computed, so `auto`
  # spams "TopologyAwareHintsDisabled: Insufficient Node information". This post-render
  # patch removes the annotation after Helm templates it; Spegel routes cluster-wide.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: spegel-registry
            patch: |
              - op: remove
                path: /metadata/annotations/service.kubernetes.io~1topology-mode
