---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: descheduler
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"
    replicas: 2
    kind: Deployment
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    deschedulerPolicy:
      # Feeds LowNodeUtilization real usage from metrics-server instead of requests.
      # Without a provider here the metricsUtilization arg below is silently inert.
      metricsProviders:
        - source: KubernetesMetrics
      profiles:
        - name: Default
          pluginConfig:
            - name: DefaultEvictor
              args:
                evictFailedBarePods: true
                evictLocalStoragePods: true
                evictSystemCriticalPods: true
                nodeFit: true
            - name: RemoveDuplicates
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 5
                includingInitContainers: true
            - name: RemoveFailedPods
              args:
                reasons:
                  - ContainerStatusUnknown
                  - NodeAffinity
                  - NodeShutdown
                  - Terminated
                  - UnexpectedAdmissionError
                includingInitContainers: true
                excludeOwnerKinds:
                  - Job
                minPodLifetimeSeconds: 1800
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
                  # Gives soft node preferences an "during execution" half: a pod that
                  # missed its preferred node (transient capacity, a rollout surge) is
                  # evicted once that node can take it. Nothing is evicted while no
                  # better node exists, so a preference still degrades to running
                  # anywhere rather than to Pending.
                  - preferredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingTopologySpreadConstraint
            - name: LowNodeUtilization
              namespaces:
                exclude:
                  - "remote"
              args:
                # Scores ACTUAL usage, not requests. Requests lie here by ~6GiB on dell1
                # alone, which is what made it look full while running at 71%, and what
                # left lenovo1 unnoticed at 88% CPU while its requests read 55%.
                metricsUtilization:
                  source: KubernetesMetrics
                # Only one pod is evicted per over-utilized node per cycle when running
                # off metrics, so churn is bounded; nodeFit above stops an eviction that
                # has nowhere better to land.
                thresholds:
                  cpu: 50
                  memory: 82
                targetThresholds:
                  cpu: 70
                  memory: 88
          plugins:
            balance:
              enabled:
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
                - RemoveDuplicates
            deschedule:
              enabled:
                - RemoveFailedPods
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    leaderElection:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi