---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-feature-discovery
  namespace: kube-system
spec:
  path: ./kubernetes/apps/kube-system/node-feature-discovery/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  prune: false
  wait: true
---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-feature-discovery-configs
  namespace: kube-system
spec:
  path: ./kubernetes/apps/kube-system/node-feature-discovery/configs
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 30m
  prune: false
  wait: true
  dependsOn:
    - name: node-feature-discovery
