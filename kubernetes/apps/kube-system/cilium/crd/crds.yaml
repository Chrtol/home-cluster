---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api-crd
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
    # Pinned to v1.3.0: this is the last release that still SERVES TLSRoute under
    # gateway.networking.k8s.io/v1alpha2, which Cilium 1.19.x's gateway-api operator
    # requires for its field indexer. v1.4.0+ unserves v1alpha2 -> operator crash-loops.
    tag: v1.3.0
  ignore: |
    # exclude
    /*
    # include
    # experimental channel includes TLSRoute/TCPRoute/UDPRoute (required by Cilium's gateway-api operator)
    !config/crd/experimental
---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  prune: true
  sourceRef:
    kind: GitRepository
    name: gateway-api-crd
  wait: true
  interval: 15m
  retryInterval: 1m
  timeout: 5m
