---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api-crd
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
    # Capped to the v1.4.x line: Cilium 1.19.5's gateway-api operator officially targets
    # gateway-api v1.4.1 and its field indexer still requires TLSRoute served under
    # gateway.networking.k8s.io/v1alpha2 (experimental channel). v1.5.0+ promotes TLSRoute
    # to v1 and unserves v1alpha2 -> cilium-operator crash-loops. The real unblock is
    # Cilium 1.20 (moves TLSRoute to v1); until then keep this < v1.5.0.
    tag: v1.4.1
  ignore: |
    # exclude
    /*
    # include
    # experimental channel includes TLSRoute/TCPRoute/UDPRoute (required by Cilium's gateway-api operator)
    !config/crd/experimental
---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  prune: true
  sourceRef:
    kind: GitRepository
    name: gateway-api-crd
  wait: true
  interval: 15m
  retryInterval: 1m
  timeout: 5m
