---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api-crd
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
    # Experimental channel at v1.6.0 serves TLSRoute under BOTH v1 (needed by Envoy
    # Gateway 1.8.x) AND v1alpha2 (needed by Cilium 1.19.x's operator field indexer),
    # plus v1alpha3. This satisfies both controllers from a single CRD. The prior
    # "cap < v1.5.0" was a misdiagnosis: v1alpha2 is NOT dropped by the experimental
    # channel. The safe-upgrades VAP (shipped since v1.5) PERMITS this upgrade because
    # the existing CRDs are already experimental-channel and the target is v1.5+ — so
    # it is left installed (do NOT exclude it: the upstream kustomization.yaml
    # references the file, and removing it breaks `kustomize build`).
    tag: v1.6.0
  ignore: |
    # exclude
    /*
    # include
    # experimental channel includes TLSRoute/TCPRoute/UDPRoute (required by Cilium's gateway-api operator)
    !config/crd/experimental
---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  prune: true
  sourceRef:
    kind: GitRepository
    name: gateway-api-crd
  wait: true
  interval: 15m
  retryInterval: 1m
  timeout: 5m
