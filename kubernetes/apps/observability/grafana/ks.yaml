---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grafana
  namespace: &namespace observability
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/observability/grafana/app
  dependsOn:
    - name: cloudnative-pg-cluster-v17
      namespace: database
  components:
    - ../../../../components/cnpg
    - ../../../../components/oidc-application
    - ../../../../components/gatus/guarded
  postBuild:
    substitute:
      APP: *app
      # Split off the shared "app" role: grafana now owns its DB with its own
      # role and password (field on the grafana 1Password item). Only the
      # ExternalSecret half of the component is used here — the values ConfigMap
      # is app-template-shaped and this chart is not (see helmrelease.yaml).
      DB_OP_ITEM: grafana
      DB_PASS_FIELD: GRAFANA_POSTGRES_PASS
      # OIDC component variables
      GROUP: "Infrastructure"
      SUBDOMAIN: grafana
      DISPLAY_NAME: "Grafana"
      DESCRIPTION: "Metrics, logs and dashboards"
      REDIRECT_PATH: "/login/generic_oauth"
      # Land the generated client secret in observability, not security, so the
      # Grafana pod can read it directly.
      OIDC_SECRET_NAMESPACE: observability
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
