---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: observability
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Role/database creation is handled by the cnpg component, which renders
        # grafana-initdb-secret (consumed by the extraInitContainers init-db).
        # This secret now carries only Grafana's own connection settings, using
        # its dedicated role split off from the shared "app" role.
        GF_DATABASE_TYPE: postgres
        GF_DATABASE_HOST: "{{ .POSTGRES_RW_SVC }}"
        GF_DATABASE_NAME: grafana
        GF_DATABASE_USER: grafana
        GF_DATABASE_PASSWORD: "{{ .GRAFANA_POSTGRES_PASS }}"
        # CNPG serves TLS on the -rw Service (ssl=on). "require" encrypts the
        # connection without needing the cluster CA mounted for verification.
        GF_DATABASE_SSL_MODE: require
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: grafana
