---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: observability
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Consumed by the init-db initContainer to create the role and database
        INIT_POSTGRES_HOST: &dbHost "{{ .POSTGRES_RW_SVC }}"
        INIT_POSTGRES_DBNAME: &dbName grafana
        INIT_POSTGRES_USER: &dbUser "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: &dbPass "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

        # Consumed by Grafana itself
        GF_DATABASE_TYPE: postgres
        GF_DATABASE_HOST: *dbHost
        GF_DATABASE_NAME: *dbName
        GF_DATABASE_USER: *dbUser
        GF_DATABASE_PASSWORD: *dbPass
        # CNPG serves TLS on the -rw Service (ssl=on). "require" encrypts the
        # connection without needing the cluster CA mounted for verification.
        GF_DATABASE_SSL_MODE: require
  dataFrom:
    - extract:
        key: cloudnative-pg
