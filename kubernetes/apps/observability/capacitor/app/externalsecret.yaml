---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: capacitor
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: capacitor
    creationPolicy: Owner
    template:
      data:
        LICENSE_KEY: "{{ .CAPACITOR_LICENSE_KEY }}"

        AUTH: oidc
        AUTH_DEBUG: "true" #logs impersonation headers
        OIDC_ISSUER: "{{ .CAPACITOR_OIDC_ISSUER }}"
        OIDC_CLIENT_ID: "{{ .CAPACITOR_OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .CAPACITOR_OIDC_CLIENT_SECRET }}"
        OIDC_REDIRECT_URL: "{{ .CAPACITOR_OIDC_REDIRECT_URL }}"
        OIDC_SCOPES: "{{ .CAPACITOR_OIDC_SCOPES }}"
        AUTHORIZED_EMAILS: "{{ .CAPACITOR_AUTHORIZED_EMAILS }}"

        IMPERSONATE_SA_RULES: "{{ .CAPACITOR_IMPERSONATE_SA_RULES }}"

        SESSION_HASH_KEY: "{{ .CAPACITOR_SESSION_HASH_KEY }}"
        SESSION_BLOCK_KEY: "{{ .CAPACITOR_SESSION_BLOCK_KEY }}"


        # Cluster configuration for in-cluster access
        registry.yaml: |
          clusters:
            - id: in-cluster
              name: In-cluster
              apiServerURL: https://kubernetes.default.svc
              certificateAuthorityFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              serviceAccount:
                tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  dataFrom:
    - extract:
        key: capacitor
