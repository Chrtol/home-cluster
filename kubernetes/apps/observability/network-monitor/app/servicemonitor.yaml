---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: network-monitor
  namespace: observability
  labels:
    app.kubernetes.io/name: network-monitor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: network-monitor
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
---
# Monitor DNS resolution across cluster
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: network-monitor-dns
  namespace: observability
  labels:
    app.kubernetes.io/name: network-monitor-dns
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: network-monitor
  endpoints:
    - port: http
      interval: 15s
      path: /probe
      params:
        module: [dns]
        target: 
          - google.com
          - plex.${SECRET_DOMAIN}
          - cloudflare.com
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: probe_.*
          targetLabel: __tmp_probe_type
          replacement: dns
        - sourceLabels: [instance]
          targetLabel: dns_target
        - targetLabel: instance
          replacement: "{{ $labels.node }}"
---
# Monitor HTTP connectivity to critical services
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: network-monitor-http
  namespace: observability
  labels:
    app.kubernetes.io/name: network-monitor-http
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: network-monitor
  endpoints:
    - port: http
      interval: 15s
      path: /probe
      params:
        module: [http_2xx]
        target:
          - https://plex.${SECRET_DOMAIN}
          - https://google.com
          - http://10.0.30.70:32400/web
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: probe_.*
          targetLabel: __tmp_probe_type
          replacement: http
        - sourceLabels: [instance]
          targetLabel: http_target
        - targetLabel: instance
          replacement: "{{ $labels.node }}"