---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.32.2/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-configmap
  namespace: observability
data:
  config.yaml: |
    web:
      port: 80
    storage:
      type: sqlite
      path: /config/sqlite.db
      caching: true
    metrics: true
    debug: true
    ui:
      title: Status | Gatus
      header: Status
    connectivity:
      checker:
        target: 1.1.1.1:53
        interval: 1m
    endpoints:
      - name: flux-webhook
        group: external
        url: https://flux-webhook.${SECRET_DOMAIN}
        interval: 1m
        client:
          dns-resolver: tcp://1.1.1.1:53
        conditions:
          - "[STATUS] == 404"
        alerts:
          - type: custom
      - name: status
        group: guarded
        url: 1.1.1.1
        interval: 1m
        dns:
          query-name: "status.${SECRET_DOMAIN}"
          query-type: A
        conditions:
          - "len([BODY]) == 0"
        alerts:
          - type: custom
      - name: nas
        group: certificates
        url: https://nas.${SECRET_DOMAIN}
        interval: 12h
        client:
          dns-resolver: tcp://1.1.1.1:53
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"
        alerts:
          - type: custom
            description: "Certificate expires in [CERTIFICATE_EXPIRATION]"
            send-on-resolved: true
            failure-threshold: 1
            success-threshold: 1
      - name: opnsense
        group: certificates
        url: https://opnsense.${SECRET_DOMAIN}
        interval: 12h
        client:
          dns-resolver: tcp://1.1.1.1:53
          timeout: 10s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 720h"
        alerts:
          - type: custom
            description: "Certificate expires in [CERTIFICATE_EXPIRATION]"
            send-on-resolved: true
            failure-threshold: 1
            success-threshold: 1
    alerting:
      custom:
        url: https://n8n-webhook.cftollefsen.com/webhook/gatus
        method: POST
        headers:
          Content-Type: application/json
        body: |
          {
            "endpoint_name": "[ENDPOINT_NAME]",
            "group": "[ENDPOINT_GROUP]",
            "alert_state": "[ALERT_TRIGGERED_OR_RESOLVED]",
            "description": "[ALERT_DESCRIPTION]"
          }
        default-alert:
          description: health-check failed
          send-on-resolved: true
          failure-threshold: 3
          success-threshold: 3