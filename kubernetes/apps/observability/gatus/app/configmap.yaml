---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.32.2/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-configmap
  namespace: observability
data:
  # Base Gatus config + the endpoints that CANNOT be derived from an HTTPRoute.
  # Route-backed app endpoints are generated by the gatus-sidecar container into
  # /config/gatus-sidecar.yaml and merged by Gatus at read time. Only genuinely
  # routeless service/TCP/DNS probes belong here — an app that also has a route
  # would be double-registered (name+group must be unique).
  config.yaml: |
    web:
      port: 80
    storage:
      type: sqlite
      path: /config/sqlite.db
      caching: true
    metrics: true
    ui:
      title: Status | Gatus
      header: Status
    connectivity:
      checker:
        target: 1.1.1.1:53
        interval: 1m
    endpoints:
      # flux-webhook is auto-discovered from its HTTPRoute (annotated 404), so it's
      # not declared here. Routeless service/TCP/DNS probes only:
      - name: mosquitto
        group: infrastructure
        url: tcp://mosquitto.default.svc.cluster.local:1883
        interval: 1m
        ui:
          hide-url: true
          hide-hostname: true
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: custom
      # --- Off-cluster Matter/Thread stack (Proxmox host lenovo2 + CT103) ---
      # Nothing here is Flux-managed, so nothing else in the cluster notices when it
      # dies. The 2026-08-01 rack power cut took CT103 down and it did not autostart;
      # the only symptom was "the lights stopped responding". pve_up{id="lxc/103"}
      # covers "the container is running" — these cover "the service inside it works".
      - name: matter-server
        group: infrastructure
        url: "http://10.0.30.11:5580/"
        interval: 2m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: custom
      # Asserts the Thread network by name, not just that a port answers. OTBR can be
      # listening while attached to no network or the wrong one — a liveness check
      # would pass in both cases.
      - name: otbr
        group: infrastructure
        url: "http://10.0.30.61:8081/node"
        interval: 2m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].networkName == ha-thread-d38e"
        alerts:
          - type: custom

      - name: alertmanager
        group: internal
        url: "http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093/-/healthy"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: custom
      - name: cross-seed
        group: guarded
        url: 1.1.1.1
        interval: 1m
        ui:
          hide-hostname: true
          hide-url: true
        dns:
          query-name: "cross-seed.${SECRET_DOMAIN}"
          query-type: A
        conditions:
          - "len([BODY]) == 0"
        alerts:
          - type: custom
      - name: tempo
        group: guarded
        url: 1.1.1.1
        interval: 1m
        ui:
          hide-hostname: true
          hide-url: true
        dns:
          query-name: "tempo.${SECRET_DOMAIN}"
          query-type: A
        conditions:
          - "len([BODY]) == 0"
        alerts:
          - type: custom
      - name: nas
        group: certificates
        url: https://nas.${SECRET_DOMAIN}
        interval: 12h
        client:
          dns-resolver: tcp://10.0.30.1:53
          timeout: 30s
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 696h"
        alerts:
          - type: custom
            description: "Certificate expires in [CERTIFICATE_EXPIRATION]"
            send-on-resolved: true
            failure-threshold: 1
            success-threshold: 1
      - name: opnsense
        group: certificates
        url: https://opnsense.${SECRET_DOMAIN}
        interval: 12h
        client:
          dns-resolver: tcp://10.0.30.1:53
          timeout: 30s
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 696h"
        alerts:
          - type: custom
            description: "Certificate expires in [CERTIFICATE_EXPIRATION]"
            send-on-resolved: true
            failure-threshold: 1
            success-threshold: 1
      - name: proxmox
        group: certificates
        url: https://proxmox.${SECRET_DOMAIN}
        interval: 12h
        client:
          dns-resolver: tcp://10.0.30.1:53
          timeout: 30s
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 696h"
        alerts:
          - type: custom
            description: "Certificate expires in [CERTIFICATE_EXPIRATION]"
            send-on-resolved: true
            failure-threshold: 1
            success-threshold: 1
      - name: vps-public-ip
        group: vps
        url: https://${VPS_PUBLIC_IP}
        interval: 2m
        client:
          insecure: true
          timeout: 10s
        conditions:
          - "[STATUS] < 500"
          - "[CONNECTED] == true"
        alerts:
          - type: custom
            description: "VPS public IP is unreachable from cluster"
            send-on-resolved: true
            failure-threshold: 3
            success-threshold: 1
    alerting:
      custom:
        url: https://n8n-webhook.${SECRET_DOMAIN}/webhook/gatus
        method: POST
        headers:
          Content-Type: application/json
        body: |
          {
            "gatus_instance": "internal",
            "endpoint_name": "[ENDPOINT_NAME]",
            "group": "[ENDPOINT_GROUP]",
            "alert_state": "[ALERT_TRIGGERED_OR_RESOLVED]",
            "description": "[ALERT_DESCRIPTION]"
          }
        default-alert:
          description: health-check failed
          send-on-resolved: true
          failure-threshold: 3
          success-threshold: 3
