---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.32.2/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-configmap
  namespace: observability
data:
  config.yaml: |
    web:
      port: 80
    storage:
      type: sqlite
      path: /config/sqlite.db
      caching: true
    metrics: true
    debug: false
    ui:
      title: Status | Gatus
      header: Status
    connectivity:
      checker:
        target: 1.1.1.1:53
        interval: 1m
    endpoints:
      - name: flux-webhook
        group: external
        url: https://flux-webhook.${SECRET_DOMAIN}
        interval: 1m
        client:
          dns-resolver: tcp://1.1.1.1:53
        conditions:
          - "[STATUS] == 404"
        alerts:
          - type: pushover
      - name: status
        group: guarded
        url: 1.1.1.1
        interval: 1m
        dns:
          query-name: "status.${CLUSTER_DOMAIN}"
          query-type: A
        conditions:
          - "len([BODY]) == 0"
        alerts:
          - type: pushover
      - name: pushover-test
        group: test
        url: https://this-domain-does-not-exist-12345.com
        interval: 30s
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover
    alerting:
      pushover:
        title: Gatus (Kubernetes)
        application-token: ${PUSHOVER_TOKEN}
        user-key: ${PUSHOVER_USER_KEY}
        priority: 1
        default-alert:
          description: health-check failed
          send-on-resolved: true
          failure-threshold: 3
          success-threshold: 3