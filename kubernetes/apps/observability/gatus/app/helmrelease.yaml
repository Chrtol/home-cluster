---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gatus-sidecar
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Roll the pod when the config ConfigMap changes.
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    gatus:
      port: 80
      env:
        TZ: ${SECRET_TIMEZONE}
    sidecar:
      # The internal status page discovers every routed app across both gateways.
      # Internal/ext-auth routes render as guarded (DNS) probes via Gateway/ext-auth
      # annotation inheritance; external routes render as HTTP probes.
      gatewayNames:
        - external
        - internal
      defaultInterval: 1m
      logLevel: info
      kinds:
        httproute:
          enable: true
          auto: true
        service:
          enable: false
          auto: false
    config:
      existingConfigMap: gatus-configmap
      items:
        - key: config.yaml
          path: config.yaml
    # Reuse the existing gatus PVC so history survives the cutover.
    persistence:
      enabled: true
      existingClaim: gatus
    serviceAccount:
      create: true
    rbac:
      create: true
      type: ClusterRole
    monitoring:
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    priorityClassName: control-plane-priority
    httpRoute:
      enabled: true
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
      hostnames:
        - gatus.${SECRET_DOMAIN}
