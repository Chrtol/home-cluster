---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus-rules
spec:
  groups:
    - name: gatus.rules
      # Scoped to service="gatus-gatus-sidecar" (the internal instance's Service
      # name from the chart's fullname; it discovers ALL groups). gatus-public
      # exports the same metric names, so without this filter every external
      # endpoint would alert twice.
      rules:
        - alert: GatusEndpointDown
          expr: |
            gatus_results_endpoint_success{service="gatus-gatus-sidecar",group="external"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint is down
          labels:
            severity: critical

        - alert: GatusEndpointExposed
          # Guarded endpoints DNS-query an internal-only host against a public
          # resolver with condition `len([BODY]) == 0`: success==1 means it did
          # NOT resolve (healthy), success==0 means it resolved on public DNS —
          # i.e. an internal host is leaking. Fire on success==0.
          expr: |
            gatus_results_endpoint_success{service="gatus-gatus-sidecar",group="guarded"} == 0
          for: 5m
          annotations:
            summary: >-
              Internal endpoint {{ $labels.name }} is resolving on public DNS
          labels:
            severity: critical
