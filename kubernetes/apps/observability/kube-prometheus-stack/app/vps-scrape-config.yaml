---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: vps-metrics
  namespace: observability
  labels:
    prometheus: kube-prometheus-stack
spec:
  # The VPS end of the WireGuard tunnel; UFW opens these ports on wg0 only
  staticConfigs:
    - labels:
        job: vps-node-exporter
        instance: vps
      targets:
        - 10.100.0.1:9100
    - labels:
        job: vps-traefik
        instance: vps
      targets:
        - 10.100.0.1:8082
  metricsPath: /metrics
  scheme: http
  scrapeInterval: 30s
  scrapeTimeout: 10s
