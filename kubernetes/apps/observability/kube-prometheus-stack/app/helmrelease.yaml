# apiVersion: source.toolkit.fluxcd.io/v1
# kind: OCIRepository
# metadata:
#   name: kube-prometheus-stack
# spec:
#   interval: 5m
#   layerSelector:
#     mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
#     operation: copy
#   ref:
#     tag: 72.9.1
#   url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 83.7.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
# spec:
#   interval: 1h
#   chartRef:
#     kind: OCIRepository
#     name: kube-prometheus-stack
  install:
    remediation:
      retries: -1
    timeout: 5m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 5m
  values:
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      rules:
        kubeApiserverAvailability: false
        kubeApiserverBurnrate: false
        kubeApiserverSlos: false
    alertmanager:
      route:
        main:
          enabled: true
          hostnames: ["alertmanager.${SECRET_DOMAIN}"]
          parentRefs:
            - name: internal
              namespace: kube-system
              sectionName: https
      alertmanagerSpec:
        priorityClassName: control-plane-priority
        alertmanagerConfiguration:
          name: alertmanager
          global:
            resolveTimeout: 5m
        externalUrl: https://alertmanager.${SECRET_DOMAIN}
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: csi-rbd-sc
              resources:
                requests:
                  storage: 1Gi
    # Drop high-cardinality histogram buckets not needed for homelab monitoring
    # These metrics account for ~60k+ series and are rarely used
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: apiserver_(request_duration|request_body_size|response_sizes|watch_cache_read_wait|watch_list_duration|watch_events_sizes|request_sli_duration)_seconds_bucket
            action: drop
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
      serviceMonitor:
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: etcd_request_duration_seconds_bucket
            action: drop
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          hostnames: ["prometheus.${SECRET_DOMAIN}"]
          parentRefs:
            - name: internal
              namespace: kube-system
              sectionName: https
      prometheusSpec:
        priorityClassName: control-plane-priority
        enableRemoteWriteReceiver: true
        remoteWriteDashboards: true
        image:
          registry: quay.io
          repository: prometheus/prometheus
          tag: v3.9.1
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 50GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2000Mi
        # Increase probe tolerance for large TSDB (17GB+)
        # Prometheus returns 503 while loading, needs time to become ready
        startupProbe:
          failureThreshold: 120
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          failureThreshold: 10
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          failureThreshold: 5
          periodSeconds: 10
          timeoutSeconds: 10
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: csi-rbd-sc
              resources:
                requests:
                  storage: 50Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    grafana:
      enabled: false
      forceDeployDashboards: true
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: Kubernetes cluster Dockerhub rate limit risk
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
