---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy: ["alertname", "job"]
    groupInterval: 10m
    groupWait: 1m
    receiver: "null"
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      # Watchdog fires continuously by design. Route it to the heartbeat
      # receiver so it pings the out-of-cluster dead-man's-switch on the VPS on a
      # steady cadence. If these pings stop (cluster/ingress/monitoring down), the
      # VPS watcher notifies via Pushover — an independent failure domain from the
      # n8n webhook path, which routes through Envoy Gateway ingress.
      - receiver: heartbeat
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
        groupWait: 0s
        groupInterval: 1m
        repeatInterval: 2m30s
      - receiver: "null"
        matchers:
          - name: alertname
            value: KubeMemoryOvercommit
            matchType: =
      - receiver: "null"
        matchers:
          - name: alertname
            value: KubeCPUOvercommit
            matchType: =
      - receiver: n8n-smart-routing
        matchers:
          - name: alertname
            value: "(InfoInhibitor|Watchdog|KubeMemoryOvercommit|KubeCPUOvercommit)"
            matchType: "!~"
  inhibitRules:
    - equal: ["alertname", "namespace"]
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: "null"
    - name: heartbeat
      webhookConfigs:
        - urlSecret:
            name: alertmanager-secret
            key: ALERTMANAGER_HEARTBEAT_URL
    - name: n8n-smart-routing
      webhookConfigs:
        - url: "https://n8n-webhook.${SECRET_DOMAIN}/webhook/alerts"
          sendResolved: true
          httpConfig:
            followRedirects: true
