---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-gatus-ep
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: alertmanager
        group: internal
        url: "http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093/-/healthy"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: custom