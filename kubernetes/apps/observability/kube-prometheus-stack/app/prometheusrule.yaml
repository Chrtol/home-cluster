---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-capacity.rules
spec:
  groups:
    - name: cluster-capacity.rules
      rules:
        # Replaces the built-in KubeMemoryOvercommit, disabled in the HelmRelease.
        # Threshold sits above the steady state (82.6% as of 2026-09-06) so this
        # warns while there is still room to act, rather than at the point pods
        # already go Pending.
        - alert: KubeMemoryRequestsNearCapacity
          annotations:
            summary: Pod memory requests are approaching total cluster capacity.
            description: >-
              Memory requests are at {{ $value | humanizePercentage }} of total
              allocatable memory. Past 100% new pods cannot be scheduled.
          expr: |
            sum(namespace_memory:kube_pod_container_resource_requests:sum{})
              /
            sum(kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
              > 0.90
          for: 30m
          labels:
            severity: warning
---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: etcd-grpc.rules
spec:
  groups:
    - name: etcd-grpc.rules
      rules:
        # Replace the built-in etcdHighNumberOfFailedGRPCRequests, disabled in the
        # HelmRelease. It computed failures per gRPC method, including streams: a
        # LeaseKeepAlive stream only ever ends as Unavailable when its client reconnects,
        # so that method read 0% or 100% and paged critical with <1% of calls failing
        # (>5% for 544 minutes over 8 days to 2026-09-15). Low-volume unary methods did
        # the same off a single failure (LeaseGrant hit 10.7%). Scoped to unary calls
        # and aggregated per member, the worst 8-day value was 0.93%.
        - alert: EtcdHighFailedUnaryRequests
          annotations:
            summary: etcd member is failing unary gRPC requests.
            description: >-
              {{ $value | humanize }}% of unary gRPC requests failed on etcd member
              {{ $labels.instance }} over the last 5 minutes.
          expr: |
            100 * sum by (job, instance) (
              rate(grpc_server_handled_total{job=~".*etcd.*", grpc_type="unary", grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[5m])
            )
              /
            sum by (job, instance) (
              rate(grpc_server_handled_total{job=~".*etcd.*", grpc_type="unary"}[5m])
            )
              > 1
          for: 10m
          labels:
            severity: warning
        - alert: EtcdHighFailedUnaryRequests
          annotations:
            summary: etcd member is failing unary gRPC requests.
            description: >-
              {{ $value | humanize }}% of unary gRPC requests failed on etcd member
              {{ $labels.instance }} over the last 5 minutes.
          expr: |
            100 * sum by (job, instance) (
              rate(grpc_server_handled_total{job=~".*etcd.*", grpc_type="unary", grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[5m])
            )
              /
            sum by (job, instance) (
              rate(grpc_server_handled_total{job=~".*etcd.*", grpc_type="unary"}[5m])
            )
              > 5
          for: 5m
          labels:
            severity: critical
