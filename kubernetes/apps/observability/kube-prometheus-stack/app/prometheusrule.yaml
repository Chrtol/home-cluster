---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-capacity.rules
spec:
  groups:
    - name: cluster-capacity.rules
      rules:
        # Replaces the built-in KubeMemoryOvercommit, disabled in the HelmRelease.
        # Threshold sits above the steady state (82.6% as of 2026-09-06) so this
        # warns while there is still room to act, rather than at the point pods
        # already go Pending.
        - alert: KubeMemoryRequestsNearCapacity
          annotations:
            summary: Pod memory requests are approaching total cluster capacity.
            description: >-
              Memory requests are at {{ $value | humanizePercentage }} of total
              allocatable memory. Past 100% new pods cannot be scheduled.
          expr: |
            sum(namespace_memory:kube_pod_container_resource_requests:sum{})
              /
            sum(kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
              > 0.90
          for: 30m
          labels:
            severity: warning
---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: etcd-grpc.rules
spec:
  groups:
    - name: etcd-grpc.rules
      rules:
        # Replace the built-in etcdHighNumberOfFailedGRPCRequests, disabled in the
        # HelmRelease. It computed failures per gRPC method, including streams: a
        # LeaseKeepAlive stream only ever ends as Unavailable when its client reconnects,
        # so that method read 0% or 100% and paged critical with <1% of calls failing
        # (>5% for 544 minutes over 8 days to 2026-09-15). Low-volume unary methods did
        # the same off a single failure (LeaseGrant hit 10.7%). Scoped to unary calls
        # and aggregated per member, the worst 8-day value was 0.93%.
        - alert: EtcdHighFailedUnaryRequests
          annotations:
            summary: etcd member is failing unary gRPC requests.
            description: >-
              {{ $value | humanize }}% of unary gRPC requests failed on etcd member
              {{ $labels.instance }} over the last 5 minutes.
          expr: |
            100 * sum by (job, instance) (
              rate(grpc_server_handled_total{job=~".*etcd.*", grpc_type="unary", grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[5m])
            )
              /
            sum by (job, instance) (
              rate(grpc_server_handled_total{job=~".*etcd.*", grpc_type="unary"}[5m])
            )
              > 1
          for: 10m
          labels:
            severity: warning
        - alert: EtcdHighFailedUnaryRequests
          annotations:
            summary: etcd member is failing unary gRPC requests.
            description: >-
              {{ $value | humanize }}% of unary gRPC requests failed on etcd member
              {{ $labels.instance }} over the last 5 minutes.
          expr: |
            100 * sum by (job, instance) (
              rate(grpc_server_handled_total{job=~".*etcd.*", grpc_type="unary", grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[5m])
            )
              /
            sum by (job, instance) (
              rate(grpc_server_handled_total{job=~".*etcd.*", grpc_type="unary"}[5m])
            )
              > 5
          for: 5m
          labels:
            severity: critical
---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: etcd-peer.rules
spec:
  groups:
    - name: etcd-peer.rules
      rules:
        # Replaces the built-in etcdMemberCommunicationSlow, disabled in the
        # HelmRelease. sabnzbd and qbittorrent downloads saturate their node's NIC and
        # push peer RTT past 0.15s for 8-26 minutes (22 bursts 2026-09-23 to 10-07), so
        # the built-in 10m hold paged on every one while quorum stayed healthy. A
        # sustained slow link means a failing NIC, cable or node. Lost quorum is
        # caught sooner by the built-in etcdMembersDown, etcdNoLeader and
        # etcdHighNumberOfLeaderChanges.
        - alert: EtcdMemberCommunicationSlowSustained
          annotations:
            summary: etcd peer link has been slow for 45 minutes.
            description: >-
              p99 round trip from {{ $labels.instance }} to member {{ $labels.To }} is
              {{ $value | humanizeDuration }}. instance is the reporting member; the slow
              node is the one common to every firing To/instance pair. Check that
              node's network throughput first.
          expr: |
            histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket{job=~".*etcd.*"}[5m]))
              > 0.15
          for: 45m
          labels:
            severity: warning
---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: controller-loop.rules
spec:
  groups:
    - name: controller-loop.rules
      rules:
        # A controller stuck rewriting the same objects. Nothing built in catches it:
        # the API server stays healthy and the controller reports Ready. The
        # mariadb-operator did this for months until 2026-09-21 -- 16.7 writes/s each
        # to mariadbs, services and configmaps, 69 of the cluster's 122 API requests/s
        # and ~0.9 cores of kube-apiserver. The busiest healthy resource that day was
        # verticalpodautoscalers at 8.4/s sustained (Goldilocks), then pods at 5.4/s.
        # Leases and events are excluded because they are high by design; the review
        # resources are POSTs that write nothing.
        - alert: KubeAPIResourceWriteRateHigh
          annotations:
            summary: One resource type is being written to the API server unusually fast.
            description: >-
              {{ $labels.resource }} has taken {{ $value | humanize }} writes/s for 2
              hours. That is usually a controller reconciling in a loop. Find it with
              sum by (verb, resource) (rate(apiserver_request_total[10m])): several
              resources at an identical rate belong to the same controller.
          expr: |
            sum by (resource) (
              rate(apiserver_request_total{verb=~"POST|PUT|PATCH|DELETE", resource!~"leases|events|tokenreviews|subjectaccessreviews|selfsubjectaccessreviews|selfsubjectrulesreviews"}[30m])
            )
              > 12
          for: 2h
          labels:
            severity: warning
        # Names the controller, which the rule above cannot, but only sees controllers
        # that export controller-runtime metrics (9 on 2026-09-21; mariadb-operator is
        # no longer one of them). Every one of those sat at 0 errors/s that day while
        # the mariadb loop ran at 4.6/s. controller-runtime only backs off error
        # retries, so a controller whose failing pass still writes to its own object
        # re-triggers itself through the watch and never slows down.
        - alert: ControllerReconcileErrorLoop
          annotations:
            summary: A controller is failing every reconcile without backing off.
            description: >-
              Controller {{ $labels.controller }} in {{ $labels.namespace }} has failed
              {{ $value | humanize }} reconciles/s for an hour. Its log will be repeating
              one error.
          expr: |
            sum by (namespace, controller) (
              rate(controller_runtime_reconcile_errors_total[15m])
            )
              > 0.5
          for: 1h
          labels:
            severity: warning
