---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-remote-write
  namespace: observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: kube-prometheus-stack-prometheus
  ports:
    - name: remote-write
      port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
