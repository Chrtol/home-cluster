---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.32.2/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-sidecar-configmap
  namespace: observability
data:
  # Base Gatus config + the endpoints that CANNOT be derived from a route
  # (external appliance certs, the VPS public IP, the flux-webhook 404 probe).
  # Route-backed app endpoints are generated by the gatus-sidecar container into
  # /config/gatus-sidecar.yaml and merged by Gatus at read time.
  #
  # NOTE: this is a side-by-side PILOT instance (gatus-next). Storage is in-memory
  # so it can run alongside the live `gatus` without contending for its RWO PVC.
  config.yaml: |
    web:
      port: 80
    storage:
      type: memory
    metrics: true
    debug: true
    ui:
      title: Status | Gatus (sidecar pilot)
      header: Status
    connectivity:
      checker:
        target: 1.1.1.1:53
        interval: 1m
    endpoints:
      # flux-webhook is now auto-discovered from its HTTPRoute (annotated with the
      # 404 condition), so it's no longer declared here to avoid a duplicate.
      - name: nas
        group: certificates
        url: https://nas.${SECRET_DOMAIN}
        interval: 12h
        client:
          dns-resolver: tcp://10.0.30.1:53
          timeout: 30s
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 696h"
        alerts:
          - type: custom
            description: "Certificate expires in [CERTIFICATE_EXPIRATION]"
            send-on-resolved: true
            failure-threshold: 1
            success-threshold: 1
      - name: opnsense
        group: certificates
        url: https://opnsense.${SECRET_DOMAIN}
        interval: 12h
        client:
          dns-resolver: tcp://10.0.30.1:53
          timeout: 30s
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 696h"
        alerts:
          - type: custom
            description: "Certificate expires in [CERTIFICATE_EXPIRATION]"
            send-on-resolved: true
            failure-threshold: 1
            success-threshold: 1
      - name: proxmox
        group: certificates
        url: https://proxmox.${SECRET_DOMAIN}
        interval: 12h
        client:
          dns-resolver: tcp://10.0.30.1:53
          timeout: 30s
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 696h"
        alerts:
          - type: custom
            description: "Certificate expires in [CERTIFICATE_EXPIRATION]"
            send-on-resolved: true
            failure-threshold: 1
            success-threshold: 1
      - name: vps-public-ip
        group: vps
        url: https://${VPS_PUBLIC_IP}
        interval: 2m
        client:
          insecure: true
          timeout: 10s
        conditions:
          - "[STATUS] < 500"
          - "[CONNECTED] == true"
        alerts:
          - type: custom
            description: "VPS public IP is unreachable from cluster"
            send-on-resolved: true
            failure-threshold: 3
            success-threshold: 1
    alerting:
      custom:
        url: https://n8n-webhook.${SECRET_DOMAIN}/webhook/gatus
        method: POST
        headers:
          Content-Type: application/json
        body: |
          {
            "gatus_instance": "internal-sidecar-pilot",
            "endpoint_name": "[ENDPOINT_NAME]",
            "group": "[ENDPOINT_GROUP]",
            "alert_state": "[ALERT_TRIGGERED_OR_RESOLVED]",
            "description": "[ALERT_DESCRIPTION]"
          }
        default-alert:
          description: health-check failed
          send-on-resolved: true
          failure-threshold: 3
          success-threshold: 3
