---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: alloy
    namespace: flux-system
  values:
    fullnameOverride: alloy

    controller:
      type: daemonset
      volumes:
        extra:
          - name: positions
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate

    alloy:
      # Reads the kubelet's log files from /var/log/pods instead of streaming them
      # through the API (loki.source.kubernetes). A followed API stream makes the
      # kubelet poll CRI ContainerStatus about once a second per stream, which cost
      # dell1 ~700 calls/s and ~1.9 cores of containerd + kubelet on 2026-09-21.
      mounts:
        varlog: true
        dockercontainers: false
        extra:
          - name: positions
            mountPath: /var/lib/alloy
      # Read offsets have to outlive the pod, or every Alloy restart re-ships each
      # log file from its first byte. The chart default, /tmp/alloy, does not.
      storagePath: /var/lib/alloy
      configMap:
        content: |-
          // Only the pods on this Alloy pod's own node: their log files are the only
          // ones under this node's /var/log/pods. Before the selector existed all
          // three DaemonSet pods discovered every pod in the cluster and each
          // container's log was followed three times (1035 streams, 337 containers).
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
            }
          }

          // Port of Promtail's default kubernetes-pods scrape_config relabel rules,
          // preserving label parity (app, instance, component, node_name, namespace,
          // job=<namespace>/<app>, pod, container).
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            // __tmp_controller_name = controller name with the hash suffix stripped.
            rule {
              source_labels = ["__meta_kubernetes_pod_controller_name"]
              regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
              action        = "replace"
              target_label  = "__tmp_controller_name"
            }

            // app: first non-empty of app.kubernetes.io/name, app, controller, pod name.
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_name",
                "__meta_kubernetes_pod_label_app",
                "__tmp_controller_name",
                "__meta_kubernetes_pod_name",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              separator    = ";"
              action       = "replace"
              target_label = "app"
            }

            // instance: first non-empty of app.kubernetes.io/instance, instance.
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_instance",
                "__meta_kubernetes_pod_label_instance",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              separator    = ";"
              action       = "replace"
              target_label = "instance"
            }

            // component: first non-empty of app.kubernetes.io/component, component.
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_component",
                "__meta_kubernetes_pod_label_component",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              separator    = ";"
              action       = "replace"
              target_label = "component"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              action        = "replace"
              target_label  = "node_name"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              action        = "replace"
              target_label  = "namespace"
            }

            // job = <namespace>/<app>
            rule {
              source_labels = ["namespace", "app"]
              separator     = "/"
              action        = "replace"
              replacement   = "$1"
              target_label  = "job"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              action        = "replace"
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              action        = "replace"
              target_label  = "container"
            }

            // The kubelet names each log directory <namespace>_<pod>_<uid>.
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              action        = "replace"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }

            // Static pods (kube-apiserver, controller-manager, scheduler) are the
            // exception: their directory carries the config hash, not the mirror
            // pod's uid, so without this rule the control plane's logs stop.
            rule {
              source_labels = [
                "__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash",
                "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash",
                "__meta_kubernetes_pod_container_name",
              ]
              separator     = "/"
              regex         = "true/(.*)"
              action        = "replace"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }

          local.file_match "pod_logs" {
            path_targets = discovery.relabel.pod_logs.output
          }

          loki.source.file "pod_logs" {
            targets    = local.file_match.pod_logs.targets
            forward_to = [loki.process.pod_logs.receiver]
          }

          // The files are in CRI format ("<time> <stream> <F|P> <line>"), which the
          // API stream used to strip. This restores the bare line and its timestamp.
          loki.process "pod_logs" {
            stage.cri {}
            // loki.source.file tags every line with its path, which embeds the pod
            // uid and restart count: a new Loki stream per container restart, for
            // nothing that pod + container do not already say.
            stage.label_drop {
              values = ["filename"]
            }
            forward_to = [loki.write.loki.receiver]
          }

          loki.write "loki" {
            endpoint {
              url = "http://loki-headless.observability.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

    serviceMonitor:
      enabled: true
