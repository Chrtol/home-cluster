---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus-public
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gatus-sidecar
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    gatus:
      port: 80
      env:
        TZ: ${SECRET_TIMEZONE}
    sidecar:
      # Public status page: discover ONLY routes on the external gateway, so this
      # page reflects exactly what's exposed to the internet.
      gatewayNames:
        - external
      defaultInterval: 1m
      logLevel: info
      kinds:
        httproute:
          enable: true
          auto: true
        service:
          enable: false
          auto: false
    config:
      existingConfigMap: gatus-public-configmap
      items:
        - key: config.yaml
          path: config.yaml
    persistence:
      enabled: true
      existingClaim: gatus-public
    serviceAccount:
      create: true
    rbac:
      create: true
      type: ClusterRole
    monitoring:
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    priorityClassName: control-plane-priority
    httpRoute:
      enabled: true
      annotations:
        external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
      parentRefs:
        - name: external
          namespace: network
          sectionName: https
      hostnames:
        - status.${SECRET_DOMAIN}
