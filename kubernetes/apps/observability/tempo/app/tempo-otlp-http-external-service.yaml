---
# HTTPRoute for Tempo OTLP HTTP endpoint (for nginx and other HTTP-based exporters)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tempo-otlp-http
  namespace: observability
  annotations:
    external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
    # gatus-sidecar: opt out — this is an OTLP trace-ingest endpoint, not a
    # user-facing service; it returns non-200 to a bare GET so an HTTP probe would
    # false-alarm. Tempo liveness is covered by the guarded DNS check in the
    # central gatus config instead.
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: external
      namespace: network
      kind: Gateway
  hostnames:
    - tempo-otlp-http.${SECRET_DOMAIN}
  rules:
    - backendRefs:
        - name: tempo-distributor
          port: 4318
