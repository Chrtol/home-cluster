---
# HTTPRoute for Tempo OTLP HTTP endpoint (for nginx and other HTTP-based exporters)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tempo-otlp-http
  namespace: observability
  annotations:
    external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
spec:
  parentRefs:
    - name: external
      namespace: network
      kind: Gateway
  hostnames:
    - tempo-otlp-http.${SECRET_DOMAIN}
  rules:
    - backendRefs:
        - name: tempo-distributor
          port: 4318
