---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  interval: 5m
  chart:
    spec:
      chart: tempo-distributed
      version: 1.61.2
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Global settings
    global:
      image:
        registry: docker.io

    # Enable processors via overrides
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics

    # Tempo configuration overrides
    tempo:
      structuredConfig:
        ingester:
          lifecycler:
            ring:
              replication_factor: 1  # Set to 1 since we only run 1 ingester
        metrics_generator:
          ring:
            kvstore:
              store: memberlist
          # Enable service graphs generation
          processor:
            service_graphs:
              dimensions:
                - service.namespace
                - service.name
                - service.version
              histogram_buckets: [0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.02, 2.05, 4.10]
              max_items: 10000
              wait: 30s  # Increased to handle WireGuard latency and trace propagation delays
            span_metrics:
              dimensions:
                - service.namespace
                - service.name
                - span.name
                - span.kind
                - status.code
              histogram_buckets: [0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.02, 2.05, 4.10]
          storage:
            # Remote write configuration to send metrics to Prometheus
            remote_write:
              - url: http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write
                send_exemplars: true

    # Trace ingestion configuration
    traces:
      otlp:
        grpc:
          enabled: true
        http:
          enabled: true
      zipkin:
        enabled: true
      jaeger:
        grpc:
          enabled: true
        thriftHttp:
          enabled: true

    # Storage configuration for Garage S3
    storage:
      trace:
        backend: s3
        s3:
          bucket: tempo-traces
          endpoint: garage.database.svc.cluster.local:3900
          region: homelab
          insecure: true
          forcepathstyle: true
          # Credentials will be provided via AWS environment variables

    # Configure components
    distributor:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      extraEnv:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: SECRET_KEY

    ingester:
      replicas: 1
      persistence:
        enabled: true
        storageClass: csi-rbd-sc
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      extraEnv:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: SECRET_KEY

    compactor:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      extraEnv:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: SECRET_KEY

    querier:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      extraEnv:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: SECRET_KEY

    queryFrontend:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
      extraEnv:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: SECRET_KEY

    gateway:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi

    # Metrics generation for Prometheus
    metricsGenerator:
      enabled: true
      replicas: 1
      # Note: remoteWriteUrl doesn't work with structuredConfig, it's set above in tempo.structuredConfig
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      extraEnv:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tempo-secret
              key: SECRET_KEY

    # Service monitor for Prometheus scraping
    serviceMonitor:
      enabled: true