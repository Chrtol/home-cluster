---
# Ingress for Tempo OTLP gRPC endpoint
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempo-otlp-grpc
  namespace: observability
  annotations:
    external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Whitelist WireGuard subnet, server network, pod network, and service network
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.100.0.0/24,10.0.30.0/24,10.42.0.0/16,10.43.0.0/16"
    # Basic auth for additional security (optional)
    # nginx.ingress.kubernetes.io/auth-type: basic
    # nginx.ingress.kubernetes.io/auth-secret: tempo-otlp-auth
    # nginx.ingress.kubernetes.io/auth-realm: 'OTLP Authentication'
spec:
  ingressClassName: external
  tls:
    - hosts:
        - "tempo-otlp.${SECRET_DOMAIN}"
      secretName: "tempo-otlp-tls"
  rules:
    - host: "tempo-otlp.${SECRET_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tempo-distributor
                port:
                  number: 4317
---
# Optional: Basic auth secret for OTLP endpoint
# Uncomment if you want to add authentication
# apiVersion: v1
# kind: Secret
