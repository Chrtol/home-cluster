---
# TLS Certificate for Tempo OTLP gRPC endpoint
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tempo-otlp-grpc
  namespace: observability
spec:
  secretName: tempo-otlp-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "tempo-otlp.${SECRET_DOMAIN}"
  dnsNames:
    - "tempo-otlp.${SECRET_DOMAIN}"
  privateKey:
    rotationPolicy: Always
---
# GRPCRoute for Tempo OTLP gRPC endpoint
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: tempo-otlp-grpc
  namespace: observability
  annotations:
    external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
spec:
  parentRefs:
    - name: external
      namespace: network
      kind: Gateway
  hostnames:
    - tempo-otlp.${SECRET_DOMAIN}
  rules:
    - backendRefs:
        - name: tempo-distributor
          port: 4317
