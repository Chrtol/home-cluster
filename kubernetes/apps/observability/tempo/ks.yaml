---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tempo
  namespace: &namespace observability
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/observability/tempo/app
  components:
    - ../../../../components/gatus/guarded
    - ../../../../components/s3-bucket
  dependsOn:
    - name: garage
      namespace: database
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      S3_BUCKET: tempo-traces
      # CORS_ORIGINS not set - Tempo doesn't need CORS for backend S3 access
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
