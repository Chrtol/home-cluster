---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app drm-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    config:
      # Intel engine utilization is averaged across this window, so it must stay
      # at or below the scrape interval below or Prometheus resamples a value
      # that is already an average of an average.
      intervalSeconds: 5
      port: 8081

    # Every node is an Intel iGPU box today, but the DaemonSet is scoped to the
    # NFD label rather than running everywhere: a future GPU-less node would
    # otherwise get a pod that starts, finds no DRM device, and reports nothing
    # while still counting as a healthy target.
    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: "true"

    # Nodes carry no taints today (all three are controller+worker), but node-exporter
    # tolerates everything for the same reason: a DaemonSet that silently skips a
    # freshly-tainted node leaves a blind spot rather than an alert.
    tolerations:
      - effect: NoSchedule
        operator: Exists

    hostAccess:
      # Deliberately empty -- do NOT set this to /dev/dri. A hostPath mount makes the
      # device nodes visible but the kernel devices cgroup still denies open() to a
      # non-privileged container, which fails as:
      #   discovering DRM devices: Operation not permitted (os error 1)
      # Access comes from the gpu.intel.com/monitoring resource below instead, which
      # is what actually programs the cgroup allow-list.
      devDri: ""
      sys: /sys
      # Deliberately empty. This would mount /dev/cpu for MSR-based package
      # temperature, but Talos ships no `msr` kernel module
      # (siderolabs/extensions#620), so the device nodes do not exist.
      devCpu: ""

    podSecurityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
        # Required for drm_engine_utilization_ratio: the i915 engine-busyness
        # counters come from the perf PMU, not sysfs. Verified working with Talos's
        # default kernel.perf_event_paranoid=3 -- that sysctl gates CPU perf events,
        # not this device-scoped uncore PMU, so it does NOT need lowering.
        # Startup logs "engines PMU init: OK" when this capability is present.
        add: ["PERFMON"]
        # SYS_RAWIO is intentionally NOT added. It exists only for /dev/cpu/*/msr,
        # which Talos does not provide -- see hostAccess.devCpu above.

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
        # The Intel device plugin's dedicated monitoring resource: it grants the
        # container access to EVERY GPU on the node and programs the devices cgroup
        # so /dev/dri is actually openable. Unlike gpu.intel.com/i915 (which Plex,
        # Immich and Ollama each claim a slot of) this one is monitoring-only and
        # does not consume a transcode slot, so the exporter never competes with them.
        gpu.intel.com/monitoring: 1
      limits:
        memory: 128Mi
        gpu.intel.com/monitoring: 1

    service:
      type: ClusterIP

    monitoring:
      serviceMonitor:
        enabled: true
        interval: 1m
        scrapeTimeout: 30s
        # No labeldrop of `pod` here, unlike the single-replica exporters in this
        # directory. This is a DaemonSet: the chart's built-in relabeling maps each
        # pod to a `node` label, and the bundled dashboard groups by it because the
        # `device` PCI slot repeats identically across nodes.
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          allowCrossNamespaceImport: true
          folder: Infrastructure
          resyncPeriod: 10m
          matchLabels:
            grafana.internal/instance: grafana

    serviceAccount:
      create: true
      # The exporter never calls the Kubernetes API.
      automount: false

    daemonsetAnnotations:
      reloader.stakater.com/auto: "true"

    updateStrategy:
      type: RollingUpdate
