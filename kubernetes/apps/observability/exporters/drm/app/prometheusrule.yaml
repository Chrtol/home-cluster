---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: drm-exporter
  labels:
    app.kubernetes.io/instance: drm-exporter
    app.kubernetes.io/name: drm-exporter
spec:
  groups:
    - name: drm.exporter
      rules:
        - alert: DrmExporterAbsent
          annotations:
            description: >-
              The DRM exporter has disappeared from Prometheus target discovery.
              All GPU telemetry below is blind until it returns.
            summary: DRM exporter is down.
          expr: |
            absent(up{job=~".*drm-exporter.*"} == 1)
          for: 15m
          labels:
            severity: critical

        # A single-node failure does not fire DrmExporterAbsent, because the other
        # pods still answer -- one dead node hides behind two live ones. Compared
        # against the DaemonSet's own desired-pod count rather than a node-label
        # query: that number already accounts for the nodeSelector, so it stays
        # correct if GPU nodes are added or removed.
        # NB: do NOT rewrite this against kube_node_labels -- kube-state-metrics is
        # not configured to export node labels here, so that series does not exist
        # and the rule would silently never fire.
        - alert: DrmExporterNodeMissing
          annotations:
            description: >-
              Only {{ $value }} DRM exporter target(s) are up, fewer than the pods the
              DaemonSet wants scheduled. At least one node is reporting no GPU
              telemetry while the others mask the gap from the absent() check.
            summary: DRM exporter is missing on at least one GPU node.
          expr: |
            count(up{job=~".*drm-exporter.*"} == 1)
              < max(kube_daemonset_status_desired_number_scheduled{daemonset="drm-exporter"})
          for: 30m
          labels:
            severity: warning

        # The exporter can run happily while finding zero GPUs -- probes pass and
        # /metrics is served, just empty. That is the expected symptom if the
        # /dev/dri hostPath mount is lost, so alert on the data rather than the pod.
        - alert: DrmExporterNoGpusDiscovered
          annotations:
            description: >-
              The DRM exporter on {{ $labels.node }} is up but reporting no GPUs.
              Usually the /dev/dri mount or the i915 driver extension is missing;
              the pod stays Ready regardless, so nothing else surfaces this.
            summary: DRM exporter discovered no GPUs on {{ $labels.node }}.
          expr: |
            count by (node) (up{job=~".*drm-exporter.*"} == 1)
              unless count by (node) (drm_info)
          for: 30m
          labels:
            severity: warning

    - name: drm.gpu
      rules:
        # The failure that actually costs something. Plex silently falls back to
        # software transcoding when it cannot open the render node -- a lost i915
        # device plugin slot, a driver hiccup, a Plex Pass lapse. Nothing breaks:
        # streams keep playing, the pod stays Ready, plex_plays_active still shows the
        # stream. It just pins the CPU and stutters on 4K.
        # Neither exporter can see this alone -- Plex does not report which encoder
        # it chose, and an idle GPU is only suspicious while Plex is busy. Joining
        # the two is what makes it detectable.
        # Thresholds are measured, not guessed: a 1080p VAAPI encode on dell1 drove
        # render to 1.0 and video to 0.25, so 0.05 sits far above hardware-idle
        # noise and far below any real transcode.
        - alert: PlexTranscodingWithoutGpu
          annotations:
            # No {{ $labels.node }} here: `and on ()` joins on the empty label set, so
            # the resulting series carries no labels at all and the template would
            # render an empty string. The node is recoverable from the query below.
            description: >-
              Plex has been transcoding video for 20m while the GPU on its node stayed
              idle (peak engine utilization under 5%) AND the Plex container burned over
              1.5 CPU cores -- the CPU is doing the encode the GPU should be doing, i.e.
              a software fallback. Playback still works but stutters on high-bitrate
              content. Find the node with:
              kube_pod_info * on (namespace, pod) group_left ()
              kube_pod_labels{label_app_kubernetes_io_name="plex"}
            summary: Plex is transcoding video without GPU acceleration.
          # plex-exporter scrapes the Plex API remotely, so its series carry NO node
          # label -- joining it to drm metrics on (node) directly matches nothing and
          # the alert can never fire. kube_pod_labels supplies the missing pod->node
          # mapping, matched on label_app_kubernetes_io_name rather than a pod-name
          # regex: the name carries a ReplicaSet hash that changes on every redeploy,
          # and a "plex-.*" pattern also swallows plex-auto-languages, plex-off-deck
          # and plex-exporter (the last of which runs on a different node entirely,
          # which would join the wrong GPU).
          # ONE gate on plex_plays_active filtered to VIDEO transcodes does three jobs:
          #  1. transcode_type=~"video|both" excludes AUDIO-ONLY and subtitle-only
          #     transcodes (e.g. EAC3->AAC, sidecar subs). Those legitimately use no GPU,
          #     so the old plex_active_transcode_sessions gate -- which counts EVERY
          #     transcode -- fired with a (correctly) idle GPU. Over 7d that was ~382 min
          #     of false positives, including "nobody streaming" fires up to 20m after an
          #     audio-only transcode ended (the max_over_time window keeps the gate hot).
          #     transcode_type values observed: audio, video, both, none. Burn-in subs
          #     force a real video transcode (type=both) that DOES use the GPU, so they
          #     stay correctly quiet.
          #  2. stream_type="transcode" excludes direct play (values: transcode,
          #     directplay, unknown).
          #  3. plex_plays_active only exists during genuine playback, so Plex's nightly
          #     maintenance window (chapter thumbs, analysis, ~3-5am) -- which decodes on
          #     CPU BY DESIGN and tripped the old alert at 03:25-04:30 on 2026-07-20 -- is
          #     excluded for free. This single filtered gate supersedes the old
          #     plex_active_transcode_sessions + plex_plays_active pair.
          # GPU-idle ALONE is not enough: a LIGHT hardware transcode (a 720p/3Mbps remote
          # stream barely taxes the UHD 770) and a PAUSED stream both leave the GPU idle,
          # and HLS transcode-ahead is bursty so a 5s-avg sample scraped once/min often
          # lands in an idle gap. Measured 2026-08-02: video-transcode+GPU-idle windows
          # peaked at 0.63 CPU cores over 2d -- pure light-HW/paused, zero real fallbacks,
          # yet the GPU-only rule fired 821 min. The CPU term is the discriminator: a real
          # software 1080p/4K encode pins 2-4 cores, so >1.5 cleanly separates it from
          # light-HW/paused (<0.7) while the GPU-idle term rejects a CPU spike from a
          # library scan happening ALONGSIDE a healthy HW transcode (GPU busy => no fire).
          # All three together == "video work is on the CPU, not the GPU" == software.
          # CPU is label-joined (not pod=~"plex.*") so it excludes plex-auto-languages,
          # which also runs a container named "app" in this namespace.
          # The CPU is checked on TWO windows so the page is always ACTIONABLE -- i.e. it
          # only fires while the software transcode is LIVE, not on a stale average:
          #  - rate[5m] > 1.5 is the sustained trend (paired with for:20m below).
          #  - rate[2m] > 1.5 is "still burning CPU right now". A counter has no
          #    instantaneous read, so this short window is the closest to current; it
          #    closes the ~3min tail where the 5m average keeps coasting >1.5 after the
          #    stream already ended (during which nothing is left to act on).
          expr: |
            (
              max(max_over_time(
                plex_plays_active{stream_type="transcode", transcode_type=~"video|both"}[20m]
              )) > 0
            )
            and on ()
            (
              max by (node) (
                max_over_time(drm_engine_utilization_ratio[20m])
              ) * on (node) group_left ()
              max by (node) (
                kube_pod_info * on (namespace, pod) group_left ()
                kube_pod_labels{label_app_kubernetes_io_name="plex", namespace="media"}
              )
            ) < 0.05
            and on ()
            (
              sum(
                rate(container_cpu_usage_seconds_total{namespace="media", container="app"}[5m])
                * on (namespace, pod) group_left ()
                kube_pod_labels{label_app_kubernetes_io_name="plex", namespace="media"}
              ) > 1.5
            )
            and on ()
            (
              sum(
                rate(container_cpu_usage_seconds_total{namespace="media", container="app"}[2m])
                * on (namespace, pod) group_left ()
                kube_pod_labels{label_app_kubernetes_io_name="plex", namespace="media"}
              ) > 1.5
            )
          for: 20m
          labels:
            severity: warning

        # Per-scrape 0/1 gauge: is Plex transcoding VIDEO on the CPU right now? Shared
        # signal for the trend alert below; mirrors PlexTranscodingWithoutGpu minus its
        # 20m sustain. 1 only when a video-transcode session exists, the GPU saw no
        # activity for 2m (short window survives bursty HLS transcode-ahead without the
        # 20m smear that would distort a time-average), AND Plex burns >1.5 cores -- i.e.
        # the encode is on the CPU, not the GPU. The vector(1)/vector(0) wrap turns the
        # match into a continuous 0/1 so avg_over_time() reads it as a time-fraction.
        - record: plex:software_video_transcode:active
          expr: |
            (
              vector(1) and on ()
              (
                (
                  count(plex_plays_active{stream_type="transcode", transcode_type=~"video|both"}) > 0
                )
                and on ()
                (
                  max by (node) (max_over_time(drm_engine_utilization_ratio[2m]))
                  * on (node) group_left ()
                  max by (node) (
                    kube_pod_info * on (namespace, pod) group_left ()
                    kube_pod_labels{label_app_kubernetes_io_name="plex", namespace="media"}
                  )
                ) < 0.05
                and on ()
                (
                  sum(
                    rate(container_cpu_usage_seconds_total{namespace="media", container="app"}[5m])
                    * on (namespace, pod) group_left ()
                    kube_pod_labels{label_app_kubernetes_io_name="plex", namespace="media"}
                  ) > 1.5
                )
              )
            ) or on () vector(0)

        # The slow-burn companion to PlexTranscodingWithoutGpu. That alert catches ONE
        # software transcode sustained live for 20m; this catches DEATH BY A THOUSAND
        # CUTS -- many short CPU transcodes that each end before the 20m sustain trips but
        # add up, the signature of an intermittently failing GPU path or the single i915
        # slot saturating under concurrent load. avg_over_time of the 0/1 gauge above ==
        # the fraction of the window spent software-transcoding; 0.08 ~= 29 min of any 6h.
        # Baseline is ~0 (the GPU normally handles everything, measured 2026-08-02), so
        # this cannot be validated to fire until a real regression occurs -- tune the
        # threshold UP if legitimate rare-codec CPU transcodes ever make it chatter.
        - alert: PlexSoftwareTranscodeExcessive
          annotations:
            description: >-
              Plex spent over 8% of the last 6h transcoding video on the CPU instead of
              the GPU ({{ $value | humanizePercentage }}). Each episode was short enough
              to dodge PlexTranscodingWithoutGpu, but the accumulation points at an
              intermittently failing GPU path or a saturated i915 slot. Review recent
              transcode sessions (Tautulli) and dell1 GPU health.
            summary: Plex has been CPU-transcoding video more than usual lately.
          expr: |
            avg_over_time(plex:software_video_transcode:active[6h]) > 0.08
          for: 15m
          labels:
            severity: warning

        # Sustained saturation of the render engine. On these iGPUs render -- not the
        # dedicated video block -- is the bottleneck: the same test encode pushed
        # render to 1.0 while video only reached 0.25, because format conversion runs
        # there. At a sustained 95% additional transcodes queue rather than run, which
        # users experience as buffering.
        # Scoped to render deliberately: alerting on any engine would fire on the
        # video block hitting 100% during a legitimate single stream.
        - alert: DrmGpuSaturated
          annotations:
            description: >-
              GPU render engine on {{ $labels.node }} has averaged over 95% for 1h
              ({{ $value | humanizePercentage }}). Further transcodes will queue
              behind the current ones and surface to users as buffering.
            summary: GPU on {{ $labels.node }} is saturated.
          expr: |
            avg by (node) (avg_over_time(drm_engine_utilization_ratio{engine="render"}[1h])) > 0.95
          for: 1h
          labels:
            severity: warning

    # Deliberately NO memory alert. drm_memory_used_bytes reads 0 even at 100% render
    # utilization: the only pool is "smem" (shared system memory, since an iGPU has no
    # dedicated VRAM) and i915 does not report usage through it. A used/total ratio
    # rule would sit at 0/28GB forever and read as healthy. Host memory pressure is
    # already covered by node-exporter.
    #
    # Deliberately NO frequency alert. drm_frequency_hertz{kind="actual"} is sampled
    # instantaneously and catches idle dips mid-load -- it read 100MHz while the render
    # engine was pinned at 100% -- so any threshold on it produces noise. Engine
    # utilization is the trustworthy saturation signal.
    #
    # Deliberately NO thermal / fan / power alerts. These are integrated GPUs in
    # Proxmox VMs: drm_temperature_celsius, drm_fan_speed_rpm and drm_power_watts
    # are never published, because the iGPU exposes no hwmon node (/sys/class/hwmon
    # is empty on every node) and the exporter logs "no rapl power reporting" at
    # startup. The MSR fallback that would recover package temperature needs
    # /dev/cpu, which Talos cannot provide (no msr kernel module).
    # A rule on those metrics would never evaluate, so it would read as "GPU
    # temperature is fine" when nothing is being measured at all. GPU thermals on
    # these hosts are only visible from the Proxmox side, via the CPU package
    # sensor that pve-exporter already scrapes.
