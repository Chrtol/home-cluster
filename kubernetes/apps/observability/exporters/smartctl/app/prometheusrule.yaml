---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-alerts
  namespace: observability
spec:
  groups:
    # Rules follow ai-activity/proxmox-scrape/prometheus-smartctl-scrape.md. Thresholds
    # re-verified against the live exporters on 2026-09-06, after lenovo1:sda was swapped
    # from a dying Samsung 850 PRO to an HP MK0240GFDKQ (see SataWearHigh):
    #   lenovo1 nvme0 percentage_used=74   lenovo1 sda attr173 value=97 (thresh 5)
    #   lenovo2 nvme0=61   dell1 nvme0=36   dell1 nvme1=30   nas nvme0=41   nas nvme1=19
    #   available_spare=100 (thresh 10), media_errors=0, exit_status=0 except lenovo1:sda.
    - name: smartctl
      interval: 1m
      rules:
        # Overall SMART self-assessment. 1 = PASSED, 0 = FAILED. Covers NVMe and ATA.
        # This is the LAGGING signal: it flips only once a pre-fail attribute reaches its
        # vendor threshold. The Samsung 850 PRO this cluster retired in Sep 2026 read
        # attr177 value=1 vs thresh=0 for months while smart_status still said 1 - which
        # is exactly why SataWearHigh below exists.
        - alert: DiskSmartFailed
          expr: smartctl_device_smart_status{job="smartctl"} == 0
          for: 5m
          labels:
            severity: critical
            component: smartctl
          annotations:
            summary: "SMART overall health FAILED on {{ $labels.node }} {{ $labels.device }}"
            description: "{{ $labels.device }} on {{ $labels.node }} reports SMART status FAILED. The drive firmware predicts imminent failure - replace it."

        # NVMe wear: percentage of rated write endurance consumed, counts UP toward 100.
        # NVMe ONLY - ATA SSDs do not expose this metric (see SataWearHigh). Fleet max is
        # 66 today, so this does not fire yet.
        - alert: NvmeWearHigh
          expr: smartctl_device_percentage_used{job="smartctl"} >= 80
          for: 1h
          labels:
            severity: warning
            component: smartctl
          annotations:
            summary: "NVMe wear high on {{ $labels.node }} {{ $labels.device }}"
            description: "{{ $labels.device }} on {{ $labels.node }} has used {{ $value }}% of rated write endurance. Plan a replacement."

        # ATA/SATA wear: reported as a NORMALISED value counting DOWN from 100 toward the
        # vendor threshold - the inverse of NVMe percentage_used, so no single expression
        # covers both. The attribute id is vendor-specific, hence the regex:
        #   177 Wear_Leveling_Count  - Samsung (the retired 850 PRO)
        #   173 (Unknown_Attribute)  - lenovo1:sda, HP MK0240GFDKQ, value=97 thresh=5
        # 10 is deliberately well above both vendors' own thresholds (0 and 5): the whole
        # point is to warn BEFORE smart_status flips.
        #
        # Both ids are matched fleet-wide rather than pinned per-node, but verify a new id
        # is really a wear counter before adding it - some vendors reuse 173 for unrelated
        # counters. Checked 2026-09-06: lenovo1:sda is the only drive publishing either id
        # (the four NAS spinners publish neither), so there are no false matches today.
        - alert: SataWearHigh
          expr: smartctl_device_attribute{job="smartctl", attribute_id=~"173|177", attribute_value_type="value"} <= 10
          for: 1h
          labels:
            severity: warning
            component: smartctl
          annotations:
            summary: "SATA SSD wear indicator at {{ $value }}/100 on {{ $labels.node }} {{ $labels.device }}"
            description: "Wear attribute {{ $labels.attribute_id }} normalised value is {{ $value }} (100 = new) on {{ $labels.device }}, {{ $labels.node }}. Replace the disk."

        # Guard for the rule above. Swapping lenovo1:sda in Sep 2026 moved the wear counter
        # from attr 177 to attr 173 and left SataWearHigh matching nothing - evaluating
        # empty forever while still reporting health=ok. A drive using a THIRD id would do
        # it again silently, so this notices instead of the next disk dying unannounced.
        - alert: SataWearMetricMissing
          expr: absent(smartctl_device_attribute{job="smartctl", attribute_id=~"173|177", attribute_value_type="value"})
          for: 30m
          labels:
            severity: warning
            component: smartctl
          annotations:
            summary: "No SATA SSD wear attribute is being published"
            description: "SataWearHigh matches neither attr 173 nor 177 anywhere in the fleet, so SATA SSD wear is unmonitored. A replaced disk probably reports wear under a different attribute id - run `smartctl -A` on it and add the id to both expressions."

        # HDD sector health (the NAS Seagate/HGST drives). Spinning disks fail via bad
        # sectors, not wear-levelling, so none of the SSD rules above cover them: attr 5
        # Reallocated_Sector_Ct, 197 Current_Pending_Sector, 198 Offline_Uncorrectable and
        # 187 Reported_Uncorrect all count reallocations/unreadable sectors, and the RAW
        # value IS the count. All four read 0 across every NAS HDD today; ANY nonzero is a
        # real failure signal (a single pending sector often precedes death), so raw > 0.
        #
        # One regex rule, not per-id, so it stays one line AND tolerates drives that omit
        # an attribute: the HGST HUH721212 (sdd) does not expose 187, and this simply never
        # matches it rather than erroring. NVMe carries no attribute_id 5/197/198, so there
        # are no false matches there. smart_status still trips DiskSmartFailed on collapse.
        - alert: HddSectorErrors
          expr: smartctl_device_attribute{job="smartctl", attribute_id=~"5|187|197|198", attribute_value_type="raw"} > 0
          for: 15m
          labels:
            severity: warning
            component: smartctl
          annotations:
            summary: "{{ $labels.attribute_name }} = {{ $value }} on {{ $labels.node }} {{ $labels.device }}"
            description: "{{ $labels.device }} on {{ $labels.node }} reports {{ $value }} for {{ $labels.attribute_name }} (was 0). Reallocated/pending/uncorrectable sectors predict HDD failure - run `smartctl -a` and plan a replacement."

        # NVMe spare blocks. available_spare and available_spare_threshold are both percent
        # (0-100); comparing the two series is self-documenting and survives a drive that
        # reports a threshold other than the usual 10. Fires when the NVMe crosses its own
        # critical-warning point. Fleet reads 100 vs 10 today.
        - alert: NvmeSpareLow
          expr: smartctl_device_available_spare{job="smartctl"} < smartctl_device_available_spare_threshold{job="smartctl"}
          for: 15m
          labels:
            severity: critical
            component: smartctl
          annotations:
            summary: "NVMe spare area low on {{ $labels.node }} {{ $labels.device }}"
            description: "{{ $labels.device }} on {{ $labels.node }} has dropped below its spare-block failure threshold. Replace now."

        # New uncorrectable media errors (data unrecoverable even with ECC/retries). The
        # counter is cumulative, so a nonzero total from years ago would fire forever -
        # alert on the RATE, which resolves once errors stop appearing. Currently 0.
        - alert: DiskMediaErrors
          expr: increase(smartctl_device_media_errors{job="smartctl"}[24h]) > 0
          for: 5m
          labels:
            severity: critical
            component: smartctl
          annotations:
            summary: "New media errors on {{ $labels.node }} {{ $labels.device }}"
            description: "{{ $labels.device }} on {{ $labels.node }} logged {{ $value | printf \"%.0f\" }} new uncorrectable media error(s) in 24h."

        # smartctl's own exit status is a bitmask; nonzero means the exporter is up but
        # could not cleanly read a device (open failed, SMART command failed, etc.).
        #
        # lenovo1:sda (HP MK0240GFDKQ) permanently reads exactly 4 = bit 2 alone, "a SMART
        # command failed". Its firmware answers "SMART Error Log not supported" and "SMART
        # Self-test Log not supported"; the exporter always passes --tolerance=verypermissive,
        # which continues past the refusal but still sets the bit. Verified by bisecting the
        # exporter's own argv: `smartctl -l error` alone exits 0, and adding only
        # --tolerance=verypermissive makes the identical command exit 4. Health is unaffected
        # (smart_status PASSED, attr 5/196 raw 0, 0 reported uncorrectables).
        #
        # `unless` matches on the full label set, so ONLY the value 4 on that one device is
        # exempt - any additional bit (8 DISK FAILING, 16 prefail below threshold, 64 error
        # log entries) changes the value and still alerts. Drop this clause when the disk
        # is replaced; SmartctlReadFailed is otherwise 0 fleet-wide.
        - alert: SmartctlReadFailed
          expr: |
            smartctl_device_smartctl_exit_status{job="smartctl"} != 0
              unless smartctl_device_smartctl_exit_status{job="smartctl", node="lenovo1", device="sda"} == 4
          for: 15m
          labels:
            severity: warning
            component: smartctl
          annotations:
            summary: "smartctl could not cleanly read {{ $labels.node }} {{ $labels.device }}"
            description: "smartctl exit status is {{ $value }} (bitmask) for {{ $labels.device }} on {{ $labels.node }}. The exporter is up but the device read is degraded."

        # Per-host reachability: one host's exporter down while others still report, so
        # SMART for that machine goes dark. ProxmoxNodeDown covers the node being down
        # entirely; this covers the exporter/port alone.
        - alert: SmartctlExporterDown
          expr: up{job="smartctl"} == 0
          for: 10m
          labels:
            severity: warning
            component: smartctl
          annotations:
            summary: "smartctl-exporter down on {{ $labels.node }}"
            description: "Prometheus cannot scrape smartctl-exporter on {{ $labels.node }} (:9633). SMART monitoring for that host is blind."

        # Repo-wide guard (as on pve/ceph/nas rules): a rule whose metric vanishes
        # evaluates empty forever and reports health=ok. If ALL exporters stop publishing,
        # every rule above goes silently inert - this is the only one that notices.
        # Distinct from SmartctlExporterDown, which needs `up` and one surviving target.
        - alert: SmartctlMetricsMissing
          expr: absent(smartctl_device_smart_status{job="smartctl"})
          for: 15m
          labels:
            severity: critical
            component: smartctl
          annotations:
            summary: "smartctl-exporter is publishing no metrics"
            description: "smartctl_device_smart_status has disappeared from all three Proxmox hosts - every SMART alert is now inert."
