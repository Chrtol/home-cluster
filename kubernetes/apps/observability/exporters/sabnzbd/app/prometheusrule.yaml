---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sabnzbd-exporter
  labels:
    app.kubernetes.io/instance: sabnzbd-exporter
    app.kubernetes.io/name: sabnzbd-exporter
spec:
  groups:
    - name: sabnzbd.exporter
      rules:
        - alert: SabnzbdExporterAbsent
          annotations:
            description: >-
              The SABnzbd exporter has disappeared from Prometheus target discovery.
              Every SABnzbd alert below is blind until it returns.
            summary: SABnzbd exporter is down.
          expr: |
            absent(up{job=~".*sabnzbd-exporter.*"} == 1)
          for: 15m
          labels:
            severity: critical

        # exportarr's /healthz only proves the process is alive -- it does NOT check the
        # SABnzbd backend. So a reachable exporter that cannot talk to SAB looks healthy
        # to the probe. sabnzbd_info is only published on a successful API call, which
        # makes its absence the real signal that SAB is unreachable or the key is wrong.
        - alert: SabnzbdUnreachable
          annotations:
            description: >-
              The exporter is up and scraping, but SABnzbd is publishing no metrics --
              its API is unreachable or rejecting the API key. Downloads may be failing
              silently. Note exportarr's own liveness probe cannot catch this: /healthz
              reports process liveness, not backend health.
            summary: SABnzbd API is unreachable to its exporter.
          expr: |
            absent(sabnzbd_info) and on() count(up{job=~".*sabnzbd-exporter.*"} == 1) > 0
          for: 15m
          labels:
            severity: critical

    - name: sabnzbd.queue
      rules:
        # A paused queue is SABnzbd's classic silent failure: the app is healthy, the
        # pod is Running, nothing is wrong -- it simply downloads nothing, forever.
        # Usually someone paused it to debug and forgot, or a disk-full event auto-paused
        # it. Nothing else in the stack surfaces this.
        - alert: SabnzbdPaused
          annotations:
            description: >-
              SABnzbd's download queue has been paused for over 1h. The app is running
              normally and will simply not download anything until it is resumed --
              often left paused after debugging, or auto-paused by a full disk.
            summary: SABnzbd queue is paused.
          expr: |
            sabnzbd_paused_all == 1 or sabnzbd_paused == 1
          for: 1h
          labels:
            severity: warning

    # SabnzbdServerArticleFailures removed 2026-08-04. It fired permanently for ALL FOUR
    # configured servers -- 7d of ALERTS history showed bonus/eunews/eweka/news all in
    # `firing` -- for two independent reasons, neither fixable by tuning the threshold:
    #
    #   1. clamp_min(rate(...), 1) was written as "a floor on total articles", but rate()
    #      yields articles PER SECOND. Flooring the denominator at 1/s (=3600/h) forces
    #      the ratio toward 0 for any server below that throughput. bonus.frugalusenet.com
    #      peaks at 16 articles per HOUR, so it could never clear 0.9. The `and rate > 0`
    #      guard does not help: it passes on a single article per hour.
    #   2. The counters are not a success ratio. SABnzbd's own server_stats API reports
    #      news.eweka.nl at 38.7M articles_tried vs 2.2M articles_success (5.7%) on a
    #      server that has pulled 27 TB without incident, while the barely-used
    #      bonus/news.frugalusenet servers read 83%/96%. articles_success is only
    #      incremented on some code paths, so the two series are not comparable.
    #
    # Provider-level article failure has no trustworthy metric on this exporter. The
    # user-visible consequence -- failed repairs and failed imports -- is already caught
    # downstream by the arrs and Cleanuparr. SabnzbdDownloadStalled below covers the
    # blunt version of the same failure using series that do mean what they say.
    - name: sabnzbd.throughput
      rules:
        # SAB says it is actively downloading, the queue is not empty and there are bytes
        # left to fetch -- yet nothing is moving. That is the shape of every real download
        # failure that matters here: provider outage or auth rejection, the gluetun
        # WireGuard tunnel dropping, or the NAS incomplete-dir going read-only. Unlike the
        # rule it replaces, every term is a plain gauge with no derived arithmetic.
        #
        # The remaining_bytes term keeps post-processing quiet: a long par2 repair or
        # unrar leaves the queue non-empty at zero speed, but with nothing left to
        # download. 100 KB/s is a floor, not a performance target -- this is a
        # stuck-detector, not a speed alert.
        - alert: SabnzbdDownloadStalled
          annotations:
            description: >-
              SABnzbd has been in Downloading state for 30m with a non-empty queue and
              bytes still outstanding, but under 100 KB/s of throughput. Check the
              gluetun tunnel first -- Usenet traffic traverses it while the exporter's
              API calls do not, so SabnzbdUnreachable stays quiet when only the tunnel
              is down -- then the provider's connection status, then free space on the
              incomplete dir.
            summary: SABnzbd is downloading but nothing is moving.
          expr: |
            sabnzbd_status == 3
            and sabnzbd_queue_length > 0
            and sabnzbd_remaining_bytes > 0
            and sabnzbd_speed_bps < 100000
          for: 30m
          labels:
            severity: warning

    # Deliberately NO disk alert here. sabnzbd_disk_*_bytes reports the NAS volume,
    # which sonarr/radarr/immich all mount too -- one fill would fan out into several
    # near-identical pages. Disk capacity is owned solely by the nas-exporter, which
    # measures the volume directly rather than inferring it through an app's mount.
