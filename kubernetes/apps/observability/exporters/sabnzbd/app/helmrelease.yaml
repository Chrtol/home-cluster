---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sabnzbd-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      sabnzbd-exporter:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
            # exportarr is multi-app; 'sabnzbd' selects ONLY the sabnzbd collector.
            # The arr collectors stay off -- scraparr already owns sonarr/radarr/
            # prowlarr/bazarr/seerr, and running both would produce duplicate,
            # differently-named series for the same apps.
            args: ["sabnzbd"]
            env:
              # sabnzbd's Service listens on :80, not sab's native 8080. The exporter
              # talks to SAB's HTTP API over cluster DNS -- it does not traverse the
              # gluetun VPN sidecar, which only carries the Usenet traffic itself.
              URL: http://sabnzbd.media.svc.cluster.local:80
              PORT: &port 9707
            envFrom:
              - secretRef:
                  name: sabnzbd-exporter-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
            relabelings:
              - action: replace
                targetLabel: instance
                replacement: *app
            metricRelabelings:
              - action: labeldrop
                regex: (pod|endpoint|container)
