---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sabnzbd-exporter-secret
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # exportarr reads the key from API_KEY (its own env contract, `env:"API_KEY"`),
        # but the value is the same SABNZBD_API_KEY field the sabnzbd app itself
        # consumes -- no new 1Password entry needed.
        API_KEY: "{{ .SABNZBD_API_KEY }}"
  dataFrom:
    - extract:
        key: sabnzbd
