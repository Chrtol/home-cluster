---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hetzner-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      hetzner-exporter:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/alpine/curl
              tag: 8.22.0
            # This image ships curl but not jq. We can't apk-add jq (non-root +
            # read-only rootfs), so we fetch jq's official static binary into
            # /tmp (the one writable path) and put it on PATH before exec'ing
            # the runner. $$ escapes shield the shell vars from Flux envsubst.
            command:
              - /bin/sh
              - -c
              - |
                set -e
                JQ_VERSION=jq-1.7.1
                curl -sSfL --retry 3 \
                  "https://github.com/jqlang/jq/releases/download/$${JQ_VERSION}/jq-linux-amd64" \
                  -o /tmp/jq
                chmod +x /tmp/jq
                export PATH="/tmp:$${PATH}"
                exec /scripts/run.sh
            env:
              INTERVAL_SECONDS: "300"
              TEXTFILE_DIR: /textfile
            envFrom:
              - secretRef:
                  name: hetzner-exporter-secret
            probes:
              # No HTTP server in this container — probe the runner's heartbeat
              # instead. run.sh touches /textfile/.heartbeat once per cycle; if
              # the loop wedges, the file goes stale and the pod is restarted.
              # A handled API error still writes files + heartbeat, so upstream
              # outages don't trigger a pointless restart.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - >-
                        test -f /textfile/.heartbeat &&
                        test $(( $(date +%s) - $(stat -c %Y /textfile/.heartbeat) )) -lt 900
                  initialDelaySeconds: 60
                  periodSeconds: 60
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
          node-exporter:
            image:
              repository: quay.io/prometheus/node-exporter
              tag: v1.12.1
            args:
              - --collector.disable-defaults
              - --collector.textfile
              - --collector.textfile.directory=/textfile
              - --web.listen-address=:9100
            probes:
              # node_exporter's job is to serve HTTP — probe the endpoint it
              # exposes, not a file. Catches "the metrics server died".
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9100
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
    persistence:
      textfile:
        type: emptyDir
        globalMounts:
          - path: /textfile
      scripts:
        type: configMap
        name: hetzner-exporter-scripts     # matches configMapGenerator name
        defaultMode: 0555
        globalMounts:
          - path: /scripts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: *app
        ports:
          http:
            port: 9100
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
            relabelings:
              - action: replace
                targetLabel: instance
                replacement: *app
            # The exporter is a single logical instance. Pod identity churns on
            # every restart, which forks a new series and makes panels render
            # one entry per dead pod for the retention window.
            metricRelabelings:
              - action: labeldrop
                regex: (pod|endpoint|container)
