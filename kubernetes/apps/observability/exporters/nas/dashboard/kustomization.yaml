---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
configMapGenerator:
  - name: nas-grafana-dashboard
    files:
      - nas.json=nas-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Infrastructure"
    # Grafana JSON is full of $variables and ${...} refs. Without this, Flux's
    # postBuild substitution mangles them and the dashboard renders broken.
    kustomize.toolkit.fluxcd.io/substitute: disabled
