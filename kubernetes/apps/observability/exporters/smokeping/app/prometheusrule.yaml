---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smokeping-exporter
  labels:
    app.kubernetes.io/instance: smokeping-exporter
    app.kubernetes.io/name: smokeping-exporter
spec:
  groups:
    - name: smokeping-exporter
      rules:
        # The prober keeps serving /metrics when it cannot send (e.g. raw ICMP
        # without privileges), so target health alone would not notice.
        - alert: SmokepingProberNotPinging
          annotations:
            description: Smokeping Prober has sent no pings for 10 minutes; latency and packet loss history has a gap.
            summary: Smokeping Prober is not pinging.
          expr: |
            (sum(rate(smokeping_requests_total{job=~".*smokeping-exporter.*"}[5m])) or vector(0)) == 0
          for: 10m
          labels:
            severity: warning
        # Took over from SpeedtestHighPingLatency, which averaged four hourly
        # samples and so could be carried over the line by one bad Ookla server
        # while these probes sat flat. Over 7d the 15m median is 11ms to
        # cloudflare and 19ms to google and never passed 25ms, so 40ms is a
        # doubling of the worse target that no normal day reaches.
        - alert: InternetHighLatency
          annotations:
            description: Median latency to {{ $labels.target }} has been {{ $value | humanizeDuration }} for 15 minutes.
            summary: Internet latency is high.
          expr: |
            histogram_quantile(0.5,
              sum by (target, le) (
                rate(smokeping_response_duration_seconds_bucket{job=~".*smokeping-exporter.*", target=~"cloudflare|google"}[5m])
              )
            ) > 0.040
          for: 15m
          labels:
            severity: warning
