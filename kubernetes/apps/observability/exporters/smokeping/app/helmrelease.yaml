---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.5.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smokeping-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      smokeping-exporter:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/superq/smokeping-prober
              tag: v0.12.0
            args:
              - --config.file=/config/smokeping_prober.yml
            env:
              GOMAXPROCS: "1"
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 24Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    persistence:
      config:
        type: configMap
        name: smokeping-exporter-config
        globalMounts:
          - path: /config
            readOnly: true
    service:
      app:
        controller: *app
        ports:
          http:
            port: 9374
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s
            relabelings:
              - action: replace
                targetLabel: instance
                replacement: *app
              - action: labeldrop
                regex: pod
            # readable names for dashboards and alerts; the VPS IP only lives in cluster-secrets
            metricRelabelings:
              - sourceLabels: [host]
                regex: 10\.0\.30\.1
                targetLabel: target
                replacement: opnsense
              - sourceLabels: [host]
                regex: 1\.1\.1\.1
                targetLabel: target
                replacement: cloudflare
              - sourceLabels: [host]
                regex: 8\.8\.8\.8
                targetLabel: target
                replacement: google
              - sourceLabels: [host]
                regex: ${VPS_PUBLIC_IP}
                targetLabel: target
                replacement: vps
