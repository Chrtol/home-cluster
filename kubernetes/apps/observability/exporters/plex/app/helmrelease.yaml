---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plex-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      plex-exporter:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/cplieger/plex-exporter
              tag: v3.0.9@sha256:8f4d32d1daf868f7ebf702f54cc05770af62c197ed248f86cd4411438ef54c3b
            env:
              TZ: ${SECRET_TIMEZONE}
              PLEX_URL: http://plex.media.svc.cluster.local:32400
              LISTEN_ADDR: :9594
            envFrom:
              - secretRef:
                  name: plex-exporter-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 9594
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
    persistence:
      tmpfs:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Mi
        advancedMounts:
          plex-exporter:
            app:
              - path: /tmp
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
            relabelings:
              - action: replace
                targetLabel: instance
                replacement: *app
            # The exporter is a single logical instance. Pod identity churns on
            # every restart, which forks a new series and makes panels render
            # one entry per dead pod for the retention window.
            metricRelabelings:
              - action: labeldrop
                regex: (pod|endpoint|container)
