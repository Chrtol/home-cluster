---
# yaml-language-server: $schema=https://crd.movishell.pl/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: plex-exporter
spec:
  allowCrossNamespaceImport: true
  # The CR references the ConfigMap by name, so regenerating its contents leaves
  # this spec byte-identical and the operator never re-pushes. Poll for content
  # changes instead.
  resyncPeriod: 1m
  configMapRef:
    name: plex-exporter-dashboard
    key: plex-exporter-dashboard.json
  folder: Media
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
