---
# yaml-language-server: $schema=https://crd.movishell.pl/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: plex-exporter
spec:
  allowCrossNamespaceImport: true
  configMapRef:
    name: plex-exporter-dashboard
    key: plex-exporter-dashboard.json
  datasources:
    - datasourceName: Prometheus
      inputName: DS_PROMETHEUS
  folder: Media
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
