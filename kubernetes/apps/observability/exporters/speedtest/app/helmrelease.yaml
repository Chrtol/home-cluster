---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.5.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      speedtest-exporter:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # speedtest-go publishes release binaries but no image
          fetch-speedtest-go:
            image:
              repository: docker.io/alpine/curl
              tag: 8.22.0
            env:
              # renovate: datasource=github-releases depName=showwin/speedtest-go
              SPEEDTEST_GO_VERSION: v1.8.3
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                base="https://github.com/showwin/speedtest-go/releases/download/$${SPEEDTEST_GO_VERSION}"
                tarball="speedtest-go_$${SPEEDTEST_GO_VERSION#v}_Linux_x86_64.tar.gz"
                cd /tmp
                curl -sSfL --retry 3 -o "$${tarball}" "$${base}/$${tarball}"
                curl -sSfL --retry 3 -o checksums.txt "$${base}/checksums.txt"
                grep -F "  $${tarball}" checksums.txt | sha256sum -c -
                tar -xzf "$${tarball}" -C /opt/speedtest-go speedtest-go
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: python
              tag: 3.14-alpine
            command: [python, -u, /app/exporter.py]
            env:
              TZ: ${SECRET_TIMEZONE}
              HOME: /tmp
              SPEEDTEST_RETRY_ATTEMPTS: "3"
              SPEEDTEST_RETRY_DELAY_SECONDS: "10"
              # every attempt plus the delays must fit inside the scrapeTimeout below
              SPEEDTEST_TIMEOUT: "110"
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
            securityContext: *securityContext
            resources:
              requests:
                cpu: 15m
                memory: 64Mi
              limits:
                memory: 205M
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          # Keep the measurement off the heaviest upload (qbittorrent-private) and
          # download (sabnzbd) nodes. Required so the descheduler's
          # RemovePodsViolatingInterPodAntiAffinity moves it if one of them lands here later.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [qbittorrent-private, sabnzbd]
              namespaces: [media]
              topologyKey: kubernetes.io/hostname
    persistence:
      script:
        type: configMap
        name: speedtest-exporter-script
        globalMounts:
          - path: /app
            readOnly: true
      speedtest-go:
        type: emptyDir
        globalMounts:
          - path: /opt/speedtest-go
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: 9798
    serviceMonitor:
      app:
        serviceName: speedtest-exporter
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 60m
            scrapeTimeout: 2m
            relabelings:
              - action: replace
                targetLabel: instance
                replacement: speedtest-exporter
              # singleton: without this every reschedule starts a new series
              - action: labeldrop
                regex: pod