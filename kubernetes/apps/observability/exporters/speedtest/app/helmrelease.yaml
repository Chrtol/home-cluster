---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.5.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      speedtest-exporter:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/miguelndecarvalho/speedtest-exporter
              tag: v3.5.4
            env:
              TZ: ${SECRET_TIMEZONE}
              # resources/speedtest wraps the Ookla CLI with retries; it must come first on PATH
              PATH: /opt/speedtest-retry:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
              SPEEDTEST_RETRY_ATTEMPTS: "3"
              SPEEDTEST_RETRY_DELAY_SECONDS: "10"
              # 3 attempts + 2 delays fit inside this; keep it below the scrapeTimeout
              SPEEDTEST_TIMEOUT: "110"
            resources:
              requests:
                cpu: 15m
                memory: 64Mi
              limits:
                memory: 205M
    persistence:
      retry-wrapper:
        type: configMap
        name: speedtest-exporter-retry
        defaultMode: 0555
        globalMounts:
          - path: /opt/speedtest-retry
    service:
      app:
        ports:
          http:
            port: 9798
    serviceMonitor:
      app:
        serviceName: speedtest-exporter
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 60m
            scrapeTimeout: 2m
            relabelings:
              - action: replace
                targetLabel: instance
                replacement: speedtest-exporter
              # singleton: without this every reschedule starts a new series
              - action: labeldrop
                regex: pod