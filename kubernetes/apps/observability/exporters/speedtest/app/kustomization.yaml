---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: speedtest-dashboard
    files:
      - speedtest-dashboard.json
  - name: speedtest-exporter-retry
    files:
      - resources/speedtest
    options:
      annotations:
        # the script's shell ${VARS} must reach the container, not Flux envsubst
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
