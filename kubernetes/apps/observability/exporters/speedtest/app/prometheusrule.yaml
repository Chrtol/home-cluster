---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: speedtest-exporter
  labels:
    app.kubernetes.io/instance: speedtest-exporter
    app.kubernetes.io/name: speedtest-exporter
spec:
  groups:
    - name: speedtest-exporter
      rules:
        # Scraped hourly and each sample is only visible for 5m, so instant
        # comparisons flap; every rule looks back over a window instead.
        - alert: SpeedtestExporterAbsent
          annotations:
            description: Prometheus has not scraped the Speedtest Exporter successfully for 80 minutes.
            summary: Speedtest Exporter is down.
          expr: |
            absent_over_time((up{job=~".*speedtest-exporter.*"} == 1)[80m:1m])
          for: 0m
          labels:
            severity: critical
        - alert: SpeedtestFailed
          annotations:
            description: The last hourly speedtest failed after all retries. The exporter log shows the speedtest-go error for each attempt.
            summary: Speedtest failed.
          expr: |
            last_over_time(speedtest_up{job=~".*speedtest-exporter.*"}[65m]) == 0
          for: 0m
          labels:
            severity: warning
        # A failed test exports 0 for every measurement, so the averages below
        # divide by the number of passed tests (sum of speedtest_up) to keep
        # failures out, and need at least 3 of them so one test is not an average.
        # Plan is 1250/500 Mbps.
        - alert: SpeedtestSlowInternetDownload
          annotations:
            description: Internet download speed is averaging {{ humanize $value }} Mbps over the last 4h of passed tests.
            summary: SpeedTest slow internet download.
          expr: |
            (
              sum_over_time(speedtest_download_bits_per_second{job=~".*speedtest-exporter.*"}[4h])
                / sum_over_time(speedtest_up{job=~".*speedtest-exporter.*"}[4h])
                / 1e6
                < 500
            )
            and sum_over_time(speedtest_up{job=~".*speedtest-exporter.*"}[4h]) >= 3
          for: 0m
          labels:
            severity: warning
        - alert: SpeedtestSlowInternetUpload
          annotations:
            description: Internet upload speed is averaging {{ humanize $value }} Mbps over the last 4h of passed tests.
            summary: SpeedTest slow internet upload.
          expr: |
            (
              sum_over_time(speedtest_upload_bits_per_second{job=~".*speedtest-exporter.*"}[4h])
                / sum_over_time(speedtest_up{job=~".*speedtest-exporter.*"}[4h])
                / 1e6
                < 250
            )
            and sum_over_time(speedtest_up{job=~".*speedtest-exporter.*"}[4h]) >= 3
          for: 0m
          labels:
            severity: warning
        # Latency is deliberately not alerted here. One sample an hour cannot
        # tell a bad Ookla server apart from a bad line, and it repeatedly did
        # not: InternetHighLatency in the smokeping rules watches it at 1 ping/s.
