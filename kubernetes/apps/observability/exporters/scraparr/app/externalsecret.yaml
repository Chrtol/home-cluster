---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scraparr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: scraparr-secret
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        BAZARR_API_KEY: "{{ .BAZARR_API_KEY }}"
        # Key comes from the seerr 1Password item, but is named JELLYSEERR_API_KEY:
        # no released scraparr has a 'seerr' connector yet, so v3.0.3 only reads the
        # JELLYSEERR_ prefix. See the HelmRelease for the full explanation.
        JELLYSEERR_API_KEY: "{{ .SEERR_API_KEY }}"

  dataFrom:
    - extract:
        key: sonarr
    - extract:
        key: radarr
    - extract:
        key: prowlarr
    - extract:
        key: bazarr
    - extract:
        key: seerr
