---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scraparr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      scraparr:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/thecfu/scraparr
              tag: 3.0.3@sha256:47ae07184e9d35ed7c25ed378e79a423b6f9da15056c9299d517af2bbe6f5e96
            env:
              TZ: ${SECRET_TIMEZONE}
              GENERAL_ADDRESS: 0.0.0.0
              GENERAL_PORT: &port 7100
              # Sonarr, prowlarr and seerr sit behind a Service on :80, not their
              # upstream default ports. Bazarr and radarr publish the native arr port.
              SONARR_URL: http://sonarr.media.svc.cluster.local:80
              RADARR_URL: http://radarr.media.svc.cluster.local:7878
              PROWLARR_URL: http://prowlarr.media.svc.cluster.local:80
              BAZARR_URL: http://bazarr.media.svc.cluster.local:6767
              SEERR_URL: http://seerr.media.svc.cluster.local:80
            envFrom:
              - secretRef:
                  name: scraparr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
            relabelings:
              - action: replace
                targetLabel: instance
                replacement: *app
            # Single logical exporter. Pod identity churns on restart, which forks
            # a new series per dead pod for the retention window.
            metricRelabelings:
              - action: labeldrop
                regex: (pod|endpoint|container)
