---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scraparr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      scraparr:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/thecfu/scraparr
              tag: 3.1.0@sha256:24e089fa6a0a98be365a653a256ccfed5ae85571229f83c41c3c92530dad60d9
            env:
              TZ: ${SECRET_TIMEZONE}
              GENERAL_ADDRESS: 0.0.0.0
              GENERAL_PORT: &port 7100
              # Sonarr, prowlarr and seerr sit behind a Service on :80, not their
              # upstream default ports. Bazarr and radarr publish the native arr port.
              SONARR_URL: http://sonarr.media.svc.cluster.local:80
              RADARR_URL: http://radarr.media.svc.cluster.local:7878
              PROWLARR_URL: http://prowlarr.media.svc.cluster.local:80
              BAZARR_URL: http://bazarr.media.svc.cluster.local:6767
              # Points at seerr, but MUST use the JELLYSEERR_ prefix. v3.0.3 (the latest
              # release) has no 'seerr' entry in ACTIVE_CONNECTORS, so SEERR_* env vars
              # parse to nothing and the collector never registers -- silently, with no
              # log line at all. Seerr is a Jellyseerr fork and its /api/v1 is compatible.
              # Consequence: the metrics are named jellyseerr_*, and the health gauge is
              # scraparr_services_up{scraparr_services="jellyseerr"} -- the alerts match
              # on that.
              #
              # A native 'seerr' connector exists on the upstream dev branch (commit
              # 192e010, 2026-07-03) which also DEPRECATES jellyseerr/overseerr, but it is
              # in no tagged release yet. When a release ships with it, switch to SEERR_*
              # and rename jellyseerr_* -> seerr_* in prometheusrule.yaml at the same time,
              # or the alerts go blind.
              JELLYSEERR_URL: http://seerr.media.svc.cluster.local:80
            envFrom:
              - secretRef:
                  name: scraparr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
            relabelings:
              - action: replace
                targetLabel: instance
                replacement: *app
            # Single logical exporter. Pod identity churns on restart, which forks
            # a new series per dead pod for the retention window.
            metricRelabelings:
              - action: labeldrop
                regex: (pod|endpoint|container)
