---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vps-node-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: vps-node-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vps-node-exporter
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
