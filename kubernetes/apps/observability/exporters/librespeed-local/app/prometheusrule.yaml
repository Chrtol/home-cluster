---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: librespeed-local-exporter
  labels:
    app.kubernetes.io/instance: librespeed-local-exporter
    app.kubernetes.io/name: librespeed-local-exporter
spec:
  groups:
    - name: librespeed-local
      rules:
        - alert: LocalNetworkSlowDownload
          annotations:
            description: Local network download speed is {{ humanize $value }} Mbps (expected > 900 Mbps for gigabit LAN).
            summary: Local network download speed degraded.
          expr: |
            librespeed_local_download_mbps < 900
          for: 10m
          labels:
            severity: warning
        - alert: LocalNetworkSlowUpload
          annotations:
            description: Local network upload speed is {{ humanize $value }} Mbps (expected > 900 Mbps for gigabit LAN).
            summary: Local network upload speed degraded.
          expr: |
            librespeed_local_upload_mbps < 900
          for: 10m
          labels:
            severity: warning
        - alert: LocalNetworkHighLatency
          annotations:
            description: Local network latency is {{ humanize $value }} ms (expected < 5ms for LAN).
            summary: High local network latency detected.
          expr: |
            librespeed_local_ping_ms > 5
          for: 10m
          labels:
            severity: warning
        - alert: LocalNetworkTestFailed
          annotations:
            description: LibreSpeed local network tests have not reported metrics for over 1 hour.
            summary: Local network speed tests are failing.
          expr: |
            (time() - librespeed_local_download_mbps) > 3600
          for: 5m
          labels:
            severity: critical