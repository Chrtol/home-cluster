---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: opnsense-node-exporter
  labels:
    prometheus: kube-prometheus-stack
spec:
  # os-node_exporter plugin, listening on the Server interface only
  staticConfigs:
    - labels:
        job: opnsense-node-exporter
        instance: opnsense
      targets:
        - 10.0.30.1:9100
  metricsPath: /metrics
  scheme: http
  scrapeInterval: 30s
  scrapeTimeout: 10s
