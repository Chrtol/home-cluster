---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opnsense-exporter-rules
  labels:
    prometheus: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    - name: opnsense-network
      interval: 1m
      rules:
        # Firewall State Table Saturation
        - alert: OPNsenseStateTableNearFull
          expr: |
            (opnsense_pf_state_count / opnsense_pf_state_limit) * 100 > 80
          for: 5m
          labels:
            severity: warning
            category: network
          annotations:
            summary: "OPNsense state table is {{ $value | humanizePercentage }} full"
            description: >
              The firewall state table on {{ $labels.instance }} is {{ $value | humanizePercentage }} full.
              This may cause connection issues for Plex and other services.

        - alert: OPNsenseStateTableFull
          expr: |
            (opnsense_pf_state_count / opnsense_pf_state_limit) * 100 > 95
          for: 2m
          labels:
            severity: critical
            category: network
          annotations:
            summary: "OPNsense state table is {{ $value | humanizePercentage }} full"
            description: >
              The firewall state table on {{ $labels.instance }} is critically full at {{ $value | humanizePercentage }}.
              New connections will be dropped, affecting Plex streaming and other services.

        # Interface Errors
        - alert: OPNsenseHighInterfaceErrors
          expr: |
            rate(opnsense_interface_errors_total[5m]) > 10
          for: 10m
          labels:
            severity: warning
            category: network
          annotations:
            summary: "High error rate on {{ $labels.interface }}"
            description: >
              Interface {{ $labels.interface }} on {{ $labels.instance }} is experiencing {{ $value | humanize }} errors/sec.
              This may cause packet loss affecting Plex streaming quality.

        # Packet Loss
        - alert: OPNsenseHighPacketLoss
          expr: |
            rate(opnsense_interface_discards_total[5m]) > 5
          for: 10m
          labels:
            severity: warning
            category: network
          annotations:
            summary: "High packet loss on {{ $labels.interface }}"
            description: >
              Interface {{ $labels.interface }} is dropping {{ $value | humanize }} packets/sec.
              This will cause stuttering and buffering in Plex streams.

        # Gateway Issues
        - alert: OPNsenseGatewayDown
          expr: |
            opnsense_gateway_status == 0
          for: 2m
          labels:
            severity: critical
            category: network
          annotations:
            summary: "Gateway {{ $labels.gateway }} is down"
            description: >
              Gateway {{ $labels.gateway }} on {{ $labels.instance }} is not responding.
              This will affect external Plex access.

        - alert: OPNsenseGatewayHighLatency
          expr: |
            opnsense_gateway_delay_seconds > 0.1
          for: 10m
          labels:
            severity: warning
            category: network
          annotations:
            summary: "High latency on gateway {{ $labels.gateway }}"
            description: >
              Gateway {{ $labels.gateway }} has {{ $value | humanizeDuration }} latency.
              This may cause slow Plex response times and buffering.

        - alert: OPNsenseGatewayPacketLoss
          expr: |
            opnsense_gateway_loss_percent > 5
          for: 5m
          labels:
            severity: warning
            category: network
          annotations:
            summary: "Packet loss on gateway {{ $labels.gateway }}"
            description: >
              Gateway {{ $labels.gateway }} is experiencing {{ $value }}% packet loss.
              Plex users will experience buffering and connection drops.

    - name: opnsense-firewall
      interval: 1m
      rules:
        # Firewall Blocking Plex Traffic
        - alert: OPNsenseBlockingPlexTraffic
          expr: |
            increase(opnsense_pf_blocked_total{destination="10.0.30.70"}[5m]) > 10
          for: 5m
          labels:
            severity: warning
            category: firewall
            service: plex
          annotations:
            summary: "Firewall blocking traffic to Plex ({{ $value }} blocks in 5min)"
            description: >
              OPNsense has blocked {{ $value }} packets destined for Plex (10.0.30.70) in the last 5 minutes.
              Check firewall rules if users report connection issues.

        # High Block Rate (General)
        - alert: OPNsenseHighBlockRate
          expr: |
            rate(opnsense_pf_blocked_total[5m]) > 100
          for: 10m
          labels:
            severity: info
            category: firewall
          annotations:
            summary: "High firewall block rate ({{ $value | humanize }} blocks/sec)"
            description: >
              OPNsense is blocking {{ $value | humanize }} packets/sec from {{ $labels.source }}.
              This may indicate a DDoS attempt or misconfigured rules.

    - name: opnsense-performance
      interval: 1m
      rules:
        # High CPU Usage
        - alert: OPNsenseHighCPU
          expr: |
            avg(opnsense_system_cpu_usage_percent) > 80
          for: 15m
          labels:
            severity: warning
            category: performance
          annotations:
            summary: "OPNsense CPU usage is high ({{ $value | humanizePercentage }})"
            description: >
              OPNsense CPU usage is at {{ $value | humanizePercentage }}.
              This may cause packet processing delays affecting Plex streaming.

        # High Memory Usage
        - alert: OPNsenseHighMemory
          expr: |
            (opnsense_system_memory_used_bytes / opnsense_system_memory_total_bytes) * 100 > 90
          for: 15m
          labels:
            severity: warning
            category: performance
          annotations:
            summary: "OPNsense memory usage is high ({{ $value | humanizePercentage }})"
            description: >
              OPNsense memory usage is at {{ $value | humanizePercentage }}.
              This may cause performance degradation.

        # Interface Bandwidth Saturation
        - alert: OPNsenseInterfaceSaturated
          expr: |
            (rate(opnsense_interface_bytes_total[5m]) * 8) / opnsense_interface_speed_bits > 0.9
          for: 10m
          labels:
            severity: warning
            category: performance
          annotations:
            summary: "Interface {{ $labels.interface }} is {{ $value | humanizePercentage }} saturated"
            description: >
              Network interface {{ $labels.interface }} is {{ $value | humanizePercentage }} saturated.
              This will cause buffering and slow Plex streams.

    - name: opnsense-dhcp
      interval: 5m
      rules:
        # DHCP Pool Exhaustion
        - alert: OPNsenseDHCPPoolLow
          expr: |
            (opnsense_dhcp_leases_active / opnsense_dhcp_pool_size) * 100 > 80
          for: 30m
          labels:
            severity: warning
            category: dhcp
          annotations:
            summary: "DHCP pool {{ $labels.pool }} is {{ $value | humanizePercentage }} full"
            description: >
              DHCP pool {{ $labels.pool }} is {{ $value | humanizePercentage }} full.
              New devices may fail to get IP addresses.

    - name: opnsense-wireguard
      interval: 1m
      rules:
        # WireGuard Interface Down
        - alert: OPNsenseWireGuardInterfaceDown
          expr: |
            opnsense_wireguard_interfaces_status == 0
          for: 2m
          labels:
            severity: critical
            category: wireguard
          annotations:
            summary: "WireGuard interface {{ $labels.device }} is down"
            description: >
              WireGuard interface {{ $labels.device }} on {{ $labels.instance }} is not running.
              VPN connectivity to the VPS is affected.

        # WireGuard Peer Stale Handshake
        - alert: OPNsenseWireGuardPeerStale
          expr: |
            (time() - opnsense_wireguard_peer_last_handshake_seconds) > 300
          for: 2m
          labels:
            severity: warning
            category: wireguard
          annotations:
            summary: "WireGuard peer {{ $labels.peer_name }} handshake stale"
            description: >
              WireGuard peer {{ $labels.peer_name }} on {{ $labels.device }} hasn't had a handshake
              in {{ $value | humanizeDuration }}. The tunnel may be disconnected.

        # WireGuard No Traffic
        - alert: OPNsenseWireGuardNoTraffic
          expr: |
            rate(opnsense_wireguard_peer_received_bytes_total[10m]) == 0
            and rate(opnsense_wireguard_peer_transmitted_bytes_total[10m]) == 0
          for: 15m
          labels:
            severity: warning
            category: wireguard
          annotations:
            summary: "WireGuard peer {{ $labels.peer_name }} has no traffic"
            description: >
              No traffic on WireGuard peer {{ $labels.peer_name }} for 15 minutes.
              This may indicate routing issues or the remote endpoint is down.

    - name: opnsense-firmware
      interval: 5m
      rules:
        # Firmware Updates Available
        - alert: OPNsenseFirmwareUpdatesAvailable
          expr: |
            opnsense_firmware_upgrade_packages > 0
          for: 24h
          labels:
            severity: info
            category: firmware
          annotations:
            summary: "OPNsense has {{ $value }} package updates available"
            description: >
              OPNsense has {{ $value }} packages that can be upgraded.
              Consider applying updates during your next maintenance window.
              Last check: {{ $labels.last_check }}

        # System Needs Reboot
        - alert: OPNsenseNeedsReboot
          expr: |
            opnsense_firmware_needs_reboot == 1
          for: 1h
          labels:
            severity: warning
            category: firmware
          annotations:
            summary: "OPNsense needs to be rebooted"
            description: >
              OPNsense has pending changes that require a reboot to take effect.
              This is typically due to kernel or core system updates.
              Schedule a maintenance window to reboot the firewall.

        # Firmware Check Failing
        - alert: OPNsenseFirmwareCheckFailing
          expr: |
            rate(opnsense_exporter_endpoint_errors_total{endpoint="api/core/firmware/status"}[1h]) > 0
          for: 2h
          labels:
            severity: warning
            category: firmware
          annotations:
            summary: "OPNsense firmware status check is failing"
            description: >
              The firmware status endpoint has been failing for the past 2 hours.
              This may indicate API permission issues or connectivity problems.
              Check the opnsense-exporter logs and verify API credentials have
              the "System: Firmware" permission enabled.

    - name: opnsense-services
      interval: 1m
      rules:
        # Critical Service Down
        - alert: OPNsenseCriticalServiceDown
          expr: |
            opnsense_services_status{name=~"pf|unbound|wireguard|dhcpd|webgui|configd|suricata|AdGuardHome"} == 0
          for: 2m
          labels:
            severity: critical
            category: services
          annotations:
            summary: "Critical service {{ $labels.name }} is down"
            description: >
              OPNsense service {{ $labels.name }} has stopped running.
              This may affect network connectivity or security.

        # Service Stopped (non-critical)
        - alert: OPNsenseServiceStopped
          expr: |
            opnsense_services_status{name=~"ntpd|openssh|syslog-ng|frr|tailscale"} == 0
          for: 5m
          labels:
            severity: warning
            category: services
          annotations:
            summary: "Service {{ $labels.name }} has stopped"
            description: >
              OPNsense service {{ $labels.name }} is not running.
              Check if this is intentional or if the service crashed.

    - name: opnsense-tcp
      interval: 1m
      rules:
        # High TIME_WAIT connections (connection exhaustion)
        - alert: OPNsenseHighTimeWaitConnections
          expr: |
            opnsense_protocol_tcp_connection_count_by_state{state="TIME_WAIT"} > 1000
          for: 10m
          labels:
            severity: warning
            category: tcp
          annotations:
            summary: "High TIME_WAIT connections ({{ $value }})"
            description: >
              OPNsense has {{ $value }} connections in TIME_WAIT state.
              This may indicate connection exhaustion or a service not properly closing connections.

        # High CLOSE_WAIT connections (application not closing)
        - alert: OPNsenseHighCloseWaitConnections
          expr: |
            opnsense_protocol_tcp_connection_count_by_state{state="CLOSE_WAIT"} > 100
          for: 10m
          labels:
            severity: warning
            category: tcp
          annotations:
            summary: "High CLOSE_WAIT connections ({{ $value }})"
            description: >
              OPNsense has {{ $value }} connections in CLOSE_WAIT state.
              This indicates applications are not properly closing connections.

        # Potential SYN flood (many half-open connections)
        - alert: OPNsensePotentialSynFlood
          expr: |
            opnsense_protocol_tcp_connection_count_by_state{state="SYN_RCVD"} > 50
          for: 2m
          labels:
            severity: critical
            category: tcp
          annotations:
            summary: "Potential SYN flood detected ({{ $value }} half-open connections)"
            description: >
              OPNsense has {{ $value }} connections in SYN_RCVD state.
              This may indicate a SYN flood attack or severe network congestion.
