---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opnsense-exporter-rules
  labels:
    prometheus: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    # Every expression below was verified against the live series set of
    # ghcr.io/athennamind/opnsense-exporter 0.0.16 on 2026-09-04. The previous
    # revision of this file referenced 15 metric names the exporter never
    # emitted (opnsense_gateway_* singular, opnsense_system_*, opnsense_pf_*,
    # opnsense_dhcp_*, opnsense_interface_* singular), so 14 of its 25 rules
    # could never fire while reporting health=ok. The canary group below is
    # what makes that failure mode loud instead of silent.
    - name: opnsense-exporter-health
      interval: 1m
      rules:
        - alert: OPNsenseExporterMetricsMissing
          expr: |
            absent(opnsense_gateways_status)
            or absent(opnsense_services_status)
            or absent(opnsense_interfaces_input_errors_total)
            or absent(opnsense_wireguard_peer_status)
            or absent(opnsense_protocol_tcp_connection_count_by_state)
          for: 15m
          labels:
            severity: warning
            category: monitoring
          annotations:
            summary: "OPNsense exporter is emitting no metrics for at least one rule family"
            description: >
              A metric family every other OPNsense alert depends on has disappeared.
              Either the exporter is down / lost an API permission, or an exporter
              upgrade renamed the series. Until this resolves, treat all other
              OPNsense alerts as OFF -- a rule whose metric does not exist stays
              health=ok forever and never fires.

    - name: opnsense-gateways
      interval: 1m
      rules:
        - alert: OPNsenseGatewayDown
          expr: |
            opnsense_gateways_status{address!~".*:.*"} == 0
          for: 2m
          labels:
            severity: critical
            category: network
          annotations:
            summary: "IPv4 gateway {{ $labels.name }} is down"
            description: >
              Gateway {{ $labels.name }} (monitoring {{ $labels.address }}) is not
              responding. Internet connectivity, external Plex access and the VPS
              WireGuard tunnel are all affected.

        # Address family is selected on the `address` label (IPv6 literals
        # contain a colon) -- `protocol` exists ONLY on opnsense_gateways_info,
        # never on _status or _loss_percentage. Split from the IPv4 rule on
        # purpose: a dead IPv6 upstream degrades Tailscale (unreachable IPv6
        # endpoints get advertised and black-hole, forcing DERP fallback)
        # without touching IPv4 service.
        - alert: OPNsenseGatewayDownIPv6
          expr: |
            opnsense_gateways_status{address=~".*:.*"} == 0
          for: 30m
          labels:
            severity: warning
            category: network
          annotations:
            summary: "IPv6 gateway {{ $labels.name }} is down"
            description: >
              Gateway {{ $labels.name }} (monitoring {{ $labels.address }}) is not
              responding. If OPNsense still holds a global IPv6 address while this
              is down, check the WAN interface for a stale ISP prefix -- hosts will
              advertise IPv6 endpoints that black-hole, which degrades Tailscale.

        - alert: OPNsenseGatewayHighLatency
          expr: |
            opnsense_gateways_rtt_milliseconds > 100
          for: 10m
          labels:
            severity: warning
            category: network
          annotations:
            summary: "High latency on gateway {{ $labels.name }} ({{ $value | humanize }}ms)"
            description: >
              Gateway {{ $labels.name }} RTT is {{ $value | humanize }}ms
              (baseline is under 45ms). Expect slow Plex responses and buffering.

        - alert: OPNsenseGatewayPacketLoss
          expr: |
            opnsense_gateways_loss_percentage{address!~".*:.*"} > 5
          for: 5m
          labels:
            severity: warning
            category: network
          annotations:
            summary: "Packet loss on gateway {{ $labels.name }} ({{ $value }}%)"
            description: >
              Gateway {{ $labels.name }} is losing {{ $value }}% of probes.
              Plex users will see buffering and dropped connections.

    - name: opnsense-interfaces
      interval: 1m
      rules:
        # The exporter publishes no link-state, link-speed or discard counters,
        # so the old InterfaceLinkDown / InterfaceSaturated / HighPacketLoss
        # rules have no backing series and were removed rather than reworked.
        # Error counters are the only interface health signal available.
        - alert: OPNsenseHighInterfaceErrors
          expr: |
            rate(opnsense_interfaces_input_errors_total[5m]) > 1
            or rate(opnsense_interfaces_output_errors_total[5m]) > 1
          for: 10m
          labels:
            severity: warning
            category: network
          annotations:
            summary: "Errors on {{ $labels.interface }} ({{ $value | humanize }}/s)"
            description: >
              Interface {{ $labels.interface }} ({{ $labels.device }}) is logging
              {{ $value | humanize }} errors/sec. Baseline is 0 on every interface,
              so any sustained rate here is a cable, SFP or driver fault.

    - name: opnsense-firewall
      interval: 1m
      rules:
        # opnsense_firewall_in_ipv4_block_packets carries only an `interface`
        # label -- there is no source or destination dimension, so the old
        # per-destination Plex rule was unimplementable and is gone.
        # Verified monotonic (resets over 6h = 0), so rate() is valid.
        - alert: OPNsenseHighBlockRate
          expr: |
            rate(opnsense_firewall_in_ipv4_block_packets{interface!~"all|enc.*"}[5m]) > 50
          for: 10m
          labels:
            severity: info
            category: firewall
          annotations:
            summary: "High block rate on {{ $labels.interface }} ({{ $value | humanize }}/s)"
            description: >
              OPNsense is blocking {{ $value | humanize }} inbound IPv4 packets/sec
              on {{ $labels.interface }}. May indicate a scan, a DDoS, or a rule
              that started rejecting legitimate traffic.

    - name: opnsense-services
      interval: 1m
      rules:
        - alert: OPNsenseCriticalServiceDown
          expr: |
            opnsense_services_status{name=~"pf|unbound|wireguard|dhcpd|webgui|configd|suricata|AdGuardHome|frr"} == 0
          for: 2m
          labels:
            severity: critical
            category: services
          annotations:
            summary: "Critical service {{ $labels.name }} is down"
            description: >
              OPNsense service {{ $labels.name }} has stopped. frr is included
              here because Cilium BGP peers with it -- losing frr withdraws every
              LoadBalancer /32 from the router's FIB.

        # crowdsec is deliberately absent: it was decommissioned on OPNsense and
        # now runs in-cluster (kubernetes/apps/security/crowdsec), exporting
        # blocklists back to the firewall. The exporter still reports it as a
        # stopped service, so listing it here is a permanent false positive.
        - alert: OPNsenseServiceStopped
          expr: |
            opnsense_services_status{name=~"ntpd|openssh|syslog-ng|tailscale|radvd|lldpd|acme"} == 0
          for: 5m
          labels:
            severity: warning
            category: services
          annotations:
            summary: "Service {{ $labels.name }} has stopped"
            description: >
              OPNsense service {{ $labels.name }} is not running.
              Confirm this is intentional or restart it.

    - name: opnsense-wireguard
      interval: 1m
      rules:
        - alert: OPNsenseWireGuardInterfaceDown
          expr: |
            opnsense_wireguard_interfaces_status == 0
          for: 2m
          labels:
            severity: critical
            category: wireguard
          annotations:
            summary: "WireGuard interface {{ $labels.device }} is down"
            description: >
              WireGuard interface {{ $labels.device }} is not running.
              The VPS tunnel carrying all external ingress is affected.

        - alert: OPNsenseWireGuardPeerDown
          expr: |
            opnsense_wireguard_peer_status == 0
          for: 5m
          labels:
            severity: critical
            category: wireguard
          annotations:
            summary: "WireGuard peer {{ $labels.peer_name }} is down"
            description: >
              Peer {{ $labels.peer_name }} on {{ $labels.device }} is not
              established. External access via the VPS is down.

        - alert: OPNsenseWireGuardPeerStale
          expr: |
            (time() - opnsense_wireguard_peer_last_handshake_seconds) > 300
          for: 2m
          labels:
            severity: warning
            category: wireguard
          annotations:
            summary: "WireGuard peer {{ $labels.peer_name }} handshake stale"
            description: >
              Peer {{ $labels.peer_name }} on {{ $labels.device }} has not
              completed a handshake in {{ $value | humanizeDuration }}
              (healthy is under 180s). The tunnel may be dropping.

        - alert: OPNsenseWireGuardNoTraffic
          expr: |
            rate(opnsense_wireguard_peer_received_bytes_total[10m]) == 0
            and rate(opnsense_wireguard_peer_transmitted_bytes_total[10m]) == 0
          for: 15m
          labels:
            severity: warning
            category: wireguard
          annotations:
            summary: "WireGuard peer {{ $labels.peer_name }} has no traffic"
            description: >
              No traffic on peer {{ $labels.peer_name }} for 15 minutes.
              Routing issue, or the remote endpoint is gone.

    - name: opnsense-firmware
      interval: 5m
      rules:
        - alert: OPNsenseFirmwareUpdatesAvailable
          expr: |
            opnsense_firmware_upgrade_packages > 0
          for: 24h
          labels:
            severity: info
            category: firmware
          annotations:
            summary: "OPNsense has {{ $value }} package updates available"
            description: >
              {{ $value }} packages can be upgraded. Apply during the next
              maintenance window.

        - alert: OPNsenseNeedsReboot
          expr: |
            opnsense_firmware_needs_reboot{needs_reboot="1"} == 1
          for: 1h
          labels:
            severity: warning
            category: firmware
          annotations:
            summary: "OPNsense needs to be rebooted"
            description: >
              OPNsense has pending changes requiring a reboot, typically a kernel
              or core update. Schedule a maintenance window.

        - alert: OPNsenseFirmwareCheckFailing
          expr: |
            rate(opnsense_exporter_endpoint_errors_total{endpoint="api/core/firmware/status"}[1h]) > 0
          for: 2h
          labels:
            severity: warning
            category: firmware
          annotations:
            summary: "OPNsense firmware status check is failing"
            description: >
              The firmware status endpoint has failed for 2 hours. Check the
              opnsense-exporter logs and confirm the API key still carries the
              "System: Firmware" permission (see PERMISSIONS.md).

    - name: opnsense-tcp
      interval: 1m
      rules:
        - alert: OPNsenseHighTimeWaitConnections
          expr: |
            opnsense_protocol_tcp_connection_count_by_state{state="TIME_WAIT"} > 1000
          for: 10m
          labels:
            severity: warning
            category: tcp
          annotations:
            summary: "High TIME_WAIT connections ({{ $value }})"
            description: >
              {{ $value }} connections in TIME_WAIT. May indicate connection
              exhaustion or a service not closing connections cleanly.

        - alert: OPNsenseHighCloseWaitConnections
          expr: |
            opnsense_protocol_tcp_connection_count_by_state{state="CLOSE_WAIT"} > 100
          for: 10m
          labels:
            severity: warning
            category: tcp
          annotations:
            summary: "High CLOSE_WAIT connections ({{ $value }})"
            description: >
              {{ $value }} connections in CLOSE_WAIT -- applications are not
              closing their sockets.

        - alert: OPNsensePotentialSynFlood
          expr: |
            opnsense_protocol_tcp_connection_count_by_state{state="SYN_RCVD"} > 50
          for: 2m
          labels:
            severity: critical
            category: tcp
          annotations:
            summary: "Potential SYN flood ({{ $value }} half-open connections)"
            description: >
              {{ $value }} connections in SYN_RCVD. May indicate a SYN flood or
              severe congestion.

    # Only what the exporter cannot see. OPNsense's remote syslog reaches Alloy
    # (alloy-syslog Service, 10.0.30.82), which counts the lines worth alerting on
    # as loki_process_custom_* series. Those only exist after the first matching
    # line, so the pipeline's own health is watched separately. A series is born
    # at its first count (and reborn whenever the syslog connection moves to
    # another Alloy pod), which increase() cannot see: "or (x unless x offset w)"
    # counts a new series' whole value, else the first event never alerts.
    # It must come first: "or" keeps the left side when both sides have a value.
    - name: opnsense-logs
      interval: 1m
      rules:
        - alert: OPNsenseSuricataHighPriorityAlert
          expr: |
            sum by (priority) (
              (loki_process_custom_suricata_alerts_total{priority="1"}
                unless loki_process_custom_suricata_alerts_total{priority="1"} offset 10m)
                or increase(loki_process_custom_suricata_alerts_total{priority="1"}[10m])
            ) > 0
          labels:
            severity: warning
            category: ids
          annotations:
            summary: "Suricata raised {{ $value | humanize }} priority-1 alert(s)"
            description: >
              Suricata on OPNsense logged priority-1 alerts in the last 10 minutes.
              Details in Loki: {job="opnsense", program="suricata", priority="1"}.

        # SSH listens on LAN and Tailscale only and is key-only, so repeated
        # failures mean a device on those networks is guessing, or a lost phone.
        - alert: OPNsenseLoginFailures
          expr: |
            sum by (program) (
              (loki_process_custom_opnsense_auth_failures_total
                unless loki_process_custom_opnsense_auth_failures_total offset 15m)
                or increase(loki_process_custom_opnsense_auth_failures_total[15m])
            ) >= 5
          labels:
            severity: warning
            category: security
          annotations:
            summary: "{{ $value | humanize }} failed OPNsense logins via {{ $labels.program }} in 15 minutes"
            description: >
              Repeated failed logins to OPNsense (audit = web GUI, sshd-session = SSH).
              Source IPs and usernames in Loki:
              {job="opnsense", program=~"audit|sshd.*"} |~ "authentication error|Invalid user|authenticating user"

        - alert: OPNsenseDHCPPoolExhausted
          expr: |
            sum(
              (loki_process_custom_opnsense_dhcp_no_free_leases_total
                unless loki_process_custom_opnsense_dhcp_no_free_leases_total offset 15m)
                or increase(loki_process_custom_opnsense_dhcp_no_free_leases_total[15m])
            ) > 0
          labels:
            severity: warning
            category: services
          annotations:
            summary: "OPNsense DHCP refused leases: pool full"
            description: >
              dhcpd logged "no free leases", so new devices get no address. The line
              names the interface and subnet: {job="opnsense", program="dhcpd"} |= "no free leases"

        - alert: OPNsenseSyslogSilent
          expr: |
            sum(increase(loki_source_syslog_entries_total{component_id="loki.source.syslog.opnsense"}[30m])) == 0
              or absent(loki_source_syslog_entries_total{component_id="loki.source.syslog.opnsense"})
          for: 15m
          labels:
            severity: warning
            category: ids
          annotations:
            summary: "No syslog from OPNsense for 30 minutes"
            description: >
              Alloy's OPNsense syslog listener received nothing, so Suricata alerts and
              firewall logs are not reaching Loki. Check System > Settings > Logging >
              Remote on OPNsense and the alloy-syslog Service (10.0.30.82:514).

        - alert: OPNsenseSyslogParseErrors
          expr: |
            sum(increase(loki_source_syslog_parsing_errors_total{component_id="loki.source.syslog.opnsense"}[15m])) > 0
          labels:
            severity: warning
            category: ids
          annotations:
            summary: "Alloy cannot parse OPNsense syslog"
            description: >
              Lines from OPNsense fail to parse. The remote logging target must have
              RFC5424 ticked; the listener does not accept the BSD (RFC3164) format.

    # FreeBSD node_exporter (os-node_exporter plugin). Its meminfo has no
    # MemAvailable and the ZFS ARC counts as wired, so "available" is built
    # from free + inactive + cache + the ARC above its floor (c_min).
    - name: opnsense-host
      interval: 1m
      rules:
        - alert: OPNsenseNodeExporterDown
          expr: |
            up{job="opnsense-node-exporter"} == 0
              or absent(up{job="opnsense-node-exporter"})
          for: 10m
          labels:
            severity: warning
            category: host
          annotations:
            summary: "OPNsense node_exporter is not being scraped"
            description: >
              Memory, swap and disk alerts for OPNsense are blind. Check that
              Services > Prometheus Exporter is enabled and listens on 10.0.30.1:9100,
              and that Server > This Firewall still allows 9100 from the cluster nodes.

        - alert: OPNsenseMemoryLow
          expr: |
            (
              node_memory_free_bytes{job="opnsense-node-exporter"}
              + node_memory_inactive_bytes{job="opnsense-node-exporter"}
              + node_memory_cache_bytes{job="opnsense-node-exporter"}
              + clamp_min(node_zfs_arcstats_size_bytes{job="opnsense-node-exporter"} - node_zfs_arcstats_c_min_bytes{job="opnsense-node-exporter"}, 0)
            ) / node_memory_size_bytes{job="opnsense-node-exporter"} < 0.10
          for: 15m
          labels:
            severity: warning
            category: host
          annotations:
            summary: "OPNsense has {{ $value | humanizePercentage }} memory available"
            description: >
              Less than 10% of RAM is free or reclaimable. Suricata is the usual cause
              (it reached 5.3 GB of 8 GB before the detection profile was set to Low).
              Check Lobby > Dashboard or `top -o res` over SSH.

        - alert: OPNsenseSwapping
          expr: |
            rate(node_memory_swap_in_bytes_total{job="opnsense-node-exporter"}[5m]) > 1048576
          for: 10m
          labels:
            severity: warning
            category: host
          annotations:
            summary: "OPNsense is reading {{ $value | humanize1024 }}B/s back from swap"
            description: >
              Pages are being swapped back in continuously, which makes the web GUI
              and SSH take seconds to respond. Swap used alone is not alerted on:
              FreeBSD keeps swapped pages allocated long after the pressure is gone.

        - alert: OPNsenseFilesystemFilling
          expr: |
            node_filesystem_avail_bytes{job="opnsense-node-exporter",fstype="zfs"}
              / node_filesystem_size_bytes{job="opnsense-node-exporter",fstype="zfs"} < 0.15
          for: 30m
          labels:
            severity: warning
            category: host
          annotations:
            summary: "OPNsense {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} space left"
            description: >
              {{ $labels.mountpoint }} ({{ $labels.device }}) is filling up. /var/log has
              its own 5 GB quota, so it fills long before the pool does; Suricata's
              eve.json and the firewall log live there.

        - alert: OPNsenseFilesystemFull
          expr: |
            node_filesystem_avail_bytes{job="opnsense-node-exporter",fstype="zfs"}
              / node_filesystem_size_bytes{job="opnsense-node-exporter",fstype="zfs"} < 0.05
          for: 5m
          labels:
            severity: critical
            category: host
          annotations:
            summary: "OPNsense {{ $labels.mountpoint }} is almost full ({{ $value | humanizePercentage }} left)"
            description: >
              {{ $labels.mountpoint }} ({{ $labels.device }}) is nearly out of space. On
              /var/log, logging and Suricata stop writing once it is full.
