---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app opentelemetry-operator
  namespace: &namespace observability
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  path: ./kubernetes/apps/observability/opentelemetry/app
  dependsOn:
    - name: cert-manager
  postBuild:
    substitute:
      APP: opentelemetry
      NAMESPACE: observability
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true  # Wait for operator to be ready
---
# Separate kustomization for Instrumentation CRDs that depends on operator
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opentelemetry-instrumentation
  namespace: observability
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: opentelemetry-instrumentation
  interval: 30m
  path: ./kubernetes/apps/observability/opentelemetry/instrumentation
  dependsOn:
    - name: opentelemetry-operator
      namespace: observability
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  timeout: 5m
  wait: false
