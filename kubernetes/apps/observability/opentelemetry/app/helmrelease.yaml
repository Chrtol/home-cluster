# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
spec:
  interval: 30m
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: opentelemetry-operator
      version: 0.122.0
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  uninstall:
    keepHistory: false
  values:
    # Use cert-manager since it's installed
    admissionWebhooks:
      certManager:
        enabled: true
      failurePolicy: Ignore # don't Fail on flaky TLS errors
      create: true
    manager:
      collectorImage:
        repository: otel/opentelemetry-collector-contrib
      autoInstrumentationImage:
        dotnet:
          repository: ghcr.io/pl4nty/otel-operator-autoinstrumentation-dotnet
          tag: latest@sha256:358512aab44a8900f0d3aaa8124372ad74ce3cea8b7b3543124dc11f1d073b23
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      # disabled by default - enable instrumentation types
      extraArgs:
        - --enable-go-instrumentation=true
        - --enable-nginx-instrumentation=true
        - --enable-cr-metrics=false