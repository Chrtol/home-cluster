spec:
  exporter:
    endpoint: http://tempo-distributor.observability.svc.cluster.local:4317
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_always_on  # Always continue parent traces, always sample root spans
  resource:
    addK8sUIDAttributes: true
  dotnet:
