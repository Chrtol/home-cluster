      # .NET also uses http/proto by default
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://tempo-distributor.observability.svc.cluster.local:4318
      # Propagators for trace context extraction from incoming requests
      - name: OTEL_PROPAGATORS
