      - name: OTEL_DOTNET_AUTO_LOGS_ENABLED
        value: "false"
      - name: OTEL_METRICS_EXPORTER
        value: none  # Disable metrics - Tempo doesn't accept them
      - name: OTEL_LOGS_EXPORTER
        value: none  # Disable logs - Tempo doesn't accept them
