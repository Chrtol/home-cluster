---
# Python instrumentation for default namespace
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: python-instrumentation
  namespace: observability
spec:
  exporter:
    endpoint: http://tempo-distributor.observability.svc.cluster.local:4317
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_always_on  # Always continue parent traces, always sample root spans
  resource:
    addK8sUIDAttributes: true
  python:
    # Pinned so Renovate tracks it: the operator default lags, and its bundled
    # typing_extensions shadows the app's (mealie v3.29 crashed on 4.15.0)
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.66b0@sha256:569ce79ab56503ab5aea8998b141b7c90615cbf21d814e654e99d3987e9b6c3b
    env:
      # Python uses http/proto by default, so we need port 4318 for HTTP
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://tempo-distributor.observability.svc.cluster.local:4318
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      # Propagators for trace context extraction from incoming requests
      - name: OTEL_PROPAGATORS
        value: "tracecontext,baggage"
      # Explicit sampler to always continue parent traces
      - name: OTEL_TRACES_SAMPLER
        value: "parentbased_always_on"
      # Don't override service name if already set by application
      - name: OTEL_RESOURCE_ATTRIBUTES_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
        value: "true"
      - name: OTEL_PYTHON_LOG_LEVEL
        value: "debug"
      - name: OTEL_INSTRUMENTATION_POSTGRESQL_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_REDIS_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_HTTP_CLIENT_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_SQLALCHEMY_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_REQUESTS_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_FASTAPI_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_STARLETTE_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_ASGI_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_DJANGO_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_CELERY_ENABLED
        value: "true"
      - name: OTEL_METRICS_EXPORTER
        value: none  # Disable metrics - Tempo doesn't accept them
      - name: OTEL_LOGS_EXPORTER
        value: none  # Disable logs - Tempo doesn't accept them
---
# Node.js instrumentation
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: nodejs-instrumentation
  namespace: observability
spec:
  exporter:
    endpoint: http://tempo-distributor.observability.svc.cluster.local:4317
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_always_on  # Always continue parent traces, always sample root spans
  resource:
    addK8sUIDAttributes: true
  nodejs:
    env:
      - name: OTEL_NODE_RESOURCE_DETECTORS
        value: "env,host,os,process,container"
      # Propagators for trace context extraction from incoming requests
      - name: OTEL_PROPAGATORS
        value: "tracecontext,baggage"
      # Explicit sampler to always continue parent traces
      - name: OTEL_TRACES_SAMPLER
        value: "parentbased_always_on"
      - name: OTEL_INSTRUMENTATION_HTTP_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_EXPRESS_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_FASTIFY_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_POSTGRES_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_REDIS_ENABLED
        value: "true"
      - name: OTEL_METRICS_EXPORTER
        value: none  # Disable metrics - Tempo doesn't accept them
      - name: OTEL_LOGS_EXPORTER
        value: none  # Disable logs - Tempo doesn't accept them
---
# .NET instrumentation
