---
# These live in the ai-jobs Kustomization, NOT beside the app in kubernetes/apps/ai.
# That Kustomization sets `targetNamespace: ai`, which OVERRIDES the namespace on
# every object it applies -- so a Role written here with `namespace: ai-jobs` was
# silently created in `ai` instead, and the worker got a 403 creating workspaces.
# `namespace:` is therefore omitted below: the owning Kustomization's
# targetNamespace decides it, and repeating it would only invite the same
# confusion. The RoleBinding *subject* keeps its explicit `namespace: ai` -- that
# is a cross-namespace reference and kustomize leaves it alone.
#
# The ServiceAccount itself is created by the app-template chart (named for the
# release); declaring it here as well would give two owners for one object.
#
# Plan §11: the trusted application worker gets namespace-scoped Job/pod/PVC
# permissions and nothing more. Deliberately absent: secrets (a coding Job must
# never be handed a board token or a Git credential through a mounted secret),
# any verb in the `ai` namespace itself, and anything cluster-scoped.
#
# The coding Job that these create runs with `automountServiceAccountToken:
# false`, so none of this is reachable from inside an attempt.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-orchestrator-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - # Fencing reads pod logs to collect attempt evidence before a Job is removed.
    apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create"]
  - # The per-attempt context package: one immutable ConfigMap mounted read-only
    # at /context, holding the approved handoff, the operating policy, the
    # selected lessons and the manifest saying where each came from. The Job's
    # namespace is default-deny with DNS only, so an attempt can fetch nothing
    # -- everything it will ever know has to be written here before its pod is
    # scheduled.
    #
    # `patch` is for metadata only: the ConfigMap has to exist before the Job
    # that owns it, so the ownerReference is attached immediately afterwards.
    # Immutability covers `data`, so this cannot rewrite a package in flight.
    #
    # Still no `secrets`, in this namespace or any other. A coding Job must
    # never be handed a board token or a Git credential, and the memory
    # credential in particular stays on the orchestrator: lessons are selected
    # and copied in by the trusted layer, never fetched by the attempt.
    apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-orchestrator-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-orchestrator-jobs
subjects:
  - kind: ServiceAccount
    name: ai-orchestrator
    namespace: ai
