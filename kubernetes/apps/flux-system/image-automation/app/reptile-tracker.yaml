---
# Lives here, not in the app dir: an ImageUpdateAutomation only resolves
# policies from its own namespace, and the write credential is here.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: reptile-tracker-backend
  namespace: flux-system
spec:
  image: ghcr.io/chrtol/reptile-tracker-backend
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: reptile-tracker-frontend
  namespace: flux-system
spec:
  image: ghcr.io/chrtol/reptile-tracker-frontend
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: reptile-tracker-backend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: reptile-tracker-backend
  policy:
    numerical:
      order: asc
  filterTags:
    pattern: '^main-([0-9]+)$'
    extract: '$1'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: reptile-tracker-frontend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: reptile-tracker-frontend
  policy:
    numerical:
      order: asc
  filterTags:
    pattern: '^main-([0-9]+)$'
    extract: '$1'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: reptile-tracker
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: home-cluster-write
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: 'chore(reptile-tracker): update images'
    push:
      branch: main
  update:
    path: ./kubernetes/apps/default/reptile-tracker
    strategy: Setters
