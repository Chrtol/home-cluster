---
instance:
  distribution:
    # renovate: datasource=github-releases depName=controlplaneio-fluxcd/distribution
    version: 2.7.5
  cluster:
    networkPolicy: false
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  sync:
    kind: GitRepository
    url: "ssh://git@github.com/chrtol/home-cluster.git"
    ref: "refs/heads/main"
    path: kubernetes/flux/cluster
    secretRef:
      name: flux-system
