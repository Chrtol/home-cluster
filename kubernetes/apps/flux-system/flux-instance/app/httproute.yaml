---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  annotations:
    external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
    # gatus-sidecar: the webhook receiver returns 404 to a bare GET (no payload),
    # which is the healthy signal — override the default [STATUS]==200 and drop
    # the auto-extracted /hook/ path so the probe hits the bare host.
    gatus.home-operations.com/endpoint: |
      group: external
      path: ""
      conditions:
        - "[STATUS] == 404"
spec:
  parentRefs:
    - name: external
      namespace: network
      kind: Gateway
  hostnames:
    - flux-webhook.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: webhook-receiver
          port: 80
