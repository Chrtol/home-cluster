---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
    namespace: flux-system
  interval: 1h
  values:
    config:
      repo: github://chrtol/home-cluster
      statusChecks: true
      prComments: true
      publicUrl: https://{{ .Release.Name }}.${SECRET_DOMAIN}
      mcp: true
      verifyImages: true
    secret:
      existingSecret: konflate-webhook-token-secret
    # Chart HTTPRoute disabled: routing is owned by the two hand-written routes
    # (httproute.yaml = authed / + outpost callback; httproute-hooks.yaml =
    # unauthenticated /hooks for GitHub webhooks). A single chart route can't
    # carve out the /hooks auth exception the SecurityPolicy needs.
    httpRoute:
      enabled: false
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 1Gi
      # The chart derives GOMEMLIMIT from this limit (90%), so it is the GC
      # ceiling, not just the OOM ceiling. konflate retains a rendered diff per
      # open PR (101 of them) plus the merged shelf, on a 138-HelmRelease repo:
      # the chart default of 1Gi thrashed GC (renders 7s -> 96s) then OOMKilled.
      limits:
        memory: 2Gi