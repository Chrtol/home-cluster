---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangolin-controller
  namespace: network
  labels:
    app.kubernetes.io/name: pangolin-controller
    app.kubernetes.io/instance: pangolin
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate  # Only one instance should run at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: pangolin-controller
      app.kubernetes.io/instance: pangolin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangolin-controller
        app.kubernetes.io/instance: pangolin
      annotations:
        configmap.reloader.stakater.com/reload: "pangolin-controller-config"
        secret.reloader.stakater.com/reload: "pangolin-api"
    spec:
      serviceAccountName: pangolin-controller
      containers:
      - name: controller
        image: python:3.14-slim
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Install dependencies
          pip install --no-cache-dir kubernetes requests
          # Copy and run the controller script
          cp /config/controller.py /app/controller.py
          cd /app
          python controller.py
        env:
        - name: PANGOLIN_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: pangolin-api
              key: endpoint
        - name: PANGOLIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: pangolin-api
              key: apiKey
        - name: PANGOLIN_ORGANIZATION
          value: "homelab"
        - name: PANGOLIN_SITE
          value: "newt-home-cluster"
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: controller-script
          mountPath: /config
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pgrep
            - -f
            - controller.py
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: controller-script
        configMap:
          name: pangolin-controller-script
          defaultMode: 0755