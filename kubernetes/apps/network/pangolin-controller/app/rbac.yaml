---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pangolin-controller
  namespace: network
  labels:
    app.kubernetes.io/name: pangolin-controller
    app.kubernetes.io/instance: pangolin

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pangolin-controller
  labels:
    app.kubernetes.io/name: pangolin-controller
    app.kubernetes.io/instance: pangolin
rules:
# Watch and list HTTPRoutes
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["get", "list", "watch"]

# Watch and list Ingresses
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]

# Watch and list Services (for future enhancement)
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]

# Read ConfigMaps and Secrets in the controller's namespace
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pangolin-controller
  labels:
    app.kubernetes.io/name: pangolin-controller
    app.kubernetes.io/instance: pangolin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pangolin-controller
subjects:
- kind: ServiceAccount
  name: pangolin-controller
  namespace: network