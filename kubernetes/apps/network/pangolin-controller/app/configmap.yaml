---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pangolin-controller-script
  namespace: network
  labels:
    app.kubernetes.io/name: pangolin-controller
    app.kubernetes.io/instance: pangolin
data:
  controller.py: |
    #!/usr/bin/env python3
    """
    Pangolin Blueprint Controller

    Watches Kubernetes resources (HTTPRoutes, Ingresses, etc.) with specific labels
    and automatically creates/updates Pangolin blueprints for authentication.
    """

    import os
    import sys
    import time
    import json
    import logging
    import requests
    from typing import Dict, List, Optional, Any
    from kubernetes import client, config, watch
    from kubernetes.client.rest import ApiException
    import urllib3

    # Suppress SSL warnings for Pangolin API calls
    urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

    # Configure logging
    logging.basicConfig(
        level=logging.INFO,
        format='%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    )
    logger = logging.getLogger('pangolin-controller')


    class PangolinBlueprintController:
        """Controller that syncs Kubernetes resources to Pangolin blueprints"""

        # Label/annotation keys
        LABEL_MANAGED = "pangolin.io/managed"
        LABEL_BLUEPRINT = "pangolin.io/blueprint"
        ANNOTATION_ORG = "pangolin.io/organization"
        ANNOTATION_SITE = "pangolin.io/site"
        ANNOTATION_AUTH_TYPE = "pangolin.io/auth-type"
        ANNOTATION_PUBLIC = "pangolin.io/public"

        def __init__(self):
            """Initialize the controller"""
            # Load Kubernetes config
            try:
                config.load_incluster_config()
                logger.info("Loaded in-cluster Kubernetes config")
            except:
                config.load_kube_config()
                logger.info("Loaded local Kubernetes config")

            # Initialize Kubernetes clients
            self.v1 = client.CoreV1Api()
            self.custom_api = client.CustomObjectsApi()
            self.networking_v1 = client.NetworkingV1Api()

            # Load Pangolin configuration
            self.pangolin_endpoint = os.environ.get('PANGOLIN_ENDPOINT', '').rstrip('/')
            self.pangolin_api_key = os.environ.get('PANGOLIN_API_KEY', '')
            self.organization = os.environ.get('PANGOLIN_ORGANIZATION', 'homelab')
            self.default_site = os.environ.get('PANGOLIN_SITE', 'newt-home-cluster')

            if not self.pangolin_endpoint or not self.pangolin_api_key:
                logger.error("PANGOLIN_ENDPOINT and PANGOLIN_API_KEY must be set")
                sys.exit(1)

            logger.info(f"Pangolin endpoint: {self.pangolin_endpoint}")
            logger.info(f"Default organization: {self.organization}")
            logger.info(f"Default site: {self.default_site}")

            # Track managed blueprints
            self.managed_blueprints: Dict[str, str] = {}

        def process_httproute(self, httproute: Dict, event_type: str):
            """Process an HTTPRoute event"""
            try:
                metadata = httproute.get('metadata', {})
                name = metadata.get('name')
                namespace = metadata.get('namespace', 'default')
                labels = metadata.get('labels', {})

                # Check if this resource should be managed
                if labels.get(self.LABEL_MANAGED) != 'true':
                    return

                logger.info(f"Processing HTTPRoute {namespace}/{name} - {event_type}")

                if event_type in ['ADDED', 'MODIFIED']:
                    # Extract hostnames from HTTPRoute
                    spec = httproute.get('spec', {})
                    hostnames = spec.get('hostnames', [])

                    # Create/update blueprint
                    blueprint_name = labels.get(self.LABEL_BLUEPRINT, f"{namespace}-{name}")
                    logger.info(f"Would create/update blueprint: {blueprint_name} for hosts: {hostnames}")

                    # TODO: Implement actual Pangolin API calls

                elif event_type == 'DELETED':
                    logger.info(f"Would delete blueprint for {namespace}/{name}")
                    # TODO: Implement deletion

            except Exception as e:
                logger.error(f"Error processing HTTPRoute: {e}")

        def process_ingress(self, ingress: Dict, event_type: str):
            """Process an Ingress event"""
            try:
                metadata = ingress.get('metadata', {})
                name = metadata.get('name')
                namespace = metadata.get('namespace', 'default')
                labels = metadata.get('labels', {})

                # Check if this resource should be managed
                if labels.get(self.LABEL_MANAGED) != 'true':
                    return

                logger.info(f"Processing Ingress {namespace}/{name} - {event_type}")

                if event_type in ['ADDED', 'MODIFIED']:
                    # Extract hosts from Ingress
                    spec = ingress.get('spec', {})
                    rules = spec.get('rules', [])
                    hosts = [rule.get('host') for rule in rules if rule.get('host')]

                    # Create/update blueprint
                    blueprint_name = labels.get(self.LABEL_BLUEPRINT, f"{namespace}-{name}")
                    logger.info(f"Would create/update blueprint: {blueprint_name} for hosts: {hosts}")

                    # TODO: Implement actual Pangolin API calls

                elif event_type == 'DELETED':
                    logger.info(f"Would delete blueprint for {namespace}/{name}")
                    # TODO: Implement deletion

            except Exception as e:
                logger.error(f"Error processing Ingress: {e}")

        def watch_httproutes(self):
            """Watch HTTPRoute resources"""
            w = watch.Watch()
            try:
                logger.info("Starting HTTPRoute watch")
                for event in w.stream(
                    self.custom_api.list_cluster_custom_object,
                    group="gateway.networking.k8s.io",
                    version="v1beta1",
                    plural="httproutes"
                ):
                    event_type = event['type']
                    httproute = event['object']
                    self.process_httproute(httproute, event_type)

            except ApiException as e:
                if e.status == 404:
                    logger.warning("HTTPRoute CRD not found, skipping HTTPRoute watch")
                else:
                    logger.error(f"Error watching HTTPRoutes: {e}")
            except Exception as e:
                logger.error(f"Unexpected error in HTTPRoute watch: {e}")

        def watch_ingresses(self):
            """Watch Ingress resources"""
            w = watch.Watch()
            try:
                logger.info("Starting Ingress watch")
                for event in w.stream(self.networking_v1.list_ingress_for_all_namespaces):
                    event_type = event['type']
                    ingress = event['object']

                    # Convert to dict
                    ingress_dict = client.ApiClient().sanitize_for_serialization(ingress)
                    self.process_ingress(ingress_dict, event_type)

            except Exception as e:
                logger.error(f"Error watching Ingresses: {e}")

        def run(self):
            """Main controller loop"""
            logger.info("Starting Pangolin Blueprint Controller")

            # Start watching resources in parallel
            import threading

            httproute_thread = threading.Thread(target=self.watch_httproutes, daemon=True)
            ingress_thread = threading.Thread(target=self.watch_ingresses, daemon=True)

            httproute_thread.start()
            ingress_thread.start()

            # Keep the main thread alive
            try:
                while True:
                    time.sleep(30)
                    logger.debug(f"Controller healthy, managing {len(self.managed_blueprints)} blueprints")
            except KeyboardInterrupt:
                logger.info("Shutting down controller")


    if __name__ == '__main__':
        controller = PangolinBlueprintController()
        controller.run()