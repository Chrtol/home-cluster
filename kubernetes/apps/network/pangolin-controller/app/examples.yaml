---
# Example HTTPRoute that will be managed by pangolin-controller
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: example-protected-app
  namespace: default
  labels:
    # This label tells the controller to manage this resource
    pangolin.io/managed: "true"
    # Optional: Custom blueprint name (defaults to namespace-name)
    pangolin.io/blueprint: "protected-app"
  annotations:
    # Optional: Override default organization
    pangolin.io/organization: "homelab"
    # Optional: Override default site
    pangolin.io/site: "newt-home-cluster"
    # Authentication type: oauth2, basic, jwt, etc.
    pangolin.io/auth-type: "oauth2"
    # Whether this should be publicly accessible without auth
    pangolin.io/public: "false"
spec:
  parentRefs:
  - name: nginx-internal
    namespace: network
    kind: Gateway
  hostnames:
  - "protected.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: example-app
      port: 80

---
# Example Ingress that will be managed by pangolin-controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-public-app
  namespace: default
  labels:
    # This label tells the controller to manage this resource
    pangolin.io/managed: "true"
  annotations:
    # Make this publicly accessible without authentication
    pangolin.io/public: "true"
    # Use basic auth for this app
    pangolin.io/auth-type: "basic"
spec:
  ingressClassName: nginx-internal
  rules:
  - host: public.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: public-app
            port:
              number: 80

---
# Example HTTPRoute with multiple hosts and paths
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: complex-app
  namespace: production
  labels:
    pangolin.io/managed: "true"
  annotations:
    pangolin.io/auth-type: "oauth2"
    pangolin.io/public: "false"
    # Can specify additional Pangolin configuration
    pangolin.io/require-mfa: "true"
    pangolin.io/allowed-groups: "admin,developers"
spec:
  parentRefs:
  - name: nginx-external
    namespace: network
    kind: Gateway
  hostnames:
  - "app.example.com"
  - "www.app.example.com"
  rules:
  # Public paths
  - matches:
    - path:
        type: PathPrefix
        value: /public
    - path:
        type: PathPrefix
        value: /health
    backendRefs:
    - name: app-service
      port: 80
  # Protected admin paths
  - matches:
    - path:
        type: PathPrefix
        value: /admin
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: app-service
      port: 80