---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: multus-wlan
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "multus-wlan",
      "plugins": [
        {
          "type": "ipvlan",
          "master": "bond0",
          "mode": "l3",
          "ipam": {
            "type": "static",
            "routes": [
              {"dst": "224.0.0.0/4"}
            ]
          }
        },
        {
          "type": "sbr"
        }
      ]
    }