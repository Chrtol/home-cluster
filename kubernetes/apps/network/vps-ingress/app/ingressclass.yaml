---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/ingressclass_v1.json
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: vps
  annotations:
    # VPS ingresses are served by the external nginx-ingress controller
    # but DNS is managed by external-dns-vps (not external-dns)
    external-dns.alpha.kubernetes.io/ingress-class: vps
spec:
  controller: k8s.io/external
