---
# Periodically send traffic through WireGuard tunnel to update VPS endpoint
# when home IP changes (replacement for PersistentKeepalive)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wireguard-endpoint-refresh
  namespace: network
spec:
  # Run every 30 minutes
  schedule: "*/30 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          hostNetwork: false
          containers:
            - name: keepalive
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  # Send lightweight HTTP request through WireGuard tunnel
                  # This updates the VPS with our current IP endpoint
                  curl -s --max-time 5 http://10.100.0.1 > /dev/null || true
                  echo "Endpoint refresh completed at $(date)"
