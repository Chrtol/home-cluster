---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wireguard-vps
  namespace: network
spec:
  selector:
    matchLabels:
      app: wireguard-vps
  template:
    metadata:
      labels:
        app: wireguard-vps
    spec:
      priorityClassName: system-node-critical
      hostNetwork: true
      containers:
        - name: wireguard
          image: ghcr.io/linuxserver/wireguard:latest
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    sleep 5
                    # Add permanent ARP entries for LoadBalancer IPs using broadcast MAC
                    # Broadcast is used because Cilium L2 lease holders can change (failover)
                    # Without these entries, ARP resolution fails intermittently causing connection hangs
                    ip neigh replace 10.0.30.60 lladdr ff:ff:ff:ff:ff:ff dev ens18 nud permanent || true  # nginx-ingress
                    ip neigh replace 10.0.30.44 lladdr ff:ff:ff:ff:ff:ff dev ens18 nud permanent || true  # envoy-gateway
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: ${SECRET_TIMEZONE}
          volumeMounts:
            - name: config
              mountPath: /config/wg_confs
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: wireguard-vps-secret
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
