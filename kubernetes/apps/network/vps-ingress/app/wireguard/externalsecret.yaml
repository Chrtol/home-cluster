---
# yaml-language-server: $schema=https://kubernetes-schemas.perry.cafe/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wireguard-vps
  namespace: network
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wireguard-vps-secret
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        wg0.conf: |
          [Interface]
          PrivateKey = {{ .VPS_WG_HOME_PRIVATE_KEY }}
          Address = 10.100.0.2/24

          [Peer]
          PublicKey = {{ .VPS_WIREGUARD_PUBLIC_KEY }}
          Endpoint = ${VPS_PUBLIC_IP}:51820
          AllowedIPs = 10.100.0.1/32
          # PersistentKeepalive disabled - ANY interval causes TCP disruptions
          # Dynamic IP changes handled by periodic outbound traffic (see CronJob)
          # PersistentKeepalive = 0
  dataFrom:
    - extract:
        key: vps-wireguard
