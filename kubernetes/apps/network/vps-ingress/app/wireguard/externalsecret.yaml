---
# yaml-language-server: $schema=https://kubernetes-schemas.perry.cafe/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wireguard-vps
  namespace: network
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wireguard-vps-secret
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        wg0.conf: |
          [Interface]
          PrivateKey = {{ .HOME_WG_PRIVATE_KEY }}
          Address = 10.100.0.2/24

          [Peer]
          PublicKey = {{ .VPS_WIREGUARD_PUBLIC_KEY }}
          Endpoint = {{ .VPS_PUBLIC_IP }}:51820
          AllowedIPs = 10.100.0.0/24
          PersistentKeepalive = 25
  dataFrom:
    - extract:
        key: vps-wireguard  # Create this in 1Password with your WireGuard keys
