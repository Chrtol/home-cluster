---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wireguard-vps
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      wireguard-vps:
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/wireguard
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: ${SECRET_TIMEZONE}
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - |
                      sleep 5
                      # Add permanent ARP entries for LoadBalancer IPs using broadcast MAC
                      # Broadcast is used because Cilium L2 lease holders can change (failover)
                      # Without these entries, ARP resolution fails intermittently causing connection hangs
                      ip neigh replace 10.0.30.60 lladdr ff:ff:ff:ff:ff:ff dev ens18 nud permanent || true  # nginx-ingress
                      ip neigh replace 10.0.30.44 lladdr ff:ff:ff:ff:ff:ff dev ens18 nud permanent || true  # envoy-gateway
            securityContext:
              privileged: true
              capabilities:
                add:
                  - NET_ADMIN
                  - SYS_MODULE
    defaultPodOptions:
      hostNetwork: true
      priorityClassName: system-node-critical
    persistence:
      config:
        type: secret
        name: wireguard-vps-secret
        globalMounts:
          - path: /config/wg_confs
      lib-modules:
        type: hostPath
        hostPath: /lib/modules
        globalMounts:
          - path: /lib/modules
            readOnly: true
