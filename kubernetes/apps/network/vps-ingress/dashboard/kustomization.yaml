---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: network
configMapGenerator:
  - name: wireguard-grafana-dashboard
    files:
      - wireguard-monitoring.json=wireguard-monitoring-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Infrastructure"
generatorOptions:
  disableNameSuffixHash: true
