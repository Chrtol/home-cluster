---
# yaml-language-server: $schema=https://kubernetes-schemas.perry.cafe/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsense-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opnsense-backup-secret
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # A SEPARATE OPNsense API key from the exporter's. The exporter key was
        # verified to return 403 on /api/core/backup/download/this -- it lacks the
        # backup privilege, and widening it is the wrong fix: that key is mounted
        # into a pod that runs continuously, while this one is mounted by a job that
        # runs for a few seconds a day. Config.xml is the most sensitive object on
        # the network, so the two stay separate.
        OPNSENSE_API_KEY: "{{ .OPNSENSE_BACKUP_API_KEY }}"
        OPNSENSE_API_SECRET: "{{ .OPNSENSE_BACKUP_API_SECRET }}"
  dataFrom:
    - extract:
        key: opnsense
