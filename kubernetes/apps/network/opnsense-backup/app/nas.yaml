# Its own folder under applications/, deliberately NOT the shared cf-nas/backup one.
# config.xml is stored as plaintext XML (that is the point -- it restores with no
# tooling), and it carries WireGuard private keys, certificate private keys and
# hashed user passwords. cf-nas/backup is mounted by every namespace that runs a
# volsync mover, so cleartext firewall secrets there would be readable by a much
# wider set of pods than needs them.
#
# The separation is at the NFS-export layer, not the ZFS one: everything here lives
# in the single cf-nas dataset, so this folder inherits its snapshot and replication
# policy and cannot carry its own. What it does get is a separate NFS share entry,
# so keep that share's allowed-hosts list narrower than the others.
#
# See the media namespace's nas.yaml for the nconnect-per-node reasoning.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-opnsense-backup-network
spec:
  # Advisory only -- static NFS PVs do not enforce capacity. Sized to signal intent:
  # 30 revisions of a ~3 MB config is well under 100 MB.
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: ["nfsvers=4.2", "nconnect=16", "hard", "noatime"]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nas-opnsense-backup-network
    volumeAttributes:
      server: nas.${SECRET_DOMAIN}
      share: /mnt/truenas/cf-nas/applications/opnsense-backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-opnsense-backup
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: nas-opnsense-backup-network
  resources:
    requests:
      storage: 10Gi
