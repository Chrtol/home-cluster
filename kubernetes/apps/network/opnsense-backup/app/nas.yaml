# Dedicated dataset, deliberately NOT the shared cf-nas/backup one. config.xml is
# stored as plaintext XML (that is the point -- it restores with no tooling), and it
# carries WireGuard private keys, certificate private keys and hashed user passwords.
# The shared backup dataset is mounted by every namespace that runs a volsync mover,
# so putting cleartext firewall secrets there would expose them to a much wider set
# of pods than needs them. Keep this dataset's NFS share list narrow.
#
# See the media namespace's nas.yaml for the nconnect-per-node reasoning.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-opnsense-backup-network
spec:
  # Advisory only -- static NFS PVs do not enforce capacity. Sized to signal intent:
  # 30 revisions of a ~3 MB config is well under 100 MB.
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: ["nfsvers=4.2", "nconnect=16", "hard", "noatime"]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nas-opnsense-backup-network
    volumeAttributes:
      server: nas.${SECRET_DOMAIN}
      share: /mnt/truenas/cf-nas/applications/opnsense-backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-opnsense-backup
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: nas-opnsense-backup-network
  resources:
    requests:
      storage: 10Gi
