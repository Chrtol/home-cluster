apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
  annotations:
    secret.reloader.stakater.com/reload: "newt-secret"
spec:
  interval: 30m
  chart:
    spec:
      chart: newt
      version: "1.1.0"
      sourceRef:
        kind: HelmRepository
        name: fossorial
        namespace: newt
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Configure Newt instance
    newtInstances:
      - name: main
        enabled: true

    # Use existing secret for authentication
    auth:
      existingSecretName: newt-secret
      keys:
        endpointKey: PANGOLIN_ENDPOINT
        idKey: NEWT_SITE_ID
        secretKey: NEWT_SITE_SECRET