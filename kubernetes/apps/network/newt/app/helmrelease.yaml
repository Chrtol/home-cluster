apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
  namespace: network
  annotations:
    secret.reloader.stakater.com/reload: "newt-secret"
spec:
  interval: 30m
  chart:
    spec:
      chart: newt
      version: "1.1.0"  # Helm chart version (contains Newt app v1.5.0)
      sourceRef:
        kind: HelmRepository
        name: fossorial
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Configure Newt instances
    newtInstances:
      - name: main
        enabled: true  # REQUIRED: Must be explicitly enabled
        # Use existing secret for authentication
        auth:
          existingSecretName: newt-secret
          keys:
            endpointKey: PANGOLIN_ENDPOINT
            idKey: NEWT_SITE_ID
            secretKey: NEWT_SITE_SECRET
        # Instance-specific WireGuard settings
        # mtu: 1280  # Removed - using default to avoid type comparison error
        interface: "newt"
        keepInterface: false
        ping:
          interval: 30
          reliable: false
        # Environment variables for this instance
        extraEnv:
          NEWT_DISABLE_PING: "true"
          NEWT_HEALTH_CHECK_MODE: "websocket"

    # Global settings (apply to all instances)
    global:
      # Name overrides
      nameOverride: "newt"
      fullNameOverride: "newt"

      # Host networking for WireGuard
      hostNetwork: true

      # Security context for WireGuard operations
      securityContext:
        privileged: true
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
            - SYS_MODULE

      # Health probe configuration
      health:
        enabled: true
        path: "/tmp/healthy"
        readinessFailureThreshold: 10
        healthFile: "/tmp/healthy"