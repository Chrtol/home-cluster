---
apiVersion: v1
kind: Service
metadata:
  name: newt-metrics
  namespace: network
  labels:
    app.kubernetes.io/name: newt
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for DaemonSet
  selector:
    app: newt-daemon
  ports:
  - name: metrics
    port: 2112
    targetPort: metrics
    protocol: TCP