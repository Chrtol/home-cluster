---
apiVersion: v1
kind: Service
metadata:
  name: newt-metrics
  namespace: network
  labels:
    app.kubernetes.io/name: newt
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: newt
  ports:
  - name: metrics
    port: 2112
    targetPort: metrics
    protocol: TCP