---
# Alternative: Run Newt as a DaemonSet directly on nodes
# This gives better network access for WireGuard and ICMP
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: newt-daemon
  namespace: network
spec:
  selector:
    matchLabels:
      app: newt-daemon
  template:
    metadata:
      labels:
        app: newt-daemon
    spec:
      hostNetwork: true  # Use host network for proper ICMP and WireGuard
      hostPID: true      # Access host PID namespace
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      # Remove nodeSelector to run on all nodes like wireguard-vps
      # Or add specific node selector if you want to limit to certain nodes
      # nodeSelector:
      #   kubernetes.io/hostname: dell1  # Example: run only on dell1
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: newt
        image: ghcr.io/fosrl/newt:1.10.4@sha256:ccd2b0e9a0492d7492c00dff1295d0c487a2f71f9f8fc80b1c61e597f5181aed
        # Use sh -c to properly expand environment variable
        # Each pod gets a unique interface name to avoid conflicts
        command:
        - sh
        - -c
        - |
          # Extract last part of pod name for unique interface suffix
          IFACE_SUFFIX=$(echo ${POD_NAME} | cut -d'-' -f3)
          /usr/local/bin/newt \
            -interface=newt-${IFACE_SUFFIX} \
            -health-file=/tmp/healthy \
            -metrics=true \
            -metrics-admin-addr=0.0.0.0:2112 \
            -ping-interval=30s \
            -ping-timeout=10s \
            -log-level=INFO
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - SYS_MODULE
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PANGOLIN_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: newt-secret
              key: PANGOLIN_ENDPOINT
        - name: NEWT_ID
          valueFrom:
            secretKeyRef:
              name: newt-secret
              key: NEWT_SITE_ID
        - name: NEWT_SECRET
          valueFrom:
            secretKeyRef:
              name: newt-secret
              key: NEWT_SITE_SECRET
        ports:
        - name: metrics
          containerPort: 2112
          protocol: TCP
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "test -f /tmp/healthy || pgrep newt"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "test -f /tmp/healthy || (pgrep newt && ip link show | grep -q newt-)"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
        volumeMounts:
        - name: host-modules
          mountPath: /lib/modules
          readOnly: true
      volumes:
      - name: host-modules
        hostPath:
          path: /lib/modules
          type: Directory