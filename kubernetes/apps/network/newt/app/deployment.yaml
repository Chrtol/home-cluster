---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newt
  namespace: network
spec:
  replicas: 1
  strategy:
    type: Recreate  # Important: only one instance should run at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: newt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newt
    spec:
      hostNetwork: true  # Use host network for proper ICMP and WireGuard
      hostPID: true      # Access host PID namespace
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: newt
        image: ghcr.io/fosrl/newt:1.8.1@sha256:c05a8383fc8370e6211f0ab84e37993848aae224322d0c5aede7d3368414bdd0
        command:
        - /usr/local/bin/newt
        - -interface=newt0
        - -health-file=/tmp/healthy
        - -metrics=true
        - -metrics-admin-addr=0.0.0.0:2112
        - -ping-interval=30s
        - -ping-timeout=10s
        - -log-level=INFO
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - SYS_MODULE
        env:
        - name: PANGOLIN_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: newt-secret
              key: PANGOLIN_ENDPOINT
        - name: NEWT_ID
          valueFrom:
            secretKeyRef:
              name: newt-secret
              key: NEWT_SITE_ID
        - name: NEWT_SECRET
          valueFrom:
            secretKeyRef:
              name: newt-secret
              key: NEWT_SITE_SECRET
        ports:
        - name: metrics
          containerPort: 2112
          protocol: TCP
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "test -f /tmp/healthy || pgrep newt"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "test -f /tmp/healthy || (pgrep newt && ip link show | grep -q newt)"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
        volumeMounts:
        - name: host-modules
          mountPath: /lib/modules
          readOnly: true
      volumes:
      - name: host-modules
        hostPath:
          path: /lib/modules
          type: Directory