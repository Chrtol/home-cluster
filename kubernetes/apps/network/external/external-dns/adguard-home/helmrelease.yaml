---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-adguard-home
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: -1
    timeout: 5m
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: -1
    timeout: 5m
  values:
    # domainFilters: ["internal.${SECRET_DOMAIN}"]
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.1.1@sha256:b3dfe851982b59a36bf2e15f42ca4015b7ef39ddf7a808c39a855a05a61b5892
          pullPolicy: IfNotPresent
        env:
          - name: ADGUARD_URL
            value: https://adguard.${SECRET_DOMAIN}
          - name: &name ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-adguard-home
                namespace: network
                key: *name
          - name: &name ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: *secret
                key: *name
          - name: SERVER_HOST
            value: 0.0.0.0
        securityContext:
          readOnlyRootFilesystem: true
    interval: 1h
    triggerLoopOnEvent: true
    policy: sync
    registry: noop
    sources: ["crd", "ingress", "gateway-httproute"]
    extraArgs:
      - --webhook-provider-url=http://localhost:8888
      # crd source: lets internal-only records (L4 services with no HTTPRoute,
      # e.g. mosquitto) be declared as DNSEndpoints instead of Service annotations,
      # which this instance does not watch.
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --ingress-class=internal
      - --gateway-label-filter=dns-provider=internal
      # dns-provider routes a DNSEndpoint to one instance: annotate it "internal"
      # for AdGuard only, "external" for Cloudflare only. Absent = both, so every
      # existing ingress/httproute is unaffected (a missing key satisfies notin).
      - --annotation-filter=external-dns.alpha.kubernetes.io/exclude notin (true),dns-provider notin (external)
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
    logLevel: debug