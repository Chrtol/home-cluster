---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-external-proxy
  namespace: network
spec:
  telemetry:
    tracing:
      samplingRate: 50  # Sample 50% of requests
      provider:
        type: OpenTelemetry
        host: tempo-distributor.observability.svc.cluster.local
        port: 4317
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        name: envoy-gateway-external
        pod:
          # Pin Envoy proxy to same node as Envoy Gateway controller
          # to avoid cross-node xDS connection issues with Cilium
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: gateway-helm
                      app.kubernetes.io/instance: envoy-gateway
                  topologyKey: kubernetes.io/hostname
      envoyService:
        name: envoy-gateway-external
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        loadBalancerIP: "10.0.30.44"
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "*.${SECRET_DOMAIN}"