---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-external-proxy
  namespace: network
spec:
  telemetry:
    tracing:
      samplingRate: 50  # Sample 50% of requests
      provider:
        type: OpenTelemetry
        host: tempo-distributor.observability.svc.cluster.local
        port: 4317
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        loadBalancerIP: "10.0.30.44"
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "*.${SECRET_DOMAIN}"