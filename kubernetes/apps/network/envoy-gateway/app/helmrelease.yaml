---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app envoy-gateway
  namespace: network
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
    namespace: flux-system
  driftDetection:
    ignore:
      - paths: [/spec/replicas]
  values:
    config:
      envoyGateway:
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              # Deploy Envoy proxies in the same namespace as the Gateway
              type: GatewayNamespace
    # Optional: Enable HPA for production
    # hpa:
    #   enabled: true
    #   minReplicas: 1
    #   maxReplicas: 3
    #   metrics:
    #     - resource:
    #         name: cpu
    #         target:
    #           averageUtilization: 60
    #           type: Utilization
    #       type: Resource