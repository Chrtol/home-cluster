---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cert-expiry-monitor
  namespace: monitoring
spec:
  schedule: "0 8 * * *"  # Daily at 8 AM
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cert-checker
              image: alpine:3.22
              env:
                - name: PUSHOVER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gatus-secret
                      key: PUSHOVER_TOKEN
                - name: PUSHOVER_USER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gatus-secret
                      key: PUSHOVER_USER_KEY
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache openssl curl

                  # Check NAS certificate
                  EXPIRY=$(echo | openssl s_client -servername nas.cftollefsen.com -connect nas.cftollefsen.com:443 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
                  EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s)
                  NOW_EPOCH=$(date +%s)
                  DAYS_LEFT=$(( ($EXPIRY_EPOCH - $NOW_EPOCH) / 86400 ))

                  echo "Certificate for nas.cftollefsen.com expires in $DAYS_LEFT days"

                  if [ $DAYS_LEFT -lt 29 ]; then
                    echo "WARNING: Certificate expires in less than 29 days!"

                    # Send alert via Pushover
                    curl -s -X POST https://api.pushover.net/1/messages.json \
                      -d "token=$PUSHOVER_TOKEN" \
                      -d "user=$PUSHOVER_USER_KEY" \
                      -d "title=Certificate Expiring Soon" \
                      -d "message=NAS certificate (*.cftollefsen.com) expires in $DAYS_LEFT days. Auto-renewal may have failed!" \
                      -d "priority=1" \
                      -d "sound=persistent"

                    exit 1
                  fi

                  echo "Certificate is valid"
