---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr-outpost
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: internal
  tls:
    - hosts:
        - sonarr.cftollefsen.com
  rules:
    - host: sonarr.cftollefsen.com
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-outpost
                port:
                  number: 9000