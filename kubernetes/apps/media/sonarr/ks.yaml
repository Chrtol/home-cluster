---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sonarr
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
  interval: 1h
  path: ./kubernetes/apps/media/sonarr/app
  components:
    - ../../../../components/cnpg
    - ../../../../components/gatus/guarded
    - ../../../../components/ext-auth
  postBuild:
    substitute:
      APP: *app
      DB_NAME: "sonarr_main sonarr_log"
      DB_OP_ITEM: *app
      DB_PASS_FIELD: SONARR_POSTGRES_PASS
      EXT_AUTH_PORT: "80"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
