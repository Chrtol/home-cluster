---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app readmeabook
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: readmeabook
  components:
    - ../../../../components/cnpg
    - ../../../../components/dragonfly
    - ../../../../components/ceph-rbd
    - ../../../../components/gatus/guarded
    - ../../../../components/oidc-application
  dependsOn:
    - name: cloudnative-pg-cluster-v17
      namespace: database
    - name: dragonfly-cluster
      namespace: database
  interval: 1h
  path: "./kubernetes/apps/media/readmeabook/app"
  postBuild:
    substitute:
      APP: *app
      CEPH_RBD_CAPACITY: 2Gi
      DB_OP_ITEM: *app
      DB_PASS_FIELD: READMEABOOK_POSTGRES_PASS
      # OIDC component variables
      GROUP: "Media"
      SUBDOMAIN: readmeabook
      DISPLAY_NAME: "ReadMeABook"
      DESCRIPTION: "Audiobook downloader and manager"
      REDIRECT_PATH: "/api/auth/oidc/callback"
      OIDC_SECRET_NAMESPACE: *namespace
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false