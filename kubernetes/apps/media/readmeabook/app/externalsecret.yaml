---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readmeabook
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: readmeabook-secret
    template:
      data:
        # App
        POSTGRES_DB: &dbName readmeabook
        DB_HOSTNAME: &dbHost "{{ .POSTGRES_RW_SVC }}"
        DB_PORT: "5432"
        POSTGRES_USER: &dbUser "{{ .READMEABOOK_POSTGRES_USER }}"
        POSTGRES_PASSWORD: &dbPass "{{ .READMEABOOK_POSTGRES_PASS }}"
        DATABASE_URL: "postgresql://{{ .READMEABOOK_POSTGRES_USER }}:{{ .READMEABOOK_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}/readmeabook"
        JWT_SECRET: "{{ .READMEABOOK_JWT_SECRET }}"
  dataFrom:
    - extract:
        key: readmeabook
    - extract:
        key: cloudnative-pg