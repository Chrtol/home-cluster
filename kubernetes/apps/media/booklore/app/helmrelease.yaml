---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app booklore
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  test:
    enable: false
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
      strategy: rollback
    cleanupOnFail: true
  rollback:
    timeout: 10m
    recreate: true
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          *app :
            # Grimmory is the community fork of BookLore; upstream BookLore was
            # deleted at v2.3.1 and Grimmory v3.0.0 continues from that commit.
            # The DB, volumes and port are unchanged — only the env var names
            # were renamed (USER_ID/GROUP_ID, API_DOCS_ENABLED).
            image:
              repository: ghcr.io/grimmory-tools/grimmory
              tag: v3.2.4@sha256:dfa7afdfcf25d649fd664497a62385dd00cd9678c37546e182c172e41c8e80cb

            env:
              TZ: "${SECRET_TIMEZONE}"
              USER_ID: "1000"
              GROUP_ID: "1000"
              # Query params match Grimmory's built-in default URL, which our
              # explicit DATABASE_URL would otherwise override away.
              DATABASE_URL: "jdbc:mariadb://mariadb-operator.database.svc.cluster.local:3306/booklore?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
              DATABASE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: booklore-secret
                    key: DATABASE_USERNAME
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: booklore-secret
                    key: DATABASE_PASSWORD
              API_DOCS_ENABLED: "false"
              # /books and /bookdrop are TrueNAS NFS. NFS/SMB cannot guarantee atomic
              # rename, so a move that fails mid-flight can leave the file and the DB
              # disagreeing. NETWORK removes the UI's file mover ("Organize File") and
              # the delete/move/rename actions that depend on it; reading, metadata
              # write-back, bookdrop ingest and sync are unaffected.
              DISK_TYPE: "NETWORK"

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 6060
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes

    defaultPodOptions:
      priorityClassName: external-facing

    service:
      app :
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/data

      books:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/data/media/books
        globalMounts:
          - path: /books
            readOnly: false

      bookdrop:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/applications/booklore/bookdrop
        globalMounts:
          - path: /bookdrop
            readOnly: false

