---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app booklore
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
    - name: mariadb-operator-instance
      namespace: database
    - name: volsync
      namespace: volsync-system
  interval: 1h
  path: ./kubernetes/apps/media/booklore/app
  components:
    - ../../../../components/ceph-rbd
    - ../../../../components/volsync
  postBuild:
    substitute:
      CEPH_RBD_CAPACITY: 1Gi
      APP: *app
      # Deliberately NOT "booklore": this app is being renamed to grimmory (BookLore
      # upstream is dead; we run the Grimmory fork). Seeding the restic repo under the
      # post-rename name keeps backup history continuous across that rename, since
      # restic repos cannot be renamed in place.
      VOLSYNC_REPO_NAME: grimmory
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false