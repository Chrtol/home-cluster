---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cleanuparr
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      cleanuparr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/cleanuparr/cleanuparr
              tag: 2.9.13@sha256:4ad626da7e1d2774ca51bbfa812f832d5639264b3fe308909e47de02ba2188f7
            args: ["/app/Cleanuparr"]
            env:
              TZ: ${SECRET_TIMEZONE}
              PORT: &port 9705
              # BASE_PATH: '/'
              # QUEUECLEANER__ENABLED: true
              # SONARR__ENABLED: true
              # SONARR__INSTANCES__0__URL: http://sonarr.media.svc.cluster.local:80
              # RADARR__ENABLED: true
              # RADARR__INSTANCES__0__URL: http://radarr.media.svc.cluster.local:7878
              # DOWNLOAD_CLIENT: qBittorrent
              # QBITTORRENT__URL: http://qbittorrent-app.media.svc.cluster.local:80
              # DOWNLOADCLEANER__ENABLED: true
            envFrom:
              - secretRef:
                  name: cleanuparr-config
            resources: # Based on goldilocks
              requests:
                cpu: 15m
                memory: 352M
              limits:
                memory: 446M
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: &pgid 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 65539

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        existingClaim: *app
        advancedMounts:
          cleanuparr:
            app:
              - path: /config
      tmp:
        type: emptyDir
        advancedMounts:
          cleanuparr:
            app:
              - path: /tmp
                subPath: tmp
      # Required for the "Unlinked Downloads" cleaner: Cleanuparr must see the
      # same /data mount qBittorrent uses so it can stat files and count hardlinks.
      data:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/data
        advancedMounts:
          cleanuparr:
            app:
              - path: /data