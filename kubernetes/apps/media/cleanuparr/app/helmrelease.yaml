---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cleanuparr
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-upgrade
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      cleanuparr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/cleanuparr/cleanuparr
              tag: 2.0.2@sha256:d23d76edd37acfb1e72ef02743c29c89cca49a14ebd9da0d24463f1367a06ddf
            env:
              TZ: ${SECRET_TIMEZONE}
              PORT: &port 9705
              UMASK: 022
              BASE_PATH: '/'
              # QUEUECLEANER__ENABLED: true
              # SONARR__ENABLED: true
              # SONARR__INSTANCES__0__URL: http://sonarr.media.svc.cluster.local:80
              # RADARR__ENABLED: true
              # RADARR__INSTANCES__0__URL: http://radarr.media.svc.cluster.local:7878
              # DOWNLOAD_CLIENT: qBittorrent
              # QBITTORRENT__URL: http://qbittorrent-app.media.svc.cluster.local:80
              # DOWNLOADCLEANER__ENABLED: true
            envFrom:
              - secretRef:
                  name: cleanuparr-config
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsUser: &puid 1000
        runAsGroup: &pgid 1000
        fsGroup: *pgid
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    ingress:
      app:
        className: internal
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        enabled: true
        existingClaim: *app
        advancedMounts:
          cleanuparr:
            app:
              - path: /config
      tmp:
        type: emptyDir
        advancedMounts:
          cleanuparr:
            app:
              - path: /tmp
                subPath: tmp