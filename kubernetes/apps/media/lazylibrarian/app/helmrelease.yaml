---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lazylibrarian
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-upgrade
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  values:
    controllers:
      readarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: linuxserver/lazylibrarian
              tag: version-2f9ad8bd
            env:
              PUID: 1000
              PGID: 1000
              TZ: ${SECRET_TIMEZONE}

            securityContext:
              allowPrivilegeEscalation: true
              # Gag...TODO KILL THIS WITH FIRE ASAP
              readOnlyRootFilesystem: false
              capabilities: 
                add: ["CHOWN", "SETUID", "SETGID"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 200m
                memory: 300Mi
              limits:
                memory: 500Mi

    defaultPodOptions:
      securityContext:
        # Gag...TODO KILL THIS WITH FIRE ASAP
        runAsNonRoot: false
        # runAsUser: 1000
        # runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        # seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: readarr
        ports:
          http:
            port: &port 5299

    ingress:
      app:
        className: internal
        annotations:
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host

    persistence:
      config:
        existingClaim: lazylibrarian
      tmp:
        type: emptyDir
      media:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path:  /mnt/truenas/cf-nas/data
        globalMounts:
          - path: /data
            readOnly: false