---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app grimmory
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  test:
    enable: false
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
      strategy: rollback
    cleanupOnFail: true
  rollback:
    timeout: 10m
    recreate: true
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          *app :
            # Grimmory is the community fork of BookLore; upstream BookLore was
            # deleted at v2.3.1 and Grimmory v3.0.0 continues from that commit.
            # The DB, volumes and port are unchanged — only the env var names
            # were renamed (USER_ID/GROUP_ID, API_DOCS_ENABLED).
            image:
              repository: ghcr.io/grimmory-tools/grimmory
              tag: v3.3.3@sha256:fffd0ae0bfccd64ca00441e8fa58a14e286b9115e5df1cb47eecf294ad09e6ff

            env:
              TZ: "${SECRET_TIMEZONE}"
              USER_ID: "1000"
              GROUP_ID: "1000"
              # Query params match Grimmory's built-in default URL, which our
              # explicit DATABASE_URL would otherwise override away.
              DATABASE_URL: "jdbc:mariadb://mariadb-operator.database.svc.cluster.local:3306/grimmory?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
              DATABASE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: grimmory-secret
                    key: DATABASE_USERNAME
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: grimmory-secret
                    key: DATABASE_PASSWORD
              API_DOCS_ENABLED: "false"
              # /books and /bookdrop are TrueNAS NFS. NFS/SMB cannot guarantee atomic
              # rename, so a move that fails mid-flight can leave the file and the DB
              # disagreeing. NETWORK removes the UI's file mover ("Organize File") and
              # the delete/move/rename actions that depend on it; reading, metadata
              # write-back, bookdrop ingest and sync are unaffected.
              DISK_TYPE: "NETWORK"

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 6060
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              # JVM cold boot (Flyway validate 142 migrations + Hibernate on 64 repos)
              # takes ~55s to open 6060 — longer than liveness would tolerate. The startup
              # probe gates liveness/readiness until boot completes so restarts (e.g. the
              # Talos reboots) don't crashloop it. 30 x 10s = 300s runway.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30

    defaultPodOptions:
      priorityClassName: external-facing

    service:
      app :
        controller: *app
        ports:
          http:
            port: *port

    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["books.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        annotations:
          # gatus-sidecar: without this the internal Gateway's inherited
          # `guarded: true` turns this route into a public-DNS leak canary, so the
          # internal hostname gets no uptime check at all. Overriding it with an
          # HTTP probe means both routes are actually monitored. Grimmory redirects
          # / to its login page, hence < 400 rather than == 200.
          gatus.home-operations.com/endpoint: |
            group: internal
            conditions:
              - "[STATUS] < 400"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /app/data

      books:
        existingClaim: nas-data
        globalMounts:
          - path: /books
            subPath: media/books
            readOnly: false

      bookdrop:
        # PV nas-bookdrop points at applications/booklore/bookdrop — shelfmark mounts the
        # same dataset (see media/shelfmark). Renaming it would drag an unrelated app into
        # this rename for no benefit. Not an oversight.
        existingClaim: nas-bookdrop
        globalMounts:
          - path: /bookdrop
            readOnly: false

