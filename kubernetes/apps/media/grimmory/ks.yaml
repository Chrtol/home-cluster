---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grimmory
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
    - name: mariadb-operator-instance
      namespace: database
    - name: volsync
      namespace: volsync-system
  interval: 1h
  path: ./kubernetes/apps/media/grimmory/app
  components:
    - ../../../../components/ceph-rbd
    - ../../../../components/volsync
  postBuild:
    substitute:
      CEPH_RBD_CAPACITY: 1Gi
      APP: *app
      # VOLSYNC_REPO_NAME is gone on purpose: it was set to "grimmory" ahead of this
      # rename so restic history would survive it. Now that APP is grimmory the
      # component default produces the same /repository/grimmory path, and the
      # existing snapshots carry straight over.
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false