---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readarr-books
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: readarr-books-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        READARR__AUTH__APIKEY: "{{ .READARR-BOOKS_API_KEY }}"
        READARR__POSTGRES__HOST: &dbHost "{{ .POSTGRES_RW_SVC }}"
        READARR__POSTGRES__PORT: "5432"
        READARR__POSTGRES__USER: &dbUser "{{ .READARR-BOOKS_POSTGRES_USER }}"
        READARR__POSTGRES__PASSWORD: &dbPass "{{ .READARR-BOOKS_POSTGRES_PASS }}"
        READARR__POSTGRES__MAINDB: readarr-books_main
        READARR__POSTGRES__LOGDB: readarr-books_log

        INIT_POSTGRES_DBNAME: readarr-books_main readarr-books_log
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        
  dataFrom:
    - extract:
        key: readarr-books
    - extract:
        key: cloudnative-pg