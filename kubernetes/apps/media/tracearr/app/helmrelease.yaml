# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracearr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  # db.home.arpa/dragonfly pod label comes from the dragonfly component.
  # No cnpg component: tracearr 2.x requires TimescaleDB (continuous aggregates +
  # compression, both TSL-only), which the shared postgres17 cluster cannot provide
  # without a self-built image and cluster-wide shared_preload_libraries. It runs its
  # own single-instance timescaledb-ha below instead. See ai-activity/tracearr-timescaledb/.
  valuesFrom:
    - kind: ConfigMap
      name: ${APP}-dragonfly-values
  values:
    controllers:
      tracearr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/connorgallopo/tracearr
              tag: 2.0.0@sha256:2aa63d4b96e96b0ef474e86757ca5208ba42e0ac020f5d6f95782dfed4c43686
            env:
              TZ: ${SECRET_TIMEZONE}
              CORS_ORIGIN: "https://tracearr.${SECRET_DOMAIN}"
              HOST: "0.0.0.0"
              NODE_ENV: production
              PORT: &port 3000
            envFrom:
              - secretRef:
                  name: tracearr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: tracearr
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          tracearr:
            app:
            - path: /app/data/image-cache
              subPath: cache
            - path: /tmp
              subPath: tmp