# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tracearr-secret
    template:
      engineVersion: v2
      data:
        # App
        COOKIE_SECRET: "{{ .TRACEARR_COOKIE_SECRET }}"
        # Points at tracearr's OWN timescaledb-ha pod, not the shared postgres17
        # cluster: 2.x needs TimescaleDB. sslmode=disable because that pod serves
        # plaintext and never leaves the namespace — which also retires the old
        # uselibpqcompat=true workaround (it existed only so node-pg would not treat
        # sslmode=require as verify-full against CNPG's self-signed CA).
        DATABASE_URL: "postgresql://{{ .TRACEARR_POSTGRES_USER }}:{{ .TRACEARR_POSTGRES_PASSWORD | urlquery }}@tracearr-timescale.media.svc.cluster.local:5432/tracearr?sslmode=disable"
        ENCRYPTION_KEY: "{{ .TRACEARR_ENCRYPTION_KEY }}"
        JWT_SECRET: "{{ .TRACEARR_JWT_SECRET }}"
        MAXMIND_LICENSE_KEY: "{{ .MAXMIND_LICENSE_KEY }}"
        REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/15"
  dataFrom:
  - extract:
      key: cloudnative-pg
  - extract:
      key: maxmind
  - extract:
      key: tracearr
---
# Separate secret so the postgres container gets ONLY its own credentials: the app
# container consumes tracearr-secret wholesale via envFrom, and POSTGRES_* keys in
# there would be injected into the app too. Same 1Password fields as DATABASE_URL
# above, so the two can never drift apart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tracearr-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: "{{ .TRACEARR_POSTGRES_USER }}"
        POSTGRES_PASSWORD: "{{ .TRACEARR_POSTGRES_PASSWORD }}"
  # Same two items the app secret merges, in the same order, so these resolve to
  # byte-identical values to the ones baked into DATABASE_URL above no matter which
  # item actually carries TRACEARR_POSTGRES_USER. (maxmind is app-only, omitted.)
  dataFrom:
  - extract:
      key: cloudnative-pg
  - extract:
      key: tracearr
