# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tracearr-secret
    template:
      engineVersion: v2
      data:
        # App
        COOKIE_SECRET: "{{ .TRACEARR_COOKIE_SECRET }}"
        DATABASE_URL: "postgresql://{{ .TRACEARR_POSTGRES_USER }}:{{ .TRACEARR_POSTGRES_PASSWORD | urlquery }}@{{ .POSTGRES_RW_SVC }}:5432/tracearr?sslmode=require"
        ENCRYPTION_KEY: "{{ .TRACEARR_ENCRYPTION_KEY }}"
        JWT_SECRET: "{{ .TRACEARR_JWT_SECRET }}"
        MAXMIND_LICENSE_KEY: "{{ .MAXMIND_LICENSE_KEY }}"
        REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/15"
  dataFrom:
  - extract:
      key: cloudnative-pg
  - extract:
      key: maxmind
  - extract:
      key: tracearr
