---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tracearr
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: dragonfly-cluster
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/media/tracearr/app
  # ceph-rbd  -> RWO PVC for the app's own timescaledb-ha instance. tracearr 2.x needs
  #              TimescaleDB (TSL continuous aggregates + compression), which the shared
  #              postgres17 cluster cannot serve, so this app is deliberately the one
  #              exception to the cnpg component. See ai-activity/tracearr-timescaledb/.
  # volsync   -> restic backup of that PVC, on its own retention independent of the
  #              CNPG cluster's 7d barman policy.
  components:
    - ../../../../components/ceph-rbd
    - ../../../../components/dragonfly
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      CEPH_RBD_CLAIM_NAME: tracearr-timescale
      CEPH_RBD_CAPACITY: 20Gi
      VOLSYNC_PVC: tracearr-timescale
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false