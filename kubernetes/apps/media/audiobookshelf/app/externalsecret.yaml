---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: audiobookshelf-secret
spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-connect
  target:
    name: audiobookshelf-secret
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .AUDIOBOOKSHELF_OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .AUDIOBOOKSHELF_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: audiobookshelf