---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
components:
  - ../../components/common
resources:
  - ./nas/ks.yaml
  - ./plex/ks.yaml
  - ./flaresolverr/ks.yaml
  - ./prowlarr/ks.yaml
  - ./qbittorrent/ks.yaml
  - ./radarr/ks.yaml
  - ./sonarr/ks.yaml
  - ./recyclarr/ks.yaml
  - ./bazarr/ks.yaml
  - ./seerr/ks.yaml
  - ./cleanuparr/ks.yaml
  - ./maintainerr/ks.yaml
  - ./wizarr/ks.yaml
  - ./gluetun/ks.yaml
  - ./tautulli/ks.yaml
  - ./immich/ks.yaml
  - ./audiobookshelf/ks.yaml
  # Disabled: Readarr is discontinued/archived upstream; superseded by
  # shelfmark. Removing it (and its rreading-glasses metadata proxy below)
  # eliminates the dominant WAL churn on the slow Ceph OSD.
  # - ./readarr/ks.yaml
  # - ./readarr-books/ks.yaml
  - ./sabnzbd/ks.yaml
  - ./autobrr/ks.yaml
  - ./cross-seed/ks.yaml
  # Disabled: rarely-used Readarr metadata proxy. Its Postgres `cache` table
  # (~80 writes/sec, 4.77GB) was the dominant WAL source saturating the slow
  # Ceph OSD. Re-enable alongside Readarr when needed.
  # - ./rreading-glasses/ks.yaml
  - ./audiobookrequest/ks.yaml
  - ./grimmory/ks.yaml
  - ./recommendarr/ks.yaml
  - ./mydia/ks.yaml
  - ./qui/ks.yaml
  - ./tracearr/ks.yaml
  - ./shelfmark/ks.yaml
  # Decommissioned 2026-08-05: no hardlink support, so its torrents could only be
  # protected from qui's "Delete Unlinked Orphans" rule by living inside /data/media,
  # which put raw torrent dirs in the library. shelfmark hardlinks instead.
  # Manifests kept in ./readmeabook/; DB dump in ai-activity/readmeabook-decommission/.
  # - ./readmeabook/ks.yaml
  - ./unpackerr/ks.yaml
  - ./owncast/ks.yaml
  - ./yata/ks.yaml
