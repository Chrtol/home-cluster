---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
  namespace: &namespace media
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/media/immich/app
  components:
    - ../../../../components/cnpg
    - ../../../../components/dragonfly
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: external-secrets
      namespace: external-secrets
    - name: intel-device-plugins-gpu
      namespace: kube-system
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: photos
      DB_CONTROLLER: server
      DB_OP_ITEM: *app
      DB_PASS_FIELD: IMMICH_POSTGRES_PASS
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  wait: false
  interval: 30m
  timeout: 5m