---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    timeout: 10m
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      priorityClassName: external-facing
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      server:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17.6.0@sha256:86a1992d46273c58fd4ad95b626081dfaabfe16bd56944675169e406d1a660dd
            envFrom:
              - secretRef:
                  name: immich-secret
          
          02-setup-folders:
            image:
              repository: busybox
              tag: 1.37.0
            command:
              - /bin/sh
              - -c
              - |
                echo "Creating required Immich folder structure..."
                echo "Current directory contents:"
                ls -la /usr/src/app/upload/
                echo "Creating directories..."
                mkdir -p /usr/src/app/upload/upload
                mkdir -p /usr/src/app/upload/thumbs
                mkdir -p /usr/src/app/upload/profile
                mkdir -p /usr/src/app/upload/encoded-video
                mkdir -p /usr/src/app/upload/library
                mkdir -p /usr/src/app/upload/backups
                
                echo "Directory structure after creation:"
                ls -la /usr/src/app/upload/
                
                # Create the .immich marker files for system integrity checks
                echo "Creating .immich marker files..."
                touch /usr/src/app/upload/.immich
                touch /usr/src/app/upload/upload/.immich
                touch /usr/src/app/upload/thumbs/.immich
                touch /usr/src/app/upload/profile/.immich
                touch /usr/src/app/upload/encoded-video/.immich
                touch /usr/src/app/upload/library/.immich
                touch /usr/src/app/upload/backups/.immich
                
                echo "Final directory structure:"
                ls -la /usr/src/app/upload/
                find /usr/src/app/upload/ -name ".immich" -ls
                
                echo "Folder structure created successfully"
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000

        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v1.144.1@sha256:f34203f6c2db130c26480ff21c412c6f0c37c24ee5261f6a6e4fe1eecaa921c0
            env:
              IMMICH_MEDIA_LOCATION: &mediaLocation /usr/src/app/upload
              THUMB_LOCATION: &thumbLocation /thumbnails
              # ENCODED_VIDEO_LOCATION: &evLocation /encoded-video
            envFrom:
              - secretRef:
                  name: immich-secret

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4096Mi
                gpu.intel.com/i915: 1

      machine-learning:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false

        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v1.140.1@sha256:6239f9852f2ccd8bef52b161629a8fc62bac7636750c06e5fe021e994bab4781
            envFrom:
              - secretRef:
                  name: immich-secret
            env:
              MPLCONFIGDIR: "/cache/matplotlib"
              IMMICH_MEDIA_LOCATION: *mediaLocation
              THUMB_LOCATION: *thumbLocation
              # ENCODED_VIDEO_LOCATION: *evLocation
            resources:
              requests:
                cpu: 100m
                memory: 274M
              limits:
                memory: 3949M

    service:
      server:
        controller: server
        ports:
          http:
            port: &port 2283
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003

    route:
      server:
        hostnames: ["immich.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: server
                port: *port

    ingress:
      app:
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hosts:
          - host: &host photos.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: server
                  port: http
        tls:
          - hosts:
            - *host

    persistence:
      matplotlib:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /config/matplotlib

      library:
        type: nfs
        server: nas.cftollefsen.com
        path: /mnt/truenas/cf-nas/applications/immich
        globalMounts:
          - path: *mediaLocation

      thumbnails:
        type: persistentVolumeClaim
        existingClaim: immich-thumbnails  
        advancedMounts:
          server:
            main:
              - path: *thumbLocation

      # encoded-video:
      #   type: nfs
      #   server: nas.cftollefsen.com
      #   path: /mnt/truenas/cf-nas/immich-kubernetes/encoded-video
      #   globalMounts:
      #     - path: *evLocation

      cache:
        type: persistentVolumeClaim
        existingClaim: immich-machine-learning-cache
        advancedMounts:
          machine-learning:
            main:
              - path: /cache
                subPath: cache
              - path: /.cache
                subPath: dotCache

      tmpfs:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers