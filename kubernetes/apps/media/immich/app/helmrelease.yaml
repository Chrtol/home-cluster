---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-upgrade
    namespace: flux-system
  maxHistory: 3
  # install:
  #   createNamespace: true
  #   remediation:
  #     retries: 3
  # upgrade:
  #   cleanupOnFail: true
  #   remediation:
  #     retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      server:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17.5.0@sha256:894a38169bf4135fb1e85a1112c64fc24a267d1191887cbf6fb8c0a17893770d
            envFrom:
              - secretRef:
                  name: immich-secret

          02-verify-mounts:
            image:
              repository: busybox
              tag: latest
            command: ["/bin/sh", "-c"]
            args:
              - |
                echo "Waiting for all mounts to be ready..."
                for i in 1 2 3 4 5; do
                  if [ -f /usr/src/app/upload/.immich ] && \
                     [ -f /usr/src/app/upload/encoded-video/.immich ] && \
                     [ -f /usr/src/app/upload/thumbs/.immich ]; then
                    echo "All mounts verified!"
                    ls -la /usr/src/app/upload/encoded-video/
                    ls -la /usr/src/app/upload/thumbs/
                    exit 0
                  fi
                  echo "Attempt $i: Waiting for mounts..."
                  echo "Main: $(ls -la /usr/src/app/upload/.immich 2>&1)"
                  echo "Encoded: $(ls -la /usr/src/app/upload/encoded-video/.immich 2>&1)"
                  echo "Thumbs: $(ls -la /usr/src/app/upload/thumbs/.immich 2>&1)"
                  sleep 2
                done
                echo "ERROR: Mounts not ready after 10 seconds"
                ls -la /usr/src/app/upload/
                ls -la /usr/src/app/upload/encoded-video/
                ls -la /usr/src/app/upload/thumbs/
                exit 1

        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v1.134.0@sha256:073fc04c7e3d18ace466c20763809cf17aa55765ed610f12971b392a6a80b50c
            env:
              IMMICH_MEDIA_LOCATION: &mediaLocation /usr/src/app/upload
            envFrom:
              - secretRef:
                  name: immich-secret

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4096Mi

      machine-learning:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false

        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v1.134.0@sha256:e157e0fa0d4363b0b6bab1923adab5951bbcdb71cd9016470bc6810dae21d115
            envFrom:
              - secretRef:
                  name: immich-secret
            env:
              MPLCONFIGDIR: "/cache/matplotlib"
              IMMICH_MEDIA_LOCATION: *mediaLocation
            resources:
              requests:
                cpu: 100m
                memory: 274M
              limits:
                memory: 3949M

    service:
      server:
        controller: server
        ports:
          http:
            port: &port 2283
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003

    route:
      server:
        hostnames: ["immich.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: server
                port: *port

    ingress:
      app:
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hosts:
          - host: &host photos.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: server
                  port: http
        tls:
          - hosts:
            - *host

    persistence:
      matplotlib:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /config/matplotlib

      # external:
      #   type: persistentVolumeClaim
      #   existingClaim: immich-external-library-pvc
      #   globalMounts:
      #     - path: /external-library

      library:
        type: nfs
        server: nas.cftollefsen.com
        path: /mnt/truenas/cf-nas/applications/immich/photos
        globalMounts:
          - path: *mediaLocation

      thumbnails:
        type: persistentVolumeClaim
        existingClaim: immich-thumbnails  
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/upload/thumbs
              - path: /usr/src/app/upload/encoded-video

      cache:
        type: persistentVolumeClaim
        existingClaim: immich-machine-learning-cache
        globalMounts:
          - path: /cache
            subPath: cache
          - path: /.cache
            subPath: dotCache

      tmpfs:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers