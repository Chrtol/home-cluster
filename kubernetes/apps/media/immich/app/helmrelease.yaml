---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    timeout: 10m
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # init-db initContainer + db.home.arpa/* pod labels come from the cnpg/dragonfly components
  valuesFrom:
    - kind: ConfigMap
      name: ${APP}-cnpg-values
    - kind: ConfigMap
      name: ${APP}-dragonfly-values
  values:
    defaultPodOptions:
      priorityClassName: external-facing
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      server:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
        initContainers:
          # image + core INIT_POSTGRES_* come from the cnpg component; the second
          # secretRef layers immich's extras on top (USER_FLAGS -s, SUPER_USER)
          init-db:
            envFrom:
              - secretRef:
                  name: immich-initdb-secret
              - secretRef:
                  name: immich-secret

          02-setup-folders:
            image:
              repository: busybox
              tag: 1.38.0
            command:
              - /bin/sh
              - -c
              - |
                echo "Creating required Immich folder structure..."
                echo "Current directory contents:"
                ls -la /usr/src/app/upload/
                echo "Creating directories..."
                mkdir -p /usr/src/app/upload/upload
                mkdir -p /usr/src/app/upload/thumbs
                mkdir -p /usr/src/app/upload/profile
                mkdir -p /usr/src/app/upload/encoded-video
                mkdir -p /usr/src/app/upload/library
                mkdir -p /usr/src/app/upload/backups
                
                echo "Directory structure after creation:"
                ls -la /usr/src/app/upload/
                
                # Create the .immich marker files for system integrity checks
                echo "Creating .immich marker files..."
                touch /usr/src/app/upload/.immich
                touch /usr/src/app/upload/upload/.immich
                touch /usr/src/app/upload/thumbs/.immich
                touch /usr/src/app/upload/profile/.immich
                touch /usr/src/app/upload/encoded-video/.immich
                touch /usr/src/app/upload/library/.immich
                touch /usr/src/app/upload/backups/.immich
                
                echo "Final directory structure:"
                ls -la /usr/src/app/upload/
                find /usr/src/app/upload/ -name ".immich" -ls
                
                echo "Folder structure created successfully"
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000

        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
            env:
              IMMICH_MEDIA_LOCATION: &mediaLocation /usr/src/app/upload
              THUMB_LOCATION: &thumbLocation /thumbnails
              # ENCODED_VIDEO_LOCATION: &evLocation /encoded-video
              # Immich ships native Prometheus metrics (OTEL), so no exporter is needed.
              # The api and microservices telemetry are served by this one container but
              # on two SEPARATE ports -- the job-queue metrics that actually matter for
              # alerting (stuck thumbnail/ML jobs) come from the microservices port.
              IMMICH_TELEMETRY_INCLUDE: all
              IMMICH_API_METRICS_PORT: &apiMetricsPort 8081
              IMMICH_MICROSERVICES_METRICS_PORT: &msMetricsPort 8082
            envFrom:
              - secretRef:
                  name: immich-secret

            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                cpu: "3"
                memory: 4Gi
                gpu.intel.com/i915: 1

      machine-learning:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false

        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
            envFrom:
              - secretRef:
                  name: immich-secret
            env:
              MPLCONFIGDIR: "/cache/matplotlib"
              IMMICH_MEDIA_LOCATION: *mediaLocation
              THUMB_LOCATION: *thumbLocation
              # ENCODED_VIDEO_LOCATION: *evLocation
            resources:
              requests:
                cpu: 100m
                memory: 1536Mi
              limits:
                cpu: "2"
                memory: 4Gi

    service:
      server:
        controller: server
        ports:
          http:
            port: &port 2283
          # Scraped by the immich ServiceMonitor in observability/exporters/immich.
          metrics-api:
            port: *apiMetricsPort
          metrics-microservices:
            port: *msMetricsPort
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003

    route:
      internal:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: server
                port: *port
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["photos.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: server
                port: *port

    persistence:
      matplotlib:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /config/matplotlib

      library:
        existingClaim: nas-immich
        globalMounts:
          - path: *mediaLocation

      thumbnails:
        type: persistentVolumeClaim
        existingClaim: immich-thumbnails  
        advancedMounts:
          server:
            main:
              - path: *thumbLocation

      # encoded-video:
      #   type: nfs
      #   server: nas.${SECRET_DOMAIN}
      #   path: /mnt/truenas/cf-nas/immich-kubernetes/encoded-video
      #   globalMounts:
      #     - path: *evLocation

      cache:
        type: persistentVolumeClaim
        existingClaim: immich-machine-learning-cache
        advancedMounts:
          machine-learning:
            main:
              - path: /cache
                subPath: cache
              - path: /.cache
                subPath: dotCache

      tmpfs:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers