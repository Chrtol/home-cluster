---
# ClientTrafficPolicy for large file uploads (videos, photos)
# Extends client-side timeouts to accommodate large uploads over slow connections
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: immich-client-policy
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: immich-external
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: immich-internal
  timeout:
    http:
      # Time to wait for the client to send the complete request body
      # Extended for large video/photo uploads over slow WiFi connections
      requestReceivedTimeout: 900s  # 15 minutes for large files
  http1:
    http10: {}  # Allow HTTP/1.0 clients if needed
