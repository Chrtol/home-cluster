---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-secret
    creationPolicy: Owner
    template:
      data:
        # Immich
        DB_DATABASE_NAME: &dbname immich
        DB_HOSTNAME: &dbhost postgres17-rw.database.svc.cluster.local
        DB_USERNAME: &dbuser ${APP}
        DB_PASSWORD: &dbpass "{{ .IMMICH_POSTGRES_PASS }}"
        DB_PORT: "5432"
        # Passed straight through to postgres.js as its `ssl` option
        # (config.repository.js: `ssl: dto.DB_SSL_MODE || undefined`), where
        # "require" means rejectUnauthorized:false -- encrypt, but do not verify
        # the server cert. Correct for CNPG's self-signed CA. Verified against the
        # live DB with immich's own driver: ssl=true TLSv1.3.
        #
        # Only read on this discrete-vars path. Setting DB_URL would make immich
        # ignore every DB_* var above, DB_SSL_MODE included. The value is validated
        # by a zod enum, so a typo crashes the server at boot.
        DB_SSL_MODE: require
        JWT_SECRET: "{{ .IMMICH_JWT_SECRET }}"

        # Redis/Dragonfly connection
        # REDIS_URL: ""
        REDIS_HOSTNAME: "dragonfly.database.svc.cluster.local"
        REDIS_PORT: "6379"

        # Extra postgres-init knobs layered on top of the cnpg component's
        # immich-initdb-secret (see the HR init-db envFrom list). NOTE: the
        # current postgres-init image ignores INIT_POSTGRES_EXTENSIONS — the
        # extensions already exist in the DB; kept to document intent for a
        # from-scratch restore.
        INIT_POSTGRES_USER_FLAGS: "-s"
        INIT_POSTGRES_EXTENSIONS: "vector,cube,earthdistance"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        
  dataFrom:
    - extract:
        key: immich
    - extract:
        key: cloudnative-pg