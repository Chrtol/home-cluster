---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: immich
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: immich
spec:
  groups:
    - name: immich.exporter
      rules:
        # Immich serves its own metrics, so an absent target means Immich itself is
        # unreachable OR telemetry got switched off -- both worth knowing.
        - alert: ImmichMetricsAbsent
          annotations:
            description: >-
              Immich has stopped serving metrics on its telemetry ports. Either the
              server is down, or IMMICH_TELEMETRY_INCLUDE was removed from the
              HelmRelease. Every Immich alert below is blind until it returns.
            summary: Immich metrics are absent.
          expr: |
            absent(up{job=~".*immich.*"} == 1)
          for: 15m
          labels:
            severity: critical

    - name: immich.jobs
      rules:
        # Immich's signature silent failure: the pod is healthy, the UI loads, uploads
        # succeed -- but a queue wedges and thumbnails/ML/metadata silently never
        # generate. Nothing at the pod level can see this. immich_queues_<q>_active is a
        # gauge of in-flight jobs; if it stays pinned above zero without draining, the
        # queue is stuck rather than merely busy.
        #
        # min_over_time is the key: a busy queue dips to 0 between batches, a wedged one
        # never does. Never dipping across the window means stuck, not working.
        #
        # These gauges are created lazily, on the first JobStart event -- they do not
        # exist on a freshly restarted pod and are wiped by every restart. That is why
        # the window is 1h rather than longer: it has to be short enough to refill after
        # a restart, or the alert can never evaluate. It is also why this must NOT be
        # written as an absent()-style check -- an idle Immich legitimately publishes no
        # queue series at all, and that is not a fault.
        - alert: ImmichQueueStuck
          annotations:
            description: >-
              An Immich job queue has had jobs in flight continuously for 1h without ever
              draining to zero. A healthy queue dips to 0 between batches; one that never
              does is wedged. Thumbnails, ML or metadata are silently not being generated
              even though the app looks fine.
            summary: An Immich job queue {{ $labels.queue }} is stuck ({{ $value | printf "%.0f" }} jobs in flight).
          # A bare {__name__=~...} selector matches multiple metric names, and min_over_time
          # DROPS __name__ from its output. Once dropped, every immich_queues_*_active series
          # collapses to the same labelset and Prometheus rejects the vector ("vector cannot
          # contain metrics with the same labelset"), so the rule stops evaluating. Aggregating
          # `by (__name__)` does not help -- __name__ is already gone before the aggregation runs.
          # Fix: label_replace the queue name into a real `queue` label BEFORE the function drops
          # __name__, then keep each queue distinct by grouping on that surviving label.
          expr: |
            min by (queue) (
              label_replace(
                min_over_time({__name__=~"immich_queues_.+_active"}[1h]),
                "queue", "$1", "__name__", "immich_queues_(.+)_active"
              )
            ) > 0
          for: 30m
          labels:
            severity: warning

        # Job failures are counters. A steady failure rate means Immich is chewing
        # through assets and erroring on each -- commonly the ML service being
        # unreachable, or unreadable files on the NFS media mount.
        - alert: ImmichJobsFailing
          annotations:
            description: >-
              Immich jobs have been failing continuously for 1h. Most often the
              machine-learning service is unreachable from the server, or media files on
              the NFS mount from the NAS cannot be read. Affected assets get no
              thumbnails, no search embeddings, and no face detection.
            summary: Immich jobs are failing ({{ $labels.job_type }}).
          # Same __name__-drop problem as ImmichQueueStuck above: rate() strips __name__ from a
          # multi-name selector, collapsing every immich_jobs_*_failed_total series to one
          # labelset. label_replace the job type into a real `job_type` label first, then sum
          # per type so each failing job kind stays a distinct, non-colliding series.
          expr: |
            sum by (job_type) (
              label_replace(
                rate({__name__=~"immich_jobs_.+_failed_total"}[15m]),
                "job_type", "$1", "__name__", "immich_jobs_(.+)_failed_total"
              )
            ) > 0
          for: 1h
          labels:
            severity: warning
