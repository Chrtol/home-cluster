---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      unpackerr:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: 0.15.2@sha256:89e13608521ece21dd300c39229fd595a55fbf4b8152771af5670a7455b5c747
            env:
              TZ: ${SECRET_TIMEZONE}
              UN_WEBSERVER_METRICS: "true"
              UN_ACTIVITY: "true"
              # Sonarr
              UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local:80
              UN_SONARR_0_PATHS_0: /data/usenet/complete
              UN_SONARR_0_PATHS_1: /data/torrents/tv
              # Radarr
              UN_RADARR_0_URL: http://radarr.media.svc.cluster.local:7878
              UN_RADARR_0_PATHS_0: /data/usenet/complete
              # Covers both the "movies" category subfolder and the
              # empty-path "radarr" category that saves to /data/torrents directly
              UN_RADARR_0_PATHS_1: /data/torrents
              # Discord notifications (URL injected from unpackerr-secret).
              # The native discord template is auto-detected from the webhook URL.
              # Events: 4=extracted, 3=extract failed
              UN_WEBHOOK_0_NAME: discord
              UN_WEBHOOK_0_NICKNAME: Unpackerr
              UN_WEBHOOK_0_SILENT: "false"
              UN_WEBHOOK_0_EVENTS_0: "4"
              UN_WEBHOOK_0_EVENTS_1: "3"
            envFrom:
              - secretRef:
                  name: unpackerr-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 4Gi

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 65539

    service:
      app:
        controller: unpackerr
        ports:
          http:
            port: 5656

    persistence:
      data:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path:  /mnt/truenas/cf-nas/data
        globalMounts:
          - path: /data
            readOnly: false

    serviceMonitor:
      app:
        serviceName: unpackerr
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s