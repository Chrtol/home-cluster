---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbit-manage
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      qbit-manage:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # config.yml must be writable (qbit_manage rewrites it), so copy the
          # read-only ConfigMap into the writable /config emptyDir at startup.
          init-config:
            image:
              repository: busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - cp /config-template/config.yml /config/config.yml
        containers:
          app:
            image:
              repository: ghcr.io/stuffanthings/qbit_manage
              tag: v4.11.0
            env:
              TZ: ${SECRET_TIMEZONE}
              QBT_CONFIG: /config/config.yml
              QBT_WEB_SERVER: "true"
              QBT_PORT: &port 8080
              QBT_SCHEDULE: "360"   # run every 6 hours (minutes)
            envFrom:
              - secretRef:
                  name: qbit-manage-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 65539

    service:
      app:
        controller: qbit-manage
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config-template:
        type: configMap
        name: qbit-manage-public-config
        globalMounts:
          - path: /config-template
            readOnly: true
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      data:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/data
        globalMounts:
          - path: /data
