---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pia-vpn-scripts
  namespace: media
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e
    
    echo "🔧 PIA WireGuard Dedicated IP + Control Server Starting..."
    
    # Environment validation
    if [[ -z "$PIA_DIP_TOKEN" || -z "$PIA_USER" || -z "$PIA_PASS" ]]; then
        echo "❌ Missing required environment variables"
        exit 1
    fi
    
    # Install dependencies
    export DEBIAN_FRONTEND=noninteractive
    apt-get update -qq
    apt-get install -y -qq curl jq wireguard-tools iptables python3 python3-flask git iproute2
    
    # Clone PIA scripts
    cd /tmp
    rm -rf manual-connections
    git clone https://github.com/pia-foss/manual-connections.git
    cd manual-connections
    
    # Step 1: Get PIA token
    echo "🔐 Step 1: Getting PIA token..."
    export PIA_USER PIA_PASS
    TOKEN_OUTPUT=$(./get_token.sh 2>&1)
    if ! PIA_TOKEN=$(echo "$TOKEN_OUTPUT" | grep "PIA_TOKEN=" | cut -d'=' -f2); then
        echo "❌ Failed to extract PIA token from output: $TOKEN_OUTPUT"
        exit 1
    fi
    if [[ -z "$PIA_TOKEN" ]]; then
        echo "❌ PIA_TOKEN is empty. Output was: $TOKEN_OUTPUT"
        exit 1
    fi
    echo "✅ PIA token obtained: ${PIA_TOKEN:0:20}..."
    export PIA_TOKEN
    
    # Step 2: Connect to WireGuard with dedicated IP
    echo "🚀 Step 2: Connecting to WireGuard with dedicated IP..."
    export WG_SERVER_IP WG_HOSTNAME DIP_TOKEN="$PIA_DIP_TOKEN"
    PIA_PF=false ./connect_to_wireguard_with_token.sh
    
    # Step 3: Enable port forwarding (in background)
    echo "🔀 Enabling port forwarding..."
    ./port_forwarding.sh &
    PF_PID=$!
    
    # Wait a moment for port forwarding to establish
    sleep 10
    
    # Check if WireGuard connection was established
    if wg show | grep -q "interface"; then
        echo "✅ WireGuard connection established successfully"
        
        # Set default route through VPN immediately
        echo "🌐 Configuring default route through VPN..."
        ip route del default || true
        ip route add default dev pia
        echo "✅ Default route set through VPN interface"
        
        # Configure firewall for Kubernetes networking
        echo "🔀 Configuring firewall rules..."
        
        # Allow loopback traffic
        iptables -A INPUT -i lo -j ACCEPT
        iptables -A OUTPUT -o lo -j ACCEPT
        
        # Allow established and related connections
        iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
        
        # Allow cluster communication
        iptables -A INPUT -s 10.42.0.0/16 -j ACCEPT
        iptables -A INPUT -s 10.43.0.0/16 -j ACCEPT
        iptables -A OUTPUT -d 10.42.0.0/16 -j ACCEPT  
        iptables -A OUTPUT -d 10.43.0.0/16 -j ACCEPT
        
        # Allow health check traffic on port 80 and 8000
        iptables -A INPUT -p tcp --dport 80 -j ACCEPT
        iptables -A INPUT -p tcp --dport 8000 -j ACCEPT
        
        # Allow forwarded port if available
        if [[ -f "/tmp/port" ]]; then
            FORWARDED_PORT=$(cat /tmp/port)
            echo "🔀 Opening forwarded port: $FORWARDED_PORT"
            iptables -A INPUT -p tcp --dport $FORWARDED_PORT -j ACCEPT
            iptables -A INPUT -p udp --dport $FORWARDED_PORT -j ACCEPT
        fi
        
        
        # Configure incoming traffic routing
        echo "📥 Configuring incoming traffic routing..."
        
        # Get pod and VPN IPs
        POD_IP=$(ip addr show eth0 | grep 'inet ' | awk '{print $2}' | cut -d'/' -f1)
        VPN_IP=$(ip addr show pia | grep 'inet ' | awk '{print $2}' | cut -d'/' -f1)
        
        # Route incoming traffic properly
        if [[ -n "$POD_IP" && -n "$VPN_IP" ]]; then
            echo "Pod IP: $POD_IP, VPN IP: $VPN_IP"
            
            # Allow local traffic to stay local (health probes, etc.)
            ip route add local $POD_IP dev lo scope host
            
            # DNAT incoming VPN traffic to pod IP for qBittorrent
            iptables -t nat -A PREROUTING -d $VPN_IP -p tcp --dport 80 -j DNAT --to-destination $POD_IP:80
            iptables -t nat -A PREROUTING -d $VPN_IP -p tcp --dport 8000 -j DNAT --to-destination $POD_IP:8000
            
            # Forward incoming traffic on forwarded port to qBittorrent
            if [[ -f "/tmp/port" ]]; then
                FORWARDED_PORT=$(cat /tmp/port)
                iptables -t nat -A PREROUTING -i pia -p tcp --dport $FORWARDED_PORT -j DNAT --to-destination $POD_IP:$FORWARDED_PORT
                iptables -t nat -A PREROUTING -i pia -p udp --dport $FORWARDED_PORT -j DNAT --to-destination $POD_IP:$FORWARDED_PORT
                echo "✅ Forwarding port $FORWARDED_PORT to qBittorrent"
            fi
            
            # Enable NAT for outgoing traffic
            iptables -t nat -A POSTROUTING -o pia -j MASQUERADE
            
            echo "✅ Incoming traffic routing configured"
        else
            echo "❌ Could not determine pod or VPN IP addresses"
        fi
        
        # Start control server in background
        echo "🌐 Starting control server..."
        chmod +x /scripts/control-server.py
        python3 /scripts/control-server.py &
        
        # Monitor VPN connection and port forwarding
        echo "📊 Monitoring VPN connection and port forwarding..."
        while true; do
            if wg show pia | grep -q "endpoint"; then
                echo "✅ VPN connection active"
                if [[ -f "/tmp/port" ]]; then
                    echo "🔀 Port forwarded: $(cat /tmp/port)"
                fi
            else
                echo "❌ VPN connection lost, attempting reconnection..."
                wg-quick down pia 2>/dev/null || true
                wg-quick up pia
            fi
            
            # Check if port forwarding process is still running
            if ! kill -0 $PF_PID 2>/dev/null; then
                echo "⚠️ Port forwarding process died, restarting..."
                ./port_forwarding.sh &
                PF_PID=$!
            fi
            
            sleep 60
        done
    else
        echo "❌ Failed to generate WireGuard config"
        exit 1
    fi

  control-server.py: |
    #!/usr/bin/env python3
    import json
    import subprocess
    import os
    from flask import Flask, jsonify
    
    app = Flask(__name__)
    
    def get_public_ip():
        """Get the public IP address via the VPN"""
        try:
            result = subprocess.run(['curl', '-s', 'https://ipinfo.io/ip'], 
                                  capture_output=True, text=True, timeout=10)
            if result.returncode == 0:
                return result.stdout.strip()
        except:
            pass
        return "unknown"
    
    def get_forwarded_port():
        """Get the forwarded port from PIA"""
        try:
            if os.path.exists('/tmp/port'):
                with open('/tmp/port', 'r') as f:
                    port = f.read().strip()
                    return int(port) if port.isdigit() else 0
        except:
            pass
        return 0
    
    @app.route('/v1/publicip/ip')
    def public_ip():
        """Return public IP for gluetun compatibility"""
        ip = get_public_ip()
        return jsonify({"public_ip": ip})
    
    @app.route('/v1/openvpn/portforwarded')  
    def port_forwarded():
        """Return forwarded port for gluetun compatibility"""
        port = get_forwarded_port()
        return jsonify({"port": port})
    
    @app.route('/health')
    def health():
        """Health check endpoint"""
        return jsonify({"status": "healthy"})
    
    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=8000)