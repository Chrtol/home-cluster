# Dynamic-IP reporter script, delivered as a SOPS-encrypted Secret rather than a
# plaintext configMap: the script body names an external endpoint, so keeping it
# out of cleartext git avoids advertising the setup in a public repo. The script
# holds no secret value itself (the session id comes from the ExternalSecret).
#
# substitute: disabled is REQUIRED — without it Flux postBuild envsubst would eat
# the script's ${VAR}/${VAR:-default} shell expansions (same reason the sibling
# configMapGenerator carries this annotation).
apiVersion: v1
kind: Secret
metadata:
  name: qbittorrent-private-dyn-ip
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
type: Opaque
