---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./externalsecret.yaml
  - ./dyn-ip-secret.sops.yaml
  - ./helmrelease.yaml
  - ./replicationsource.yaml
configMapGenerator:
  - name: qbittorrent-private-coredns
    files:
      - ./config/Corefile
  - name: qbittorrent-private-port-watchdog
    files:
      - ./config/port-watchdog.sh
# configMapGenerator:
#   - name: qbittorrent-loki-rules
#     files:
#       - qbittorrent.yaml=./lokirule.yaml
#     options:
#       labels:
#         loki_rule: "true"
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
