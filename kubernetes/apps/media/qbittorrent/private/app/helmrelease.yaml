---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent-private
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 0
  upgrade:
    # cleanupOnFail: true
    remediation:
      retries: 0
  values:
    controllers:
      qbittorrent-private:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          coredns: 
            image:
              repository: coredns/coredns
              tag: 1.12.2
            args: ["-conf", "/etc/coredns/Corefile"]
            restartPolicy: Always
            securityContext:
              capabilities:
                add: ["NET_BIND_SERVICE"]
              readOnlyRootFilesystem: false
          pia-vpn:
            dependsOn:
              - coredns
            image:
              repository: ubuntu
              tag: 22.04
            restartPolicy: Always
            command: ["/bin/bash"]
            args: ["/scripts/entrypoint.sh"]
            env:
              CONNECTION_SETTINGS: openvpn_udp_standard
              PIA_PF: "true"
              PIA_DNS: "true"
            envFrom:
              - secretRef:
                  name: qbittorrent-private-secret
            securityContext:
              runAsUser: 0  # Must run as root for OpenVPN
              runAsGroup: 0 
              runAsNonRoot: false  #  Override pod-level setting
              capabilities: { add: ["NET_ADMIN"] }
              allowPrivilegeEscalation: true
            resources:
              limits:
                squat.ai/tun: "1"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.1.2@sha256:a724f86a39fa637fc4ff81165585d7273dc9dcd9ca59818a34e9fa9c467dd26c
            env:
              TZ: ${SECRET_TIMEZONE}
              QBT_WEBUI_PORT: &port 80
              QBT_TORRENTING_PORT: 50414
              QBT_WEBUI_ADDRESS: "*"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 8Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    ingress:
      app:
        className: internal
        hosts:
          - host: qb-priv.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http

    persistence:
      config:
        existingClaim: qbittorrent-private
      media:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/data/torrents
        globalMounts:
          - path: /data/torrents
      tmp:
        type: emptyDir
      pia-scripts:
        type: configMap
        name: pia-entrypoint
        defaultMode: 0755
        advancedMounts:
          qbittorrent-private:
            pia-vpn:
              - path: /scripts/entrypoint.sh
                subPath: entrypoint.sh
                readOnly: true
      coredns:
        type: configMap
        name: qbittorrent-private-coredns
        advancedMounts:
          qbittorrent-private:
            coredns:
              - path: /etc/coredns/Corefile
                subPath: Corefile
                readOnly: true
