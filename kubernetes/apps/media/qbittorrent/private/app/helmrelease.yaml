---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent-private
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    # cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      qbittorrent-private:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          coredns:
            image:
              repository: coredns/coredns
              tag: 1.14.6
            args: ["-conf", "/etc/coredns/Corefile"]
            restartPolicy: Always
            securityContext:
              capabilities:
                add: ["NET_BIND_SERVICE"]
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
          gluetun:
            dependsOn:
              - coredns
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            restartPolicy: Always
            env:
              DOT: "off"
              DNS_ADDRESS: 127.0.0.2
              DNS_KEEP_NAMESERVER: "off"
              HTTP_CONTROL_SERVER_ADDRESS: ":8000"
              HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: &gluetunAuthPath /config/auth.toml
              HTTP_CONTROL_SERVER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-private-secret
                    key: GLUETUN_CONTROL_SERVER_API_KEY
              VPN_SERVICE_PROVIDER: protonvpn
              # WireGuard: much higher throughput + fewer connection resets than OpenVPN.
              # Requires WIREGUARD_PRIVATE_KEY in qbittorrent-private-secret (Proton WG
              # config generated WITH NAT-PMP/port forwarding enabled).
              VPN_TYPE: wireguard
              # Norway-preferred with Nordic fallback. All three are P2P-capable
              # (gluetun equates ProtonVPN P2P == port-forward-capable), low-latency,
              # and this deliberately drops Netherlands (flagged unreliable for
              # Proton NAT-PMP port forwarding).
              SERVER_COUNTRIES: Norway,Sweden,Denmark
              VPN_PORT_FORWARDING: on
              VPN_PORT_FORWARDING_PROVIDER: protonvpn
              # Only select servers that support port forwarding (P2P). If the pool
              # ever empties, gluetun crashloops with "no server found" (loud) rather
              # than silently connecting to a non-PF server -> firewalled qBittorrent.
              PORT_FORWARD_ONLY: "on"
              FIREWALL_INPUT_PORTS: "80,8000,9999"
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16 #cluster CIDR and service-cluster CIDR
              HEALTH_SERVER_ADDRESS: ":9999"
            envFrom:
              - secretRef:
                  name: qbittorrent-private-secret
            lifecycle:
              postStart:
                exec:
                  command:
                    - "/bin/sh"
                    - "-c"
                    - "(ip rule del table 51820; ip -6 rule del table 51820) || true"
            securityContext:
              runAsUser: 0  # Gluetun must run as root
              runAsGroup: 0
              runAsNonRoot: false  #  Override pod-level setting
              capabilities: { add: ["NET_ADMIN"] }
              allowPrivilegeEscalation: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                squat.ai/tun: "1"
                memory: 128Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
            env:
              TZ: ${SECRET_TIMEZONE}
              QBT_WEBUI_PORT: &port 80
              QBT_TORRENTING_PORT: 50414
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              # No CPU limit -- recheck bursts to several cores; throttling stretches them.
              requests:
                cpu: 600m
                memory: 4Gi
              limits:
                memory: 6Gi
          port-forward:
            image:
              repository: ghcr.io/bjw-s-labs/gluetun-qb-port-sync
              tag: 0.0.4@sha256:14ce24f2e054abf06f695f35c8c33612e49d6d0fe80a33896403d85b09a9d329
            env:
              GLUETUN_CONTROL_SERVER_HOST: localhost
              GLUETUN_CONTROL_SERVER_PORT: 8000
              GLUETUN_CONTROL_SERVER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-private-secret
                    key: GLUETUN_CONTROL_SERVER_API_KEY
              QBITTORRENT_HOST: localhost
              QBITTORRENT_WEBUI_PORT: *port
              CRON_ENABLED: true
              CRON_SCHEDULE: "*/5 * * * *"
              LOG_TIMESTAMP: false
            securityContext:
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 146Mi
              limits:
                memory: 256Mi
          # Watchdog for the gluetun PF stuck-at-0 bug (upstream #3178/#3257,
          # fixed only on master/latest). gluetun's healthcheck ignores port
          # forwarding, so a dead NAT-PMP gateway leaves the forwarded port at 0
          # indefinitely -> qBittorrent "firewalled" -> failed seeding -> H&R.
          # On a SUSTAINED port==0 this cycles the tunnel (stop->start) via the
          # control server, which reselects a server and re-requests NAT-PMP,
          # WITHOUT restarting the pod (a container-only restart would strand
          # qBittorrent on loopback — see upstream #3383).
          port-watchdog:
            image:
              # docker.io/alpine/curl — same utility image used by the opnsense/
              # hetzner exporters. Ships curl + BusyBox sh (no jq needed here).
              repository: docker.io/alpine/curl
              tag: 8.21.0@sha256:7e0084208deb6b1dd71bba78e4d5ada7e29054b7782214d037fa78739faf3fe9
            command:
              - /bin/sh
              - /scripts/port-watchdog.sh
            env:
              GLUETUN_CONTROL_SERVER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-private-secret
                    key: GLUETUN_CONTROL_SERVER_API_KEY
            securityContext:
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 32Mi
    defaultPodOptions:
      # Keep this bulk NFS writer off Plex's node. One NFS mount multiplexes all I/O
      # for a client<->server pair over a SINGLE TCP connection, so 69 MB/s of torrent
      # writes put Plex's reads at the back of the queue -- 2026-08-07 seeks stalled
      # 30s+ while the NAS itself sat at 26% disk busy and load 1.55. Anti-affinity
      # rather than a nodeSelector so the rule tracks Plex if its GPU affinity moves it.
      # IgnoredDuringExecution: nothing evicts if Plex later lands here (e.g. dell1
      # down); they separate again on the next restart.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: plex
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["qb-priv.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        existingClaim: qbittorrent-private
      media:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/data/torrents
        globalMounts:
          - path: /data/torrents
            readOnly: false
      media-library:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/data/media
        globalMounts:
          - path: /data/media
            readOnly: false
      tmp:
        type: emptyDir
      gluetun-auth:
        type: secret
        name: qbittorrent-private-gluetun-secret
        advancedMounts:
          qbittorrent-private:
            gluetun:
              - path: *gluetunAuthPath
                subPath: auth.toml
      # Fresh ProtonVPN server list from the gluetun-update CronJob. gluetun
      # auto-reads/merges /gluetun/servers.json when present, keeping the
      # Norway-pinned + PORT_FORWARD_ONLY server pool populated with live
      # endpoints (dead-server connection failures avoided).
      gluetun-data:
        existingClaim: gluetun-update
        advancedMounts:
          qbittorrent-private:
            gluetun:
              - path: /gluetun
                readOnly: false
      coredns:
        type: configMap
        name: qbittorrent-private-coredns
        advancedMounts:
          qbittorrent-private:
            coredns:
              - path: /etc/coredns/Corefile
                subPath: Corefile
                readOnly: true
      port-watchdog:
        type: configMap
        name: qbittorrent-private-port-watchdog
        advancedMounts:
          qbittorrent-private:
            port-watchdog:
              - path: /scripts/port-watchdog.sh
                subPath: port-watchdog.sh
                readOnly: true
