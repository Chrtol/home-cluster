---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pia-entrypoint
  namespace: media
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e

    # Colors for output
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    YELLOW='\033[1;33m'
    NC='\033[0m'

    log() {
        echo -e "${GREEN}[$(date +'%Y-%m-%d %H:%M:%S')] $1${NC}"
    }

    error() {
        echo -e "${RED}[$(date +'%Y-%m-%d %H:%M:%S')] ERROR: $1${NC}"
        exit 1
    }

    # Install dependencies
    log "Installing dependencies..."
    export DEBIAN_FRONTEND=noninteractive
    apt-get update >/dev/null 2>&1
    apt-get install -y openvpn jq curl iproute2 iptables git expect >/dev/null 2>&1

    # Check required environment variables
    if [[ -z "$PIA_USER" || -z "$PIA_PASS" || -z "$DIP_TOKEN" || -z "$OVPN_SERVER_IP" || -z "$OVPN_HOSTNAME" ]]; then
        error "Missing required environment variables: PIA_USER, PIA_PASS, DIP_TOKEN, OVPN_SERVER_IP, OVPN_HOSTNAME"
    fi

    # Set defaults
    CONNECTION_SETTINGS=${CONNECTION_SETTINGS:-"openvpn_udp_standard"}
    PIA_PF=${PIA_PF:-"true"}
    PIA_DNS=${PIA_DNS:-"true"}

    log "Starting PIA-FOSS OpenVPN connection process..."
    log "Server: $OVPN_HOSTNAME"
    log "Connection: $CONNECTION_SETTINGS"
    log "Port Forwarding: $PIA_PF"

    # Download PIA-FOSS scripts if not already present
    if [[ ! -d /opt/pia-foss ]]; then
        log "Downloading PIA-FOSS scripts..."
        git clone https://github.com/pia-foss/manual-connections.git /opt/pia-foss
        if [[ $? -ne 0 ]]; then
            error "Failed to clone PIA-FOSS repository"
        fi
    fi
    
    # The git clone creates the full repo, so we need to go to manual-connections directory
    if [[ -d /opt/pia-foss/manual-connections ]]; then
        cd /opt/pia-foss/manual-connections
    else
        # Check if the clone created the files directly in /opt/pia-foss
        cd /opt/pia-foss
    fi
    
    chmod +x *.sh
    log "Current directory: $(pwd)"
    log "Available scripts: $(ls -la *.sh 2>/dev/null || echo 'No shell scripts found')"

    # Step 1: Get PIA token
    log "Step 1: Getting PIA token..."
    export PIA_USER PIA_PASS
    TOKEN_OUTPUT=$(./get_token.sh 2>&1)
    if ! PIA_TOKEN=$(echo "$TOKEN_OUTPUT" | grep "PIA_TOKEN=" | cut -d'=' -f2); then
        error "Failed to extract PIA token from output: $TOKEN_OUTPUT"
    fi
    if [[ -z "$PIA_TOKEN" ]]; then
        error "PIA_TOKEN is empty. Output was: $TOKEN_OUTPUT"
    fi
    log "✓ PIA token obtained: ${PIA_TOKEN:0:20}..."

    # Step 2: Using dedicated IP info from environment variables
    log "Step 2: Using dedicated IP information from environment..."
    export PIA_TOKEN DIP_TOKEN
    log "✓ Using dedicated IP server: $OVPN_HOSTNAME"

    # Step 3: Connect to OpenVPN
    log "Step 3: Connecting to OpenVPN..."
    export OVPN_SERVER_IP OVPN_HOSTNAME PIA_TOKEN DIP_TOKEN CONNECTION_SETTINGS PIA_PF PIA_DNS

    # Create necessary directories
    mkdir -p /opt/piavpn-manual

    # Start the connection with expect to handle password prompts
    log "Starting OpenVPN connection..."
    expect << EXPECT_EOF &
    spawn ./connect_to_openvpn_with_token.sh
    expect {
        "Enter Auth Password:" {
            send "$PIA_PASS\r"
            exp_continue
        }
        "password:" {
            send "$PIA_PASS\r"
            exp_continue
        }
        eof
    }
    EXPECT_EOF
    CONNECT_PID=$!

    # Wait for connection to establish
    log "Waiting for OpenVPN connection to establish..."
    for i in {1..60}; do
        if [[ -f /opt/piavpn-manual/debug_info ]] && grep -q "Initialization Sequence Completed" /opt/piavpn-manual/debug_info; then
            log "✓ OpenVPN connection established successfully!"
            CONNECTION_ESTABLISHED=true
            break
        fi
        
        # Check for authentication errors and provide more specific feedback
        if [[ -f /opt/piavpn-manual/debug_info ]]; then
            if grep -q "auth-failure\|AUTH_FAILED\|authentication failed" /opt/piavpn-manual/debug_info; then
                log "Authentication error detected. Checking credentials..."
                if [[ -f /opt/piavpn-manual/credentials ]]; then
                    log "Credentials file exists with $(wc -l < /opt/piavpn-manual/credentials) lines"
                else
                    log "WARNING: Credentials file not found!"
                fi
                tail -20 /opt/piavpn-manual/debug_info
                error "OpenVPN authentication failed"
            fi
            
            if grep -q "fatal error\|Exiting due to fatal error" /opt/piavpn-manual/debug_info; then
                log "Fatal error detected in OpenVPN logs:"
                tail -20 /opt/piavpn-manual/debug_info
                error "OpenVPN failed with fatal error"
            fi
        fi
        
        if [[ $i -eq 60 ]]; then
            log "Connection attempt timed out. Checking debug info..."
            if [[ -f /opt/piavpn-manual/debug_info ]]; then
                tail -20 /opt/piavpn-manual/debug_info
            fi
            if [[ -f /opt/piavpn-manual/credentials ]]; then
                log "Credentials file exists with $(wc -l < /opt/piavpn-manual/credentials) lines"
            fi
            error "OpenVPN connection failed to establish within 60 seconds"
        fi
        sleep 1
    done

    # Get the OpenVPN PID
    if [[ -f /opt/piavpn-manual/pia_pid ]]; then
        OVPN_PID=$(cat /opt/piavpn-manual/pia_pid)
        log "OpenVPN PID: $OVPN_PID"
    fi

    # Fix routing to ensure Kubernetes cluster traffic bypasses VPN
    log "Fixing cluster network routing..."
    # Add routes for Kubernetes cluster networks to bypass VPN
    ip route add 10.42.0.0/16 via $(ip route | grep '^default' | awk '{print $3}') dev eth0 2>/dev/null || true
    ip route add 10.43.0.0/16 via $(ip route | grep '^default' | awk '{print $3}') dev eth0 2>/dev/null || true
    log "✓ Cluster network routing configured"

    # Show connection info
    if [[ -f /opt/piavpn-manual/route_info ]]; then
        GATEWAY_IP=$(cat /opt/piavpn-manual/route_info)
        log "VPN Gateway IP: $GATEWAY_IP"
    fi

    # Function to cleanup on exit
    cleanup() {
        log "Shutting down OpenVPN connection..."
        if [[ -n "$OVPN_PID" ]]; then
            kill "$OVPN_PID" 2>/dev/null || true
        fi
        exit 0
    }

    # Set up signal handlers
    trap cleanup SIGTERM SIGINT

    log "OpenVPN connection established. Monitoring connection..."

    # Keep the container running and monitor the connection
    while true; do
        if [[ -n "$OVPN_PID" ]] && ! kill -0 "$OVPN_PID" 2>/dev/null; then
            error "OpenVPN process died unexpectedly"
        fi
        
        # Check if tunnel interface exists
        if ! ip link show tun06 >/dev/null 2>&1; then
            warn "VPN tunnel interface tun06 is missing, attempting to restart..."
            cleanup
        fi
        
        sleep 30
    done