---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-private
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: qbittorrent-private-secret
    template:
      data:
        GLUETUN_CONTROL_SERVER_API_KEY: "{{ .QB_GLUETUN_API_KEY }}"
        OPENVPN_USER: "{{ .PIA_USERNAME }}"
        OPENVPN_PASSWORD: "{{ .PIA_PASSWORD }}"
        # XSEED_APIKEY: "{{ .CROSS_SEED_API_KEY }}"
        
        # PIA-FOSS container environment variables
        PIA_USER: "{{ .PIA_USERNAME }}"
        PIA_PASS: "{{ .PIA_PASSWORD }}"
        DIP_TOKEN: "{{ .PIA_DEDICATED_IP_TOKEN }}"
        OVPN_SERVER_IP: "{{ .PIA_DEDICATED_IP_ADDRESS }}"
        OVPN_HOSTNAME: "{{ .PIA_DEDICATED_IP_HOSTNAME }}"

        #Restic backup
        RESTIC_REPOSITORY: "/repository/qbittorrent-private"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
  dataFrom:
    - extract:
        key: qbittorrent
    - extract:
        key: privateinternetaccess
    - extract:
        key: restic
    # - extract:
    #     key: cross-seed
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-private-gluetun
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: qbittorrent-private-gluetun-secret
    template:
      data:
        auth.toml: |
          [[roles]]
          name = "gluetun-qb-port-sync"
          routes = [
            "GET /v1/publicip/ip",
            "GET /v1/openvpn/portforwarded"
          ]
          auth = "apikey"
          apikey = "{{ .QB_GLUETUN_API_KEY }}"
  dataFrom:
    - extract:
        key: qbittorrent