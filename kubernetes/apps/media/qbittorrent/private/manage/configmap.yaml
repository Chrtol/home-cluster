---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbit-manage-private-config
data:
  config.yml: |
    # qbit-manage config for qbittorrent-private
    # Rules live in git; qBit credentials injected via !ENV from the secret.
    # dry_run verified safe on 2026-07-11 (14 unregistered found, cleanuparr-unlinked
    # untouched); now live. Set dry_run True again if changing rules materially.
    commands:
      dry_run: False
      recheck: False
      cat_update: False
      tag_update: False
      rem_unregistered: True
      tag_tracker_error: False
      # Disabled: both qBit instances share /data/torrents, but each qbit_manage
      # only sees ITS instance's torrents — so the other instance's files look
      # orphaned (741 false positives on the private run, correctly aborted by the
      # max-threshold safety). Unsafe until cross-instance orphan detection exists.
      rem_orphaned: False
      tag_nohardlinks: False
      share_limits: False       # Prowlarr owns seeding limits — do not let qbm manage them
      skip_qb_version_check: True    # qBit v5.2.3 exceeds qbit_manage v4.9.1's tested ceiling; bypass (rem_unregistered still works)
      skip_cleanup: False

    qbt:
      host: "qbittorrent-private.media.svc.cluster.local:80"
      user: !ENV QBIT_USER
      pass: !ENV QBIT_PASS

    settings:
      force_auto_tmm: False
      tracker_error_tag: issue
      nohardlinks_tag: noHL
      # Conservative for private trackers (H&R protection). Unregistered torrents
      # are H&R-exempt (tracker already deleted them), so the per-run cap was only
      # a first-run safety governor — raised to 25 after verifying safe operation
      # so the backlog (mostly seedpool.org) drains in a run or two instead of days.
      rem_unregistered_filter_completed: False
      rem_unregistered_grace_minutes: 60   # skip newly-added torrents flagged unregistered
      rem_unregistered_max_torrents: 25    # cap removals per tracker per run
      rem_unregistered_ignore_list:
        - unreachable
        - maintenance
        - tracker is down
        - down for

    directory:
      # In-container paths; qBit and qbit-manage both see the share at /data/torrents.
      root_dir: "/data/torrents"
      orphaned_dir: "/data/torrents/orphaned_data"
      recycle_bin: "/data/torrents/.RecycleBin"

    cat:
      # Every category MUST be declared so rem_orphaned does not treat
      # referenced folders (including the Cleanuparr staging category) as orphaned.
      tv: "/data/torrents/tv"
      movies: "/data/torrents/movies"
      audiobooks: "/data/torrents/audiobooks"
      books: "/data/torrents/books"
      music: "/data/torrents/music"
      readmeabook: "/data/media/audiobooks"
      cleanuparr-unlinked: "/data/torrents/cleanuparr-unlinked"

    tracker:
      # Fallback tag for any tracker not explicitly mapped.
      other:
        tag: other
