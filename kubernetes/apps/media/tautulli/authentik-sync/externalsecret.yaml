---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name tautulli-authentik-sync-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTHENTIK_TOKEN: "{{ .AUTHENTIK_BOOTSTRAP_TOKEN }}"
        TAUTULLI_API_KEY: "{{ .TAUTULLI_API_KEY }}"
        WEBHOOK_SECRET: "{{ .TAUTULLI_WEBHOOK_SECRET }}"
        WEBHOOK_NOTIFIER_ID: "{{ .TAUTULLI_WEBHOOK_NOTIFIER_ID }}"
  dataFrom:
    - extract:
        key: authentik
    - extract:
        key: tautulli