---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tautulli-authentik-sync-script
  namespace: media
data:
  app.py: |
    #!/usr/bin/env python3
    import os
    import json
    import requests
    import sqlite3
    from flask import Flask, request, jsonify
    from datetime import datetime
    import logging

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)
    app = Flask(__name__)

    # Suppress health check logs
    werkzeug_logger = logging.getLogger('werkzeug')
    class HealthCheckFilter(logging.Filter):
        def filter(self, record):
            return 'GET /health' not in record.getMessage()
    werkzeug_logger.addFilter(HealthCheckFilter())

    AUTHENTIK_URL = os.getenv('AUTHENTIK_URL', 'http://authentik-server.security.svc.cluster.local')
    AUTHENTIK_TOKEN = os.getenv('AUTHENTIK_TOKEN')
    DEFAULT_GROUPS = os.getenv('DEFAULT_GROUPS', 'audiobookshelf-users,media-users').split(',')
    WEBHOOK_SECRET = os.getenv('WEBHOOK_SECRET', '')
    DB_PATH = '/data/users.db'

    def init_db():
        conn = sqlite3.connect(DB_PATH)
        cursor = conn.cursor()
        cursor.execute('''
            CREATE TABLE IF NOT EXISTS processed_users (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                plex_username TEXT UNIQUE,
                email TEXT,
                authentik_user_id TEXT,
                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            )
        ''')
        conn.commit()
        conn.close()

    def is_user_processed(username):
        conn = sqlite3.connect(DB_PATH)
        cursor = conn.cursor()
        cursor.execute('SELECT 1 FROM processed_users WHERE plex_username = ?', (username,))
        result = cursor.fetchone()
        conn.close()
        return result is not None

    def mark_user_processed(username, email, authentik_user_id):
        conn = sqlite3.connect(DB_PATH)
        cursor = conn.cursor()
        cursor.execute(
            'INSERT OR REPLACE INTO processed_users (plex_username, email, authentik_user_id) VALUES (?, ?, ?)',
            (username, email, authentik_user_id)
        )
        conn.commit()
        conn.close()

    def create_authentik_user(username, email, name):
        try:
            headers = {
                'Authorization': f'Bearer {AUTHENTIK_TOKEN}',
                'Content-Type': 'application/json'
            }
            
            user_data = {
                'username': username,
                'email': email or f"{username}@plex.local",
                'name': name or username,
                'is_active': True,
                'type': 'external'
            }
            
            logger.info(f"Creating Authentik user: {username}")
            response = requests.post(f'{AUTHENTIK_URL}/api/v3/core/users/', headers=headers, json=user_data)
            
            if response.status_code == 201:
                return response.json()
            elif response.status_code == 400:
                error_data = response.json()
                if 'username' in error_data and 'already exists' in str(error_data['username']):
                    logger.info(f"User {username} already exists in Authentik")
                    get_response = requests.get(f'{AUTHENTIK_URL}/api/v3/core/users/?username={username}', headers=headers)
                    if get_response.status_code == 200:
                        users = get_response.json()['results']
                        if users:
                            return users[0]
                raise Exception(f"Failed to create user: {error_data}")
            else:
                response.raise_for_status()
                
        except Exception as e:
            logger.error(f"Error creating Authentik user {username}: {e}")
            return None

    def get_authentik_groups():
        try:
            headers = {'Authorization': f'Bearer {AUTHENTIK_TOKEN}', 'Content-Type': 'application/json'}
            response = requests.get(f'{AUTHENTIK_URL}/api/v3/core/groups/', headers=headers)
            response.raise_for_status()
            return {group['name']: group['pk'] for group in response.json()['results']}
        except Exception as e:
            logger.error(f"Error fetching Authentik groups: {e}")
            return {}

    def add_user_to_groups(user_id, group_names):
        try:
            headers = {'Authorization': f'Bearer {AUTHENTIK_TOKEN}', 'Content-Type': 'application/json'}
            all_groups = get_authentik_groups()

            for group_name in group_names:
                if group_name in all_groups:
                    group_id = all_groups[group_name]
                    response = requests.post(f'{AUTHENTIK_URL}/api/v3/core/groups/{group_id}/add_user/', headers=headers, json={'pk': user_id})

                    if response.status_code in [200, 204]:
                        logger.info(f"Added user {user_id} to group {group_name}")
                    else:
                        logger.warning(f"Failed to add user {user_id} to group {group_name}: {response.text}")
                else:
                    logger.warning(f"Group {group_name} not found in Authentik")

        except Exception as e:
            logger.error(f"Error adding user to groups: {e}")

    def sync_existing_users():
        """Populate database with existing Authentik users on startup"""
        try:
            logger.info("Syncing existing users from Authentik to local database...")
            headers = {'Authorization': f'Bearer {AUTHENTIK_TOKEN}', 'Content-Type': 'application/json'}

            # Fetch all users from Authentik (type=external to match our created users)
            response = requests.get(f'{AUTHENTIK_URL}/api/v3/core/users/?type=external', headers=headers)
            if response.status_code == 200:
                users = response.json()['results']
                synced_count = 0

                for user in users:
                    username = user.get('username')
                    email = user.get('email', '')
                    user_id = user.get('pk')

                    if username and user_id:
                        # Add to database if not already there
                        if not is_user_processed(username):
                            mark_user_processed(username, email, user_id)
                            synced_count += 1

                logger.info(f"Synced {synced_count} existing users from Authentik")
            else:
                logger.warning(f"Failed to fetch users from Authentik: {response.status_code}")

        except Exception as e:
            logger.error(f"Error syncing existing users: {e}")

    @app.route('/webhook', methods=['POST'])
    def webhook_handler():
        try:
            logger.info(f"Webhook request received from {request.remote_addr}")
            logger.info(f"All headers: {list(request.headers.keys())}")
            logger.info(f"X-Webhook-Secret header: '{request.headers.get('X-Webhook-Secret', 'NOT_FOUND')}'")

            if WEBHOOK_SECRET:
                provided_secret = request.headers.get('X-Webhook-Secret', '')
                expected_secret = WEBHOOK_SECRET
                logger.info(f"Secret comparison - Expected: '{expected_secret}' (len={len(expected_secret)}), Provided: '{provided_secret}' (len={len(provided_secret)})")
                if provided_secret != WEBHOOK_SECRET:
                    logger.warning("Invalid webhook secret - mismatch detected")
                    return jsonify({'error': 'Unauthorized'}), 401

            data = request.get_json()
            if not data:
                logger.warning("No JSON data provided in request")
                return jsonify({'error': 'No JSON data provided'}), 400

            logger.info(f"Received webhook data: {json.dumps(data, indent=2)}")

            username = data.get('username') or data.get('user')
            email = data.get('email')
            
            if not username:
                logger.warning("No username found in webhook data")
                return jsonify({'error': 'No username provided'}), 400

            if is_user_processed(username):
                logger.info(f"User {username} already processed, skipping")
                return jsonify({'message': 'User already processed'}), 200

            authentik_user = create_authentik_user(username, email, username)
            if authentik_user:
                authentik_user_id = authentik_user['pk']
                
                if DEFAULT_GROUPS:
                    add_user_to_groups(authentik_user_id, [g.strip() for g in DEFAULT_GROUPS if g.strip()])
                
                mark_user_processed(username, email, authentik_user_id)
                
                logger.info(f"Successfully created and configured user: {username}")
                return jsonify({
                    'message': 'User created successfully',
                    'username': username,
                    'authentik_user_id': authentik_user_id
                }), 200
            else:
                logger.error(f"Failed to create user: {username}")
                return jsonify({'error': 'Failed to create user'}), 500

        except Exception as e:
            logger.error(f"Error processing webhook: {e}")
            return jsonify({'error': str(e)}), 500

    @app.route('/health', methods=['GET'])
    def health_check():
        try:
            return jsonify({'status': 'healthy'}), 200
        except Exception as e:
            logger.error(f"Health check failed: {e}")
            return jsonify({'status': 'unhealthy', 'error': str(e)}), 500

    @app.route('/status', methods=['GET'])
    def status():
        try:
            conn = sqlite3.connect(DB_PATH)
            cursor = conn.cursor()
            cursor.execute('SELECT COUNT(*) FROM processed_users')
            count = cursor.fetchone()[0]
            conn.close()
            
            return jsonify({
                'status': 'running',
                'processed_users': count,
                'default_groups': DEFAULT_GROUPS
            }), 200
        except Exception as e:
            return jsonify({'error': str(e)}), 500

    if __name__ == '__main__':
        init_db()
        sync_existing_users()
        logger.info("Starting Tautulli-Authentik sync webhook service")
        logger.info(f"Default groups: {DEFAULT_GROUPS}")
        app.run(host='0.0.0.0', port=5000)

