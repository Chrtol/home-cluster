---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mydia
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # init-db initContainer + db.home.arpa/postgres pod label come from the cnpg component
  valuesFrom:
    - kind: ConfigMap
      name: ${APP}-cnpg-values
  values:
    controllers:
      mydia:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/getmydia/mydia
              tag: 0.12.0-pg@sha256:3d64970b2f18c14df395d716c215561d2b986cf903f7e4f95c9cbf3a27c2aa29
            command:
              - /bin/sh
              - -c
              - |
                # Skip chown on mounted volumes, only run on /app
                echo "Starting Mydia (skipping chown on mounted volumes)..."
                mkdir -p /config /data /media 2>/dev/null || true
                chown -R 1000:1000 /app 2>/dev/null || true
                if [ -n "$TZ" ] && [ -f "/usr/share/zoneinfo/$TZ" ]; then
                  ln -sf "/usr/share/zoneinfo/$TZ" /etc/localtime
                fi
                exec /app/bin/mydia start
            env:
              PUID: &puid 1000
              PGID: &pgid 1000
              TZ: ${SECRET_TIMEZONE}
              PHX_HOST: mydia.${SECRET_DOMAIN}
              PORT: &port 4000
              MOVIES_PATH: /data/media/movies
              TV_PATH: /data/media/tv
            envFrom:
              - secretRef:
                  name: mydia-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN"]
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: *puid
        runAsGroup: *pgid
        fsGroup: *pgid
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: mydia
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: mydia
      media:
        existingClaim: nas-data
        globalMounts:
          - path: /data
            readOnly: false
      tmp:
        type: emptyDir
