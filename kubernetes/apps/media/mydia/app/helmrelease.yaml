---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mydia
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      mydia:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.1
              pullPolicy: IfNotPresent
            envFrom: &envFrom
              - secretRef:
                  name: mydia-secret
        containers:
          app:
            image:
              repository: ghcr.io/getmydia/mydia
              tag: 0.7.4-pg@sha256:014b64d251a1bf6a6df2c6e066b8bee7d635232fa22031a981a36293a7278bdb
            env:
              PUID: &puid 1000
              PGID: &pgid 1000
              TZ: ${SECRET_TIMEZONE}
              PHX_HOST: ${SECRET_DOMAIN}
              PORT: &port 4000
              MOVIES_PATH: &moviePath /data/media/movies
              TV_PATH: &tvPath /data/media/movies
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: *puid
        runAsGroup: *pgid
        fsGroup: *pgid
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: mydia
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: mydia
      media:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path:  /mnt/truenas/cf-nas/data
        globalMounts:
          - path: /data
            readOnly: false
      tmp:
        type: emptyDir
