---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-update
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gluetun-update-secret
    template:
      data:
        # The ProtonVPN server-list updater authenticates against the Proton API
        # (account.proton.me), so these are the Proton ACCOUNT email + password —
        # NOT the OpenVPN/IKEv2 connection username (no +pmp suffix). Source:
        # gluetun v3.41.1 internal/configuration/settings/updater.go reads
        # UPDATER_PROTONVPN_EMAIL / UPDATER_PROTONVPN_PASSWORD (both required).
        UPDATER_PROTONVPN_EMAIL: "{{ .PROTON_ACCOUNT_EMAIL }}"
        UPDATER_PROTONVPN_PASSWORD: "{{ .PROTON_ACCOUNT_PASSWORD }}"
  dataFrom:
    - extract:
        key: protonvpn
