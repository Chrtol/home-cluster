---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gluetun-update
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      gluetun-update:
        type: cronjob
        cronjob:
          schedule: "@daily"
          suspend: false
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          gluetun-update:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
            args:
              - update
              - -enduser
              - -providers
              - protonvpn
            env:
              TZ: ${SECRET_TIMEZONE}
            # UPDATER_PROTONVPN_EMAIL / _PASSWORD come from the secret below.
            # ProtonVPN's server API is now auth-gated (v3.41.1
            # internal/provider/protonvpn/updater/servers.go: authenticate()),
            # so the updater fails without these — which is why this job sat
            # suspended and inert. Refreshes /gluetun/servers.json (server IPs,
            # WireGuard keys, P2P flags) so the Norway-pinned + PORT_FORWARD_ONLY
            # qbittorrent-private pool stays populated with live servers.
            envFrom:
              - secretRef:
                  name: gluetun-update-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      gluetun-update:
        type: persistentVolumeClaim
        size: 100Mi
        # RWX on CephFS: this servers.json cache has multiple readers
        # (qbittorrent-public + qbittorrent-private gluetun sidecars) plus this
        # writer (the update CronJob). RWO/RBD attaches to one node only, so any
        # non-co-scheduled consumer would fail to mount. CephFS lets all mount
        # on any node. Content is a regenerable cache, safe to recreate.
        accessMode: ReadWriteMany
        storageClass: csi-cephfs-sc
        globalMounts:
          - path: /gluetun
