---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gluetun-update
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      gluetun-update:
        type: cronjob
        cronjob:
          schedule: "@daily"
          suspend: true
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          gluetun-update:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.40.3@sha256:ef4a44819a60469682c7b5e69183e6401171891feaa60186652d292c59e41b30
            args:
              - update
              - -enduser
              - -providers
              - protonvpn
            env:
              TZ: ${SECRET_TIMEZONE}
              SERVER_COUNTRIES: Norway,Netherlands,Switzerland,Sweden,Denmark
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      gluetun-update:
        type: persistentVolumeClaim
        size: 100Mi
        accessMode: ReadWriteOnce
        storageClass: csi-rbd-sc
        globalMounts:
          - path: /gluetun
