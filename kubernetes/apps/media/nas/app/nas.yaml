# restic backup repository -- volsync mover Jobs run in this namespace and get the
# repository volume injected by the volsync-mover-nfs MutatingAdmissionPolicy, which
# references this PVC so the mover mounts at nconnect=16 like every other NAS mount.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-backup-media
spec:
  capacity:
    storage: 1Ti
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
