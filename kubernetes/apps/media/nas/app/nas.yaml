# One PV/PVC pair per NAS dataset the media namespace mounts. ZFS child datasets are
# not traversable over a parent NFS mount, so each export mounts at its own path.
#
# nconnect is one-count-per-(server,node), fixed by the FIRST mount to the NAS on a node;
# every later mount reuses that transport regardless of what it requests (confirmed live
# 2026-08-09: qb-private's nconnect=16 mount stuck at 1 conn, sharing a transport an
# in-tree mount pinned first). nosharecache does NOT help -- it splits the cache, not the
# transport. So nconnect=16 only engages once EVERY NAS mount on a node is 16 AND the old
# transport is torn down (node reboot / full drain, since the client lives while any mount
# references it). volumeHandle must be unique per PV; capacity ignored for NFS but non-empty.
---
# The big shared media dataset -- one dataset (torrent<->library hardlinks prove it),
# so media, torrents and media/books are all reachable via subPath.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-data-media
spec:
  capacity:
    storage: 1Ti
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: ["nfsvers=4.2", "nconnect=16", "hard", "noatime"]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nas-data-media
    volumeAttributes:
      server: nas.${SECRET_DOMAIN}
      share: /mnt/truenas/cf-nas/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-data
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: nas-data-media
  resources:
    requests:
      storage: 1Ti
---
