---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: bazarr-config-restore
  namespace: media
spec:
  trigger:
    manual: restore-1month-ago
  restic:
    destinationPVC: bazarr
    repository: bazarr-secret
    copyMethod: Direct
    storageClassName: csi-rbd-sc
    accessModes:
      - ReadWriteOnce
    capacity: 5Gi
    restoreAsOf: "2025-09-04T03:00:00Z"
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
