---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app radarr
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
  path: ./kubernetes/apps/media/radarr/app
  components:
    - ../../../../components/cnpg
    - ../../../../components/ext-auth
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      DB_NAME: "radarr_main radarr_log"
      DB_OP_ITEM: *app
      DB_PASS_FIELD: RADARR_POSTGRES_PASS
      EXT_AUTH_PORT: "7878"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret