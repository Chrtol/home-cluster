---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app shelfmark
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: shelfmark
  components:
    - ../../../../components/ceph-rbd
    # Native OIDC, not ext-auth: shelfmark resolves AUTH_METHOD and every OIDC_*
    # setting from env before its PVC json, so the whole flow is declarative and
    # the "create a local admin first" UI wizard is bypassed entirely.
    - ../../../../components/oidc-application
  interval: 1h
  path: "./kubernetes/apps/media/shelfmark/app"
  postBuild:
    substitute:
      APP: *app
      GROUP: Media
      # External hostname (bookrequest.*) is the primary redirect URI and the
      # Authentik launch URL; the internal route is shelfmark.* below. Shelfmark
      # builds its callback from the request origin, so BOTH hosts must be
      # registered or a login from the other one fails with redirect_uri mismatch.
      SUBDOMAIN: bookrequest
      OIDC_INTERNAL_SUBDOMAIN: *app
      DESCRIPTION: Book and audiobook downloader
      CEPH_RBD_CAPACITY: 5Gi
      REDIRECT_PATH: /api/auth/oidc/callback
      # Secret lands in this namespace so the HelmRelease can secretKeyRef it directly
      OIDC_SECRET_NAMESPACE: *namespace
      # Shared access group, bound in ADDITION to bp-shelfmark-users. The application
      # is created with policyEngineMode: any, so the bindings OR together. These users
      # are NOT in media-admins, so shelfmark treats them as non-admins and
      # RESTRICT_SETTINGS_TO_ADMIN keeps settings out of reach.
      OIDC_ACCESS_GROUP: media-users
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false