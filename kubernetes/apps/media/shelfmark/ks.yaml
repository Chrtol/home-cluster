---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app shelfmark
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: shelfmark
  components:
    - ../../../../components/ceph-rbd
    - ../../../../components/gatus/guarded
    - ../../../../components/proxy-application
    - ../../../../components/ext-auth
  interval: 1h
  path: "./kubernetes/apps/media/shelfmark/app"
  postBuild:
    substitute:
      APP: *app
      EXT_AUTH_PORT: "8084"
      GROUP: Media
      SUBDOMAIN: *app
      DESCRIPTION: Book and audiobook downloader
      CEPH_RBD_CAPACITY: 5Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  patches:
    - target:
        kind: HelmRelease
        name: ${APP}-proxy
      patch: |
        - op: add
          path: /spec/values/blueprint/groups/-
          value:
            slug: "bp-${APP}-admins"
            parent: "media-admins"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false