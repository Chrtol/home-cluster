---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app shelfmark
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      shelfmark:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          shelfmark:
            image:
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.3.3@sha256:1f0e9ecdef24a3d8f5787282eaea3859edcd3bb0c3d508382e2b2bc4bb18d7d6
            command:
              - gunicorn
            args:
              # - --log-level=debug
              - --access-logfile=-
              - --error-logfile=-
              - --worker-class=geventwebsocket.gunicorn.workers.GeventWebSocketWorker
              - --workers=1
              - -t
              - "300"
              - -b
              - 0.0.0.0:8084
              - shelfmark.main:app
            envFrom:
              - secretRef:
                  name: shelfmark-secret
            probes:
              # custom: true discards the chart defaults, so timeoutSeconds falls back
              # to 1s. With a single gevent worker a slow upstream (expired Hardcover
              # token, 20s+ timeouts) stalls /api/health past that: 77 liveness kills
              # in 3 days. Do not raise --workers to fix it — a second worker would
              # start a second download orchestrator.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8084
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        existingClaim: *app

      proxy-auth-config:
        type: configMap
        name: shelfmark-proxy-auth
        advancedMounts:
          shelfmark:
            shelfmark:
              - path: /config/plugins/security.json
                subPath: security.json
                readOnly: true

      nfs-nas-bookdrop:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/applications/booklore/bookdrop
        advancedMounts:
          shelfmark:
            shelfmark:
              - path: /bookdrop
                subPath: Library/Main/Books/Booklore/bookdrop
                readOnly: false

      nfs-nas-data:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/data
        globalMounts:
          - path: /data
            readOnly: false

      tmpfs:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /var/log
            subPath: var-log
          # gunicorn 26 puts its control-server socket under $HOME
          - path: /home/shelfmark/.gunicorn
            subPath: gunicorn

    route:
      internal:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    service:
      app:
        ports:
          http:
            port: *port