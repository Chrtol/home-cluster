---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app shelfmark
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      shelfmark:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          shelfmark:
            image:
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.3.15@sha256:9602290324993c801b319d3166b202b96bd9039af2416f0916dae03a5bdca815
            command:
              - gunicorn
            args:
              # - --log-level=debug
              - --access-logfile=-
              - --error-logfile=-
              - --worker-class=geventwebsocket.gunicorn.workers.GeventWebSocketWorker
              - --workers=1
              - -t
              - "300"
              - -b
              - 0.0.0.0:8084
              - shelfmark.main:app
            env:
              # env wins over /config/plugins/*.json, so auth is fully declarative and
              # the settings UI never has to be touched (it would demand a local admin
              # before letting you enable OIDC).
              AUTH_METHOD: oidc
              OIDC_DISCOVERY_URL: https://sso.${SECRET_DOMAIN}/application/o/${APP}/.well-known/openid-configuration
              # Display name of the Authentik group, not a slug. Members get admin;
              # everyone else (media-users) is a normal, settings-restricted user.
              OIDC_ADMIN_GROUP: media-admins
              HIDE_LOCAL_AUTH: true
              OIDC_AUTO_REDIRECT: true
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: shelfmark-oidc-authentik-application
                    key: clientID
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: shelfmark-oidc-authentik-application
                    key: clientSecret
            envFrom:
              - secretRef:
                  name: shelfmark-secret
            probes:
              # custom: true discards the chart defaults, so timeoutSeconds falls back
              # to 1s. With a single gevent worker a slow upstream (expired Hardcover
              # token, 20s+ timeouts) stalls /api/health past that: 77 liveness kills
              # in 3 days. Do not raise --workers to fix it — a second worker would
              # start a second download orchestrator.
              #
              # Deliberately NOT one shared anchor: liveness must be slow to kill,
              # readiness must be quick to admit, and initialDelaySeconds belongs only
              # on liveness. Readiness has no kill power -- failing it at startup just
              # means "not ready yet", which is true -- so delaying it only extends the
              # outage: strategy is Recreate on an RWO ceph-rbd claim with replicas: 1,
              # so there are ZERO backends (Envoy 503) until the pod is marked Ready.
              # Measured: gunicorn listening at ~1s, app booted ~6s, Ready at +31s.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8084
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
                  # ~6s boot; this margin is what stops a slow start being killed
                  initialDelaySeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  timeoutSeconds: 10
                  periodSeconds: 5
                  # 6 x 5s = 30s of grace before the only endpoint is withdrawn. With a
                  # single replica there is nowhere else to route, so pulling the pod
                  # during a slow-upstream stall turns a slow request into a hard 503.
                  failureThreshold: 6
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    route:
      internal:
        annotations:
          # gatus-sidecar: without this the internal Gateway's inherited
          # `guarded: true` turns this route into a public-DNS leak canary, so the
          # internal hostname gets no uptime check at all. Overriding it with an
          # HTTP probe means both routes are actually monitored. OIDC_AUTO_REDIRECT
          # bounces / to Authentik, hence < 400 rather than == 200.
          gatus.home-operations.com/endpoint: |
            group: internal
            conditions:
              - "[STATUS] < 400"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hostnames: ["bookrequest.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    service:
      app:
        ports:
          http:
            port: *port


    persistence:
      config:
        existingClaim: *app

      nfs-nas-bookdrop:
        existingClaim: nas-bookdrop
        advancedMounts:
          shelfmark:
            shelfmark:
              - path: /bookdrop
                subPath: Library/Main/Books/Booklore/bookdrop
                readOnly: false

      nfs-nas-data:
        existingClaim: nas-data
        globalMounts:
          - path: /data
            readOnly: false

      tmpfs:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /var/log
            subPath: var-log
          # gunicorn 26 puts its control-server socket under $HOME
          - path: /home/shelfmark/.gunicorn
            subPath: gunicorn
