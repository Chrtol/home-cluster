---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shelfmark
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: shelfmark-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Shelfmark resolves ~every setting from env first and only then from
        # /config/plugins/*.json, so these override whatever the UI last wrote.
        # The Hardcover key is a JWT that expires yearly -- a stale one fails
        # closed as HTTP 200 with zero results, never as a visible error.
        HARDCOVER_API_KEY: "{{ .HARDCOVER_API_KEY }}"
        # env var is GOOGLEBOOKS_API_KEY (no underscore); GOOGLE_BOOKS_API_KEY
        # is the 1Password field name and is not a valid setting key
        GOOGLEBOOKS_API_KEY: "{{ .GOOGLE_BOOKS_API_KEY }}"
  dataFrom:
    - extract:
        key: hardcover
    - extract:
        key: google-books
