---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
patches:
  - target:
      kind: HelmRelease
      name: shelfmark-proxy
    patch: |
      - op: add
        path: /spec/values/blueprint/groups/-
        value:
          slug: "bp-shelfmark-admins"
          parent: "Media Admins"