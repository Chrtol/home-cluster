---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app audiobookrequest
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      audiobookrequest:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: markbeep/audiobookrequest
              tag: 1
            env:
              TZ: ${SECRET_TIMEZONE}
              LOG_LEVEL: "info"
              ABR_APP__PORT: &port 8000
            # envFrom:
            #   - secretRef:
            #       name: audiobookrequest-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: audiobookrequest
        ports:
          http:
            port: *port
    ingress:
      internal-app:
        className: internal
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
                  
      external-app:
        enabled: true
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hosts:
          - host: &host abr.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
            - *host

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      # config-cache:
      #   existingClaim: audiobookrequest-cache
      #   globalMounts:
      #     - path: /config/cache
      # tmpfs:
      #   type: emptyDir
      #   advancedMounts:
      #     audiobookrequest:
      #       app:
      #         - path: /app/config/logs
      #           subPath: logs
      #         - path: /tmp
      #           subPath: tmp
