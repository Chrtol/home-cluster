---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app owncast
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
  interval: 1h
  path: ./kubernetes/apps/media/owncast/app
  components:
    - ../../../../components/gatus/external
    - ../../../../components/ceph-rbd
    - ../../../../components/ext-auth
    - ../../../../components/proxy-application
  postBuild:
    substitute:
      CEPH_RBD_CAPACITY: 5Gi
      APP: *app
      # ext-auth: owns the external HTTPRoute + Authentik forward-auth SecurityPolicy
      EXT_AUTH_PORT: "8080"
      EXT_AUTH_GATEWAY: external
      EXT_AUTH_DNS_TARGET: external.${SECRET_DOMAIN}
      # proxy-application: registers the Authentik Provider + Application + group
      GROUP: Media
      SUBDOMAIN: *app
      DESCRIPTION: Self-hosted live streaming server
      # Grant the Media Users group (slug: media-users, nested under Media Admins)
      PROXY_ADMIN_GROUP: media-users
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
