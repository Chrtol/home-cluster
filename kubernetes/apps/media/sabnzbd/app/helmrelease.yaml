---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sabnzbd
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          coredns:
            image:
              repository: coredns/coredns
              tag: 1.14.6
            args: ["-conf", "/etc/coredns/Corefile"]
            restartPolicy: Always
            securityContext:
              capabilities:
                add: ["NET_BIND_SERVICE"]
              readOnlyRootFilesystem: false
          gluetun:
            dependsOn:
              - coredns
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            restartPolicy: Always
            env:
              DOT: "off"
              DNS_ADDRESS: 127.0.0.2
              DNS_KEEP_NAMESERVER: "off"
              HTTP_CONTROL_SERVER_ADDRESS: ":8000"
              HTTP_CONTROL_SERVER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sabnzbd-gluetun-secret
                    key: GLUETUN_CONTROL_SERVER_API_KEY
              VPN_SERVICE_PROVIDER: protonvpn
              # WireGuard: much higher throughput + fewer connection resets than OpenVPN
              # for Usenet. Requires WIREGUARD_PRIVATE_KEY in sabnzbd-gluetun-secret.
              VPN_TYPE: wireguard
              SERVER_COUNTRIES: Norway,Netherlands,Switzerland,Sweden,Denmark
              FIREWALL_INPUT_PORTS: "80,8000,9999"
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16
              HEALTH_SERVER_ADDRESS: ":9999"
            envFrom:
              - secretRef:
                  name: sabnzbd-gluetun-secret
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              capabilities: { add: ["NET_ADMIN"] }
              allowPrivilegeEscalation: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                squat.ai/tun: "1"
                memory: 128Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.0.4@sha256:457be5fad7b83c338a981f1945e1ecae2dedd0cc81cdd2992673b0dc84fc2890
            env:
              CROSS_SEED_HOST: cross-seed.media.svc.cluster.local
              SABNZBD__PORT: &port 80
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.default,
                sabnzbd.default.svc,
                sabnzbd.default.svc.cluster,
                sabnzbd.default.svc.cluster.local,
                sab.${SECRET_DOMAIN}
              TZ: ${SECRET_TIMEZONE}
            envFrom:
              - secretRef:
                  name: sabnzbd-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 20
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 15
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 20
                  failureThreshold: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 12Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: *app
      media:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path:  /mnt/truenas/cf-nas/data
        globalMounts:
          - path: /data
            readOnly: false
      scripts:
        type: configMap
        name: sabnzbd-scripts
        defaultMode: 0775
        globalMounts:
          - path: /scripts
            readOnly: true
      tmp:
        type: emptyDir
      # The 'incomplete' working dir MUST NOT live on NFS. Every article is written
      # here as a small random write, plus the whole par2 verify/repair read-modify-
      # write cycle. When that path can't keep up, sabnzbd does NOT apply backpressure
      # to the downloaders — it buffers articles in RAM without bound (cache_limit does
      # NOT cap this) until the cgroup OOM-kills it at the 12Gi limit. That was the
      # cause of months of OOMs: memory to ~11.7Gi, downloads stalling as it climbed,
      # and NNTP connections timing out while idle waiting on a writer that never drained.
      # Local disk only; 'complete' stays on NFS.
      incomplete:
        type: emptyDir
        sizeLimit: 100Gi
        globalMounts:
          - path: /incomplete
      coredns:
        type: configMap
        name: sabnzbd-coredns
        advancedMounts:
          sabnzbd:
            coredns:
              - path: /etc/coredns/Corefile
                subPath: Corefile
                readOnly: true
      gluetun-auth:
        type: secret
        name: sabnzbd-gluetun-secret
        advancedMounts:
          sabnzbd:
            gluetun:
              - path: /config/auth.toml
                subPath: auth.toml
