---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sabnzbd-secret
    template:
      data:
        CROSS_SEED_API_KEY: "{{ .CROSS_SEED_API_KEY }}"
        SABNZBD__API_KEY: &apiKey "{{ .SABNZBD_API_KEY }}"
        SABNZBD__NZB_KEY: *apiKey

        #Restic backup
        RESTIC_REPOSITORY: "/repository/sabnzbd"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
  dataFrom:
    - extract:
        key: cross-seed
    - extract:
        key: sabnzbd
    - extract:
        key: restic
---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-gluetun
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sabnzbd-gluetun-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GLUETUN_CONTROL_SERVER_API_KEY: "{{ .SABNZBD_GLUETUN_API_KEY }}"
        DISCORD_WEBHOOK_URL: "{{ .DISCORD_ADMIN_WEBHOOK }}"
        # Without a role covering a route, gluetun serves it unauthenticated.
        auth.toml: |
          [[roles]]
          name = "sabnzbd-vpn-control"
          routes = [
            "GET /v1/publicip/ip",
            "GET /v1/vpn/status",
            "PUT /v1/vpn/status"
          ]
          auth = "apikey"
          apikey = "{{ .SABNZBD_GLUETUN_API_KEY }}"
        # WireGuard (preferred — far higher throughput than OpenVPN for Usenet).
        # Generate a WireGuard config in the Proton portal; its private key goes here.
        WIREGUARD_PRIVATE_KEY: "{{ .PROTON_WIREGUARD_SABNZBD_PRIVATE_KEY }}"
        # OpenVPN creds kept for quick fallback if WireGuard misbehaves.
        OPENVPN_USER: "{{ .PROTON_OPENVPN_USER }}+pmp"
        OPENVPN_PASSWORD: "{{ .PROTON_OPENVPN_PASS }}"
  dataFrom:
    - extract:
        key: sabnzbd
    - extract:
        key: protonvpn
    - extract:
        key: n8n