---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sabnzbd-outpost
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: internal
  tls:
    - hosts:
        - sab.${SECRET_DOMAIN}
  rules:
    - host: sab.${SECRET_DOMAIN}
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-outpost
                port:
                  number: 9000