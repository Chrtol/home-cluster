---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.3.10861@sha256:235402dacb4c66224052de3dfd4c444044e792185ab27dc83b5c200a55370492
            env:
              TZ: ${SECRET_TIMEZONE}
              PLEX_ADVERTISE_URL: https://plex-local.${SECRET_DOMAIN},https://plex.${SECRET_DOMAIN},http://10.0.30.70:32400
              # Auth-bypass list (allowedNetworks) — real trusted LAN subnets ONLY.
              # Do NOT add the pod CIDR (10.42.0.0/16) here: external users reach Plex
              # via the Envoy gateway (source IP 10.42.x.x), so adding it would let the
              # whole internet skip authentication.
              PLEX_NO_AUTH_NETWORKS: 10.0.10.0/24, 10.0.20.0/24, 10.0.30.0/24
              # NOTE: Plex's "LAN Networks" (LanNetworksBandwidth, in the /config PVC, set
              # via UI — Settings > Network) must include the pod CIDR 10.42.0.0/16 so
              # gateway-proxied streams are classified LAN and transcode at full quality
              # instead of a low WAN default. This image has no env var for it; the value
              # lives in the backed-up config PVC (re-add via UI if the PVC is ever lost).
            envFrom:
              - secretRef:
                  name: plex-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: &port 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 600m
                memory: 3667M
              limits:
                gpu.intel.com/i915: 1
                memory: 17Gi
    defaultPodOptions:
      priorityClassName: media-high
      # Prefer dell1 for hardware transcoding: its Alder Lake UHD 770 runs at 1.5GHz
      # against the lenovos' Kaby Lake HD 630 at 1.15GHz, and it is the only node whose
      # single gpu.intel.com/i915 slot is not already claimed (Plex holds lenovo1's,
      # Immich holds lenovo2's).
      # Matched on the GPU device-id label rather than kubernetes.io/hostname so the
      # rule tracks the capability -- move that card to another node and Plex follows.
      # PREFERRED, not required: a hard nodeSelector would leave Plex Pending and the
      # server offline whenever dell1 is down or being upgraded. Falling back to a
      # slower GPU beats not streaming at all.
      # Caveat worth knowing: the fallback only lands if the other node has a FREE
      # gpu.intel.com/i915 slot. Each node advertises exactly one, so a node whose slot
      # is already claimed is infeasible outright -- affinity weight cannot override a
      # resource shortage. Today that is fine (this move frees lenovo1's slot, leaving
      # it as the fallback), but adding a third GPU workload would consume it and leave
      # Plex with nowhere to go if dell1 is down.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: gpu.intel.com/device-id.0300-4680.present
                    operator: In
                    values: ["true"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44]
    service:
      app:
        controller: plex
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.0.30.70
        ports:
          http:
            port: 32400
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
          app.kubernetes.io/name: plex
          app.kubernetes.io/instance: plex
          # gatus-sidecar: plex returns 401 to an unauthenticated GET (it's up,
          # just requires a token), so 401 is the healthy signal.
          gatus.home-operations.com/endpoint: |
            group: external
            conditions:
              - "[STATUS] == 401"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        hostnames: ["{{ .Release.Name }}-local.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    ingress:
      app:
        enabled: false
    persistence:
      config:
        existingClaim: plex
      config-cache:
        existingClaim: plex-cache
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Cache
      media:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/truenas/cf-nas/data/media
        globalMounts:
          - path: /media
            readOnly: false
      tmpfs:
        type: emptyDir
        advancedMounts:
          plex:
            app:
              - path: /config/Library/Application Support/Plex Media Server/Logs
                subPath: logs
              - path: /transcode
                subPath: transcode
              - path: /tmp
                subPath: tmp
