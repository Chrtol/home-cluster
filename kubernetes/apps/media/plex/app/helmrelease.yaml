---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.3.10861@sha256:235402dacb4c66224052de3dfd4c444044e792185ab27dc83b5c200a55370492
            env:
              TZ: ${SECRET_TIMEZONE}
              PLEX_ADVERTISE_URL: https://plex-local.${SECRET_DOMAIN},https://plex.${SECRET_DOMAIN},http://10.0.30.70:32400
              # Auth-bypass list (allowedNetworks) — real trusted LAN subnets ONLY.
              # Do NOT add the pod CIDR (10.42.0.0/16) here: external users reach Plex
              # via the Envoy gateway (source IP 10.42.x.x), so adding it would let the
              # whole internet skip authentication.
              PLEX_NO_AUTH_NETWORKS: 10.0.10.0/24, 10.0.20.0/24, 10.0.30.0/24
              # NOTE: Plex's "LAN Networks" (LanNetworksBandwidth, in the /config PVC, set
              # via UI — Settings > Network) must include the pod CIDR 10.42.0.0/16 so
              # gateway-proxied streams are classified LAN and transcode at full quality
              # instead of a low WAN default. This image has no env var for it; the value
              # lives in the backed-up config PVC (re-add via UI if the PVC is ever lost).
            envFrom:
              - secretRef:
                  name: plex-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: &port 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 600m
                memory: 3667M
              limits:
                gpu.intel.com/i915: 1
                memory: 17Gi
    defaultPodOptions:
      priorityClassName: media-high
      # Marks Plex as a GPU consumer. Every workload that claims gpu.intel.com/i915
      # carries this label; the podAntiAffinity below keys off it, so a new GPU app
      # only has to set the label to be accounted for.
      labels:
        gpu.home.arpa/consumer: "true"
      # Target dell1's Alder Lake UHD 770 over the lenovos' Kaby Lake HD 630 (AV1
      # decode, HEVC 10-bit, many more simultaneous transcodes).
      #
      # Matched on the GPU device-id label rather than kubernetes.io/hostname so the
      # rule tracks the capability -- move that card to another node and Plex follows.
      #
      # The nodeAffinity below is PREFERRED and on its own it does NOT work: verified
      # 2026-08-22 that Plex still landed on lenovo2 with dell1's slot free, because
      # weight 100 (scored x2) loses to NodeResourcesFit/LeastAllocated + ImageLocality
      # -- lenovo2 is the least-allocated node in the cluster and already had the image
      # cached. A preference can lose, and here it loses every time.
      #
      # What actually pins Plex to dell1 is the REQUIRED podAntiAffinity: immich-server
      # and frigate are barred from dell1 (nodeAffinity DoesNotExist on the same label)
      # and soft-spread across the two lenovos, so both lenovos hold a GPU consumer and
      # are infeasible for Plex. dell1 is what is left.
      #
      # Fallback is preserved WITHOUT a hard pin: if dell1 is down Plex goes Pending,
      # then preemption fires because media-high (300) outranks external-facing (200).
      # The scheduler evicts immich-server off a lenovo, Plex takes it, and immich
      # reschedules alongside frigate on the other lenovo -- their mutual anti-affinity
      # is preferred, not required, exactly so they can double up under pressure. That
      # co-location is why intel-device-plugin runs sharedDevNum: 2.
      #
      # Ordering gotcha: this is only deterministic once BOTH lenovos hold a GPU
      # consumer. Until frigate is deployed one lenovo is free and Plex may sit there.
      # Deploy frigate first, restart Plex last.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: gpu.intel.com/device-id.0300-4680.present
                    operator: In
                    values: ["true"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: gpu.home.arpa/consumer
                    operator: In
                    values: ["true"]
                  # Exclude Plex itself so a second Plex pod could never block its own
                  # scheduling. Moot today (strategy is Recreate, one pod at a time) but
                  # it would deadlock a RollingUpdate.
                  - key: app.kubernetes.io/name
                    operator: NotIn
                    values: ["plex"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44]
    service:
      app:
        controller: plex
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.0.30.70
        ports:
          http:
            port: 32400
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
          app.kubernetes.io/name: plex
          app.kubernetes.io/instance: plex
          # gatus-sidecar: plex returns 401 to an unauthenticated GET (it's up,
          # just requires a token), so 401 is the healthy signal.
          gatus.home-operations.com/endpoint: |
            group: external
            conditions:
              - "[STATUS] == 401"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        hostnames: ["{{ .Release.Name }}-local.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    ingress:
      app:
        enabled: false
    persistence:
      config:
        existingClaim: plex
      config-cache:
        existingClaim: plex-cache
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Cache
      # nconnect=16 via the shared nas-data claim (Part B). subPath maps /media onto
      # the media subdir of the /data export root.
      media:
        existingClaim: nas-data
        globalMounts:
          - path: /media
            subPath: media
            readOnly: false
      tmpfs:
        type: emptyDir
        advancedMounts:
          plex:
            app:
              - path: /config/Library/Application Support/Plex Media Server/Logs
                subPath: logs
              - path: /transcode
                subPath: transcode
              - path: /tmp
                subPath: tmp
