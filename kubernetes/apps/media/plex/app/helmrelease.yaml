---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.4.10903@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149
            env:
              TZ: ${SECRET_TIMEZONE}
              PLEX_ADVERTISE_URL: https://plex-local.${SECRET_DOMAIN},https://plex.${SECRET_DOMAIN},http://10.0.30.70:32400
              # Auth-bypass list (allowedNetworks) — real trusted LAN subnets ONLY.
              # Do NOT add the pod CIDR (10.42.0.0/16) here: external users reach Plex
              # via the Envoy gateway (source IP 10.42.x.x), so adding it would let the
              # whole internet skip authentication.
              PLEX_NO_AUTH_NETWORKS: 10.0.10.0/24, 10.0.20.0/24, 10.0.30.0/24
              # NOTE: Plex's "LAN Networks" (LanNetworksBandwidth, in the /config PVC, set
              # via UI — Settings > Network) must include the pod CIDR 10.42.0.0/16 so
              # gateway-proxied streams are classified LAN and transcode at full quality
              # instead of a low WAN default. This image has no env var for it; the value
              # lives in the backed-up config PVC (re-add via UI if the PVC is ever lost).
            envFrom:
              - secretRef:
                  name: plex-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: &port 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              # 3667M reserved 3.5Gi against a 14d peak working set of 1120Mi, and that
              # booking was what kept Plex OFF dell1: the node had 147Mi free and no
              # amount of right-sizing elsewhere could close a 3350Mi gap.
              #
              # Safe because the LIMIT is untouched -- OOMKills come from the limit, not
              # the request, so burst capacity is unchanged at 17Gi. 2Gi is still ~1.8x
              # the observed peak, and since Plex never exceeds its request it stays in
              # the kubelet's safest eviction class (pods over request are evicted first).
              requests:
                cpu: 600m
                memory: 2Gi
              limits:
                gpu.intel.com/i915: 1
                memory: 17Gi
    defaultPodOptions:
      priorityClassName: media-high
      # Marks Plex as a GPU consumer. Plex no longer keys off this itself, but frigate
      # and immich still spread away from it, so dropping it would draw them onto dell1.
      labels:
        gpu.home.arpa/consumer: "true"
      # PREFERRED, deliberately: dell1's Alder Lake UHD 770 adds AV1 decode and 10-bit
      # HEVC, but the lenovos' Kaby Lake HD 630 still transcodes. Degraded beats Pending,
      # so this must stay soft.
      #
      # Being soft, it can lose -- and on 2026-09-11 it did, though not to scoring. dell1
      # was momentarily over 100% of allocatable memory during a mass rollout (old and new
      # pods coexist during a surge), so it was filtered out entirely and Plex landed on
      # lenovo2. Correct at the time; the bug is that nothing ever moved it back.
      #
      # What moves it back is the descheduler running RemovePodsViolatingNodeAffinity over
      # preferredDuringSchedulingIgnoredDuringExecution, which evicts a pod once a node
      # matching its preference can take it. If dell1 is genuinely down there is no better
      # node, so nothing is evicted and Plex keeps running on a lenovo.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: gpu.intel.com/device-id.0300-4680.present
                    operator: In
                    values: ["true"]
      # No podAntiAffinity against other GPU consumers: frigate and immich are already
      # barred from this card by their own nodeAffinity, so it never had anything left
      # to exclude once the nodeAffinity above became required.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44]
    service:
      app:
        controller: plex
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.0.30.70
        ports:
          http:
            port: 32400
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
          app.kubernetes.io/name: plex
          app.kubernetes.io/instance: plex
          # gatus-sidecar: plex returns 401 to an unauthenticated GET (it's up,
          # just requires a token), so 401 is the healthy signal.
          gatus.home-operations.com/endpoint: |
            group: external
            conditions:
              - "[STATUS] == 401"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        hostnames: ["{{ .Release.Name }}-local.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    ingress:
      app:
        enabled: false
    persistence:
      config:
        existingClaim: plex
      config-cache:
        existingClaim: plex-cache
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Cache
      # nconnect=16 via the shared nas-data claim (Part B). subPath maps /media onto
      # the media subdir of the /data export root.
      media:
        existingClaim: nas-data
        globalMounts:
          - path: /media
            subPath: media
            readOnly: false
      tmpfs:
        type: emptyDir
        advancedMounts:
          plex:
            app:
              - path: /config/Library/Application Support/Plex Media Server/Logs
                subPath: logs
              - path: /transcode
                subPath: transcode
              - path: /tmp
                subPath: tmp
