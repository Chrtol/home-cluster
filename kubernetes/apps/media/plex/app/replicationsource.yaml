---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: plex-config-backup
  namespace: media
spec:
  sourcePVC: plex
  trigger:
    schedule: "0 3 * * *"  # Daily at 3 AM
  restic:
    copyMethod: Snapshot
    storageClassName: csi-rbd-sc
    volumeSnapshotClassName: csi-rbd-sc
    repository: plex-secret
    cacheCapacity: 50Gi
    # Bump this value to force the mover to run `restic unlock` before backing up,
    # clearing a stale repo lock left by a mover that died mid-run (see restic-unlock).
    unlock: "1"
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    pruneIntervalDays: 7
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000