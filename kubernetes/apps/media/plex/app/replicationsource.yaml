---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: plex-config-backup
  namespace: media
spec:
  sourcePVC: plex
  trigger:
    schedule: "0 3 * * *"  # Daily at 3 AM
  restic:
    copyMethod: Snapshot
    storageClassName: csi-rbd-sc
    volumeSnapshotClassName: csi-rbd-sc
    repository: plex-secret
    cacheCapacity: 20Gi
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    pruneIntervalDays: 7
    exclude:
      # Exclude large cache files that can be regenerated
      - "/Library/Application Support/Plex Media Server/Cache/PhotoTranscoder/*"
      # Exclude temporary and runtime files
      - "/Library/Application Support/Plex Media Server/Crash Reports/*"
      - "*.tmp"
      - "*.temp"
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000