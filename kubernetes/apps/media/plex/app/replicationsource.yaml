---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: plex-config-backup
  namespace: media
spec:
  sourcePVC: plex
  trigger:
    schedule: "0 3 * * *"  # Daily at 3 AM
  rsync:
    copyMethod: Clone
    storageClassName: csi-rbd-sc
    address: nas.${SECRET_DOMAIN}
    path: /mnt/truenas/cf-nas/backup/plex