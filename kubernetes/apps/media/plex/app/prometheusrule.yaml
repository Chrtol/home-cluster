---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: plex-alerts
spec:
  groups:
    - name: plex.external-access
      interval: 1m
      rules:
        # NOTE: External traffic now routes through VPS, not home nginx-ingress
        # These metrics show internal cluster traffic only
        # VPS-level monitoring is in observability/exporters/vps/app/prometheusrule.yaml

        # Nginx Ingress Health (Internal traffic)
        - alert: PlexIngressHighErrorRate
          expr: |
            (
              sum(rate(nginx_ingress_controller_requests{exported_namespace="media",ingress=~"plex.*",status=~"5.."}[5m]))
              /
              sum(rate(nginx_ingress_controller_requests{exported_namespace="media",ingress=~"plex.*"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            category: plex-access
          annotations:
            summary: "High 5xx error rate for Plex ingress"
            description: "Plex ingress is returning {{ $value | humanizePercentage }} 5xx errors. Users may see 'something went wrong' errors."

        - alert: PlexIngressHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace="media",ingress=~"plex.*"}[5m]))
              by (le)
            ) > 10
          for: 10m
          labels:
            severity: warning
            category: plex-performance
          annotations:
            summary: "High latency for Plex ingress requests"
            description: "P95 latency for Plex ingress is {{ $value }}s (threshold: 10s). Users may experience slow loading."

        - alert: PlexIngress4xxErrors
          expr: |
            (
              sum(rate(nginx_ingress_controller_requests{exported_namespace="media",ingress=~"plex.*",status=~"4.."}[5m]))
              /
              sum(rate(nginx_ingress_controller_requests{exported_namespace="media",ingress=~"plex.*"}[5m]))
            ) > 0.1
          for: 15m
          labels:
            severity: info
            category: plex-access
          annotations:
            summary: "Elevated 4xx error rate for Plex"
            description: "Plex ingress is returning {{ $value | humanizePercentage }} 4xx errors. Check authentication or client requests."

        # All four rules below were DEAD until 2026-09-12 and reported health=ok the
        # whole time. Two separate causes: kube-state-metrics exposes pod labels only on
        # kube_pod_labels (never on the restarts/ready metrics), and the container is
        # named "app", not "plex". Hence the group_left join, which is also what keeps
        # plex-exporter / plex-auto-languages / the CronJobs out of these series.
        - alert: PlexPodRestarting
          expr: |
            sum(
              rate(kube_pod_container_status_restarts_total{namespace="media"}[15m])
              * on (namespace,pod) group_left() kube_pod_labels{label_app_kubernetes_io_name="plex"}
            ) > 0
          for: 5m
          labels:
            severity: warning
            category: plex-stability
          annotations:
            summary: "Plex pod is restarting"
            description: "Plex is restarting frequently. This causes service interruptions."

        - alert: PlexPodNotReady
          expr: |
            max(
              kube_pod_status_ready{namespace="media",condition="true"}
              * on (namespace,pod) group_left() kube_pod_labels{label_app_kubernetes_io_name="plex"}
            ) == 0
          for: 5m
          labels:
            severity: critical
            category: plex-stability
          annotations:
            summary: "Plex pod is not ready"
            description: "No ready Plex pod. Service is likely unavailable."

        # Absolute, not a fraction of the limit: the limit is 17Gi against a 14d peak of
        # 1120Mi, so a 90%-of-limit rule only fires once an OOM is already imminent.
        # 4Gi is ~3.5x the observed peak and ~24% of the limit -- early warning.
        - alert: PlexHighMemoryUsage
          expr: |
            max(
              container_memory_working_set_bytes{namespace="media",container="app"}
              * on (namespace,pod) group_left() kube_pod_labels{label_app_kubernetes_io_name="plex"}
            ) > 4 * 1024^3
          for: 15m
          labels:
            severity: warning
            category: plex-performance
          annotations:
            summary: "Plex memory well above its normal ceiling"
            description: "Plex working set is {{ $value | humanize1024 }}B, far above its ~1.1GiB historical peak. Limit is 17Gi, so this is early warning, not imminent OOM."

        # The last-ditch one. container_spec_memory_limit_bytes does NOT exist in this
        # Prometheus, so the limit has to come from kube-state-metrics.
        - alert: PlexMemoryNearLimit
          expr: |
            max(
              container_memory_working_set_bytes{namespace="media",container="app"}
              * on (namespace,pod) group_left() kube_pod_labels{label_app_kubernetes_io_name="plex"}
            )
            / on() max(
              kube_pod_container_resource_limits{namespace="media",container="app",resource="memory"}
              * on (namespace,pod) group_left() kube_pod_labels{label_app_kubernetes_io_name="plex"}
            ) > 0.85
          for: 5m
          labels:
            severity: critical
            category: plex-performance
          annotations:
            summary: "Plex is near its memory limit and may be OOMKilled"
            description: "Plex is at {{ $value | humanizePercentage }} of its memory limit."

        # Cores, not a quota fraction -- Plex has NO cpu limit, so container_spec_cpu_quota
        # is absent and any ratio against it is unevaluable. 14d daily peaks were 1.4-5.0
        # cores, so 6 means something genuinely unusual rather than a busy transcode.
        - alert: PlexHighCPUUsage
          expr: |
            sum(
              rate(container_cpu_usage_seconds_total{namespace="media",container="app"}[5m])
              * on (namespace,pod) group_left() kube_pod_labels{label_app_kubernetes_io_name="plex"}
            ) > 6
          for: 15m
          labels:
            severity: info
            category: plex-performance
          annotations:
            summary: "Plex CPU unusually high"
            description: "Plex is using {{ $value | printf \"%.1f\" }} cores (14d peak was 5.0). Heavy transcoding, or something is wrong."

        # Guards all of the above: they hang off kube_pod_labels, so if the KSM label
        # allowlist changes they would silently report healthy forever again.
        - alert: PlexMetricsMissing
          expr: |
            absent(kube_pod_labels{namespace="media",label_app_kubernetes_io_name="plex"})
          for: 30m
          labels:
            severity: warning
            category: plex-stability
          annotations:
            summary: "Plex pod labels missing from kube-state-metrics"
            description: "kube_pod_labels has no plex series, so every Plex alert is blind. Check the kube-state-metrics label allowlist."

    - name: plex.placement
      interval: 5m
      rules:
        # Plex's dell1 pin depends on both lenovos holding a GPU consumer; that spread is
        # a preferred rule nothing enforces at runtime. Long `for:` because two consumers
        # on one node is also the legitimate dell1-down state.
        - alert: PlexGpuConsumerSpreadBroken
          expr: |
            count by (node) (
              kube_pod_labels{label_gpu_home_arpa_consumer="true"}
              * on (namespace, pod) group_left (node) kube_pod_info
            ) > 1
          for: 1h
          labels:
            severity: warning
            category: plex-placement
          annotations:
            summary: "Two GPU consumers share node {{ $labels.node }} — Plex's dell1 pin is not holding"
            description: "{{ $value }} pods labelled gpu.home.arpa/consumer are on {{ $labels.node }}. While both frigate and immich-server sit on one lenovo, the other lenovo is feasible for Plex and it can schedule off dell1. Restart immich-server or frigate to re-spread them, then restart Plex. Expected to fire if dell1 is down."

        # Guards the rule above: drop the label from kube-state-metrics and it would
        # report healthy forever rather than failing loudly.
        - alert: PlexGpuConsumerMetricMissing
          expr: |
            absent(kube_pod_labels{label_gpu_home_arpa_consumer="true"})
          for: 30m
          labels:
            severity: warning
            category: plex-placement
          annotations:
            summary: "GPU-consumer pod labels missing from kube-state-metrics"
            description: "kube_pod_labels{label_gpu_home_arpa_consumer=\"true\"} returns no series, so PlexGpuConsumerSpreadBroken cannot fire. Check the kube-state-metrics label allowlist."

    - name: plex.network
      interval: 1m
      rules:
        # OPNsense Firewall (for local network users)
        - alert: OPNsenseBlockingPlexTrafficLocal
          expr: |
            rate(opnsense_firewall_in_ipv4_block_packets{opnsense_instance="gw"}[5m]) > 10
            and
            opnsense_arp_table_entries{ip="10.0.30.70",opnsense_instance="gw"} == 1
          for: 5m
          labels:
            severity: info
            category: plex-network
          annotations:
            summary: "Firewall blocking packets on Plex network segment"
            description: "OPNsense is blocking packets on the server network. Local Plex access may be affected.\n  Block rate: {{ $value }} packets/s"
