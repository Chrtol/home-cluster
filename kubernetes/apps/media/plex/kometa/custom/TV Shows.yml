templates:
  Custom:
    sort_title: "!06_<<collection_name>>"
    sync_mode: sync
    collection_order: alpha
    collection_mode: hide
    schedule: weekly(monday)
  Smart:
    sort_title: "!03_<<collection_name>>"
    collection_mode: hide
  Status:
    plex_all: true
    sort_title: "!03_<<collection_name>>"
    sync_mode: sync
    collection_order: random
    collection_mode: hide
    schedule: daily
  Theme:
    plex_all: true
    filters:
      imdb_keyword: <<keywords>>
    sort_title: "!04_<<collection_name>>"
    sync_mode: sync
    collection_order: random
    collection_mode: hide
    schedule: daily

collections:
  My Favorites:
    template: {name: Custom}
    tmdb_list: https://www.themoviedb.org/list/7111217

  Binge-Worthy Miniseries:
    template: {name: Status}
    filters:
      tmdb_type: miniseries
  Complete Series:
    template: {name: Status}
    filters:
      tmdb_status: [ended, canceled]
    summary: Every season is out. Start to finish, no waiting.
  Currently Airing:
    template: {name: Status}
    filters:
      tmdb_status: returning
  Reality TV:
    template: {name: Status}
    filters:
      tmdb_type: reality
  Docuseries:
    template: {name: Status}
    filters:
      tmdb_type: documentary
  Highly Rated, Not Started:
    template: {name: Smart}
    smart_filter:
      all:
        plays.lt: 1
        user_rating.gte: 8
    summary: IMDb 8+ shows you have not started yet.
  Critically Acclaimed Shows:
    template: {name: Smart}
    smart_filter:
      all:
        critic_rating.gte: 8
      sort_by: critic_rating.desc
  Nordic Noir:
    template: {name: Smart}
    smart_filter:
      all:
        country: [Norway, Sweden, Denmark, Finland, Iceland]
        genre: [Crime, Mystery, Drama]
      validate: false
  Emmy Winners:
    template: {name: Custom}
    imdb_search:
      type: tv_series,tv_mini_series
      event.winning: emmy
      limit: 1000
    collection_order: alpha

  # Only appears once 5 owned shows carry the keyword on IMDb.
  Twist & Turns:
    template: {name: Theme, keywords: [twist-ending, plot-twist, mystery]}
  Time Travel:
    template: {name: Theme, keywords: [time-travel, time-loop]}
  Sci-Fi Worlds:
    template: {name: Theme, keywords: [outer-space, spaceship, alien, dystopia]}
  Post-Apocalyptic:
    template: {name: Theme, keywords: [post-apocalypse, zombie, apocalypse]}
  Supernatural:
    template: {name: Theme, keywords: [supernatural, ghost, vampire, witch]}
  Superheroes:
    template: {name: Theme, keywords: [superhero, based-on-comic, based-on-comic-book]}
  Serial Killers & True Crime:
    template: {name: Theme, keywords: [serial-killer, true-crime]}
  Detectives & Investigators:
    template: {name: Theme, keywords: [detective, police-detective, investigation]}
  Spies & Conspiracies:
    template: {name: Theme, keywords: [spy, espionage, conspiracy]}
  Crime Families & Gangsters:
    template: {name: Theme, keywords: [mafia, gangster, drug-cartel, organized-crime]}
  Lawyers & Courtrooms:
    template: {name: Theme, keywords: [lawyer, courtroom, law-firm]}
  Medical Dramas:
    template: {name: Theme, keywords: [hospital, doctor, surgeon]}
  Power & Politics:
    template: {name: Theme, keywords: [politics, politician, power-struggle]}
  Family Sagas:
    template: {name: Theme, keywords: [family-relationships, dysfunctional-family, family-business]}
  Workplace Comedies:
    template: {name: Theme, keywords: [workplace, office, coworker]}
  Sitcoms:
    template: {name: Theme, keywords: [sitcom]}
  Dark Comedies:
    template: {name: Theme, keywords: [dark-comedy, black-comedy, satire]}
  Teen Drama:
    template: {name: Theme, keywords: [teenager, high-school, coming-of-age]}
  Fantasy Epics:
    template: {name: Theme, keywords: [dragon, magic, sword-and-sorcery, medieval-times]}
  War & Military:
    template: {name: Theme, keywords: [military, soldier, world-war-two]}
  Survival:
    template: {name: Theme, keywords: [survival, island, wilderness]}
  Anthologies:
    template: {name: Theme, keywords: [anthology, anthology-series]}
  Animated for Adults:
    template: {name: Theme, keywords: [adult-animation]}
