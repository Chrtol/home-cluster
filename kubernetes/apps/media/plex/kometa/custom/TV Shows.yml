templates:
  Custom:
    sort_title: "!06_<<collection_name>>"
    sync_mode: sync
    collection_order: alpha
    collection_mode: hide
    schedule: weekly(monday)
  Smart:
    sort_title: "!03_<<collection_name>>"
    collection_mode: hide
  Status:
    plex_all: true
    sort_title: "!03_<<collection_name>>"
    sync_mode: sync
    collection_order: random
    collection_mode: hide
    schedule: daily
  # TMDb ids: keywords and genres joined with "|" match any, with "," match all.
  Theme:
    tmdb_discover:
      with_keywords: <<keywords>>
      sort_by: popularity.desc
      limit: 300
    sort_title: "!04_<<collection_name>>"
    sync_mode: sync
    collection_order: random
    collection_mode: hide
    schedule: daily
  # Plex already holds each show's genres, so pairs are filtered locally instead of via TMDb.
  Genre Pair:
    plex_search:
      all:
        genre: <<first>>
    filters:
      genre: <<second>>
    sort_title: "!05_<<collection_name>>"
    sync_mode: sync
    collection_order: random
    collection_mode: hide
    schedule: daily
  Mood:
    tmdb_discover:
      with_genres: <<genres>>
      with_keywords: <<keywords>>
      sort_by: popularity.desc
      limit: 300
    sort_title: "!05_<<collection_name>>"
    sync_mode: sync
    collection_order: random
    collection_mode: hide
    schedule: daily

collections:
  My Favorites:
    template: {name: Custom}
    tmdb_list: https://www.themoviedb.org/list/7111217

  # What's happening now. Plex re-evaluates smart rows per viewer, so play state is personal.
  New Episodes This Week:
    template: {name: Smart}
    smart_filter:
      all:
        episode_air_date: 7
      sort_by: episode_added.desc
  New Seasons of Shows You Watch:
    template: {name: Smart}
    smart_filter:
      all:
        episode_added: 30
        plays.gte: 1
        unplayed_episodes: true
      sort_by: episode_added.desc
  Pick Back Up:
    template: {name: Smart}
    smart_filter:
      all:
        plays.gte: 1
        unplayed_episodes: true
        last_played.notlast: 60
    summary: Shows you started and drifted away from.
  Start Something New:
    template: {name: Smart}
    smart_filter:
      all:
        plays.lt: 1
        user_rating.gte: 7
      limit: 25
    summary: A fresh random handful of unstarted shows every time you look.
  Highly Rated, Not Started:
    template: {name: Smart}
    smart_filter:
      all:
        plays.lt: 1
        user_rating.gte: 8
    summary: IMDb 8+ shows you have not started yet.

  # Quality.
  Must-Watch TV:
    template: {name: Smart}
    smart_filter:
      all:
        user_rating.gte: 8.5
      sort_by: user_rating.desc
  Audience Favorites:
    template: {name: Smart}
    smart_filter:
      all:
        audience_rating.gte: 8.5
      sort_by: audience_rating.desc
  Critically Acclaimed Shows:
    template: {name: Smart}
    smart_filter:
      all:
        critic_rating.gte: 8
      sort_by: critic_rating.desc
  Top Rated on TMDb:
    template: {name: Custom}
    tmdb_discover:
      vote_average.gte: 8.2
      vote_count.gte: 300
      sort_by: vote_average.desc
      limit: 300
    collection_order: random
  Emmy Winners:
    template: {name: Custom}
    imdb_search:
      type: tv_series,tv_mini_series
      event.winning: emmy
      limit: 300
    collection_order: alpha

  # Format and status.
  Binge-Worthy Miniseries:
    template: {name: Status}
    filters:
      tmdb_type: miniseries
  Complete Series:
    template: {name: Status}
    filters:
      tmdb_status: [ended, canceled]
    summary: Every season is out. Start to finish, no waiting.
  Currently Airing:
    template: {name: Status}
    filters:
      tmdb_status: returning
  New Series This Year:
    template: {name: Status}
    filters:
      first_episode_aired: 365
  Recently Concluded:
    template: {name: Status}
    filters:
      tmdb_status: [ended, canceled]
      last_episode_aired: 730
  Gone Too Soon:
    template: {name: Status}
    filters:
      tmdb_status: canceled
    summary: Cancelled before their time.
  Long Runners:
    template: {name: Status}
    filters:
      seasons:
        count: 5
        added.before: today
    summary: Five seasons or more to sink into.
  Half-Hour Comedies:
    template: {name: Status}
    filters:
      genre: Comedy
      duration.lte: 35
  Quick Episodes:
    template: {name: Status}
    filters:
      duration.lte: 25
  Hour-Long Dramas:
    template: {name: Status}
    filters:
      genre: Drama
      duration.gte: 45
  Classic TV:
    template: {name: Smart}
    smart_filter:
      all:
        year.lte: 1999
  Reality TV:
    template: {name: Status}
    filters:
      tmdb_type: reality
  Docuseries:
    template: {name: Status}
    filters:
      tmdb_type: documentary
  Talk & Late Night:
    template: {name: Status}
    filters:
      tmdb_type: talk_show
  Kids & Family TV:
    template: {name: Smart}
    smart_filter:
      all:
        content_rating: [TV-Y, TV-Y7, TV-G, TV-PG]
      validate: false
  After Dark:
    template: {name: Smart}
    smart_filter:
      all:
        content_rating: TV-MA
      validate: false
    summary: Rated TV-MA. Not for the kids.

  # Around the world.
  Nordic Noir:
    template: {name: Smart}
    smart_filter:
      all:
        country: [Norway, Sweden, Denmark, Finland, Iceland]
        genre: [Crime, Mystery, Drama]
      validate: false
  Scandinavian TV:
    template: {name: Status}
    filters:
      origin_country: ["no", "se", "dk", "fi", "is"]
  British TV:
    template: {name: Status}
    filters:
      origin_country: gb
  K-Dramas:
    template: {name: Status}
    filters:
      original_language: ko
  Anime:
    template: {name: Status}
    filters:
      original_language: ja
      genre: Animation
  Spanish-Language TV:
    template: {name: Status}
    filters:
      original_language: es
  International TV:
    template: {name: Status}
    filters:
      original_language.not: en
    summary: Everything not originally in English.

  # Microgenres, the way streaming services slice their catalogues.
  Crime Dramas:
    template: {name: Genre Pair, first: "Crime", second: "Drama"}
  Crime Mysteries:
    template: {name: Genre Pair, first: "Crime", second: "Mystery"}
  Mystery Dramas:
    template: {name: Genre Pair, first: "Mystery", second: "Drama"}
  Sci-Fi & Fantasy Dramas:
    template: {name: Genre Pair, first: "Sci-Fi & Fantasy", second: "Drama"}
  Mystery Sci-Fi:
    template: {name: Genre Pair, first: "Mystery", second: "Sci-Fi & Fantasy"}
  Action Dramas:
    template: {name: Genre Pair, first: "Action & Adventure", second: "Drama"}
  Action Sci-Fi & Fantasy:
    template: {name: Genre Pair, first: "Action & Adventure", second: "Sci-Fi & Fantasy"}
  Dramedies:
    template: {name: Genre Pair, first: "Comedy", second: "Drama"}
  Crime Comedies:
    template: {name: Genre Pair, first: "Comedy", second: "Crime"}
  Sci-Fi Comedies:
    template: {name: Genre Pair, first: "Comedy", second: "Sci-Fi & Fantasy"}
  Animated Comedies:
