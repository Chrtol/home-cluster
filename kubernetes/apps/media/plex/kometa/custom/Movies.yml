templates:
  Custom:
    sort_title: "!06_<<collection_name>>"
    sync_mode: sync
    collection_order: alpha
    collection_mode: hide
    schedule: weekly(monday)
  Oscars:
    sort_title: "!02_<<collection_name>>"
    sync_mode: sync
    collection_order: release.desc
    collection_mode: hide
    schedule: yearly(03/01)
  Library Filter:
    sort_title: "!07_<<collection_name>>"
    sync_mode: sync
    collection_order: alpha
    collection_mode: hide
    schedule: weekly(friday)
  Audio:
    sort_title: "!14_<<collection_name>>"
    sync_mode: sync
    collection_order: alpha
    collection_mode: hide
    schedule: daily
  Theme:
    tmdb_discover:
      with_keywords: <<keywords>>
      sort_by: popularity.desc
      limit: 1000
    sort_title: "!04_<<collection_name>>"
    sync_mode: sync
    collection_order: random
    collection_mode: hide
    schedule: daily
  Genre Mix:
    tmdb_discover:
      with_genres: <<genres>>
      sort_by: popularity.desc
      limit: 1000
    sort_title: "!05_<<collection_name>>"
    sync_mode: sync
    collection_order: random
    collection_mode: hide
    schedule: daily
  Mood:
    tmdb_discover:
      with_genres: <<genres>>
      with_keywords: <<keywords>>
      sort_by: popularity.desc
      limit: 1000
    sort_title: "!05_<<collection_name>>"
    sync_mode: sync
    collection_order: random
    collection_mode: hide
    schedule: daily
  Smart:
    sort_title: "!03_<<collection_name>>"
    collection_mode: hide
  Award Winners:
    imdb_search:
      type: movie
      event.winning: <<event>>
      limit: 1000
    sort_title: "!02_<<collection_name>>"
    sync_mode: sync
    collection_order: release.desc
    collection_mode: hide
    schedule: weekly(monday)
  Award Nominees:
    imdb_search:
      type: movie
      event: <<event>>
      limit: 1000
    sort_title: "!02_<<collection_name>>"
    sync_mode: sync
    collection_order: release.desc
    collection_mode: hide
    schedule: weekly(monday)

collections:
  Critically Acclaimed:
    template: {name: Smart}
    smart_filter:
      all:
        critic_rating.gte: 8
      sort_by: critic_rating.desc
    summary: Metacritic 80 or higher.
  Hidden Gems:
    template: {name: Custom}
    imdb_search:
      type: movie
      rating.gte: 7.3
      votes.gte: 10000
      votes.lte: 80000
      sort_by: rating.desc
      limit: 1000
    collection_order: random
    summary: Highly rated on IMDb, but far less known than they deserve.
  Quick Watches:
    template: {name: Smart}
    smart_filter:
      all:
        duration.lte: 95
        user_rating.gte: 6.5
    summary: Good movies under 95 minutes.
  Epics:
    template: {name: Smart}
    smart_filter:
      all:
        duration.gte: 150
      sort_by: user_rating.desc
    summary: Settle in. Every one runs 2.5 hours or more.
  Unwatched & Highly Rated:
    template: {name: Smart}
    smart_filter:
      all:
        unplayed: true
        user_rating.gte: 7.5
    summary: IMDb 7.5+ that you have not played yet. Reshuffles every time it loads.
  Family Movie Night:
    template: {name: Smart}
    smart_filter:
      all:
        genre: [Family, Animation]
        content_rating: [G, PG]
  Nordic Movies:
    template: {name: Smart}
    smart_filter:
      all:
        country: [Norway, Sweden, Denmark, Finland, Iceland]
      # Plex rejects a country tag no item has yet; skip those instead of failing the row.
      validate: false

