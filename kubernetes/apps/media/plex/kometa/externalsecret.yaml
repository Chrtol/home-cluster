---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kometa
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kometa-secret
    template:
      data:
        KOMETA_MDBLIST_API_KEY: "{{ .MDBLIST_API_KEY }}"
        KOMETA_OMDB_API_KEY: "{{ .OMDB_API_KEY }}"
        KOMETA_PLEX_API_KEY: "{{ .PLEX_TOKEN }}"
        KOMETA_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        KOMETA_SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        KOMETA_TAUTULLI_API_KEY: "{{ .TAUTULLI_API_KEY }}"
        KOMETA_TMDB_API_KEY: "{{ .TMDB_API_KEY }}"
  dataFrom:
  - extract:
      key: tmdb
  - extract:
      key: plex
  - extract:
      key: tautulli
  - extract:
      key: radarr
  - extract:
      key: sonarr
  - extract:
      key: omdb
  - extract:
      key: mdblist
