---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
configMapGenerator:
  - name: plex-grafana-dashboard
    files:
      - plex-monitoring.json=plex-monitoring-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Media"
generatorOptions:
  disableNameSuffixHash: true
