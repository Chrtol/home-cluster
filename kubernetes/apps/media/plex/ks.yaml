---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: intel-device-plugins-gpu
      namespace: kube-system
    - name: ceph-csi-rbd
      namespace: ceph-csi-rbd
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/media/plex/app
  components:
    - ../../../../components/kopiur
  # Media/ holds video preview and chapter thumbnails: ~3 GiB and 53k of the volume's
  # ~63k files, all regenerable, so leaving it out keeps the per-run scan small. An
  # explicit ignoreRules replaces kopiur's OS-artifact defaults; only /lost+found can
  # exist on this ext4 volume, and restating $RECYCLE.BIN would be mangled by postBuild
  # envsubst. Targeted by kind because patches run before APP is substituted.
  patches:
    - target:
        group: kopiur.home-operations.com
        kind: SnapshotPolicy
      patch: |-
        - op: add
          path: /spec/files
          value:
            ignoreRules:
              - /lost+found
              - "/Library/Application Support/Plex Media Server/Media/"
  postBuild:
    substitute:
      APP: *app
      GATUS_PATH: /web/index.html
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
