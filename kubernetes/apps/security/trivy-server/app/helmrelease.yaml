---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-server
spec:
  interval: 15m
  chart:
    spec:
      chart: trivy
      version: 0.23.0
      sourceRef:
        kind: HelmRepository
        name: trivy-charts
        namespace: flux-system
      interval: 15m
  driftDetection:
    mode: enabled
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      registry: docker.io
      repository: aquasec/trivy
      pullPolicy: IfNotPresent

    trivy:
      # Authentication token for client connections
      serverToken:
        existingSecret: trivy-server-secret
        secretKey: token

    service:
      type: ClusterIP
      port: 4954

    persistence:
      enabled: true
      storageClass: ceph-block
      size: 5Gi

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi

    serviceMonitor:
      enabled: true
