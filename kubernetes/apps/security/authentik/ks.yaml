---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app authentik
  namespace: security
spec:
  targetNamespace: security
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/security/authentik/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  components:
    - ../../../../components/cnpg
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: sso
      # Split off the shared "app" role: authentik now owns its DB with its own
      # role and password (field on the authentik 1Password item). Last app off
      # the shared role — after this, "app" owns nothing and can be dropped.
      # Only the ExternalSecret half of the component is used: this chart is not
      # app-template, so its values ConfigMap does not apply (see helmrelease.yaml).
      DB_OP_ITEM: authentik
      DB_PASS_FIELD: AUTHENTIK_POSTGRES_PASS
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app authentik-outpost-sync
  namespace: &namespace security
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/security/authentik/outpost-sync
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: authentik
      namespace: security
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m