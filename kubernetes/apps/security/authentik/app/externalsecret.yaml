---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authentik-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Authentik's own connection config. The dedicated "authentik" role
        # replaces the shared "app" role; role creation and the INIT_POSTGRES_*
        # vars are owned by components/cnpg (renders authentik-initdb-secret).
        AUTHENTIK_POSTGRESQL__HOST: postgres17-rw.database.svc.cluster.local
        AUTHENTIK_POSTGRESQL__NAME: "authentik"
        AUTHENTIK_POSTGRESQL__USER: "authentik"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .AUTHENTIK_POSTGRES_PASS }}"
        # Authentik's default is sslmode: disable (see its default.yml), so this
        # must be set explicitly -- pg_stat_ssl confirmed the connection was
        # ssl=false before. CNPG serves TLS on the -rw service, and psycopg
        # accepts "require" without needing the cluster CA mounted.
        AUTHENTIK_POSTGRESQL__SSLMODE: "require"

        # AUTHENTIK_STORAGE__MEDIA__BACKEND: "s3"
        # AUTHENTIK_STORAGE__MEDIA__S3__ACCESS_KEY: "{{ .AWS_ACCESS_KEY_ID }}"
        # AUTHENTIK_STORAGE__MEDIA__S3__SECRET_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        # AUTHENTIK_STORAGE__MEDIA__S3__BUCKET_NAME: authentik-media
        # AUTHENTIK_STORAGE__MEDIA__S3__REGION: us-east-1
        # AUTHENTIK_STORAGE__MEDIA__S3__ENDPOINT: http://minio.storage.svc.cluster.local:9000
        # AUTHENTIK_STORAGE__MEDIA__S3__CUSTOM_DOMAIN: s3://authentik-media/

        AUTHENTIK_BOOTSTRAP_EMAIL: "{{ .AUTHENTIK_BOOTSTRAP_EMAIL }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .AUTHENTIK_BOOTSTRAP_PASSWORD }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .AUTHENTIK_BOOTSTRAP_TOKEN }}"
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"

        # Discord webhook URL for notifications
        DISCORD_WEBHOOK_URL: "{{ .AUTHENTIK_DISCORD_WEBHOOK_URL }}"
        # CELERY_RESULT_BACKEND_URL: "db+postgresql://{{ .AUTHENTIK_POSTGRES_USER | urlquery }}:{{ .AUTHENTIK_POSTGRES_PASS | urlquery }}@postgres17-rw.database.svc.cluster.local/authentik"
        # CELERY_BROKER_URL: "sqla+postgresql://{{ .AUTHENTIK_POSTGRES_USER | urlquery }}:{{ .AUTHENTIK_POSTGRES_PASS | urlquery }}@postgres17-rw.database.svc.cluster.local/authentik"

        # The INIT_POSTGRES_* block that lived here is now owned by
        # components/cnpg, which renders authentik-initdb-secret. The init-db
        # initContainer reads that secret instead (see helmrelease.yaml).

  dataFrom:
    - extract:
        key: authentik
    - extract:
        key: cloudnative-pg