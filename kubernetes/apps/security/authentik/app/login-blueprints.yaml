---
kind: ConfigMap
apiVersion: v1
metadata:
  name: authentik-login-blueprints
  namespace: security
  labels:
    goauthentik_blueprint: "1"
data:
  login_sources_only.yaml: |
    version: 1
    metadata:
      name: login-sources-only
      labels:
        blueprints.goauthentik.io/description: |
          Public login page offers Google and Plex only. Password login stays
          reachable on a separate flow so a source outage cannot lock everyone out.

    entries:
      ## Empty user_fields drops the "Email or Username" input. The serializer
      ## checks user_fields against the sources in THIS payload rather than the
      ## ones already on the stage, so both have to be listed together or it
      ## rejects the entry. Listing them here also means this blueprint now owns
      ## the stage's source list.
      - model: authentik_stages_identification.identificationstage
        state: present
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields: []
          sources:
            - !Find [authentik_sources_oauth.oauthsource, [slug, google]]
            - !Find [authentik_sources_plex.plexsource, [slug, plex]]

      ## The model default is seconds=0, a cookie that dies with the browser, so
      ## every restart meant the whole Plex popup round trip again. Only the
      ## source stages are extended; break-glass uses default-authentication-login
      ## and stays browser-session.
      - model: authentik_stages_user_login.userloginstage
        state: present
        identifiers:
          name: default-source-authentication-login
        attrs:
          session_duration: weeks=4

      - model: authentik_stages_user_login.userloginstage
        state: present
        identifiers:
          name: default-source-enrollment-login
        attrs:
          session_duration: weeks=4

      ## Break-glass path: same password and TOTP stages as the default flow,
      ## just reached by its own URL instead of from the brand's login page.
      - model: authentik_stages_identification.identificationstage
        state: present
        id: break-glass-identification
        identifiers:
          name: break-glass-identification
        attrs:
          user_fields:
            - username
          case_insensitive_matching: true
          pretend_user_exists: false

      - model: authentik_flows.flow
        state: present
        id: break-glass-flow
        identifiers:
          slug: break-glass-authentication
        attrs:
          name: break-glass-authentication
          title: Break-glass login
          designation: authentication
          authentication: none
          layout: stacked
          denied_action: message_continue
          policy_engine_mode: any

      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf break-glass-flow
          stage: !KeyOf break-glass-identification
          order: 10
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: retry
          policy_engine_mode: any

      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf break-glass-flow
          stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
          order: 20
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: retry
          policy_engine_mode: any

      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf break-glass-flow
          stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
          order: 30
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: retry
          policy_engine_mode: any

      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf break-glass-flow
          stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
          order: 100
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: retry
          policy_engine_mode: any
