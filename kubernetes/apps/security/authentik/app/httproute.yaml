---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-outpost-external
  namespace: security
  annotations:
    external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
    # gatus-sidecar: opt out — this is the Authentik outpost callback path, not a
    # user-facing service (it 404s on a bare GET). sso.DOMAIN health is already
    # covered by the authentik-server route.
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: external
      namespace: network
      kind: Gateway
  hostnames:
    - sso.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: ak-outpost-authentik-embedded-outpost
          port: 9000