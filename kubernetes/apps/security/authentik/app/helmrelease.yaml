---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: security
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: 2025.12.2
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  values:
    global:
      priorityClassName: security-critical
      podAnnotations:
        # secret.reloader.stakater.com/reload: &secret authentik-secret
        reloader.stakater.com/auto: 'true'
      deploymentStrategy:
        type: RollingUpdate
      envFrom:
        - secretRef:
            name: &secret authentik-secret
      volumeMounts:
        - name: sidecar-blueprints
          mountPath: /blueprints/sidecar
      volumes:
        - name: sidecar-blueprints
          emptyDir: {}
    redis:
      enabled: false
    authentik:
      redis:
          host: dragonfly.database.svc.cluster.local
      blueprints:
        - configMapRef:
            name: authentik-discord-blueprint
        - configMapRef:
            name: authentik-base-blueprints
        - path: /blueprints/sidecar  # Include blueprints from sidecar
    server:
      serviceAccountName: authentik
      replicas: 1
      env:
        # Authentik native OTEL support (don't use auto-instrumentation - it conflicts)
        - name: OTEL_SERVICE_NAME
          value: "authentik"
        - name: AUTHENTIK_TRACING__ENABLED
          value: "true"
        - name: AUTHENTIK_TRACING__EXPORTER
          value: "otlp"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://tempo-distributor.observability.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        # Propagators for trace context extraction from incoming requests
        - name: OTEL_PROPAGATORS
          value: "tracecontext,baggage"
        # Sampler configuration - always continue parent traces
        - name: OTEL_TRACES_SAMPLER
          value: "parentbased_always_on"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=authentik,service.namespace=security,app.type=identity-provider"
      initContainers:
      - name: init-db
        image: ghcr.io/home-operations/postgres-init:18.1
        envFrom:
          - secretRef:
              name: *secret
      metrics:
        enabled: false
        serviceMonitor:
          enabled: false

      ingress:
        enabled: false

      route:
        main:
          enabled: true
          hostnames:
          - "sso.${SECRET_DOMAIN}"
          annotations:
            external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: external
              namespace: network

      probes:
        readiness:
          enabled: true
          spec:
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      resources:
        requests:
          cpu: 25m
          memory: 717M
        limits:
          memory: 1Gi
    worker:
      serviceAccountName: authentik
      replicas: 3
      env:
        # Authentik native OTEL support (don't use auto-instrumentation - it conflicts)
        - name: OTEL_SERVICE_NAME
          value: "authentik-worker"
        - name: AUTHENTIK_TRACING__ENABLED
          value: "true"
        - name: AUTHENTIK_TRACING__EXPORTER
          value: "otlp"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://tempo-distributor.observability.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        # Propagators for trace context extraction from incoming requests
        - name: OTEL_PROPAGATORS
          value: "tracecontext,baggage"
        # Sampler configuration - always continue parent traces
        - name: OTEL_TRACES_SAMPLER
          value: "parentbased_always_on"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=authentik-worker,service.namespace=security,app.type=identity-provider,component=worker"
      autoscaling:
        enabled: true
        minReplicas: 3
        maxReplicas: 10
        targetCPUUtilizationPercentage: 70
      serviceAccount:
        create: true
      extraContainers:
        - name: sidecar-blueprints
          image: "ghcr.io/kiwigrid/k8s-sidecar:2.5.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: FOLDER
              value: /blueprints/sidecar
            - name: LABEL
              value: goauthentik_blueprint
            - name: LABEL_VALUE
              value: "1"
            - name: NAMESPACE
              value: ALL
            - name: RESOURCE
              value: both
            - name: UNIQUE_FILENAMES
              value: "true"
          volumeMounts:
            - name: sidecar-blueprints
              mountPath: /blueprints/sidecar
          resources:
            requests:
              cpu: 11m
              memory: 352Mi
            limits:
              memory: 512Mi
      volumes:
        - name: sidecar-blueprints
          emptyDir: {}
      volumeMounts:
        - name: sidecar-blueprints
          mountPath: /blueprints/sidecar
      probes:
        liveness:
          enabled: true
          spec:
            timeoutSeconds: 10
        readiness:
          enabled: true
          spec:
            timeoutSeconds: 10
        startup:
          enabled: true
          spec:
            timeoutSeconds: 10
      resources:
        requests:
          cpu: 300m
          memory: 814M
        limits:
          memory: 1200Mi
    prometheus:
      rules:
        enabled: true
