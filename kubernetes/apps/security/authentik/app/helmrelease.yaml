---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: security
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: 2025.10.3
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  values:
    global:
      priorityClassName: security-critical
      podAnnotations:
        # secret.reloader.stakater.com/reload: &secret authentik-secret
        reloader.stakater.com/auto: 'true'
      deploymentStrategy:
        type: RollingUpdate
      envFrom:
        - secretRef:
            name: &secret authentik-secret
    redis:
      enabled: false
    authentik:
      redis:
          host: dragonfly.database.svc.cluster.local
      blueprints:
        - configMapRef:
            name: authentik-discord-blueprint
    server:
      replicas: 1
      initContainers:
      - name: init-db
        image: ghcr.io/home-operations/postgres-init:18.1
        envFrom:
          - secretRef:
              name: *secret
      metrics:
        enabled: false
        serviceMonitor:
          enabled: false

      ingress:
        enabled: true
        ingressClassName: external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
          nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
        hosts:
          - &host sso.${SECRET_DOMAIN}
        tls:
          - hosts:
            - *host

      probes:
        readiness:
          enabled: true
          spec:
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      resources:
        requests:
          cpu: 25m
          memory: 717M
        limits:
          memory: 1Gi
    worker:
      replicas: 3
      autoscaling:
        enabled: true
        minReplicas: 3
        maxReplicas: 10
        targetCPUUtilizationPercentage: 70
      probes:
        liveness:
          enabled: true
          spec:
            timeoutSeconds: 10
        readiness:
          enabled: true
          spec:
            timeoutSeconds: 10
        startup:
          enabled: true
          spec:
            timeoutSeconds: 10
      resources:
        requests:
          cpu: 300m
          memory: 814M
        limits:
          memory: 1200Mi
    prometheus:
      rules:
        enabled: true
