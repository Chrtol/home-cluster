---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: security
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: 2026.5.6
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  values:
    global:
      priorityClassName: security-critical
      podAnnotations:
        # secret.reloader.stakater.com/reload: &secret authentik-secret
        reloader.stakater.com/auto: 'true'
      deploymentStrategy:
        type: RollingUpdate
      envFrom:
        - secretRef:
            name: authentik-secret
      volumeMounts:
        - name: sidecar-blueprints
          mountPath: /blueprints/sidecar
        # Signing key for OIDC id_tokens, imported by authentik's certificate_discovery
        # task (it scans /certs). With a kubernetes.io/tls secret it takes the key pair
        # NAME FROM THE DIRECTORY -- so this path defines the name "authentik-cert-tls"
        # that components/oidc-application looks up.
        #
        # The point is renewal: authentik's own "Self-signed Certificate" is created
        # once and NEVER regenerated (crypto/apps.py returns early if the name exists),
        # which is why it sat expired for months. This one is a cert-manager Certificate
        # (authentik-cert, private authentik-ca issuer), so cert-manager renews the
        # secret and discovery updates the key pair in place.
        #
        # Deliberately NOT the Let's Encrypt wildcard: signing keys and TLS transport
        # keys are separate security domains, LE's ~60-day rotation churns the kid for
        # no benefit, and nothing validates a signing cert's chain anyway.
        - name: authentik-cert
          mountPath: /certs/authentik-cert-tls
          readOnly: true
        # EC sibling -> ES256, for apps that reject RSA. Same rule: the directory name
        # becomes the key pair name that OIDC_SIGNING_KEY selects.
        - name: authentik-cert-ec
          mountPath: /certs/authentik-cert-ec
          readOnly: true
      volumes:
        - name: sidecar-blueprints
          emptyDir: {}
        - name: authentik-cert
          secret:
            secretName: authentik-cert-tls
        - name: authentik-cert-ec
          secret:
            secretName: authentik-cert-ec-tls
    redis:
      enabled: false
    authentik:
      redis:
          host: dragonfly.database.svc.cluster.local
      blueprints:
        - configMapRef:
            name: authentik-discord-blueprint
        - configMapRef:
            name: authentik-base-blueprints
        - path: /blueprints/sidecar  # Include blueprints from sidecar
    server:
      serviceAccountName: authentik
      replicas: 1
      env:
        # Authentik native OTEL support (don't use auto-instrumentation - it conflicts)
        - name: OTEL_SERVICE_NAME
          value: "authentik"
        - name: AUTHENTIK_TRACING__ENABLED
          value: "true"
        - name: AUTHENTIK_TRACING__EXPORTER
          value: "otlp"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://tempo-distributor.observability.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        # Propagators for trace context extraction from incoming requests
        - name: OTEL_PROPAGATORS
          value: "tracecontext,baggage"
        # Sampler configuration - always continue parent traces
        - name: OTEL_TRACES_SAMPLER
          value: "parentbased_always_on"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=authentik,service.namespace=security,app.type=identity-provider"
      initContainers:
      - name: init-db
        image: ghcr.io/home-operations/postgres-init:18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
        envFrom:
          # Rendered by components/cnpg -- creates the dedicated "authentik" role
          # instead of the shared "app" role the old inline INIT_POSTGRES_* block used.
          - secretRef:
              name: authentik-initdb-secret
      metrics:
        enabled: false
        serviceMonitor:
          enabled: false

      ingress:
        enabled: false

      route:
        main:
          enabled: true
          hostnames:
          - "sso.${SECRET_DOMAIN}"
          annotations:
            external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: external
              namespace: network

      probes:
        readiness:
          enabled: true
          spec:
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      resources:
        requests:
          cpu: 25m
          memory: 717M
        limits:
          memory: 1Gi
    worker:
      serviceAccountName: authentik
      replicas: 3
      env:
        # Authentik native OTEL support (don't use auto-instrumentation - it conflicts)
        - name: OTEL_SERVICE_NAME
          value: "authentik-worker"
        - name: AUTHENTIK_TRACING__ENABLED
          value: "true"
        - name: AUTHENTIK_TRACING__EXPORTER
          value: "otlp"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://tempo-distributor.observability.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        # Propagators for trace context extraction from incoming requests
        - name: OTEL_PROPAGATORS
          value: "tracecontext,baggage"
        # Sampler configuration - always continue parent traces
        - name: OTEL_TRACES_SAMPLER
          value: "parentbased_always_on"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=authentik-worker,service.namespace=security,app.type=identity-provider,component=worker"
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 5
        targetCPUUtilizationPercentage: 60
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 300
          scaleDown:
            stabilizationWindowSeconds: 300
      serviceAccount:
        create: true
      extraContainers:
        - name: sidecar-blueprints
          image: "ghcr.io/home-operations/k8s-sidecar:2.10.1@sha256:9d9338eba4dbf0ae8151e772ef96d3806d56115acf5521d615e31694e046fe47"
          imagePullPolicy: IfNotPresent
          env:
            - name: FOLDER
              value: /blueprints/sidecar
            - name: LABEL
              value: goauthentik_blueprint
            - name: LABEL_VALUE
              value: "1"
            - name: NAMESPACE
              value: ALL
            - name: RESOURCE
              value: both
            - name: UNIQUE_FILENAMES
              value: "true"
          volumeMounts:
            - name: sidecar-blueprints
              mountPath: /blueprints/sidecar
          resources:
            requests:
              cpu: 11m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: sidecar-blueprints
          emptyDir: {}
      volumeMounts:
        - name: sidecar-blueprints
          mountPath: /blueprints/sidecar
      probes:
        liveness:
          enabled: true
          spec:
            timeoutSeconds: 10
        readiness:
          enabled: true
          spec:
            timeoutSeconds: 10
        startup:
          enabled: true
          spec:
            timeoutSeconds: 10
      resources:
        requests:
          cpu: 130m
          memory: 768Mi
        limits:
          memory: 1Gi
    prometheus:
      rules:
        enabled: true
