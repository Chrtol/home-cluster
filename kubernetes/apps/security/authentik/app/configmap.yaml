---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-discord-blueprint
  namespace: security
data:
  discord-notifications.yaml: |
    version: 1
    metadata:
      name: Discord Notifications Setup
    entries:
    # Disable default email transport
    - identifiers:
        name: default-email-transport
      model: authentik_events.notificationtransport
      state: absent

    # Create Discord webhook transport
    - identifiers:
        name: discord-webhook
      model: authentik_events.notificationtransport
      attrs:
        name: discord-webhook
        mode: webhook
        webhook_url: !Env DISCORD_WEBHOOK_URL
        send_once: false

    # Update notification rule to use Discord
    - identifiers:
        name: default-notify-update-available
      model: authentik_events.notificationrule
      state: present
      attrs:
        name: Notify about updates
        group: !KeyOf authentik_core.group
          by-id: !Find [authentik_core.group, [name, authentik Admins]]
        transports:
          - !KeyOf authentik_events.notificationtransport
            by-id: !Find [authentik_events.notificationtransport, [name, discord-webhook]]
        severity: notice
