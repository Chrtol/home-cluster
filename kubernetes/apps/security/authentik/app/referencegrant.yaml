---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: authentik-securitypolicy-ref
  namespace: security
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: default
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: media
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: media
    # konflate (Flux PR review) is the first authed app in flux-system; its
    # SecurityPolicy + HTTPRoute reference the outpost Service in security.
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: flux-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: flux-system
  to:
    - group: ''
      kind: Service
      name: ak-outpost-authentik-embedded-outpost
    - group: ''
      kind: Service
      name: ak-outpost-internal-proxy-outpost