---
# yaml-language-server: $schema=https://chrtol-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trivy-server-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: trivy-server-secret
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: trivy-server
        property: TRIVY_SERVER_TOKEN
