---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 15m
  chart:
    spec:
      chart: trivy-operator
      version: 0.34.0
      sourceRef:
        kind: HelmRepository
        name: trivy-charts
        namespace: flux-system
      interval: 15m
  driftDetection:
    mode: enabled
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    excludeNamespaces: "kube-system,flux-system,cert-manager,volsync-system"
    operator:
      replicas: 1
      scanJobsConcurrentLimit: 3
      scanJobTTL: 300s
      scanJobTimeout: 20m
      builtInTrivyServer: true
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true
      annotations:
        reloader.stakater.com/auto: "true"
    trivy:
      slow: true # flag is to use less CPU/memory for scanning though it takes more time than normal scanning
      # The chart default 5m kills the authentik server scan: its Python venv holds tens
      # of thousands of generated msgraph files plus a 33MB .txt, and the SECRET scanner
      # walks all of them client-side (client/server mode only offloads vuln scanning).
      # It died at exactly 5m00s with "semaphore acquire: context deadline exceeded" and
      # trivy's own advice to raise the timeout. `slow` above makes that walk slower
      # still, so the two interact. Kept under scanJobTimeout (20m).
      #
      # If this recurs the next levers are `--scanners vuln` to drop secret scanning, or
      # skipFiles for the venv path -- both of which trivy suggests in the scan log.
      timeout: 15m0s
      ignoreUnfixed: true
      mode: ClientServer
      severity: HIGH,CRITICAL
      storageClassEnabled: false # ephemeral storage
      serverTokenSecretName: trivy-server-secret
      resources:
        requests:
          cpu: 15m
          memory: 146Mi
        limits:
          # 256Mi (chart default) OOMKills scan jobs on large images; raise ceiling.
          # request stays low since scan jobs are short-lived and bursty.
          memory: 512Mi
    trivyOperator:
      excludeImages: "quay.io/backube/*"
      skipResourceByLabels: "app.kubernetes.io/created-by=volsync"
      resources:
        requests:
          cpu: 23m
          memory: 1152Mi
        limits:
          cpu: 35m
          memory: 1536Mi
      
    # https://github.com/aquasecurity/trivy-operator/issues/2566
    # Configure node collector for Talos Linux (only mount writable /var paths)
    nodeCollector:
      useNodeSelector: false
      volumeMounts:
        - mountPath: /var/lib/etcd
          name: var-lib-etcd
          readOnly: true
        - mountPath: /var/lib/kubelet
          name: var-lib-kubelet
          readOnly: true
        - mountPath: /var/lib/kube-scheduler
          name: var-lib-kube-scheduler
          readOnly: true
        - mountPath: /var/lib/kube-controller-manager
          name: var-lib-kube-controller-manager
          readOnly: true
      volumes:
        - name: var-lib-etcd
          hostPath:
            path: /var/lib/etcd
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: var-lib-kube-scheduler
          hostPath:
            path: /var/lib/kube-scheduler
        - name: var-lib-kube-controller-manager
          hostPath:
            path: /var/lib/kube-controller-manager
    serviceMonitor:
      enabled: true