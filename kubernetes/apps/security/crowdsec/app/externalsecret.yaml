---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: crowdsec-secret
    template:
      engineVersion: v2
      data:
        # CrowdSec Central enrollment token
        enroll-key: "{{ .CROWDSEC_ENROLL_KEY }}"
        # Bouncer keys, registered by the LAPI at startup (BOUNCER_KEY_* env)
        envoy-bouncer-key: "{{ .CROWDSEC_ENVOY_BOUNCER_KEY }}"
        opnsense-bouncer-key: "{{ .CROWDSEC_CLUSTER_OPNSENSE_BOUNCER_KEY }}"
  dataFrom:
    - extract:
        key: crowdsec
