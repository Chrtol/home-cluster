---
# Expose CrowdSec LAPI via NodePort for VPS agent access
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-lapi-nodeport
  namespace: security
spec:
  type: NodePort
  selector:
    app: crowdsec
    type: lapi
  ports:
    - name: lapi
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
