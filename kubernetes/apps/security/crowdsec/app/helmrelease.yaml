---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 5m
  chart:
    spec:
      chart: crowdsec
      version: 0.21.1
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
      interval: 10m
  install:
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace
  test:
    enable: true
  rollback:
    recreate: true
    force: true
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  maxHistory: 3
  values:
    container_runtime: containerd
    lapi:
      ingress:
        ingressClassName: "internal"
        enabled: true
        host: &host "crowdsec.${SECRET_DOMAIN}"
        tls: 
          - hosts:
            - *host
      env:
        - name: TZ
          value: ${SECRET_TIMEZONE}
        - name: ENROLL_INSTANCE_NAME
          value: homelab-infrastructure
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-secret
              key: enroll-key
      dashboard:
        enabled: false
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      persistentVolume:
        data:
          enabled: true
          accessModes:
            - ReadWriteOnce
          storageClassName: "csi-rbd-sc"
          size: 1Gi
        config:
          enabled: true
          accessModes:
            - ReadWriteOnce
          storageClassName: "csi-rbd-sc"
          size: 100Mi
      resources:
        requests:
          cpu: 15m
          memory: 184M
        limits:
          memory: 512M
    agent:
      acquisition:
        - namespace: network
          podName: external-ingress-nginx-controller-*
          program: nginx
        - namespace: network
          podName: internal-ingress-nginx-controller-*
          program: nginx
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      resources:
        requests:
          cpu: 15m
          memory: 128M
        limits:
          memory: 256M
    reflector:
      enabled: true
      env:
        - name: OPNSENSE_URL
          value: "https://opnsense.${SECRET_DOMAIN}"
        - name: OPNSENSE_API_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-secret
              key: opnsense-api-key
        - name: OPNSENSE_API_SECRET
          valueFrom:
            secretKeyRef:
              name: crowdsec-secret
              key: opnsense-api-secret
