---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-envoy-bouncer
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: crowdsec-envoy-bouncer-secret
    template:
      engineVersion: v2
      data:
        # CrowdSec LAPI bouncer API key
        # Generate with: kubectl exec -n security deploy/crowdsec-lapi -- cscli bouncers add envoy-bouncer -o raw
        api-key: "{{ .CROWDSEC_ENVOY_BOUNCER_KEY }}"
  dataFrom:
    - extract:
        key: crowdsec
