---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app lldap
  namespace: security
spec:
  targetNamespace: security
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  components:
    - ../../../../components/cnpg
  postBuild:
    substitute:
      APP: *app
      # Split off the shared "app" role: lldap now owns its DB with its own
      # role and password (field on the lldap 1Password item).
      DB_OP_ITEM: lldap
      DB_PASS_FIELD: LLDAP_POSTGRES_PASS
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  path: ./kubernetes/apps/security/lldap/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
