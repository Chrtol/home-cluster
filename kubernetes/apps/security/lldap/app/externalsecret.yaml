---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap
spec:
  refreshInterval: "60m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: lldap-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # App
        LLDAP_JWT_SECRET: "{{ .LLDAP_JWT_SECRET }}"
        LLDAP_LDAP_USER_PASS: "{{ .LLDAP_LDAP_USER_PASS }}"
        LLDAP_LDAP_USER_EMAIL: "{{ .LLDAP_LDAP_USER_EMAIL }}"
        LLDAP_SERVER_KEY_SEED: "{{ .LLDAP_SERVER_KEY_SEED }}"
        # Role/database creation is handled by the cnpg component
        # (${APP}-initdb-secret). lldap connects as its own dedicated role,
        # split off from the shared "app" role.
        LLDAP_DATABASE_URL: "postgres://${APP}:{{ .LLDAP_POSTGRES_PASS }}@{{ .POSTGRES_RW_SVC }}/lldap"
  dataFrom:
    - extract:
        key: lldap
    - extract:
        key: cloudnative-pg
