---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-unlock
  namespace: volsync-system
spec:
  schedule: "30 2 * * *"  # Run at 2:30 AM daily, before backups at 3 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400  # Keep job for 24 hours
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: default
          containers:
          - name: unlock
            image: docker.io/restic/restic:0.18.1
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting restic unlock for all repositories..."

              # Use shared restic password for all repositories
              export RESTIC_PASSWORD

              # Function to unlock a repository
              unlock_repo() {
                local repo_path=$1
                echo "Unlocking $repo_path..."
                export RESTIC_REPOSITORY="/repository$repo_path"
                restic unlock || echo "No lock found or unlock failed for $repo_path"
              }

              # Unlock all repositories
              unlock_repo "/plex"
              unlock_repo "/prowlarr"
              unlock_repo "/sonarr"
              unlock_repo "/radarr"
              unlock_repo "/bazarr"
              unlock_repo "/sabnzbd"
              unlock_repo "/qbittorrent"
              unlock_repo "/qbittorrent-private"
              unlock_repo "/jellyseerr"
              unlock_repo "/tautulli"
              unlock_repo "/wizarr"
              unlock_repo "/cleanuparr"

              echo "Unlock process completed!"
            env:
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restic-unlock-secret
                  key: RESTIC_PASSWORD
            volumeMounts:
            - name: repository
              mountPath: /repository
          volumes:
          - name: repository
            nfs:
              server: nas.${SECRET_DOMAIN}
              path: /mnt/truenas/cf-nas/backup
