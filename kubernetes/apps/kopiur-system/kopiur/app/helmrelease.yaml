---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kopiur
    namespace: flux-system
  # The CRDs ship in the chart's crds/ directory, which plain `helm upgrade` never
  # touches -- and an apiserver on a stale schema silently prunes new spec fields.
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Cluster-wide backstop beneath the ClusterRepository's own concurrency cap.
    maxConcurrentJobs: 2
    features:
      # Lets the `nas` ClusterRepository's password Secret, which lives only in this
      # namespace, be copied into a workload namespace for the duration of a run.
      # Grants the operator create/patch/delete on Secrets cluster-wide.
      credentialProjection:
        enabled: true
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        folderAnnotation: grafana_folder
        folder: Infrastructure
    webhook:
      serviceMonitor:
        enabled: true
