# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
clusterName: kubernetes

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://10.0.30.50:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "10.0.30.50"
  - "home-cluster.${clusterDomain}"
additionalMachineCertSans: *sans

clusterPodNets: ["10.42.0.0/16"]
clusterSvcNets: ["10.43.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "lenovo1"
    ipAddress: "10.0.30.100"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    controlPlane: true
    patches:
      - "@./patches/node/lenovo-kubelet.yaml"
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:db:44:3d"
        dhcp: false
        addresses:
          - "10.0.30.100/24"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.0.30.1"
        mtu: 1500
        vip:
          ip: "10.0.30.50"
  - hostname: "lenovo2"
    ipAddress: "10.0.30.101"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    controlPlane: true
    patches:
      - "@./patches/node/lenovo-kubelet.yaml"
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:11:70:d8"
        dhcp: false
        addresses:
          - "10.0.30.101/24"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.0.30.1"
        mtu: 1500
        vip:
          ip: "10.0.30.50"
  - hostname: "dell1"
    ipAddress: "10.0.30.102"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    controlPlane: true
    patches:
      - "@./patches/node/dell1-kubelet.yaml"
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:c5:fc:46"
        dhcp: false
        addresses:
          - "10.0.30.102/24"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.0.30.1"
        mtu: 1500
        vip:
          ip: "10.0.30.50"

# Global patches
patches:
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-network.yaml"
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/global/machine-time.yaml"

# Controller patches
controlPlane:
  schematic:
    customization:
      extraKernelArgs:
        - intel_iommu=on
        - iommu=pt
        - i915.enable_guc=3
      systemExtensions:
        officialExtensions:
          - siderolabs/i915
          - siderolabs/intel-ucode
          - siderolabs/mei
  patches:
    - "@./patches/controller/admission-controller-patch.yaml"
    - "@./patches/controller/cluster.yaml"
    - "@./patches/controller/talos-api-access.yaml"

