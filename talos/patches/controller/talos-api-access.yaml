# Allow tuppr controller to access Talos API from system-upgrade namespace
#
# Converted from JSON6902 to strategic merge: Talos rejects JSON6902 patches
# against the multi-document config it generates from v1.13 onwards.
machine:
  features:
    rbac: true
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:admin
      allowedKubernetesNamespaces:
        - system-upgrade
