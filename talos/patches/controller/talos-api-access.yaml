---
# Allow tuppr controller to access Talos API from system-upgrade namespace
- op: add
  path: /machine/features/rbac
  value: true
- op: add
  path: /machine/features/kubernetesTalosAPIAccess
  value:
    enabled: true
    allowedRoles:
      - os:admin
    allowedKubernetesNamespaces:
      - system-upgrade
