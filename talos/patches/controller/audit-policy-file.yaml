machine:
  files:
    - content: |
        apiVersion: audit.k8s.io/v1
        kind: Policy
        omitStages:
          - RequestReceived
        rules:
          # Log connectivity/networking events in key namespaces
          - level: RequestResponse
            namespaces: ["kube-system", "network"]
            resources:
            - group: ""
              resources: ["services", "endpoints", "pods"]
            - group: "networking.k8s.io"
              resources: ["networkpolicies", "ingresses"]
            - group: "cilium.io"
              resources: ["*"]

          # Log service failures and timeouts in application namespaces
          - level: RequestResponse
            resources:
            - group: ""
              resources: ["events"]
            namespaceNames: ["media", "observability", "security"]

          # Log DNS and connectivity issues
          - level: Request
            resources:
            - group: ""
              resources: ["services/proxy", "services/status"]

          # Log high-level cluster events that could indicate outages
          - level: Metadata
            omitStages:
              - RequestReceived
            resources:
            - group: ""
              resources: ["events", "nodes", "nodes/status"]
            - group: "coordination.k8s.io"
              resources: ["leases"]

          # Log Cilium-specific resources for network debugging
          - level: Request
            resources:
            - group: "cilium.io"
              resources: ["ciliumendpoints", "ciliumnodes", "ciliumnetworkpolicies"]

          # Don't log routine requests
          - level: None
            users: ["system:kube-proxy"]
            verbs: ["watch"]
            resources:
            - group: ""
              resources: ["services", "endpoints"]

          # Don't log authenticated requests to certain non-resource URL paths
          - level: None
            userGroups: ["system:authenticated"]
            nonResourceURLs:
            - "/api*"
            - "/version"
            - "/healthz"
            - "/readyz"
            - "/livez"

          # Default catch-all for other events
          - level: Metadata
            omitStages:
              - RequestReceived
      path: /etc/kubernetes/audit-policy.yaml
      mode: 0644