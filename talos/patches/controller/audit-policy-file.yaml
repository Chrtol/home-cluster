machine:
  files:
    - op: create
      path: /var/lib/kubernetes/audit-policy.yaml
      permissions: 0o644
      content: |
        apiVersion: audit.k8s.io/v1
        kind: Policy
        omitStages:
          - RequestReceived
        rules:
          # Log connectivity events in core namespaces
          - level: RequestResponse
            namespaces: ["kube-system", "media", "observability"]
            resources:
            - group: ""
              resources: ["services", "endpoints", "pods", "events"]

          # Log node and cluster-level events
          - level: Metadata
            resources:
            - group: ""
              resources: ["nodes", "nodes/status"]

          # Don't log routine requests
          - level: None
            users: ["system:kube-proxy"]
            verbs: ["watch"]
            resources:
            - group: ""
              resources: ["services", "endpoints"]

          # Don't log health checks
          - level: None
            userGroups: ["system:authenticated"]
            nonResourceURLs:
            - "/api*"
            - "/version"
            - "/healthz"
            - "/readyz"
            - "/livez"

          # Default catch-all
          - level: Metadata
            omitStages:
              - RequestReceived