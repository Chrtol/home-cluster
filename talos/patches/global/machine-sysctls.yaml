machine:
  sysctls:
    fs.inotify.max_user_watches: "1048576" # Watchdog
    fs.inotify.max_user_instances: "8192"  # Watchdog
    net.core.rmem_max: "7500000" # Cloudflared | QUIC
    net.core.wmem_max: "7500000" # Cloudflared | QUIC
    # NOTE: accept_ra_rt_info_max_plen=64 was added here (21a3df158) so the node would
    # accept OTBR's Route Information Option and learn a route to the Thread mesh.
    # REMOVED because matter-server no longer runs on Talos — Talos ships no Bluetooth
    # stack, and Matter commissioning of a factory-fresh device requires BLE. Home
    # Assistant reaches Thread devices via matter-server's WebSocket, never directly,
    # so no Talos node needs a route to the mesh. The sysctl belongs wherever
    # matter-server actually lives (Proxmox host / CT103), not here.
    # See ai-activity/matter-thread/BUILD-PLAN.md.
