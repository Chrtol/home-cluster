apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-test-noauth
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/target: external.cftollefsen.com
spec:
  hostnames:
  - echo-test-noauth.cftollefsen.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-external
    namespace: network
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: echo
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /