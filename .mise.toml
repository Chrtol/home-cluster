[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
BOOTSTRAP_DIR = "{{config_root}}/bootstrap"
KUBERNETES_DIR = "{{config_root}}/kubernetes"
ROOT_DIR = "{{config_root}}"
SCRIPTS_DIR = "{{config_root}}/scripts"
TALOS_DIR = "{{config_root}}/talos"

[tools]
"python" = "3.14.6"
"pipx:makejinja" = "2.8.2"
"pipx:kuba" = "latest"  # or specific version
"aqua:budimanjojo/talhelper" = "3.1.10"
"aqua:cilium/cilium-cli" = "0.19.6"
"aqua:cli/cli" = "2.96.0"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.1"
"aqua:fluxcd/flux2" = "2.9.2"
"aqua:getsops/sops" = "3.13.2"
"aqua:go-task/task" = "3.52.0"
"aqua:helm/helm" = "4.2.3"
"aqua:helmfile/helmfile" = "1.7.1"
"aqua:jqlang/jq" = "1.7.1"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:kubernetes/kubectl" = "1.35.0"
"aqua:mikefarah/yq" = "4.53.3"
"aqua:siderolabs/talos" = "1.13.3"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:junegunn/fzf" = "0.74.1"  # dependency for kuba
"aqua:antonmedv/fx" = "39.2.0" # dependency for kuba
"aqua:kubecolor/kubecolor" = "0.5.3" # dependency for kuba
"aqua:kubernetes-sigs/krew" = "0.5.0" # dependency for kuba
"aqua:stern/stern" = "1.33.1" # dependency for kuba
"aqua:tohjustin/kube-lineage" = "0.5.0" # dependency for kuba