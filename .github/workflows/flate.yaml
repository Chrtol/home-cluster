---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flate"

on:
  pull_request:
    branches: ["main"]
  # Work lands on main by direct push, not via PR, so a PR-only trigger would
  # leave those commits unvalidated until Flux failed on them.
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0

jobs:
  pre-job:
    name: Flate Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      # Full history so changed-files can resolve github.event.before..sha on
      # push events; at depth 1 the previous commit is unreachable and the gate
      # silently degrades to "everything changed".
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: kubernetes/**

  test:
    name: Flate Test
    needs: pre-job
    runs-on: ubuntu-latest
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # base: "" so the action does NOT export FLATE_BASE — `test all` validates
      # the full tree (no baseline). flate templates Helm by default (no
      # --enable-helm) and renders every namespace by default; it exits non-zero
      # on any Kustomization/HelmRelease reconcile failure.
      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          cache: true
          base: ""

      - name: Run flate test
        run: flate test all --path ./kubernetes/flux/cluster

  validate:
    name: Flate Validate
    needs: pre-job
    runs-on: ubuntu-latest
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          cache: true
          base: ""

      - name: Install kubeconform
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "$base/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "$base/CHECKSUMS" | grep ' kubeconform-linux-amd64.tar.gz$' | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Offline, Helm's .Capabilities lacks the Gateway API, so app-template
      # falls back to rendering HTTPRoutes as v1alpha2, which the cluster no
      # longer serves.
      - name: Render manifests
        run: |
          flate build all --path ./kubernetes/flux/cluster \
            --api-versions gateway.networking.k8s.io/v1,gateway.networking.k8s.io/v1/HTTPRoute,gateway.networking.k8s.io/v1/GRPCRoute \
            > rendered.yaml

      # flate wipes SOPS values to ..PLACEHOLDER_<key>.., which fails hostname
      # and IP patterns. Reserved names (.invalid, TEST-NET) stand in for them.
      - name: Fill cluster-secrets placeholders
        run: |
          sed -i \
            -e 's/\.\.PLACEHOLDER_SECRET_DOMAIN\.\./example.invalid/g' \
            -e 's/\.\.PLACEHOLDER_SECRET_DOMAIN_NAME\.\./example/g' \
            -e 's/\.\.PLACEHOLDER_SECRET_TIMEZONE\.\./Etc\/UTC/g' \
            -e 's/\.\.PLACEHOLDER_[A-Z_]*_IP\.\./192.0.2.1/g' \
            rendered.yaml

      # Core types are published under core/, but kubeconform passes "v1" as
      # their group.
      - name: Run kubeconform
        run: |
          kubeconform -strict -summary -output text \
            -schema-location 'https://chrtol-schemas.pages.dev/{{if eq .Group "v1"}}core{{else}}{{.Group}}{{end}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml

  diff:
    name: Flate Diff
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resources: ["hr", "ks"]
      max-parallel: 4
      fail-fast: false
    # PR-only: on a push to main, flate's --base (main) resolves to the same
    # tree being rendered, so the diff is always empty.
    if: >-
      ${{ needs.pre-job.outputs.any_changed == 'true' &&
          github.event_name == 'pull_request' }}
    steps:
      # Full history so flate's --base (main) can resolve the baseline commit;
      # a shallow clone would leave main unreachable.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The action exports FLATE_BASE=main (its default), so `flate diff`
      # materializes the base tree itself and renders changed-only — no second
      # checkout / --path-orig (which is mutually exclusive with --base).
      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          cache: true

      # -o diff emits a plain unified diff to stdout (flate has no
      # --output-file), captured via redirect. --strip-attr replaces
      # flux-local's comma-list --strip-attrs; it's repeatable and supplying
      # any value replaces flate's default strip set.
      - name: Run flate diff
        run: |
          flate diff ${{ matrix.resources }} \
            --path ./kubernetes/flux/cluster \
            --strip-attr helm.sh/chart \
            --strip-attr checksum/config \
            --strip-attr app.kubernetes.io/version \
            --strip-attr chart \
            -o diff \
            > diff.patch

      - name: Generate Diff
        id: diff
        run: |
          cat diff.patch
          # GitHub PR comments cap at 65536 chars; keep well under to leave
          # room for the ```diff fences (flux-local used --limit-bytes 10000).
          head -c 60000 diff.patch > diff.trunc
          {
              echo 'diff<<EOF'
              cat diff.trunc
              echo EOF
          } >> "$GITHUB_OUTPUT"
          {
              echo "### Diff"
              echo '```diff'
              cat diff.trunc
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  flate-status:
    name: Flate Success
    needs: ["test", "validate", "diff"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
