name: Build and Push AI Orchestrator Image

on:
  push:
    branches:
      - main
    paths:
      - 'apps/ai-orchestrator/**'
      - '.github/workflows/ai-orchestrator.yaml'
  pull_request:
    paths:
      - 'apps/ai-orchestrator/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ai-orchestrator

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Match the Dockerfile. A workflow that replays here but not in the
          # deployed image would be a guard that lies.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/ai-orchestrator/requirements.txt
            apps/ai-orchestrator/requirements-dev.txt

      - name: Install dependencies
        working-directory: ./apps/ai-orchestrator
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Deliberately first, and deliberately its own step. It needs no Temporal
      # server, so it cannot be masked by the test-server download the suite
      # below performs -- and a failure here means the change will wedge every
      # workflow in flight, which deserves its own red X in the log rather than
      # a line inside a hundred other results.
      - name: Replay guard
        working-directory: ./apps/ai-orchestrator
        run: pytest tests/test_replay.py -v

      - name: Tests
        working-directory: ./apps/ai-orchestrator
        run: pytest --ignore=tests/test_replay.py -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value={{branch}}-{{date 'YYYYMMDDHHmmss'}},enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./apps/ai-orchestrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
