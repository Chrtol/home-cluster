name: Deploy VPS Traefik Configuration

permissions:
  contents: read

concurrency:
  group: vps-reverse-proxy-deploy
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'vps/ansible/roles/traefik/**'
      - 'vps/ansible/roles/crowdsec/**'
      - 'vps/ansible/roles/trivy/**'
      - 'vps/ansible/roles/deadman/**'
      - 'vps/ansible/roles/wireguard/**'
      - 'vps/ansible/roles/firewall/**'
      - 'vps/ansible/reverse-proxy.yml'
      - '.github/workflows/vps-reverse-proxy-deploy.yml'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run Ansible in debug mode'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Run in check mode (no changes)'
        required: false
        type: boolean
        default: false
      allow_routing_change:
        description: 'Allow this run to change WireGuard AllowedIPs'
        required: false
        type: boolean
        default: false

jobs:
  deploy-traefik:
    name: Deploy Traefik Configuration
    # In-cluster runner: SSH goes over the WireGuard tunnel, so the VPS needs no public SSH.
    runs-on: home-cluster
    env:
      VPS_HOST: 10.100.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

          # VPS Access
          VPS_SSH_PORT: "op://Lab/vps-wireguard/VPS_SSH_PORT"
          VPS_SSH_KEY: "op://Lab/pangolin/PANGOLIN_VPS_SSH_PRIVATE_KEY"
          VPS_SSH_USER: "op://Lab/pangolin/PANGOLIN_VPS_SSH_USER"
          VPS_SSH_HOST_KEY: "op://Lab/vps-wireguard/VPS_SSH_HOST_KEY"

          # WireGuard tunnel (the home private key belongs to OPNsense; not loaded here)
          VPS_WG_PRIVATE_KEY: "op://Lab/vps-wireguard/VPS_WIREGUARD_PRIVATE_KEY"
          VPS_WG_HOME_PUBLIC_KEY: "op://Lab/vps-wireguard/VPS_WG_HOME_PUBLIC_KEY"
          VPS_WG_SSH_CLIENTS: "op://Lab/vps-wireguard/VPS_WG_SSH_CLIENTS"

          # Traefik Configuration
          PROXY_DOMAIN: "op://Lab/vps-proxy/VPS_PROXY_DOMAIN"
          PROXY_ENVOY_GATEWAY_IP: "op://Lab/vps-proxy/VPS_ENVOY_GATEWAY_IP"
          PROXY_SSL_CERT_PATH: "op://Lab/vps-proxy/VPS_SSL_CERT_PATH"
          PROXY_SSL_KEY_PATH: "op://Lab/vps-proxy/VPS_SSL_KEY_PATH"

          # OpenTelemetry Configuration
          OTEL_ENDPOINT: "op://Lab/vps-proxy/VPS_OTEL_ENDPOINT"
          OTEL_SERVICE_NAME: "op://Lab/vps-proxy/VPS_OTEL_SERVICE_NAME"
          OTEL_SAMPLE_RATE: "op://Lab/vps-proxy/VPS_OTEL_SAMPLE_RATE"

          # Authentik Configuration
          AUTHENTIK_ENABLED: "op://Lab/vps-proxy/VPS_AUTHENTIK_ENABLED"
          AUTHENTIK_DOMAIN: "op://Lab/vps-proxy/VPS_AUTHENTIK_DOMAIN"

          # CrowdSec Configuration
          CROWDSEC_ENABLED: "op://Lab/vps-proxy/VPS_CROWDSEC_ENABLED"
          CROWDSEC_BOUNCER_API_KEY: "op://Lab/crowdsec/CROWDSEC_VPS_TRAEFIK_BOUNCER_API_KEY"
          CROWDSEC_LAPI_HOST: "op://Lab/vps-proxy/VPS_CROWDSEC_LAPI_HOST"
          CROWDSEC_LOG_LEVEL: "op://Lab/vps-proxy/VPS_CROWDSEC_LOG_LEVEL"
          CROWDSEC_ENROLL_KEY: "op://Lab/crowdsec/CROWDSEC_ENROLL_KEY"

          # Minecraft Bedrock UDP passthrough (cluster LoadBalancer IP).
          # Must exist in 1Password -- load-secrets-action fails the whole job on any
          # unresolved op:// reference, taking every VPS deploy with it.
          VPS_MINECRAFT_LB_IP: "op://Lab/vps-proxy/VPS_MINECRAFT_LB_IP"

          # Feature Toggles
          PROXY_ENABLE_ECHO_TEST: "op://Lab/vps-proxy/VPS_ENABLE_ECHO_TEST"
          PROXY_ENABLE_METRICS: "op://Lab/vps-proxy/VPS_ENABLE_METRICS"

          # Metrics Authentication
          VPS_METRICS_USER: "op://Lab/vps-proxy/VPS_METRICS_USER"
          VPS_METRICS_PASSWORD_HASH: "op://Lab/vps-proxy/VPS_METRICS_PASSWORD_HASH"

          # Trivy Security Scanner
          VPS_PROXY_DOMAIN: "op://Lab/vps-proxy/VPS_PROXY_DOMAIN"
          TRIVY_SERVER_TOKEN: "op://Lab/trivy-server/TRIVY_SERVER_TOKEN"

          # Dead-man's-switch watcher (out-of-cluster monitoring backstop)
          # Every op:// reference must resolve — load-secrets-action fails on any
          # missing field. All of these must exist in Lab/vps-proxy.
          VPS_DEADMAN_ENABLED: "op://Lab/vps-proxy/VPS_DEADMAN_ENABLED"
          VPS_DEADMAN_PING_TOKEN: "op://Lab/vps-proxy/VPS_DEADMAN_PING_TOKEN"
          VPS_DEADMAN_GRACE_SECONDS: "op://Lab/vps-proxy/VPS_DEADMAN_GRACE_SECONDS"
          VPS_DEADMAN_PUSHOVER_TOKEN: "op://Lab/vps-proxy/VPS_DEADMAN_PUSHOVER_TOKEN"
          VPS_DEADMAN_PUSHOVER_USER: "op://Lab/vps-proxy/VPS_DEADMAN_PUSHOVER_USER"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          # Pin the VPS host key so the SSH key is only ever offered to the real VPS.
          printf '[%s]:%s %s\n' "$VPS_HOST" "$VPS_SSH_PORT" "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i ~/.ssh/vps_key -p ${VPS_SSH_PORT:-22} ${VPS_SSH_USER:-root}@$VPS_HOST "echo 'SSH connection successful'"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # The runner image has python3 but no pip.
      - name: Install Ansible
        run: uv tool install ansible-core

      - name: Install Ansible collections
        working-directory: ./vps/ansible
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        working-directory: ./vps/ansible
        run: |
          ansible-playbook reverse-proxy.yml --syntax-check

      - name: Run Ansible Playbook
        working-directory: ./vps/ansible
        env:
          VPS_SSH_KEY_PATH: /home/runner/.ssh/vps_key
          VPS_SSH_USER: ${{ env.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ env.VPS_SSH_PORT }}
        run: |
          echo "Deploying Traefik..."
          ansible-playbook reverse-proxy.yml \
            -i inventory.yml \
            ${{ github.event.inputs.dry_run == 'true' && '--check --diff' || '' }} \
            ${{ github.event.inputs.debug == 'true' && '-vvv' || '' }} \
            ${{ github.event.inputs.allow_routing_change == 'true' && '-e wireguard_allow_routing_change=true' || '' }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.ssh/vps_key