name: Deploy VPS Reverse Proxy Configuration

concurrency:
  group: vps-reverse-proxy-deploy
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'vps/ansible/roles/nginx/**'
      - 'vps/ansible/roles/nginx-otel/**'
      - 'vps/ansible/roles/traefik/**'
      - 'vps/ansible/reverse-proxy.yml'
      - 'vps/ansible/nginx-only.yml'  # Keep for backward compatibility
      - '.github/workflows/vps-reverse-proxy-deploy.yml'
  workflow_dispatch:
    inputs:
      proxy_type:
        description: 'Reverse proxy type'
        required: false
        type: choice
        options:
          - default  # Use 1Password setting
          - traefik
          - nginx-otel
        default: default
      debug:
        description: 'Run Ansible in debug mode'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Run in check mode (no changes)'
        required: false
        type: boolean
        default: false

jobs:
  deploy-reverse-proxy:
    name: Deploy Reverse Proxy Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@8d0d610af187e78a2772c2d18d627f4c52d3fbfb # v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

          # VPS Access
          VPS_HOST: "op://Lab/vps-wireguard/VPS_IP"
          VPS_SSH_PORT: "op://Lab/vps-wireguard/VPS_SSH_PORT"
          VPS_SSH_KEY: "op://Lab/pangolin/PANGOLIN_VPS_SSH_PRIVATE_KEY"
          VPS_SSH_USER: "op://Lab/pangolin/PANGOLIN_VPS_SSH_USER"

          # Reverse Proxy Type (can be overridden by workflow dispatch)
          REVERSE_PROXY_TYPE: "op://Lab/vps-proxy/VPS_PROXY_TYPE"

          # Common Proxy Configuration
          PROXY_DOMAIN: "op://Lab/vps-proxy/VPS_PROXY_DOMAIN"
          PROXY_EXTERNAL_INGRESS_IP: "op://Lab/vps-proxy/VPS_EXTERNAL_INGRESS_IP"
          PROXY_ENVOY_GATEWAY_IP: "op://Lab/vps-proxy/VPS_ENVOY_GATEWAY_IP"
          PROXY_SSL_CERT_PATH: "op://Lab/vps-proxy/VPS_SSL_CERT_PATH"
          PROXY_SSL_KEY_PATH: "op://Lab/vps-proxy/VPS_SSL_KEY_PATH"

          # OpenTelemetry Configuration
          OTEL_ENDPOINT: "op://Lab/vps-proxy/VPS_OTEL_ENDPOINT"
          OTEL_SERVICE_NAME: "op://Lab/vps-proxy/VPS_OTEL_SERVICE_NAME"
          OTEL_SAMPLE_RATE: "op://Lab/vps-proxy/VPS_OTEL_SAMPLE_RATE"

          # Authentik Configuration
          AUTHENTIK_ENABLED: "op://Lab/vps-proxy/VPS_AUTHENTIK_ENABLED"
          AUTHENTIK_DOMAIN: "op://Lab/vps-proxy/VPS_AUTHENTIK_DOMAIN"

          # CrowdSec Configuration
          CROWDSEC_ENABLED: "op://Lab/vps-proxy/VPS_CROWDSEC_ENABLED"
          CROWDSEC_BOUNCER_API_KEY: "op://Lab/crowdsec/CROWDSEC_VPS_TRAEFIK_BOUNCER_API_KEY"
          CROWDSEC_LAPI_HOST: "op://Lab/vps-proxy/VPS_CROWDSEC_LAPI_HOST"
          CROWDSEC_LOG_LEVEL: "op://Lab/vps-proxy/VPS_CROWDSEC_LOG_LEVEL"

          # Feature Toggles
          PROXY_ENABLE_ECHO_TEST: "op://Lab/vps-proxy/VPS_ENABLE_ECHO_TEST"
          PROXY_ENABLE_METRICS: "op://Lab/vps-proxy/VPS_ENABLE_METRICS"

          # Metrics Authentication
          VPS_METRICS_USER: "op://Lab/vps-proxy/VPS_METRICS_USER"
          VPS_METRICS_PASSWORD_HASH: "op://Lab/vps-proxy/VPS_METRICS_PASSWORD_HASH"

          # Legacy nginx variables for backward compatibility
          NGINX_DOMAIN: "op://Lab/vps-proxy/VPS_PROXY_DOMAIN"
          NGINX_EXTERNAL_INGRESS_IP: "op://Lab/vps-proxy/VPS_EXTERNAL_INGRESS_IP"
          NGINX_ENVOY_GATEWAY_IP: "op://Lab/vps-proxy/VPS_ENVOY_GATEWAY_IP"
          NGINX_SSL_CERT_PATH: "op://Lab/vps-proxy/VPS_SSL_CERT_PATH"
          NGINX_SSL_KEY_PATH: "op://Lab/vps-proxy/VPS_SSL_KEY_PATH"
          NGINX_ENABLE_ECHO_TEST: "op://Lab/vps-proxy/VPS_ENABLE_ECHO_TEST"
          NGINX_ENABLE_METRICS: "op://Lab/vps-proxy/VPS_ENABLE_METRICS"

      - name: Override proxy type if specified
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.proxy_type != 'default'
        run: |
          echo "REVERSE_PROXY_TYPE=${{ github.event.inputs.proxy_type }}" >> $GITHUB_ENV

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vps_key -p ${VPS_SSH_PORT:-22} ${VPS_SSH_USER:-root}@$VPS_HOST "echo 'SSH connection successful'"

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip install ansible ansible-lint

      - name: Install Ansible collections
        working-directory: ./vps/ansible
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        working-directory: ./vps/ansible
        run: |
          ansible-playbook reverse-proxy.yml --syntax-check

      - name: Run Ansible Playbook
        working-directory: ./vps/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          VPS_SSH_KEY_PATH: /home/runner/.ssh/vps_key
          VPS_SSH_USER: ${{ env.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ env.VPS_SSH_PORT }}
        run: |
          echo "Deploying $REVERSE_PROXY_TYPE reverse proxy..."
          ansible-playbook reverse-proxy.yml \
            -i inventory.yml \
            ${{ github.event.inputs.dry_run == 'true' && '--check --diff' || '' }} \
            ${{ github.event.inputs.debug == 'true' && '-vvv' || '' }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.ssh/vps_key