---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Schemas

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *  # Daily at midnight
  push:
    branches:
      - main
    paths:
      - .github/workflows/schemas.yaml

env:
  UV_SYSTEM_PYTHON: "1"

permissions:
  contents: read

jobs:
  main:
    name: Extract and Publish Schemas
    runs-on: home-cluster
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install kubectl
        run: |
          if ! command -v kubectl &> /dev/null; then
            echo "Installing kubectl..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          else
            echo "kubectl already installed"
          fi

      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14.x

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Install Python Dependencies
        run: uv pip install pyyaml

      - name: Extract CRD Schemas
        run: |
          # Create directory for schemas
          mkdir -p /tmp/crdSchemas
          cd /tmp/crdSchemas

          # Download both required files from the CRDs-catalog utilities
          curl -fsSL -o crd-extractor.sh https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/Utilities/crd-extractor.sh
          curl -fsSL -o openapi2jsonschema.py https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/Utilities/openapi2jsonschema.py
          chmod +x crd-extractor.sh

          # Run the CRD extractor
          ./crd-extractor.sh

          # The script creates schemas in ~/.datree/crdSchemas
          # Move them to our working directory
          cp -r ~/.datree/crdSchemas/* /tmp/crdSchemas/ || true

          # Clean up utility scripts before publishing
          rm -f crd-extractor.sh openapi2jsonschema.py

          # List what we extracted
          echo "Extracted schemas:"
          ls -la /tmp/crdSchemas/

      - name: Create Cloudflare Pages Project
        continue-on-error: true
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create chrtol-schemas --production-branch main

      - name: Deploy Schemas to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: /tmp/crdSchemas
          command: pages deploy --project-name=chrtol-schemas --branch main .