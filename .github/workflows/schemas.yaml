---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Schemas

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *  # Daily at midnight
  push:
    branches:
      - main
    paths:
      - .github/workflows/schemas.yaml

env:
  # renovate: datasource=github-releases depName=sholdee/crd-schema-publisher
  CRD_SCHEMA_PUBLISHER_VERSION: v2026.1102.63220

permissions:
  contents: read

jobs:
  main:
    name: Extract and Publish Schemas
    runs-on: home-cluster
    steps:
      - name: Install crd-schema-publisher
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/sholdee/crd-schema-publisher/releases/download/${CRD_SCHEMA_PUBLISHER_VERSION}"
          curl -fsSLO "$base/crd-schema-publisher-linux-amd64"
          curl -fsSL "$base/checksums-sha256.txt" | grep ' crd-schema-publisher-linux-amd64$' | sha256sum -c -
          install -m 0755 crd-schema-publisher-linux-amd64 "$RUNNER_TEMP/crd-schema-publisher"

      - name: Extract Schemas
        id: extract
        run: |
          "$RUNNER_TEMP/crd-schema-publisher" extract --include-builtins --include-kustomize -o "$RUNNER_TEMP/schemas"
          echo "dir=$(realpath "$RUNNER_TEMP/schemas/current")" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15.x

      # The extractor types Quantity as string only, but the API server accepts
      # numbers too (cpu: 1, gpu.intel.com/i915: 1); without this, kubeconform
      # rejects valid workloads.
      - name: Allow Numeric Quantities
        env:
          SCHEMA_DIR: ${{ steps.extract.outputs.dir }}
        shell: python
        run: |
          import json, os, pathlib
          quantity = {"oneOf": [{"type": "string"}, {"type": "number"}]}
          for path in pathlib.Path(os.environ["SCHEMA_DIR"]).rglob("*.json"):
              schema = json.loads(path.read_text())
              definitions = schema.get("definitions") if isinstance(schema, dict) else None
              key = "io.k8s.apimachinery.pkg.api.resource.Quantity"
              if definitions and key in definitions:
                  definitions[key] = {"description": definitions[key].get("description", ""), **quantity}
                  path.write_text(json.dumps(schema, indent=2) + "\n")

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x

      - name: Deploy Schemas to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ steps.extract.outputs.dir }}
          command: pages deploy --project-name=chrtol-schemas --branch main .
