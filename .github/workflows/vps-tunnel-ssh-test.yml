name: VPS Tunnel SSH Test

# Read-only check that the in-cluster runner can reach the VPS over WireGuard
# with the pinned host key, before the deploy workflows move onto it.

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  test:
    name: SSH to the VPS over the tunnel
    runs-on: home-cluster

    steps:
      - name: Tools on the runner image
        run: |
          for t in ssh python3 pip3 git curl; do
            printf '%-8s ' "$t"; command -v "$t" || echo MISSING
          done

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VPS_SSH_PORT: "op://Lab/vps-wireguard/VPS_SSH_PORT"
          VPS_SSH_KEY: "op://Lab/pangolin/PANGOLIN_VPS_SSH_PRIVATE_KEY"
          VPS_SSH_USER: "op://Lab/pangolin/PANGOLIN_VPS_SSH_USER"
          VPS_SSH_HOST_KEY: "op://Lab/vps-wireguard/VPS_SSH_HOST_KEY"

      - name: SSH over the tunnel with the pinned host key
        env:
          VPS_TUNNEL_IP: 10.100.0.1
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          printf '[%s]:%s %s\n' "$VPS_TUNNEL_IP" "$VPS_SSH_PORT" "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -i ~/.ssh/vps_key -p "$VPS_SSH_PORT" "$VPS_SSH_USER@$VPS_TUNNEL_IP" \
            'echo "connected to $(hostname) over the tunnel"'

      - name: Cleanup
        if: always()
        run: rm -rf ~/.ssh/vps_key
