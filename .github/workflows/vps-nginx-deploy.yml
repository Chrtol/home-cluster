name: Deploy VPS Nginx Configuration

on:
  push:
    branches: [main]
    paths:
      - 'vps/ansible/roles/nginx/**'
      - 'vps/ansible/roles/nginx-otel/**'
      - 'vps/ansible/nginx-only.yml'
      - '.github/workflows/vps-nginx-deploy.yml'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run Ansible in debug mode'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Run in check mode (no changes)'
        required: false
        type: boolean
        default: false

jobs:
  deploy-nginx:
    name: Deploy Nginx Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@8d0d610af187e78a2772c2d18d627f4c52d3fbfb # v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # VPS Access
          VPS_HOST: "op://Lab/vps-wireguard/VPS_IP"
          VPS_SSH_PORT: "op://Lab/vps-wireguard/VPS_SSH_PORT"
          VPS_SSH_KEY: "op://Lab/pangolin/PANGOLIN_VPS_SSH_PRIVATE_KEY"
          VPS_SSH_USER: "op://Lab/pangolin/PANGOLIN_VPS_SSH_USER"
          # Nginx Configuration
          NGINX_DOMAIN: "op://Lab/vps-nginx/VPS_NGINX_DOMAIN"
          NGINX_EXTERNAL_INGRESS_IP: "op://Lab/vps-nginx/VPS_NGINX_EXTERNAL_INGRESS_IP"
          NGINX_ENVOY_GATEWAY_IP: "op://Lab/vps-nginx/VPS_NGINX_ENVOY_GATEWAY_IP"
          NGINX_SSL_CERT_PATH: "op://Lab/vps-nginx/VPS_NGINX_SSL_CERT_PATH"
          NGINX_SSL_KEY_PATH: "op://Lab/vps-nginx/VPS_NGINX_SSL_KEY_PATH"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/vps_key -p ${VPS_SSH_PORT:-22} ${VPS_SSH_USER:-root}@$VPS_HOST "echo 'SSH connection successful'"

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip install ansible ansible-lint

      - name: Install Ansible collections
        working-directory: ./vps/ansible
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        working-directory: ./vps/ansible
        run: |
          ansible-playbook nginx-only.yml --syntax-check

      - name: Run Ansible Playbook
        working-directory: ./vps/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          VPS_SSH_KEY_PATH: /home/runner/.ssh/vps_key
          VPS_SSH_USER: ${{ env.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ env.VPS_SSH_PORT }}
          # Feature toggles
          NGINX_ENABLE_ECHO_TEST: "true"
          NGINX_ENABLE_METRICS: "true"
        run: |
          ansible-playbook nginx-only.yml \
            -i inventory.yml \
            ${{ github.event.inputs.dry_run == 'true' && '--check --diff' || '' }} \
            ${{ github.event.inputs.debug == 'true' && '-vvv' || '' }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.ssh/vps_key