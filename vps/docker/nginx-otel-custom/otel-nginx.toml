# OpenTelemetry configuration for nginx
exporter = "otlp"
processor = "batch"

[exporters.otlp]
# This will be overridden by environment variable OTEL_EXPORTER_OTLP_ENDPOINT
endpoint = "localhost:4317"

[processors.batch]
max_queue_size = 2048
schedule_delay_millis = 5000
max_export_batch_size = 512

[service]
name = "vps-nginx"  # This will be overridden by environment variable OTEL_SERVICE_NAME
namespace = "vps"

[sampler]
name = "AlwaysOn"  # Sample all traces

[propagator]
name = "tracecontext"  # Use W3C Trace Context standard