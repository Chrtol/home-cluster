all:
  hosts:
    vps:
      ansible_host: "{{ lookup('env', 'VPS_HOST') }}"
      ansible_port: "{{ lookup('env', 'VPS_SSH_PORT') | default('22') }}"
      ansible_user: "{{ lookup('env', 'VPS_SSH_USER') | default('root') }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'VPS_SSH_KEY_PATH') | default('/tmp/vps_key') }}"
      ansible_python_interpreter: /usr/bin/python3