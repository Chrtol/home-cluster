---
# GitOps playbook for nginx configuration management
# This ensures nginx configuration matches the desired state defined in code
# Idempotent: Can be run repeatedly without side effects
# Make changes to templates/configuration in git, not on the server

- name: Ensure nginx configuration matches desired state
  hosts: vps
  become: yes

  vars:
    # These are populated from environment variables via 1Password in CI/CD
    nginx_domain: "{{ lookup('env', 'NGINX_DOMAIN') }}"
    nginx_ssl_cert_path: "{{ lookup('env', 'NGINX_SSL_CERT_PATH') | default('/etc/letsencrypt/live/' + nginx_domain + '/fullchain.pem') }}"
    nginx_ssl_key_path: "{{ lookup('env', 'NGINX_SSL_KEY_PATH') | default('/etc/letsencrypt/live/' + nginx_domain + '/privkey.pem') }}"
    nginx_external_ingress_ip: "{{ lookup('env', 'NGINX_EXTERNAL_INGRESS_IP') }}"
    nginx_envoy_gateway_ip: "{{ lookup('env', 'NGINX_ENVOY_GATEWAY_IP') | default('10.0.30.44') }}"

    # Feature toggles
    enable_echo_test: "{{ lookup('env', 'NGINX_ENABLE_ECHO_TEST') | default('true') | bool }}"
    enable_metrics: "{{ lookup('env', 'NGINX_ENABLE_METRICS') | default('true') | bool }}"
    use_nginx_otel: true  # Always use nginx with OpenTelemetry

  pre_tasks:
    - name: Create backup of current nginx configuration
      archive:
        path: /etc/nginx
        dest: "/tmp/nginx-backup-{{ ansible_date_time.epoch }}.tar.gz"
        format: gz
      ignore_errors: yes

    - name: Display configuration summary
      debug:
        msg: |
          ========================================
          Applying Nginx Configuration State
          ========================================
          Domain: {{ nginx_domain }}
          External Ingress IP: {{ nginx_external_ingress_ip }}
          Envoy Gateway IP: {{ nginx_envoy_gateway_ip }}
          Echo Test Enabled: {{ enable_echo_test }}
          Metrics Enabled: {{ enable_metrics }}
          OpenTelemetry Mode: {{ 'Enabled (containerized)' if use_nginx_otel else 'Disabled (system nginx)' }}
          ========================================

  tasks:
    - name: Ensure system nginx configuration is applied
      include_role:
        name: nginx
      when: not use_nginx_otel

    - name: Ensure containerized nginx-otel is deployed
      include_role:
        name: nginx-otel
      when: use_nginx_otel

  post_tasks:
    - name: Verify system nginx is running
      systemd:
        name: nginx
        state: started
      register: nginx_status
      when: not use_nginx_otel

    - name: Check system nginx status
      command: systemctl status nginx --no-pager
      register: nginx_service_status
      changed_when: false
      when: not use_nginx_otel

    - name: Check containerized nginx-otel status
      command: docker ps --filter "name=nginx-otel" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      register: nginx_container_status
      changed_when: false
      when: use_nginx_otel

    - name: Display nginx status
      debug:
        var: "{{ 'nginx_service_status.stdout_lines' if not use_nginx_otel else 'nginx_container_status.stdout_lines' }}"

    - name: Test connectivity to external ingress
      uri:
        url: "https://{{ nginx_external_ingress_ip }}:443"
        method: GET
        validate_certs: no
        timeout: 5
      register: ingress_test
      ignore_errors: yes

    - name: Show deployment result
      debug:
        msg: |
          ========================================
          Nginx configuration state applied!

          Mode: {{ 'Containerized nginx-otel with OpenTelemetry' if use_nginx_otel else 'System nginx (traditional)' }}

          {% if use_nginx_otel %}
          OpenTelemetry Configuration:
          - Service: vps-nginx
          - Tempo Endpoint: {{ nginx_external_ingress_ip }}:4317
          - Traces enabled for all requests
          {% else %}
          Key fixes applied:
          - Fixed WebSocket connection handling ($connection_upgrade map)
          - Added proxy_request_buffering off for streaming
          - Improved proxy header configuration
          - Fixed SSL proxy settings
          {% endif %}

          Status:
          - Nginx: {{ 'Container Running' if use_nginx_otel else ('Running' if nginx_status.state == 'started' else 'Not Running') }}
          - External Ingress: {{ 'Reachable' if ingress_test.status is defined else 'Unreachable' }}

          If issues persist, check:
          - WireGuard tunnel status
          - External ingress controller logs
          - MTU settings on network interfaces
          {% if use_nginx_otel %}
          - Docker logs: docker logs nginx-otel
          - Traces in Grafana/Tempo
          {% endif %}
          ========================================