---
# GitOps playbook for Traefik reverse proxy configuration management
# This ensures Traefik configuration matches the desired state defined in code
# Idempotent: Can be run repeatedly without side effects
# Make changes to templates/configuration in git, not on the server

- name: Ensure Traefik configuration matches desired state
  hosts: vps
  become: yes

  vars:
    # Configuration from 1Password via CI/CD environment variables
    proxy_domain: "{{ lookup('env', 'PROXY_DOMAIN') }}"
    proxy_envoy_gateway_ip: "{{ lookup('env', 'PROXY_ENVOY_GATEWAY_IP') }}"
    proxy_ssl_cert_path: "{{ lookup('env', 'PROXY_SSL_CERT_PATH') | default('/etc/letsencrypt/live/' + proxy_domain + '/fullchain.pem') }}"
    proxy_ssl_key_path: "{{ lookup('env', 'PROXY_SSL_KEY_PATH') | default('/etc/letsencrypt/live/' + proxy_domain + '/privkey.pem') }}"

    # OpenTelemetry configuration from 1Password
    otel_endpoint: "{{ lookup('env', 'OTEL_ENDPOINT') }}"
    otel_service_name: "{{ lookup('env', 'OTEL_SERVICE_NAME') | default('vps-traefik') }}"
    otel_sample_rate: "{{ lookup('env', 'OTEL_SAMPLE_RATE') | default('0.75') }}"

    # Authentik configuration (from 1Password)
    authentik_enabled: "{{ lookup('env', 'AUTHENTIK_ENABLED') | default('false') | bool }}"
    authentik_domain: "{{ lookup('env', 'AUTHENTIK_DOMAIN') | default('authentik.' + proxy_domain) }}"

    # CrowdSec configuration (from 1Password)
    crowdsec_enabled: "{{ lookup('env', 'CROWDSEC_ENABLED') | default('true') | bool }}"
    crowdsec_bouncer_api_key: "{{ lookup('env', 'CROWDSEC_BOUNCER_API_KEY') }}"
    crowdsec_lapi_host: "{{ lookup('env', 'CROWDSEC_LAPI_HOST') | default('127.0.0.1:8080') }}"
    crowdsec_log_level: "{{ lookup('env', 'CROWDSEC_LOG_LEVEL') | default('INFO') }}"
    crowdsec_enroll_key: "{{ lookup('env', 'CROWDSEC_ENROLL_KEY') | default('', true) }}"

    # WireGuard tunnel keys from 1Password
    wireguard_private_key: "{{ lookup('env', 'VPS_WG_PRIVATE_KEY') }}"
    wireguard_home_public_key: "{{ lookup('env', 'VPS_WG_HOME_PUBLIC_KEY') }}"
    # Comma-separated CIDRs; kept out of the repo like DESKTOP_LAN_IP in cluster-secrets.
    wireguard_ssh_clients: "{{ lookup('env', 'VPS_WG_SSH_CLIENTS').split(',') | map('trim') | select | list }}"

    # Minecraft Bedrock UDP passthrough. Presence of the IP is the toggle.
    minecraft_lb_ip: "{{ lookup('env', 'VPS_MINECRAFT_LB_IP') | default('', true) }}"

    # Geo-block data (GeoLite2 Country) from 1Password
    geoblock_maxmind_account_id: "{{ lookup('env', 'MAXMIND_ACCOUNT_ID') }}"
    geoblock_maxmind_license_key: "{{ lookup('env', 'MAXMIND_LICENSE_KEY') }}"

    # Feature toggles
    enable_echo_test: "{{ lookup('env', 'PROXY_ENABLE_ECHO_TEST') | default('true') | bool }}"
    enable_metrics: "{{ lookup('env', 'PROXY_ENABLE_METRICS') | default('true') | bool }}"

    # Dead-man's-switch watcher (out-of-cluster monitoring backstop) from 1Password
    deadman_enabled: "{{ lookup('env', 'VPS_DEADMAN_ENABLED') | default('false') | bool }}"
    deadman_ping_token: "{{ lookup('env', 'VPS_DEADMAN_PING_TOKEN') | default('', true) }}"
    deadman_grace_seconds: "{{ lookup('env', 'VPS_DEADMAN_GRACE_SECONDS') | default('600', true) }}"
    deadman_pushover_token: "{{ lookup('env', 'VPS_DEADMAN_PUSHOVER_TOKEN') | default('', true) }}"
    deadman_pushover_user: "{{ lookup('env', 'VPS_DEADMAN_PUSHOVER_USER') | default('', true) }}"
    deadman_host: "deadman.{{ proxy_domain }}"

    # Pass variables to traefik role
    traefik_domain: "{{ proxy_domain }}"
    traefik_deadman_enabled: "{{ deadman_enabled }}"
    traefik_deadman_host: "{{ deadman_host }}"
    traefik_otel_endpoint: "{{ otel_endpoint }}"
    traefik_service_name: "{{ otel_service_name }}"
    traefik_sample_rate: "{{ otel_sample_rate }}"
    traefik_enable_authentik: "{{ authentik_enabled }}"
    traefik_crowdsec_enabled: "{{ crowdsec_enabled }}"
    traefik_crowdsec_api_key: "{{ crowdsec_bouncer_api_key }}"
    traefik_crowdsec_lapi_host: "{{ crowdsec_lapi_host }}"
    traefik_crowdsec_log_level: "{{ crowdsec_log_level }}"
    traefik_enable_echo_test: "{{ enable_echo_test }}"
    traefik_envoy_gateway_ip: "{{ proxy_envoy_gateway_ip }}"
    traefik_minecraft_ip: "{{ minecraft_lb_ip }}"
    traefik_enable_metrics: "{{ enable_metrics }}"
    traefik_metrics_user: "{{ lookup('env', 'VPS_METRICS_USER') }}"
    traefik_metrics_password_hash: "{{ lookup('env', 'VPS_METRICS_PASSWORD_HASH') }}"

  pre_tasks:
    - name: Display configuration summary
      debug:
        msg: |
          Applying VPS configuration...
          Features: Traefik, CrowdSec, Trivy Scanner
          Authentik: {{ 'Enabled' if authentik_enabled else 'Disabled' }}
          CrowdSec: {{ 'Enabled' if crowdsec_enabled else 'Disabled' }}
          Metrics: {{ 'Enabled' if enable_metrics else 'Disabled' }}

  tasks:
    - name: Ensure firewall is configured
      include_role:
        name: firewall

    # Before traefik: its upstream and the crowdsec home allowlist both depend on wg0.
    - name: Ensure wireguard tunnel is configured
      include_role:
        name: wireguard

    - name: Ensure traefik is deployed
      include_role:
        name: traefik

    # After traefik, so the access log directory exists before CrowdSec tails it.
    - name: Ensure crowdsec is configured
      include_role:
        name: crowdsec
      when: crowdsec_enabled

    # After firewall (UFW's chains exist) and traefik (the Minecraft port is known)
    - name: Ensure the geo-block is configured
      include_role:
        name: geoblock

    - name: Ensure trivy scanner is deployed
      include_role:
        name: trivy

    # Deploy AFTER traefik so its route can front the watcher immediately.
    - name: Ensure dead-man's-switch watcher is deployed
      include_role:
        name: deadman

  post_tasks:
    - name: Clean up old backup files (keep 2 most recent)
      shell: |
        ls -t /tmp/traefik-backup-*.tar.gz /tmp/proxy-backup-*.tar.gz 2>/dev/null | tail -n +3 | xargs -r rm -f
      changed_when: false
      ignore_errors: true

    - name: Remove old logs directory (access log now lives in /var/log/traefik)
      file:
        path: /opt/traefik/logs
        state: absent
      ignore_errors: true

    - name: Check traefik status
      shell: |
        docker ps --filter "name=traefik" --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}"
      register: traefik_container_status
      changed_when: false

    - name: Display traefik status
      debug:
        var: traefik_container_status.stdout_lines

    - name: Test health endpoint
      uri:
        url: "http://localhost/ping"
        method: GET
        timeout: 5
      register: health_test
      retries: 6
      delay: 5
      until: health_test.status == 200

    # The same hop Traefik makes: through the tunnel to Envoy, with Envoy's SNI.
    # Any HTTP status proves the path; 000 means the tunnel or Envoy is down.
    - name: Test the path to Envoy over the tunnel
      command: >-
        curl -sk -o /dev/null -w '%{http_code}' --max-time 5
        --resolve envoy.{{ proxy_domain }}:443:{{ proxy_envoy_gateway_ip }}
        https://envoy.{{ proxy_domain }}/
      register: envoy_test
      changed_when: false
      retries: 6
      delay: 5
      until: envoy_test.stdout != '000'

    - name: Show deployment result
      debug:
        msg: >-
          VPS configuration applied; Traefik answers /ping and Envoy is
          reachable over the tunnel (HTTP {{ envoy_test.stdout }}).
          Trivy scans daily at 3 AM, results in /var/log/trivy/.
