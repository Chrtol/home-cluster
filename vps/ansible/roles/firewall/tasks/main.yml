---
- name: Install UFW
  apt:
    name: ufw
    state: present

- name: Configure UFW defaults
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Configure UFW rules
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop:
    - { port: "22", proto: tcp, comment: "SSH" }
    - { port: "80", proto: tcp, comment: "HTTP" }
    - { port: "443", proto: tcp, comment: "HTTPS" }
    - { port: "51820", proto: udp, comment: "WireGuard" }

# Dropping a port from the list above leaves its rule live on the host.
- name: Remove UFW rules for retired services
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    delete: true
  loop:
    - { port: "21820", proto: udp }  # Pangolin's Gerbil

- name: Enable UFW
  ufw:
    state: enabled
    logging: on