---
- name: Create nginx-otel directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ nginx_otel_dir }}"
    - "{{ nginx_otel_config_dir }}"
    - "{{ nginx_otel_ssl_dir }}"
    - "{{ nginx_otel_dir }}/logs"

- name: Copy Dockerfile for custom nginx build
  template:
    src: Dockerfile.j2
    dest: "{{ nginx_otel_dir }}/Dockerfile"
    mode: '0644'

- name: Build custom nginx-otel image with opentelemetry-cpp-contrib
  community.docker.docker_image:
    name: nginx-otel-custom
    tag: latest
    source: build
    build:
      path: "{{ nginx_otel_dir }}"
      pull: true
    force_source: true

- name: Check if nginx has OpenTelemetry compiled in
  shell: |
    docker run --rm nginx-otel-custom:latest nginx -V 2>&1
  register: nginx_version_check
  ignore_errors: true

- name: Display nginx version and modules
  debug:
    msg: "Nginx version info: {{ nginx_version_check.stderr | default(nginx_version_check.stdout) }}"
  when: nginx_version_check is defined

- name: Copy SSL certificates to container directory
  copy:
    src: "{{ item }}"
    dest: "{{ nginx_otel_ssl_dir }}/"
    remote_src: true
    mode: '0644'
  loop:
    - "{{ nginx_ssl_cert_path }}"
    - "{{ nginx_ssl_key_path }}"
  ignore_errors: true

- name: Deploy nginx configuration with OpenTelemetry
  template:
    src: nginx.conf.j2
    dest: "{{ nginx_otel_config_dir }}/nginx.conf"
    mode: '0644'
  notify: restart nginx-otel

- name: Deploy OpenTelemetry module configuration
  template:
    src: otel-nginx.toml.j2
    dest: "{{ nginx_otel_config_dir }}/otel-nginx.toml"
    mode: '0644'
  notify: restart nginx-otel

- name: Deploy site configuration
  template:
    src: default.conf.j2
    dest: "{{ nginx_otel_config_dir }}/default.conf"
    mode: '0644'
  notify: restart nginx-otel

- name: Deploy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ nginx_otel_dir }}/docker-compose.yml"
    mode: '0644'

- name: Check if system nginx is installed
  command: which nginx
  register: nginx_installed
  changed_when: false
  failed_when: false

- name: Ensure system nginx is stopped and disabled
  systemd:
    name: nginx
    state: stopped
    enabled: false
  when: nginx_installed.rc == 0
  ignore_errors: true

- name: Wait for ports to be available
  wait_for:
    port: "{{ item }}"
    state: stopped
    host: 0.0.0.0
    delay: 1
    timeout: 30
  loop:
    - 80
    - 443
  ignore_errors: true

- name: Ensure nginx-otel container is running with current configuration
  community.docker.docker_compose_v2:
    project_src: "{{ nginx_otel_dir }}"
    state: present
    pull: never  # Don't pull since we're using a locally built image
  register: nginx_otel_output

- name: Check if configuration changed
  set_fact:
    config_changed: "{{ nginx_otel_output.changed }}"

- name: Restart nginx-otel if configuration changed
  community.docker.docker_compose_v2:
    project_src: "{{ nginx_otel_dir }}"
    state: restarted
  when: config_changed

- name: Check nginx-otel container status
  community.docker.docker_container_info:
    name: nginx-otel
  register: container_info
  retries: 3
  delay: 2

- name: Display container status for debugging
  debug:
    msg: |
      Container Running: {{ container_info.container.State.Running | default(false) }}
      Container Status: {{ container_info.container.State.Status | default('unknown') }}
  when: container_info.container is defined

- name: Get docker logs if container is not running
  shell: docker logs nginx-otel --tail 50
  register: docker_logs
  when: container_info.container is not defined or not (container_info.container.State.Running | default(false))
  ignore_errors: true

- name: Display docker logs if container failed
  debug:
    var: docker_logs.stdout_lines
  when: docker_logs is defined and docker_logs.stdout_lines is defined

- name: Wait for nginx-otel to be ready
  wait_for:
    port: "{{ nginx_http_port }}"
    state: started
    host: 0.0.0.0
    delay: 5
    timeout: 60
  ignore_errors: true

- name: Verify nginx-otel is accessible (may restart initially)
  uri:
    url: "http://localhost:{{ nginx_http_port }}/health"
    status_code: [200, 301, 302, 404]
    validate_certs: false
    follow_redirects: all
  register: health_check
  retries: 5
  delay: 2
  ignore_errors: true

- name: Final container state check
  community.docker.docker_container_info:
    name: nginx-otel
  register: final_container_info

- name: Deployment status
  debug:
    msg: |
      nginx-otel container is {{ 'running' if final_container_info.container.State.Running else 'not running' }}
      OTLP endpoint: {{ otel_exporter_endpoint }}