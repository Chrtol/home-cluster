---
# Handlers for Traefik role
- name: restart traefik
  block:
    - name: Stop Traefik
      community.docker.docker_compose_v2:
        project_src: "{{ traefik_dir }}"
        state: absent

    - name: Start Traefik
      community.docker.docker_compose_v2:
        project_src: "{{ traefik_dir }}"
        state: present

- name: apply tcp sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/60-tcp-retries.conf
  changed_when: true

- name: reload traefik
  # Traefik automatically watches the dynamic configuration file
  # This handler is here for consistency but doesn't need to do anything
  ansible.builtin.debug:
    msg: "Traefik will automatically reload the dynamic configuration"