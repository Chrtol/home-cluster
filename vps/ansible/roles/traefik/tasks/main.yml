---
# Deploy Traefik with OpenTelemetry support

# The UFW rule lives here rather than in the `firewall` role so it shares the
# traefik_minecraft_ip toggle with the entrypoint. Split them and Traefik can bind
# the port while UFW silently drops every packet -- indistinguishable from a
# broken tunnel, three hops from where you would look.
- name: Allow Minecraft Bedrock UDP through UFW
  community.general.ufw:
    rule: allow
    port: "{{ traefik_minecraft_port | default(19132) }}"
    proto: udp
    comment: "Minecraft Bedrock"
  when: traefik_minecraft_ip | default('', true) | trim | length > 0

# Prometheus in the cluster scrapes node-exporter and Traefik's metrics over the
# tunnel. Both listen on every interface, so a tunnel that comes up after Docker
# at boot cannot stop Traefik from binding; UFW is what keeps them off the public side.
- name: Allow metrics scrapes over the WireGuard tunnel
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ traefik_metrics_interface }}"
    port: "{{ item.port }}"
    proto: tcp
    comment: "{{ item.comment }}"
  loop:
    - { port: "9100", comment: "node-exporter over WireGuard" }
    - { port: "8082", comment: "Traefik metrics over WireGuard" }
  when: traefik_enable_metrics | default(false)

- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ traefik_dir }}"
    - "{{ traefik_config_dir }}"
    - "{{ traefik_access_log_dir }}"

# copytruncate: Traefik keeps the file open and only reopens it on USR1, which
# logrotate can't send into the container.
- name: Rotate the Traefik access log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/traefik
    mode: "0644"
    content: |
      {{ traefik_access_log_dir }}/access.log {
        daily
        rotate 7
        compress
        delaycompress
        missingok
        notifempty
        copytruncate
      }

# This role runs before the crowdsec role, so on the deploy that moves the engine
# into a container (and on a fresh host) the container is not there yet.
- name: Check for the crowdsec container
  ansible.builtin.command: docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' crowdsec
  register: traefik_crowdsec_container
  changed_when: false
  failed_when: false
  check_mode: false
  when: traefik_crowdsec_enabled | default(true)

- name: Check for a host cscli
  ansible.builtin.command: which cscli
  register: traefik_host_cscli
  changed_when: false
  failed_when: false
  check_mode: false
  when: traefik_crowdsec_enabled | default(true)

- name: Pick how to reach cscli
  ansible.builtin.set_fact:
    traefik_cscli: >-
      {{ 'docker exec crowdsec cscli' if (traefik_crowdsec_container.stdout | default('')) == 'true'
         else ('cscli' if (traefik_host_cscli.rc | default(1)) == 0 else '') }}
  when: traefik_crowdsec_enabled | default(true)

- name: Skip the bouncer check while no engine is running
  ansible.builtin.debug:
    msg: No crowdsec container or host cscli yet; the bouncer check runs on the next deploy.
  when:
    - traefik_crowdsec_enabled | default(true)
    - traefik_cscli | length == 0

# Manage CrowdSec bouncer for Traefik protection
- name: Setup CrowdSec bouncer
  include_tasks: crowdsec-bouncer.yml
  when:
    - traefik_crowdsec_enabled | default(true)
    - traefik_cscli | length > 0

- name: Template Traefik static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_config_dir }}/traefik.yml"
    mode: '0644'
  register: static_config_changed

- name: Template Traefik dynamic configuration
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ traefik_config_dir }}/dynamic.yml"
    mode: '0644'

- name: Template docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_dir }}/docker-compose.yml"
    mode: '0644'
  register: compose_changed

# Compose recreates on its own when the compose file or an image tag changes.
# dynamic.yml is reloaded live (file provider watch on a directory mount), so open
# connections such as Plex streams survive it; only static config needs a recreate.
- name: Start Traefik, recreating it only when its configuration changed
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present
    pull: missing
    remove_orphans: true
    recreate: "{{ 'always' if static_config_changed is changed else 'auto' }}"
  register: traefik_result

- name: Pause to let container initialize
  pause:
    seconds: 3

- name: Wait for Traefik to be healthy
  ansible.builtin.wait_for:
    port: 443
    host: 0.0.0.0
    delay: 5
    timeout: 60
  ignore_errors: true  # Don't fail deployment if health check times out

- name: Check Traefik health endpoint
  ansible.builtin.uri:
    url: "http://localhost/ping"
    method: GET
    status_code: [200, 404]  # Accept 404 in case ping endpoint is not exposed
    validate_certs: false  # Don't verify SSL cert for localhost
  retries: 5
  delay: 2
  ignore_errors: true  # Don't fail deployment if health endpoint is not yet ready

- name: Display Traefik status
  ansible.builtin.debug:
    msg: |
      Traefik has been deployed successfully!
      - Service: vps-traefik
      - Domain: {{ traefik_domain }}
      - OpenTelemetry endpoint: {{ traefik_otel_endpoint }}
      - Sample rate: {{ traefik_sample_rate }}
      - Emitting both CLIENT and SERVER spans for proper service graphs
      {% if traefik_enable_authentik %}
      - Authentik forward auth: ENABLED
      {% else %}
      - Authentik forward auth: DISABLED (set traefik_enable_authentik to true when ready)
      {% endif %}