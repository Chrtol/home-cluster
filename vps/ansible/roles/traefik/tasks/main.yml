---
# Deploy Traefik with OpenTelemetry support

# The UFW rule lives here rather than in the `firewall` role so it shares the
# traefik_minecraft_ip toggle with the entrypoint. Split them and Traefik can bind
# the port while UFW silently drops every packet -- indistinguishable from a
# broken tunnel, three hops from where you would look.
- name: Allow Minecraft Bedrock UDP through UFW
  community.general.ufw:
    rule: allow
    port: "{{ traefik_minecraft_port | default(19132) }}"
    proto: udp
    comment: "Minecraft Bedrock"
  when: traefik_minecraft_ip | default('', true) | trim | length > 0

- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ traefik_dir }}"
    - "{{ traefik_config_dir }}"
    - "{{ traefik_access_log_dir }}"

# copytruncate: Traefik keeps the file open and only reopens it on USR1, which
# logrotate can't send into the container.
- name: Rotate the Traefik access log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/traefik
    mode: "0644"
    content: |
      {{ traefik_access_log_dir }}/access.log {
        daily
        rotate 7
        compress
        delaycompress
        missingok
        notifempty
        copytruncate
      }

# Manage CrowdSec bouncer for Traefik protection
- name: Setup CrowdSec bouncer
  include_tasks: crowdsec-bouncer.yml
  when: traefik_crowdsec_enabled | default(true)

- name: Template Traefik static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_config_dir }}/traefik.yml"
    mode: '0644'
  register: static_config_changed

- name: Template Traefik dynamic configuration
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ traefik_config_dir }}/dynamic.yml"
    mode: '0644'
  register: dynamic_config_changed

- name: Template docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_dir }}/docker-compose.yml"
    mode: '0644'
  register: compose_changed

# Compose recreates on its own when the compose file or an image tag changes. The
# config files are single-file bind mounts: a template write replaces the file, and
# the container keeps reading the old one, so those changes need an explicit
# recreate. That includes dynamic.yml, even though Traefik watches it.
- name: Start Traefik, recreating it only when its configuration changed
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present
    pull: missing
    remove_orphans: true
    recreate: "{{ 'always' if (static_config_changed is changed or dynamic_config_changed is changed) else 'auto' }}"
  register: traefik_result

- name: Pause to let container initialize
  pause:
    seconds: 3

- name: Wait for Traefik to be healthy
  ansible.builtin.wait_for:
    port: 443
    host: 0.0.0.0
    delay: 5
    timeout: 60
  ignore_errors: true  # Don't fail deployment if health check times out

- name: Check Traefik health endpoint
  ansible.builtin.uri:
    url: "http://localhost/ping"
    method: GET
    status_code: [200, 404]  # Accept 404 in case ping endpoint is not exposed
    validate_certs: false  # Don't verify SSL cert for localhost
  retries: 5
  delay: 2
  ignore_errors: true  # Don't fail deployment if health endpoint is not yet ready

- name: Display Traefik status
  ansible.builtin.debug:
    msg: |
      Traefik has been deployed successfully!
      - Service: vps-traefik
      - Domain: {{ traefik_domain }}
      - OpenTelemetry endpoint: {{ traefik_otel_endpoint }}
      - Sample rate: {{ traefik_sample_rate }}
      - Emitting both CLIENT and SERVER spans for proper service graphs
      {% if traefik_enable_authentik %}
      - Authentik forward auth: ENABLED
      {% else %}
      - Authentik forward auth: DISABLED (set traefik_enable_authentik to true when ready)
      {% endif %}