---
# Deploy Traefik with OpenTelemetry support
# This role ensures only Traefik is running (stops nginx if present)

# CRITICAL: Stop any existing nginx instances to avoid port conflicts
- name: Stop and disable nginx services
  block:
    - name: Check if nginx-otel container exists (specifically)
      command: docker ps -a -q -f name=nginx-otel
      register: nginx_otel_exists
      changed_when: false
      failed_when: false

    - name: Stop and remove nginx-otel container if exists
      shell: |
        echo "Stopping nginx-otel container..."
        docker stop nginx-otel || true
        docker rm nginx-otel || true
      when: nginx_otel_exists.stdout != ""

    - name: Check for any other nginx-related containers
      shell: docker ps -a --format "{{'{{'}}.Names{{'}}'}}" | grep -i nginx | grep -v nginx-otel || true
      register: other_nginx_containers
      changed_when: false
      failed_when: false

    - name: Stop and remove other nginx containers if they exist
      shell: |
        for container in $(docker ps -a --format "{{'{{'}}.Names{{'}}'}}" | grep -i nginx | grep -v nginx-otel); do
          echo "Stopping container: $container"
          docker stop "$container" || true
          docker rm "$container" || true
        done
      when: other_nginx_containers.stdout != ""

    - name: Check if system nginx service exists
      command: systemctl list-units --full --all -t service --plain --no-legend nginx.service
      register: nginx_service_exists
      changed_when: false
      failed_when: false

    - name: Stop and disable system nginx if exists
      systemd:
        name: nginx
        state: stopped
        enabled: no
      when: "'nginx.service' in nginx_service_exists.stdout"
      ignore_errors: true

    - name: Ensure ports 80 and 443 are free
      wait_for:
        port: "{{ item }}"
        state: stopped
        timeout: 10
      loop:
        - 80
        - 443
      ignore_errors: true

- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ traefik_dir }}"
    - "{{ traefik_config_dir }}"
    - "{{ traefik_logs_dir }}"

- name: Template Traefik static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_config_dir }}/traefik.yml"
    mode: '0644'
  register: static_config_changed

- name: Template Traefik dynamic configuration
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ traefik_config_dir }}/dynamic.yml"
    mode: '0644'
  register: dynamic_config_changed

- name: Template docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_dir }}/docker-compose.yml"
    mode: '0644'
  register: compose_changed

# ALWAYS recreate container to ensure it uses the latest config
# This is idempotent - the desired state is a running container with current config
- name: Stop and remove existing Traefik container
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: absent
    remove_orphans: true

- name: Start Traefik container with current configuration
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present
    pull: always
    recreate: always  # Force recreation to pick up config changes
  register: traefik_result

- name: Wait for Traefik to be healthy
  ansible.builtin.wait_for:
    port: 443
    host: 0.0.0.0
    delay: 5
    timeout: 60
  ignore_errors: true  # Don't fail deployment if health check times out

- name: Check Traefik health endpoint
  ansible.builtin.uri:
    url: "http://localhost/ping"
    method: GET
    status_code: [200, 404]  # Accept 404 in case ping endpoint is not exposed
    validate_certs: false  # Don't verify SSL cert for localhost
  retries: 5
  delay: 2
  ignore_errors: true  # Don't fail deployment if health endpoint is not yet ready

- name: Display Traefik status
  ansible.builtin.debug:
    msg: |
      Traefik has been deployed successfully!
      - Service: vps-traefik
      - Domain: {{ traefik_domain }}
      - OpenTelemetry endpoint: {{ traefik_otel_endpoint }}
      - Sample rate: {{ traefik_sample_rate }}
      - Emitting both CLIENT and SERVER spans for proper service graphs
      {% if traefik_enable_authentik %}
      - Authentik forward auth: ENABLED
      {% else %}
      - Authentik forward auth: DISABLED (set traefik_enable_authentik to true when ready)
      {% endif %}