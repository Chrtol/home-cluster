---
# Traefik configuration defaults
traefik_dir: "/opt/traefik"
traefik_config_dir: "{{ traefik_dir }}/config"

# Domain configuration
traefik_domain: "{{ nginx_domain }}"

# OpenTelemetry configuration
# Using gRPC endpoint (port 4317) - Traefik uses gRPC for OTLP
traefik_otel_endpoint: "tempo-otlp.{{ traefik_domain }}:443"
traefik_otel_insecure: "false"  # Using TLS
traefik_service_name: "vps-traefik"
traefik_sample_rate: "1.0"  # Always propagate trace context; downstream services handle sampling

# Authentik integration (disabled by default, enable when ready)
traefik_enable_authentik: false
traefik_authentik_skip_verify: "false"

# Logging
traefik_log_level: "INFO"

# Performance tuning
traefik_max_idle_conns_per_host: 25
traefik_dial_timeout: "30s"
traefik_response_header_timeout: "30s"

# CrowdSec configuration
traefik_crowdsec_enabled: true
traefik_crowdsec_api_key: ""  # Will be provided from 1Password
traefik_crowdsec_lapi_host: "127.0.0.1:8080"  # System CrowdSec LAPI
traefik_crowdsec_log_level: "INFO"

# Envoy Gateway configuration
traefik_envoy_gateway_ip: "{{ proxy_envoy_gateway_ip | default('10.0.30.44') }}"

# Metrics configuration
traefik_enable_metrics: false
traefik_metrics_user: ""  # VPS_METRICS_USER from 1Password
traefik_metrics_password_hash: ""  # VPS_METRICS_PASSWORD_HASH (htpasswd hash) from 1Password