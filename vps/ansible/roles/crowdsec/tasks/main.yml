---
# CrowdSec engine on the VPS: reads SSH and Traefik access logs, feeds the local
# LAPI that the Traefik bouncer plugin queries, and reports to the console.

- name: Check whether crowdsec is installed
  ansible.builtin.command: which cscli
  register: cscli_path
  changed_when: false
  failed_when: false
  check_mode: false

# Bootstrap only: the live VPS already has crowdsec, so these never run in CI.
- name: Install crowdsec
  when: cscli_path.rc != 0
  block:
    - name: Add crowdsec GPG key
      ansible.builtin.apt_key:
        url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
        state: present

    - name: Add crowdsec repository
      ansible.builtin.apt_repository:
        repo: "deb https://packagecloud.io/crowdsec/crowdsec/ubuntu/ {{ ansible_distribution_release }} main"
        state: present

    - name: Install crowdsec and the firewall bouncer
      ansible.builtin.apt:
        name:
          - crowdsec
          - crowdsec-firewall-bouncer-iptables
        state: present
        update_cache: true

- name: List installed collections
  ansible.builtin.command: cscli collections list -o json
  register: crowdsec_collections_json
  changed_when: false
  check_mode: false

- name: Work out which collections are missing
  ansible.builtin.set_fact:
    crowdsec_missing_collections: "{{ crowdsec_collections | difference((crowdsec_collections_json.stdout | from_json)['collections'] | map(attribute='name') | list) }}"

- name: Update the hub index before installing collections
  ansible.builtin.command: cscli hub update
  when: crowdsec_missing_collections | length > 0

- name: Install missing collections
  ansible.builtin.command: "cscli collections install {{ item }}"
  loop: "{{ crowdsec_missing_collections }}"
  notify: restart crowdsec

# Acquisition is owned here. The installer's setup.* files watched nginx (replaced
# by Traefik) and syslog/kern.log (read, never parsed), so they are replaced.
- name: Write SSH acquisition
  ansible.builtin.copy:
    dest: /etc/crowdsec/acquis.yaml
    mode: "0644"
    content: |
      # Managed by Ansible (vps/ansible/roles/crowdsec)
      filenames:
        - /var/log/auth.log
      labels:
        type: syslog
  notify: restart crowdsec

- name: Write Traefik acquisition
  ansible.builtin.copy:
    dest: /etc/crowdsec/acquis.d/traefik.yaml
    mode: "0644"
    content: |
      # Managed by Ansible (vps/ansible/roles/crowdsec)
      filenames:
        - {{ crowdsec_traefik_access_log }}
      labels:
        type: traefik
  notify: restart crowdsec

- name: Remove superseded acquisition files
  ansible.builtin.file:
    path: "/etc/crowdsec/acquis.d/{{ item }}"
    state: absent
  loop:
    - setup.nginx.yaml
    - setup.linux.yaml
    - setup.sshd.yaml
    - docker.yaml
  notify: restart crowdsec

# Older `cscli capi register` runs omit papi_url, which silently disables
# console management (decisions and blocklists pushed from the console).
- name: Set the Polling API URL
  ansible.builtin.lineinfile:
    path: /etc/crowdsec/online_api_credentials.yaml
    regexp: "^papi_url:"
    line: "papi_url: {{ crowdsec_papi_url }}"
  notify: restart crowdsec

- name: Check console enrollment
  ansible.builtin.command: cscli console status
  register: crowdsec_console_status
  changed_when: false
  check_mode: false

- name: Enroll in the console
  ansible.builtin.command:
    argv:
      - cscli
      - console
      - enroll
      - --name
      - "{{ crowdsec_console_name }}"
      - "{{ crowdsec_enroll_key }}"
  # cscli logs the enrollment state to stderr, not stdout
  when:
    - crowdsec_enroll_key | length > 0
    - "'is enrolled' not in (crowdsec_console_status.stdout + crowdsec_console_status.stderr)"
  register: crowdsec_enroll
  changed_when: "'already enrolled' not in (crowdsec_enroll.stdout + crowdsec_enroll.stderr)"
  no_log: true
  notify: restart crowdsec

- name: Ensure crowdsec is running
  ansible.builtin.systemd:
    name: crowdsec
    state: started
    enabled: true
