---
# This handler is triggered when:
# - Docker Compose files change (needs recreate to apply new container configs)
# - Pangolin config.yml changes (Pangolin doesn't hot-reload)
# - Traefik static config changes (requires restart for static changes)
# Note: Traefik dynamic config changes DON'T trigger this (it polls every 5s)
- name: restart pangolin
  community.docker.docker_compose_v2:
    project_src: /opt/pangolin
    recreate: always
    state: present
  listen: "restart pangolin"