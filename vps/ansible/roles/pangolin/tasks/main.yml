---
# Handle Crowdsec bouncer creation first
- name: Manage Crowdsec bouncer for Pangolin
  include_tasks: crowdsec-bouncer.yml

- name: Create Pangolin directory structure
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/pangolin
    - /opt/pangolin/config
    - /opt/pangolin/config/traefik
    # - /opt/pangolin/config/traefik-dynamic
    - /opt/pangolin/config/db
    - /opt/pangolin/config/letsencrypt
    - /opt/pangolin/config/logs

- name: Deploy docker-compose files
  template:
    src: "{{ item.src }}"
    dest: "/opt/pangolin/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: docker-compose-staging-no-crowdsec.yml.j2, dest: docker-compose.yml }
    - { src: docker-compose.yml.j2, dest: docker-compose-production.yml }
  notify: restart pangolin
  vars:
    # API key is now managed by crowdsec-bouncer.yml and stored in file
    crowdsec_bouncer_key: "{{ bouncer_api_key | default('') }}"

- name: Deploy Pangolin configuration file
  template:
    src: config.yml.j2
    dest: /opt/pangolin/config/config.yml
    mode: '0644'
  notify: restart pangolin

- name: Deploy Traefik static configuration
  template:
    src: traefik_config.yml.j2
    dest: /opt/pangolin/config/traefik/traefik_config.yml
    mode: '0644'
  notify: restart pangolin

- name: Deploy Traefik dynamic configuration
  template:
    src: dynamic_config.yml.j2
    dest: /opt/pangolin/config/traefik/dynamic_config.yml
    mode: '0644'
  notify: restart pangolin

- name: Set correct permissions for Let's Encrypt
  file:
    path: /opt/pangolin/config/letsencrypt
    state: directory
    mode: '0700'

- name: Deploy migration scripts
  copy:
    src: "{{ item }}"
    dest: "/opt/pangolin/{{ item }}"
    mode: '0755'
  loop:
    - migrate-to-production.sh
    - rollback.sh

- name: Start Pangolin stack
  community.docker.docker_compose_v2:
    project_src: /opt/pangolin
    state: present
  register: pangolin_start
  ignore_errors: true

- name: Wait a moment for containers to stabilize
  pause:
    seconds: 10

- name: Check Pangolin container status
  shell: |
    docker ps -a --filter "name=pangolin" --format "table {% raw %}{{.Status}}\t{{.State}}{% endraw %}"
  register: pangolin_status
  changed_when: false

- name: Check Pangolin container logs
  command: docker logs pangolin --tail 30
  register: pangolin_logs
  ignore_errors: true

- name: Display deployment summary
  debug:
    msg: |
      ========================================
      PANGOLIN DEPLOYMENT COMPLETE!

      Container Status:
      {{ pangolin_status.stdout | default('Unknown') }}

      {% if 'Restarting' in pangolin_status.stdout %}
      ⚠️  IMPORTANT: Pangolin is restarting. This is EXPECTED on first deployment!

      Pangolin requires initial configuration. Please complete setup at:
      👉 https://{{ pangolin_domain }}:8443/auth/initial-setup

      {% elif 'Up' in pangolin_status.stdout %}
      ✅ Pangolin is running successfully!
      {% endif %}

      Services are available at:
      - HTTP:  http://{{ pangolin_domain }}:8081
      - HTTPS: https://{{ pangolin_domain }}:8443
      - WireGuard: Port 51821/UDP
      - Gerbil Management: Port 21821/UDP

      Infrastructure deployed:
      ✓ Firewall rules configured
      ✓ Docker containers running
      ✓ Crowdsec bouncer created
      ✓ Traefik proxy configured

      To monitor containers:
      ssh {{ lookup('env', 'VPS_SSH_USER') }}@{{ lookup('env', 'VPS_HOST') }} "docker compose -f /opt/pangolin/docker-compose.yml ps"

      NOTE: If Pangolin keeps restarting, complete the initial setup via the web interface.
      ========================================