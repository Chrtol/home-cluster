---
- name: Configure VPS
  hosts: vps
  become: true

  roles:
    - base        # System hardening, updates
    - docker      # Docker and docker-compose
    - firewall    # UFW configuration
    - crowdsec    # CrowdSec IDS (optional)
    - traefik     # Traefik reverse proxy
    - trivy       # Trivy security scanner (client mode)
