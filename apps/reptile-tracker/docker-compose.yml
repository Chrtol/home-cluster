services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reptile_tracker
      POSTGRES_USER: reptile_tracker
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reptile_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://reptile_tracker:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/reptile_tracker
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_DO_NOT_USE_IN_PRODUCTION}
      REDIS_URL: redis://redis:6379/0
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-not-used-in-dev}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-not-used-in-dev}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://localhost:8000/auth/.well-known/openid-configuration}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/auth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      ENVIRONMENT: development
      SQL_ECHO: "false"
      COOKIE_SECURE: "false"
      LOCAL_STORAGE_PATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - photos_data:/app/photos
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: /app/entrypoint-celery.sh
    environment:
      DATABASE_URL: postgresql+asyncpg://reptile_tracker:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/reptile_tracker
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_DO_NOT_USE_IN_PRODUCTION}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-not-used-in-dev}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-not-used-in-dev}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://localhost:8000/auth/.well-known/openid-configuration}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/auth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source files for HMR
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached
      - ./frontend/index.html:/app/index.html:cached
      - ./frontend/vite.config.js:/app/vite.config.js:cached
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:cached
      - ./frontend/postcss.config.js:/app/postcss.config.js:cached
      - ./frontend/components.json:/app/components.json:cached
      # CRITICAL: Exclude node_modules (use container's version)
      - /app/node_modules
    environment:
      # Empty VITE_API_URL so axios uses relative URLs → goes through Vite proxy
      - VITE_API_URL=
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  photos_data:
